<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Seguimiento de tu envío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<script>window.NEXO_API_URL = 'https://script.google.com/macros/s/AKfycby5LWM73dCEKGmDvc1LJBrw_eQYuLRLcZUCm_XJwXJt365-TEtkeKhr1N4GfkWFfiLT/exec';</script>
<style>
  :root { color-scheme: dark; --bg: #000000; --ink: #F5F5F5; --muted: #9B9B9B; --brand: #2F6FE4; --brand-ink: #FFFFFF; --line: #262626; --ok: #3FB27F; --bad: #E5484D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 520px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 18px 48px; }
  .biz { font-weight: 600; margin: 0; }
  .ref { color: var(--muted); font-size: 13px; margin: 2px 0 26px; }
  .status { font-size: clamp(30px, 8vw, 40px); line-height: 1.05; letter-spacing: -.02em; font-weight: 700; margin: 0 0 8px; }
  .status.done { color: var(--ok); } .status.bad { color: var(--bad); }
  .msg { margin: 0 0 22px; color: #D4D4D4; }
  .bar { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; margin: 0 0 8px; }
  .bar span { height: 6px; border-radius: 3px; background: var(--line); }
  .bar span.on { background: var(--brand); }
  .bar.done span.on { background: var(--ok); }
  .steps { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 26px; gap: 6px; }
  .steps b { color: var(--ink); font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; word-break: break-all; }
  a.btn { display: block; text-align: center; margin-top: 12px; min-height: 48px; line-height: 48px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); text-decoration: none; font-weight: 600; }
  a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .cod { border-color: #5A4A1F; background: #1A1408; }
  h2 { font-size: 15px; margin: 26px 0 10px; }
  ol.ev { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); }
  ol.ev li { position: relative; padding: 0 0 16px 6px; }
  ol.ev li::before { content: ""; position: absolute; left: -23px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  ol.ev li:first-child::before { background: var(--brand); }
  .when { color: var(--muted); font-size: 12px; display: block; }
  .msg-c { text-align: center; color: var(--muted); padding-top: 30vh; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="msg-c">Buscando tu envío…</p></main>
<script>
(function () {
  var app = document.getElementById('app');
  var t = new URLSearchParams(location.search).get('t') || '';
  var esc = function (v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fail = function (m) { app.innerHTML = '<p class="msg-c">' + esc(m) + '</p>'; };
  if (!/^[a-f0-9]{32,48}$/.test(t) || window.NEXO_API_URL.indexOf('http') !== 0) return fail('Este enlace de seguimiento no es válido.');
  var when = function (v) { if (!v) return ''; var d = new Date(v); return isNaN(d) ? '' : d.toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' }); };
  fetch(window.NEXO_API_URL + '?rpc=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'apiPublicTrack', args: [t] }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) return fail(res.error || 'No encontramos este envío.');
      var r = res.data;
      document.title = r.status_label + ' · ' + r.business;
      var idx = -1;
      r.steps.forEach(function (s, i) { if (s.code === r.status) idx = i; });
      var bad = r.status === 'fallido' || r.status === 'devuelto' || r.status === 'cancelado';
      var done = r.status === 'entregado';
      var money = function (v) { try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: r.currency || 'USD', currencyDisplay: 'narrowSymbol' }).format(v); } catch (e) { return Number(v).toFixed(2); } };
      app.innerHTML =
        '<p class="biz">' + esc(r.business) + '</p>' +
        '<p class="ref">Envío ' + esc(r.number) + (r.order ? ' · pedido ' + esc(r.order) : '') + (r.recipient ? ' · para ' + esc(r.recipient) : '') + '</p>' +
        '<h1 class="status' + (done ? ' done' : bad ? ' bad' : '') + '">' + esc(r.status_label) + '</h1>' +
        '<p class="msg">' + esc(r.message) + '</p>' +
        (bad ? '' : '<div class="bar' + (done ? ' done' : '') + '" style="--n:' + r.steps.length + '" aria-hidden="true">' + r.steps.map(function (s, i) { return '<span class="' + (i <= idx ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
          '<div class="steps"><span>' + esc(r.steps[0].label) + '</span><b>' + esc(idx >= 0 ? r.steps[idx].label : '') + '</b><span>' + esc(r.steps[r.steps.length - 1].label) + '</span></div>') +
        ((r.tracking_number || r.eta || r.city) ? '<div class="card">' +
          (r.carrier ? '<div class="row"><span>Transportista</span><span>' + esc(r.carrier) + '</span></div>' : '') +
          (r.tracking_number ? '<div class="row"><span>Número de guía</span><span>' + esc(r.tracking_number) + '</span></div>' : '') +
          (r.city ? '<div class="row"><span>Destino</span><span>' + esc(r.city) + '</span></div>' : '') +
          (r.eta && !done ? '<div class="row"><span>Entrega estimada</span><span>' + esc(new Date(r.eta).toLocaleDateString('es', { dateStyle: 'long' })) + '</span></div>' : '') +
          (r.delivered_at ? '<div class="row"><span>Entregado</span><span>' + esc(when(r.delivered_at)) + '</span></div>' : '') +
          (r.tracking_url ? '<a class="btn" href="' + esc(r.tracking_url) + '" target="_blank" rel="noopener">Ver en ' + esc(r.carrier || 'el transportista') + '</a>' : '') + '</div>' : '') +
        (r.cod ? '<div class="card cod"><div class="row"><span>Pagas al recibir</span><span><b>' + esc(money(r.cod)) + '</b></span></div></div>' : '') +
        (r.events.length ? '<h2>Movimientos</h2><ol class="ev">' + r.events.map(function (e) {
          return '<li>' + esc(e.text) + (e.where ? ' · ' + esc(e.where) : '') + '<span class="when">' + esc(when(e.at)) + '</span></li>'; }).join('') + '</ol>' : '') +
        '<p class="foot">' + (r.phone ? '¿Dudas? Escríbenos al ' + esc(r.phone) + '. ' : '') + 'Esta página se actualiza sola cuando hay novedades.</p>';
    })
    .catch(function () { fail('No hay conexión. Revisa tu internet e inténtalo de nuevo.'); });
})();
</script>
</body>
</html>
