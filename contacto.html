<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1412">
<title>Déjanos tus datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.NEXO_API_URL = 'https://script.google.com/macros/s/AKfycby5LWM73dCEKGmDvc1LJBrw_eQYuLRLcZUCm_XJwXJt365-TEtkeKhr1N4GfkWFfiLT/exec';</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0F1412; --panel: #161D1A; --line: #2C3934; --ink: #E6EEE9; --muted: #8DA197;
    --brand: #3FD49A; --brand-ink: #06281B; --sand: #E2C08A; --danger: #FF8A80;
    --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .wrap { max-width: 460px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 22px 40px; }
  header { padding: 18px 0 26px; }
  .biz { font: 700 clamp(34px, 11vw, 48px)/1 var(--display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
  /* El horizonte: una línea de arena bajo el nombre del negocio */
  .horizon { height: 3px; width: 64px; background: var(--sand); border-radius: 2px; margin: 18px 0 14px; }
  .event { color: var(--sand); font-weight: 500; margin: 0; }
  .lead { color: var(--muted); margin: 6px 0 0; }

  form { display: grid; gap: 16px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  label small { color: var(--muted); font-weight: 400; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                    border-radius: 10px; padding: 13px 14px; min-height: 50px; }
  textarea { min-height: 92px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(63, 212, 154, .18); }
  .two { display: grid; gap: 16px; }
  .consent { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); font-weight: 400; margin: 0; }
  .consent input { width: 22px; height: 22px; min-height: 0; margin: 1px 0 0; accent-color: var(--brand); flex: none; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button { font: 600 17px var(--font); width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: -4px 0 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }

  .done { display: none; padding-top: 8px; }
  .done h2 { font: 700 30px/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 10px; }
  .done p { color: var(--muted); margin: 0 0 22px; }
  .check { width: 56px; height: 56px; border-radius: 50%; background: rgba(63, 212, 154, .14); color: var(--brand); display: grid; place-items: center; margin-bottom: 18px; }
  .again { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  body.sent form, body.sent .lead { display: none; }
  body.sent .done { display: block; }
  .bad { text-align: center; padding-top: 30vh; color: var(--muted); }
  @media (min-width: 520px) { .two { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main class="wrap" id="app">
  <header>
    <h1 class="biz" id="biz">Hola</h1>
    <div class="horizon" aria-hidden="true"></div>
    <p class="event" id="event"></p>
    <p class="lead">Déjanos tus datos y te contactamos.</p>
  </header>

  <form id="f" novalidate>
    <div>
      <label for="name">Tu nombre</label>
      <input id="name" name="name" autocomplete="name" required maxlength="120">
    </div>
    <div class="two">
      <div>
        <label for="phone">WhatsApp o teléfono</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="40">
      </div>
      <div>
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="160">
      </div>
    </div>
    <div>
      <label for="company">Empresa <small>(opcional)</small></label>
      <input id="company" name="company" autocomplete="organization" maxlength="120">
    </div>
    <div>
      <label for="message">¿Qué te interesa? <small>(opcional)</small></label>
      <textarea id="message" name="message" maxlength="1500"></textarea>
    </div>
    <div class="hp" aria-hidden="true"><label for="_hp">No llenar</label><input id="_hp" name="_hp" tabindex="-1" autocomplete="off"></div>
    <label class="consent"><input type="checkbox" id="consent" checked> <span>Acepto que me contacten por WhatsApp, llamada o correo.</span></label>
    <p class="err" id="err" role="alert"></p>
    <button id="send" type="submit">Enviar mis datos</button>
    <p class="hint">Solo usaremos tus datos para contactarte.</p>
  </form>

  <section class="done" aria-live="polite">
    <div class="check" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="thanks">¡Gracias!</h2>
    <p>Recibimos tus datos. Te contactaremos pronto.</p>
    <button class="again" id="again" type="button">Registrar a otra persona</button>
  </section>
</main>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get('k') || '', event = q.get('e') || '', biz = q.get('b') || '';
  var $ = function (id) { return document.getElementById(id); };
  if (!key || window.NEXO_API_URL.indexOf('http') !== 0) {
    $('app').innerHTML = '<p class="bad">Este enlace no está completo. Pide que te muestren el código QR de nuevo.</p>';
    return;
  }
  if (biz) { $('biz').textContent = biz; document.title = biz + ' · Déjanos tus datos'; }
  else $('biz').textContent = 'Déjanos tus datos';
  if (event) $('event').textContent = event; else $('event').style.display = 'none';

  var f = $('f'), err = $('err'), send = $('send');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = '';
    var name = f.name.value.trim(), phone = f.phone.value.trim(), email = f.email.value.trim();
    if (!name) { err.textContent = 'Escribe tu nombre.'; f.name.focus(); return; }
    if (!phone && !email) { err.textContent = 'Escribe tu WhatsApp o tu correo para poder contactarte.'; f.phone.focus(); return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Revisa tu correo: parece incompleto.'; f.email.focus(); return; }
    var data = { name: name, phone: phone, email: email, company: f.company.value.trim(), message: f.message.value.trim(),
                 _hp: f._hp.value, acepta_contacto: $('consent').checked ? 'Sí' : 'No',
                 utm_source: 'qr', utm_campaign: event, page_url: location.href.split('?')[0] };
    Object.keys(data).forEach(function (k) { if (!data[k] && k !== '_hp') delete data[k]; });
    send.disabled = true; send.textContent = 'Enviando…';
    fetch(window.NEXO_API_URL + '?rpc=1', {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: 'apiPublicLead', args: [key, data] })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'No se pudo enviar.');
      $('thanks').textContent = '¡Gracias, ' + name.split(' ')[0] + '!';
      document.body.classList.add('sent');
      window.scrollTo(0, 0);
    }).catch(function (e) {
      err.textContent = e.message && e.message !== 'Failed to fetch' ? e.message : 'No hay conexión. Revisa tu internet e inténtalo de nuevo.';
    }).then(function () { send.disabled = false; send.textContent = 'Enviar mis datos'; });
  });
  $('again').onclick = function () { f.reset(); $('consent').checked = true; document.body.classList.remove('sent'); f.name.focus(); };
})();
</script>
</body>
</html>
