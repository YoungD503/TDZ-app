<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1412">
<title>Tu recibo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.NEXO_API_URL = 'https://script.google.com/macros/s/AKfycby5LWM73dCEKGmDvc1LJBrw_eQYuLRLcZUCm_XJwXJt365-TEtkeKhr1N4GfkWFfiLT/exec';</script>
<style>
  :root { color-scheme: dark; --bg: #0F1412; --ink: #E6EEE9; --muted: #8DA197; --brand: #3FD49A; --brand-ink: #06281B; --line: #2C3934; --sand: #E2C08A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 440px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; }
  .paper { background: #fff; color: #111; border-radius: 4px; padding: 22px 20px 26px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
           /* borde inferior dentado, como un ticket */
           -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, radial-gradient(circle 6px at 10px 100%, transparent 98%, #000) bottom / 20px 9px repeat-x;
                   mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, radial-gradient(circle 6px at 10px 100%, transparent 98%, #000) bottom / 20px 9px repeat-x; }
  .biz { font: 700 26px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; text-align: center; margin: 0; }
  .meta { text-align: center; color: #555; font-size: 13px; margin: 4px 0 14px; }
  .test { text-align: center; font-weight: 700; border: 1px dashed #a15c00; color: #a15c00; padding: 4px; margin-bottom: 10px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .row > span:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .head { border-top: 1px dashed #999; padding-top: 10px; font-weight: 600; }
  .sub { color: #666; font-size: 13px; }
  .items { border-top: 1px dashed #999; border-bottom: 1px dashed #999; margin: 10px 0; padding: 8px 0; }
  .item { padding: 5px 0; }
  .total { font: 700 22px "Bricolage Grotesque", sans-serif; border-top: 1px solid #111; margin-top: 8px; padding-top: 8px; }
  .refund { color: #b42318; }
  .foot { text-align: center; color: #555; margin-top: 16px; font-size: 13px; }
  .acts { display: flex; gap: 10px; margin-top: 22px; }
  button { flex: 1; min-height: 50px; border-radius: 12px; font: 600 15px "Instrument Sans", sans-serif; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .msg { text-align: center; color: var(--muted); padding-top: 30vh; }
  @media print {
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    .paper { box-shadow: none; -webkit-mask: none; mask: none; padding: 0; }
    .acts { display: none; }
  }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="msg">Cargando tu recibo…</p></main>
<script>
(function () {
  var app = document.getElementById('app');
  var t = new URLSearchParams(location.search).get('t') || '';
  var esc = function (v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fail = function (m) { app.innerHTML = '<p class="msg">' + esc(m) + '</p>'; };
  if (!/^[a-f0-9]{32,48}$/.test(t) || window.NEXO_API_URL.indexOf('http') !== 0) return fail('Este enlace de recibo no es válido.');
  fetch(window.NEXO_API_URL + '?rpc=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'apiPublicReceipt', args: [t] }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) return fail(res.error || 'No encontramos este recibo.');
      var r = res.data;
      var m = function (v) { try { return new Intl.NumberFormat('es', { style: 'currency', currency: r.currency || 'USD' }).format(Number(v || 0)); } catch (e) { return Number(v || 0).toFixed(2); } };
      document.title = 'Recibo ' + r.number + ' · ' + r.business;
      var html = '<article class="paper">' +
        '<h1 class="biz">' + esc(r.business) + '</h1>' +
        '<div class="meta">' + esc([r.legal_name, r.tax_id ? 'NIT/ID ' + r.tax_id : '', r.address, r.phone].filter(Boolean).join(' · ')) + '</div>' +
        (r.is_test ? '<div class="test">PRUEBA — no es una venta real</div>' : '') +
        '<div class="row head"><span>Recibo ' + esc(r.number) + '</span><span>' + esc(new Date(r.date).toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' })) + '</span></div>' +
        (r.customer ? '<div class="row sub"><span>' + esc(r.register || '') + '</span><span>' + esc(r.customer) + '</span></div>' : '') +
        '<div class="items">' + r.items.map(function (i) {
          return '<div class="item"><div class="row"><span>' + esc(i.name) + '</span><span>' + m(i.total) + '</span></div>' +
            '<div class="sub">' + esc(i.qty) + ' × ' + m(i.unit_price) + (i.discount ? ' · desc. ' + m(i.discount) : '') + (i.refunded_qty ? ' · ' + i.refunded_qty + ' devuelta(s)' : '') + '</div></div>';
        }).join('') + '</div>' +
        (r.discount ? '<div class="row"><span>Descuento</span><span>−' + m(r.discount) + '</span></div>' : '') +
        (r.prices_include_tax ? '<div class="row sub"><span>IVA incluido</span><span>' + m(r.tax) + '</span></div>'
          : '<div class="row"><span>Subtotal</span><span>' + m(r.subtotal) + '</span></div><div class="row"><span>Impuesto</span><span>' + m(r.tax) + '</span></div>') +
        '<div class="row total"><span>Total</span><span>' + m(r.total) + '</span></div>' +
        r.payments.map(function (p) { return '<div class="row sub"><span>' + esc(p.method) + '</span><span>' + m(p.amount) + '</span></div>'; }).join('') +
        (r.refunded ? '<div class="row refund"><span>Reembolsado</span><span>−' + m(r.refunded) + '</span></div>' : '') +
        (r.footer ? '<div class="foot">' + esc(r.footer) + '</div>' : '') +
        '</article><div class="acts"><button class="primary" id="print">Guardar o imprimir</button><button id="share">Compartir</button></div>';
      app.innerHTML = html;
      document.getElementById('print').onclick = function () { window.print(); };
      var sh = document.getElementById('share');
      if (navigator.share) sh.onclick = function () { navigator.share({ title: document.title, url: location.href }).catch(function () {}); };
      else sh.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(function () { sh.textContent = 'Enlace copiado'; }, function () { prompt('Copia el enlace:', location.href); }); };
    })
    .catch(function () { fail('No hay conexión. Revisa tu internet e inténtalo de nuevo.'); });
})();
</script>
</body>
</html>
