}

/* ---------- Cobro ---------- */

function cartPayload() {
  const c = POS.cart;
  return {
    client_ref: c.ref, notes: c.notes, discount: c.discount || 0,
    items: c.items.map(i => ({ product_id: i.product_id, qty: i.qty, price: i.price, discount: i.discount })),
    customer_id: c.customer && c.customer.id ? c.customer.id : undefined,
    customer: c.customer && !c.customer.id ? c.customer : undefined,
    doc_type: c.doc_type || '01', customer_nrc: c.doc_type === '03' ? c.customer_nrc : undefined,
    ship: c.ship || undefined, cod: c.ship && c.cod ? true : undefined,
  };
}

function receiptBase() {
  if (ON_GOOGLE) return '';
  return new URL('recibo.html', location.href).href.split('?')[0] + '?t=';
}
function receiptUrl(token) {
  return ON_GOOGLE ? (POS.cat.web_app_url || '') + '?action=receipt&t=' + token : receiptBase() + token;
}

function openPayment() {
  const t = posTotals();
  const M = POS.cat.methods;
  const pays = [];
  const remaining = () => r2(t.total - pays.reduce((a, p) => a + p.amount, 0));
  const methods = ['efectivo', 'tarjeta', 'transferencia', 'wompi', 'n1co', 'otro'];
  const offline = POS.offline || !navigator.onLine;
  openModal('Cobrar', `
    ${offline ? '<div class="note off-note">Sin conexión: la venta se guarda en este dispositivo y se envía sola cuando vuelva la señal.</div>' : ''}
    <div class="pay-total"><span class="muted">Total</span><b>${esc(pm(t.total))}</b><span class="muted" id="payLeft"></span></div>
    ${POS.cart.cod ? '<div class="note">Contra entrega: puedes finalizar sin cobrar; lo que falte lo cobra quien entrega y lo registras en Envíos.</div>' : ''}
    <div class="pay-methods" role="tablist">${methods.map(m => `<button type="button" class="btn ${m === 'efectivo' ? 'primary' : ''}" data-m="${m}">${esc(M[m])}</button>`).join('')}
      ${POS.cat.stripe_qr && !offline && !POS.cart.cod ? `<button type="button" class="btn" data-m="stripe_qr">QR Stripe${POS.cat.stripe_qr.mode === 'test' ? ' (prueba)' : ''}</button>` : ''}</div>
    <div id="payPanel"></div>
    <div id="payList"></div>`, async () => {
    if (remaining() > 0.009 && !POS.cart.cod) throw new Error('Falta cobrar ' + pm(remaining()) + '.');
    const payload = Object.assign(cartPayload(), { payments: pays.map(p => ({ method: p.method, amount: p.amount, tendered: p.tendered, reference: p.reference })) });
    let r;
    if (POS.offline || !navigator.onLine) r = posQueueSale(payload, t, pays);
    else {
      try { r = await apiT(20000, 'apiPosCheckout', S.token, payload); r.ref = payload.client_ref; }
      catch (e) {
        if (!isNet(e)) throw e;
        // Se cayó la señal al cobrar: se guarda; si el servidor sí la alcanzó a registrar, no se duplica (mismo identificador).
        POS.offline = true; r = posQueueSale(payload, t, pays);
      }
    }
    posFinished(r, true);
  }, 'Finalizar venta', true);
  const ok = $('#modalOk');
  let method = 'efectivo';
  const drawList = () => {
    const left = remaining();
    $('#payLeft').innerHTML = pays.length ? (left > 0 ? 'Falta <b>' + esc(pm(left)) + '</b>' : '<b class="pos">Completo</b>') : '';
    $('#payList').innerHTML = pays.length ? `<ul class="list pay-list">${pays.map((p, i) => `<li><span>${esc(M[p.method])}${p.reference ? ' <span class="muted sm">' + esc(p.reference) + '</span>' : ''}${p.method === 'efectivo' && p.tendered > p.amount ? '<br><span class="muted sm">Recibido ' + esc(pm(p.tendered)) + ' · cambio ' + esc(pm(p.tendered - p.amount)) + '</span>' : ''}</span>
      <span><b>${esc(pm(p.amount))}</b> <button type="button" class="ml-x" data-x="${i}" aria-label="Quitar pago">✕</button></span></li>`).join('')}</ul>` : '';
    $('#payList').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { pays.splice(Number(b.dataset.x), 1); drawList(); drawPanel(); });
    const cod = POS.cart.cod === true;
    ok.disabled = left > 0.009 && !cod;
    ok.textContent = left > 0.009 ? (cod ? 'Finalizar · cobrar ' + pm(left) + ' al entregar' : 'Falta ' + pm(left)) : 'Finalizar venta';
  };
  const add = p => { pays.push(p); drawList(); drawPanel(); };
  const drawPanel = () => {
    const left = remaining();
    document.querySelectorAll('[data-m]').forEach(b => { b.classList.toggle('primary', b.dataset.m === method); b.disabled = left <= 0.009 && b.dataset.m !== method; });
    const qr = document.querySelector('[data-m=stripe_qr]');
    if (qr) qr.disabled = pays.length > 0;
    const panel = $('#payPanel');
    if (left <= 0.009) { panel.innerHTML = ''; return; }
    if (method === 'efectivo') {
      const opts = [left].concat([1, 5, 10, 20, 50, 100].map(b => Math.ceil(left / b) * b)).filter((v, i, a) => a.indexOf(v) === i && v >= left).slice(0, 5);
      panel.innerHTML = `<label class="f">Efectivo recibido</label>
        <div class="cash-row"><input class="input pos-money" id="cashIn" inputmode="decimal" value="${left.toFixed(2)}"><button type="button" class="btn primary" id="cashAdd">Aplicar</button></div>
        <div class="chips cash-quick">${opts.map((v, i) => `<button type="button" class="btn" data-q="${v}">${i === 0 ? 'Exacto' : esc(pm(v))}</button>`).join('')}</div>
        <div class="change" id="chg"></div>`;
      const inp = $('#cashIn');
      const showChange = () => { const v = Number(inp.value.replace(',', '.')) || 0; $('#chg').innerHTML = v >= left ? 'Cambio: <b>' + esc(pm(r2(v - left))) + '</b>' : v > 0 ? 'Abono parcial en efectivo: ' + esc(pm(v)) : ''; };
      inp.oninput = showChange; showChange();
      const apply = v => {
        v = r2(v);
        if (!(v > 0)) { toast('Escribe cuánto recibiste.', true); return; }
        add({ method: 'efectivo', amount: Math.min(v, left), tendered: v });
      };
      $('#cashAdd').onclick = () => apply(Number(inp.value.replace(',', '.')));
      inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); apply(Number(inp.value.replace(',', '.'))); } };
      panel.querySelectorAll('[data-q]').forEach(b => b.onclick = () => apply(Number(b.dataset.q)));
      setTimeout(() => inp.select(), 30);
    } else if (method === 'stripe_qr') {
      panel.innerHTML = `<p class="muted">Se crea un cobro de Stripe por <b>${esc(pm(t.total))}</b> y se muestra un QR. El cliente lo escanea con su teléfono y paga; la venta se confirma sola.</p>
        <button type="button" class="btn primary pos-big" id="qrGo">Mostrar QR de pago</button>`;
      $('#qrGo').onclick = () => startStripeQr(t);
    } else {
      const refLabel = { tarjeta: 'Número de aprobación (opcional)', transferencia: 'Referencia de la transferencia', wompi: 'ID de la transacción de Wompi', n1co: 'ID de la transacción de N1co', otro: 'Detalle' }[method];
      panel.innerHTML = `<div class="form">
          <div><label class="f">Monto</label><input class="input pos-money" id="pAmt" inputmode="decimal" value="${left.toFixed(2)}"></div>
          <div><label class="f">${esc(refLabel)}</label><input class="input" id="pRef" maxlength="80"></div></div>
        ${method === 'wompi' || method === 'n1co' ? '<p class="muted sm">Cobra con el enlace o QR de ' + esc(M[method]) + ' y confirma aquí cuando veas el pago aprobado.</p>' : ''}
        ${method === 'tarjeta' ? '<p class="muted sm">Pasa la tarjeta en tu terminal; cuando salga aprobada, confirma aquí.</p>' : ''}
        <button type="button" class="btn primary" id="pAdd" style="margin-top:10px">Confirmar ${esc(M[method])}</button>`;
      $('#pAdd').onclick = () => {
        const v = r2(Number($('#pAmt').value.replace(',', '.')));
        if (!(v > 0)) { toast('Escribe el monto.', true); return; }
        if (v > left + 0.009) { toast('El monto es mayor que lo que falta (' + pm(left) + ').', true); return; }
        if (method === 'transferencia' && !$('#pRef').value.trim()) { toast('Escribe la referencia de la transferencia.', true); return; }
        add({ method: method, amount: v, reference: $('#pRef').value.trim() });
      };
    }
  };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; drawPanel(); });
  drawPanel(); drawList();
}

async function startStripeQr(t) {
  let pend;
  try { pend = await api('apiPosStripeQr', S.token, Object.assign(cartPayload(), { receipt_base: receiptBase() })); }
  catch (e) { toast(e.message, true); return; }
  if (pend.status === 'pagada') return posFinished(pend);
  let alive = true, timer = null;
  openModal('Paga con tu teléfono', `
    <div class="qr-pay">
      <div class="qr-box">${qrSvg(pend.url, 'min(72vw, 300px)')}</div>
      <div><div class="pay-total"><span class="muted">Total</span><b>${esc(pm(pend.total))}</b></div>
        ${pend.is_test ? '<p><span class="tag prueba">PRUEBA</span> Usa la tarjeta 4242 4242 4242 4242.</p>' : ''}
        <p class="muted">El cliente escanea el código con la cámara, paga en la página segura de Stripe y esta pantalla se actualiza sola.</p>
        <p class="qr-wait" aria-live="polite"><span class="dot-pulse" aria-hidden="true"></span> Esperando el pago… <span class="muted sm">${esc(pend.number)}</span></p>
        <button type="button" class="btn danger" id="qrCancel">Cancelar cobro</button></div>
    </div>`, null, null, true);
  const modal = $('#modal');
  modal._guard = () => !alive || confirm('Si cierras, el cobro sigue abierto en Stripe hasta que lo canceles o expire (30 min). ¿Cerrar de todos modos?');
  modal._onClose = () => { alive = false; clearTimeout(timer); };
  const poll = async () => {
    if (!alive) return;
    try {
      const st = await api('apiPosSaleStatus', S.token, pend.id);
      if (!alive) return;
      if (st.status === 'pagada') { alive = false; beep(true); closeModal(true); posFinished(st, true); return; }
      if (st.status === 'cancelada') { alive = false; closeModal(true); toast('El cobro con QR se canceló.', true); return; }
    } catch (e) { /* reintenta */ }
    timer = setTimeout(poll, 3000);
  };
  timer = setTimeout(poll, 3000);
  $('#qrCancel').onclick = async () => {
    const b = $('#qrCancel'); b.disabled = true;
    try {
      const r = await api('apiPosCancelPending', S.token, pend.id);
      alive = false; closeModal(true);
      if (r.status === 'pagada') { posFinished(r); return; }
      toast('Cobro cancelado. El carrito sigue listo.');
      POS.cart.ref = newRef();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  };
}

function posFinished(r, fresh) {
  POS.last = r;
  POS.cart = emptyCart();
  document.body.classList.remove('cart-open');
  swrClear();
  // Después de que se cierre la ventana de cobro (si no, se cerraría también la del recibo).
  setTimeout(() => viewPos().then(() => showPosDone(r, fresh !== false)), 0);
}

/* ---------- Venta terminada: recibo ---------- */

function showPosDone(r, fresh) {
  const rc = r.receipt;
  const link = r.token ? receiptUrl(r.token) : '';
  const phone = r.customer && r.customer.phone ? r.customer.phone : '';
  const email = r.customer && r.customer.email ? r.customer.email : '';
  const fmt = store2.get('nx_receipt_fmt', '80');
  const cfg = PRN.cfg(), direct = cfg.conn !== 'system';
  openModal('Venta ' + r.number + (r.offline ? ' · sin enviar' : ''), `
    <div class="done-head">
      ${r.change > 0 ? `<div class="change-big"><span class="muted">Cambio</span><b>${esc(pm(r.change))}</b></div>` : `<div class="change-big ok"><span class="muted">Pagado</span><b>${esc(pm(rc.total))}</b></div>`}
      ${rc.is_test ? '<span class="tag prueba">PRUEBA</span>' : ''}
    </div>
    ${r.dte ? '<div class="hint" id="rcDte" aria-live="polite"></div>' : ''}
    ${r.offline ? '<div class="note off-note">Venta guardada en este dispositivo. Se envía sola al sistema cuando vuelva la señal; ahí recibe su número definitivo y el enlace del recibo.</div>' : ''}
    <div class="done-grid">
      <div class="rc-preview" aria-label="Vista previa del recibo">${receiptHtml(rc, '80', link)}</div>
      <div class="done-acts">
        <label class="f">Imprimir</label>
        ${direct ? `<div class="cash-row"><button type="button" class="btn primary" id="rcDirect" style="flex:1">${ICONS.printer} Imprimir ticket</button><button type="button" class="btn" id="rcPrnCfg" aria-label="Ajustes de impresora">Ajustes</button></div>
          <div class="hint" id="rcPrnState" aria-live="polite">${esc(PRN.label())}</div>
          <a href="#" id="rcSystem" class="hint">Imprimir con el diálogo del navegador</a>`
        : `<div class="cash-row"><select class="input" id="rcFmt"><option value="58" ${fmt === '58' ? 'selected' : ''}>Ticket 58 mm</option><option value="80" ${fmt === '80' ? 'selected' : ''}>Ticket 80 mm</option><option value="carta" ${fmt === 'carta' ? 'selected' : ''}>Hoja carta</option></select>
          <button type="button" class="btn primary" id="rcPrint">Imprimir</button></div>
          <a href="#" id="rcPrnCfg" class="hint">Conectar una impresora térmica (Bluetooth o USB)</a>`}
        ${link ? `<label class="f" style="margin-top:12px">WhatsApp</label>
        <div class="cash-row"><input class="input" id="rcPhone" type="tel" inputmode="tel" placeholder="7123 4567" value="${esc(phone)}"><button type="button" class="btn" id="rcWa">Enviar</button></div>
        <label class="f" style="margin-top:12px">Correo</label>
        <div class="cash-row"><input class="input" id="rcMail" type="email" inputmode="email" placeholder="cliente@correo.com" value="${esc(email)}"><button type="button" class="btn" id="rcMailGo">Enviar</button></div>
        <div class="chips" style="margin-top:12px"><button type="button" class="btn" id="rcQr">Mostrar QR del recibo</button><button type="button" class="btn" id="rcCopy">Copiar enlace</button></div>`
        : '<p class="muted sm" style="margin-top:12px">El envío por WhatsApp o correo y el QR del recibo estarán en <b>Último recibo</b> cuando la venta llegue al sistema.</p>'}
      </div>
    </div>`, async () => {}, 'Nueva venta', true);
  const cancel = document.querySelector('#modal footer .btn:not(#modalOk)');
  if (cancel) cancel.style.display = 'none'; // la venta ya está hecha: solo "Nueva venta"
  if (r.dte && fresh) posSendDte(r);
  else if (r.dte && $('#rcDte')) $('#rcDte').textContent = 'DTE: ' + (r.dte.status_label || r.dte.status);
  const cash = (rc.payments || []).some(p => /efectivo/i.test(p.method));
  const state = (txt, bad) => { const el = $('#rcPrnState'); if (el) { el.textContent = txt; el.classList.toggle('neg', !!bad); } };
  const printDirect = async gesture => {
    state('Imprimiendo…');
    try { await PRN.printReceipt(rc, link, { gesture: gesture, drawer: cash }); state('Impreso ✓ · ' + PRN.label()); }
    catch (e) { state(e.code === 'PICK' ? 'Toca "Imprimir ticket" para reconectar la impresora.' : e.message, true); }
  };
  $('#rcPrnCfg').onclick = ev => { ev.preventDefault(); openPrinterSettings(() => showPosDone(r, false)); };
  if (direct) {
    $('#rcDirect').onclick = () => printDirect(true);
    $('#rcSystem').onclick = ev => { ev.preventDefault(); printReceipt(rc, cfg.width, link); };
    if (fresh && cfg.auto) printDirect(false);
  } else {
    $('#rcFmt').onchange = ev => store2.set('nx_receipt_fmt', ev.target.value);
    $('#rcPrint').onclick = () => printReceipt(rc, $('#rcFmt').value, link);
  }
  if (!link) return;
  $('#rcWa').onclick = () => {
    let d = $('#rcPhone').value.replace(/\D/g, '');
    if (d.length === 8) d = '503' + d; else if (d.length === 10) d = '1' + d;
    if (d.length < 10) { toast('Escribe el WhatsApp del cliente.', true); return; }
    const text = '¡Gracias por tu compra en ' + rc.business + '! Recibo ' + rc.number + ' por ' + pm(rc.total) + '.' + (link ? '\nMíralo aquí: ' + link : '');
    window.open('https:\/\/wa.me/' + d + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  };
  $('#rcMailGo').onclick = async ev => {
    ev.target.disabled = true;
    try { await api('apiPosEmailReceipt', S.token, r.id, $('#rcMail').value, link); toast('Recibo enviado a ' + $('#rcMail').value); }
    catch (e) { toast(e.message, true); }
    ev.target.disabled = false;
  };
  $('#rcQr').onclick = () => {
    const el = document.createElement('div');
    el.className = 'qr-full';
    el.innerHTML = `<div class="qr-full-inner"><div class="qr-biz">${esc(rc.business)}</div>${qrSvg(link, 'min(78vw, 62vh)')}
      <div class="qr-event">Recibo ${esc(rc.number)}</div><p>Escanea para guardar tu recibo</p><button class="btn" type="button">Cerrar</button></div>`;
    document.body.appendChild(el);
    el.onclick = ev => { if (ev.target === el || ev.target.tagName === 'BUTTON') el.remove(); };
  };
  $('#rcCopy').onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Enlace copiado'), () => prompt('Copia el enlace:', link));
}

/** Recibo en HTML (pantalla e impresión). fmt: '58' | '80' | 'carta'. */
function receiptHtml(rc, fmt, link) {
  const m = v => esc(moneyIn(v, rc.currency));
  return `<div class="receipt r-${fmt}">
    <div class="r-biz">${esc(rc.business)}</div>
    <div class="r-meta">${esc([rc.legal_name, rc.tax_id ? 'NIT/ID ' + rc.tax_id : '', rc.address, rc.phone].filter(Boolean).join(' · '))}</div>
    ${rc.is_test ? '<div class="r-test">PRUEBA — no es una venta real</div>' : ''}
    ${rc.doc_type === '03' ? '<div class="r-doc">Crédito fiscal · NRC cliente ' + esc(rc.customer_nrc) + '</div>' : ''}
    ${rc.offline && !rc.synced ? '<div class="r-test">Venta sin conexión · comprobante provisional</div>' : ''}
    <div class="r-row r-head"><span>Recibo ${esc(rc.number)}</span><span>${esc(new Date(rc.date).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }))}</span></div>
    <div class="r-row"><span>${esc(rc.register || '')}</span><span>${esc(rc.customer || '')}</span></div>
    <div class="r-items">${rc.items.map(i => `<div class="r-item"><div class="r-row"><span>${esc(i.name)}</span><span>${m(i.total)}</span></div>
      <div class="r-sub">${esc(qtyFmt(i.qty))} × ${m(i.unit_price)}${i.discount ? ' · desc. ' + m(i.discount) : ''}${i.refunded_qty ? ' · ' + i.refunded_qty + ' devuelta(s)' : ''}</div></div>`).join('')}</div>
    ${rc.discount ? `<div class="r-row"><span>Descuento</span><span>−${m(rc.discount)}</span></div>` : ''}
    ${rc.prices_include_tax ? `<div class="r-row"><span>IVA incluido</span><span>${m(rc.tax)}</span></div>` : `<div class="r-row"><span>Subtotal</span><span>${m(rc.subtotal)}</span></div><div class="r-row"><span>Impuesto</span><span>${m(rc.tax)}</span></div>`}
    <div class="r-row r-total"><span>TOTAL</span><span>${m(rc.total)}</span></div>
    ${rc.payments.map(p => `<div class="r-row"><span>${esc(p.method)}${p.reference ? ' ' + esc(p.reference) : ''}</span><span>${m(p.amount)}</span></div>${p.tendered && p.change ? `<div class="r-row r-sub"><span>Recibido ${m(p.tendered)}</span><span>Cambio ${m(p.change)}</span></div>` : ''}`).join('')}
    ${rc.refunded ? `<div class="r-row"><span>Reembolsado</span><span>−${m(rc.refunded)}</span></div>` : ''}
    ${receiptDteHtml(rc, fmt)}
    ${link ? `<div class="r-qr">${qrSvg(link, fmt === '58' ? 92 : 112)}<span>Tu recibo en línea</span></div>` : ''}
    ${rc.footer ? `<div class="r-foot">${esc(rc.footer)}</div>` : ''}
  </div>`;
}

function printReceipt(rc, fmt, link) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'receipt-print';
  area.innerHTML = receiptHtml(rc, fmt, link);
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  if (fmt === 'carta') ps.textContent = '@page { size: letter; margin: 14mm; }';
  else {
    // Rollo: el alto de la página es el del recibo, para no gastar papel.
    area.style.display = 'block'; area.style.position = 'absolute'; area.style.left = '-9999px'; area.style.width = fmt + 'mm';
    const mm = Math.ceil(area.firstElementChild.getBoundingClientRect().height * 25.4 / 96) + 8;
    area.removeAttribute('style');
    ps.textContent = '@page { size: ' + fmt + 'mm ' + Math.max(mm, 60) + 'mm; margin: 0; }';
  }
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

const dayFmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
/** Lee un monto escrito como 1,234.56 · 1234.56 · 12,50 (coma decimal también se entiende). */
function numIn(v) {
  let x = String(v === undefined || v === null ? '' : v).replace(/[^\d.,-]/g, '');
  if (x.indexOf('.') >= 0) x = x.replace(/,/g, '');
  else if (/,\d{1,2}$/.test(x)) x = x.replace(/,(\d{1,2})$/, '.$1').replace(/,/g, '');
  else x = x.replace(/,/g, '');
  const n = Number(x);
  return isFinite(n) ? n : 0;
}

function finChart(months) {
  if (!months || !months.length) return '<p class="muted">Sin datos todavía.</p>';
  const W = 560, H = 200, pad = 26, bw = (W - pad * 2) / months.length;
  const max = Math.max(1, ...months.map(m => Math.max(m.sales, m.cost + m.opex + m.financial, Math.abs(m.net))));
  const base = H / 2 + 10;
  const scale = (H / 2 - 16) / max;
  const pts = months.map((m, i) => [pad + bw * i + bw / 2, base - m.net * scale]);
  return `<svg class="fin-chart" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Ventas, costos y utilidad de los últimos meses">
    <line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" class="axis"/>
    ${months.map((m, i) => {
      const x = pad + bw * i, cw = Math.min(18, bw / 3.2), spend = m.cost + m.opex + m.financial;
      return `<g><title>${esc(monthName(m.month))}: ventas ${esc(fm(m.sales))}, costos y gastos ${esc(fm(spend))}, utilidad ${esc(fm(m.net))}</title>
        <rect class="b1" x="${x + bw / 2 - cw - 2}" y="${base - m.sales * scale}" width="${cw}" height="${Math.max(0, m.sales * scale)}" rx="3"/>
        <rect class="b2" x="${x + bw / 2 + 2}" y="${base - spend * scale}" width="${cw}" height="${Math.max(0, spend * scale)}" rx="3"/>
        <text x="${x + bw / 2}" y="${H + 10}" text-anchor="middle">${esc(monthName(m.month))}</text></g>`;
    }).join('')}
    <polyline class="ln" points="${pts.map(p => p.join(',')).join(' ')}"/>
    ${pts.map((p, i) => `<circle class="dt ${months[i].net < 0 ? 'neg' : ''}" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}
  </svg>`;
}

function agingBar(a) {
  const keys = Object.keys(a), tot = keys.reduce((s, k) => s + a[k], 0) || 1;
  const label = { por_vencer: 'Por vencer', '0-30': '0–30 días', '31-60': '31–60', '61-90': '61–90', '+90': 'Más de 90' };
  return `<div class="aging" role="img" aria-label="Antigüedad de saldos">${keys.filter(k => a[k] > 0).map((k, i) => `<span class="ag ag${i}" style="flex:${a[k] / tot}" title="${esc(label[k] + ': ' + fm(a[k]))}"></span>`).join('')}</div>
    <ul class="ag-legend">${keys.map((k, i) => `<li><i class="ag ag${i}"></i>${label[k]} <b>${fm(a[k])}</b></li>`).join('')}</ul>`;
}

function catBars(list) {
  const max = Math.max(...list.map(x => x.amount)) || 1;
  return `<ul class="catbars">${list.slice(0, 8).map(x => `<li><span class="cb-n">${esc(x.name)}</span><span class="cb-b"><i style="width:${Math.max(3, x.amount / max * 100)}%"></i></span><b>${fm(x.amount)}</b></li>`).join('')}</ul>`;
}

  }
}

function readAmounts(f) {
  if (f.subtotal) return { subtotal: numIn(f.subtotal.value), tax: numIn(f.tax.value) };
  return { subtotal: numIn(f.total.value), tax: 0 };
}

/** Comprime la foto (lado mayor 1600 px) y la sube a Drive. */
async function uploadReceipt(expenseId, file) {
  let data, mime = file.type;
  if (file.type.indexOf('image/') === 0) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen.')); i.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    data = cv.toDataURL('image/jpeg', 0.82); mime = 'image/jpeg';
  } else {
    if (file.size > 6 * 1024 * 1024) throw new Error('El PDF pesa más de 6 MB.');
    data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('No se pudo leer el archivo.')); r.readAsDataURL(file); });
  }
  return api('apiFinAttach', S.token, expenseId, { mime: mime, data: data });
}

/* ---------- Fechas de los reportes ---------- */

function finRange() {
  if (FIN.range) return FIN.range;
  const t = finToday();
  return (FIN.range = { from: t.slice(0, 8) + '01', to: t });
}
function rangePresets() {
  const t = finToday(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
  const pad = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();
  const pm = m === 1 ? [y - 1, 12] : [y, m - 1];
  const fy = (FIN.cfg && FIN.cfg.fiscal_start) || '01';
  const fyStart = (Number(fy) <= m ? y : y - 1) + '-' + fy + '-01';
  const ago = new Date(y, m - 12, 1);
  return [['Este mes', t.slice(0, 8) + '01', t], ['Mes anterior', pm[0] + '-' + pad(pm[1]) + '-01', pm[0] + '-' + pad(pm[1]) + '-' + lastDay(pm[0], pm[1])],
    ['Este año', fyStart, t], ['Últimos 12 meses', ago.getFullYear() + '-' + pad(ago.getMonth() + 1) + '-01', t]];
}
function rangePicker(id, from, to, single) {
  if (single) return `<div class="toolbar fin-tools"><label class="muted sm" for="${id}At">Al</label><input class="input" type="date" id="${id}At" value="${esc(to)}" style="max-width:180px"></div>`;
  return `<div class="toolbar fin-tools"><div class="chips">${rangePresets().map(p => `<button class="btn sm ${p[1] === from && p[2] === to ? 'primary' : ''}" data-rg="${p[1]}|${p[2]}">${p[0]}</button>`).join('')}</div>
    <input class="input" type="date" id="${id}From" value="${esc(from)}" aria-label="Desde" style="max-width:170px"><span class="muted">a</span><input class="input" type="date" id="${id}To" value="${esc(to)}" aria-label="Hasta" style="max-width:170px"></div>`;
}
function bindRange(id, fn, single) {
  if (single) { $('#' + id + 'At').onchange = ev => fn(ev.target.value); return; }
  document.querySelectorAll('[data-rg]').forEach(b => b.onclick = () => { const [a, c] = b.dataset.rg.split('|'); FIN.range = { from: a, to: c }; fn(a, c); });
  const ch = () => { const a = $('#' + id + 'From').value, c = $('#' + id + 'To').value; if (a && c && a <= c) { FIN.range = { from: a, to: c }; fn(a, c); } };
  $('#' + id + 'From').onchange = ch; $('#' + id + 'To').onchange = ch;
}

function downloadCsv(name, head, rows) {
  const cell = v => { const s = v === null || v === undefined ? '' : typeof v === 'number' ? (Math.round(v * 100) / 100).toFixed(2) : String(v); return /[";\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function printReport(title, html) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'report-print';
  const biz = S.boot.tenant.legal_name || S.boot.tenant.name;
  area.innerHTML = `<div class="rp"><div class="rp-h"><b>${esc(biz)}</b>${S.boot.tenant.tax_id ? '<span>NIT ' + esc(S.boot.tenant.tax_id) + '</span>' : ''}<h1>${esc(title)}</h1></div>${html}</div>`;
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  ps.textContent = '@page { size: letter; margin: 14mm; }';
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

async function repIncome(from, to) {
  const byMonth = !!FIN.byMonth;
  const d = await api('apiFinIncome', S.token, from, to, byMonth);
  if (!finActive('reportes')) return;
  const T = d.totals;
  const sec = (title, rows, total, sign) => rows.length ? `<tr class="rp-sec"><td colspan="${byMonth ? d.months.length + 2 : 2}">${title}</td></tr>
    ${rows.map(r => `<tr class="click" data-code="${esc(r.code)}"><td class="rp-acc">${esc(r.name)}</td>${byMonth ? d.months.map(m => `<td class="num">${fmZ(r.months[m.month] * sign)}</td>`).join('') : ''}<td class="num">${fmZ(r.total * sign)}</td></tr>`).join('')}
    ${total ? `<tr class="rp-sub"><td>Total ${title.toLowerCase()}</td>${byMonth ? d.months.map(m => `<td class="num">${fmZ(total[1](m))}</td>`).join('') : ''}<td class="num">${fmZ(total[0])}</td></tr>` : ''}` : '';
  const line = (label, key, cls) => `<tr class="${cls || 'rp-tot'}"><td>${label}</td>${byMonth ? d.months.map(m => `<td class="num ${m[key] < 0 ? 'neg' : ''}">${fmZ(m[key])}</td>`).join('') : ''}<td class="num ${T[key] < 0 ? 'neg' : ''}">${fmZ(T[key])}</td></tr>`;
  const isOther = r => r.code.indexOf('42') === 0, isFin = r => r.code.indexOf('62') === 0 || r.code.indexOf('63') === 0;
  const rows = d.rows;
  const table = `<table class="rp-table"><thead><tr><th></th>${byMonth ? d.months.map(m => `<th class="num">${esc(monthName(m.month))}</th>`).join('') : ''}<th class="num">${byMonth ? 'Total' : esc(dayFmt(from) + ' – ' + dayFmt(to))}</th></tr></thead><tbody>
    ${sec('Ingresos', rows.filter(r => r.type === 'ingreso' && !isOther(r)), [T.sales, m => m.sales], 1)}
    ${sec('Costo de ventas', rows.filter(r => r.type === 'costo'), [T.cost, m => m.cost], 1)}
    ${line('Utilidad bruta', 'gross')}
    ${sec('Gastos de operación', rows.filter(r => r.type === 'gasto' && !isFin(r)), [T.opex, m => m.opex], 1)}

    ${sec('Gastos financieros e impuestos', rows.filter(r => r.type === 'gasto' && isFin(r)), null, 1)}
    ${line('Utilidad neta', 'net', 'rp-net')}
  </tbody></table>`;
  $('#repBody').innerHTML = `${rangePicker('is', from, to)}
    <div class="chips" style="margin:-4px 0 10px"><label class="chk"><input type="checkbox" id="isMonth" ${byMonth ? 'checked' : ''}> Ver por mes</label></div>
    <div class="grid kpis fin-kpis"><div class="card pad kpi"><div class="l">Ventas</div><div class="v m">${fm(T.sales)}</div></div>
      <div class="card pad kpi"><div class="l">Utilidad bruta</div><div class="v m">${fm(T.gross)}</div><div class="hint">margen ${T.gross_margin.toFixed(1)} %</div></div>
      <div class="card pad kpi"><div class="l">Gastos</div><div class="v m">${fm(T.opex + T.financial)}</div></div>
      <div class="card pad kpi"><div class="l">Utilidad neta</div><div class="v m ${T.net < 0 ? 'bad' : 'good'}">${fm(T.net)}</div><div class="hint">margen ${T.net_margin.toFixed(1)} %</div></div></div>
    <div class="card tablewrap rp-card">${rows.length ? table : '<div class="empty">Sin movimientos en estas fechas.</div>'}</div>
    <div class="chips" style="margin-top:12px"><button class="btn" id="isPrint">Imprimir o PDF</button><button class="btn" id="isCsv">Descargar (Excel/CSV)</button></div>`;
  bindRange('is', (a, b) => repIncome(a, b));
  $('#isMonth').onchange = ev => { FIN.byMonth = ev.target.checked; repIncome(from, to); };
  $('#repBody').querySelectorAll('tr[data-code]').forEach(tr => tr.onclick = () => openLedger(tr.dataset.code, from, to));
  $('#isPrint').onclick = () => printReport('Estado de resultados del ' + dayFmt(from) + ' al ' + dayFmt(to), table);
  $('#isCsv').onclick = () => downloadCsv('Estado de resultados ' + from + ' a ' + to, ['Cuenta', 'Nombre', 'Tipo'].concat(byMonth ? d.months.map(m => m.month) : []).concat(['Total']),
    rows.map(r => [r.code, r.name, r.type].concat(byMonth ? d.months.map(m => r.months[m.month] || 0) : []).concat([r.total]))
      .concat([['', 'Utilidad bruta', ''].concat(byMonth ? d.months.map(m => m.gross) : []).concat([T.gross]), ['', 'Utilidad neta', ''].concat(byMonth ? d.months.map(m => m.net) : []).concat([T.net])]));

function acManual() {
  const line = () => `<div class="pm-line">${accSelect('acc', '', () => true, 'Cuenta…')}<input class="input" name="debit" inputmode="decimal" placeholder="Debe"><input class="input" name="credit" inputmode="decimal" placeholder="Haber"><input class="input" name="memo" placeholder="Detalle"><button type="button" class="btn sm" data-rm aria-label="Quitar línea">✕</button></div>`;
  $('#acBody').innerHTML = `<p class="muted">Para ajustes de tu contador: depreciaciones, provisiones, reclasificaciones. Lo del día a día (ventas, gastos, pagos) ya se registra solo.</p>
    <form class="form fin1 card pad" id="pmForm" style="max-width:860px">
      <div class="two"><div><label class="f">Fecha</label><input class="input" type="date" name="date" value="${finToday()}"></div><div><label class="f">Concepto</label><input class="input" name="description" placeholder="Ej. Depreciación de noviembre"></div></div>
      <div class="pm-head"><span>Cuenta</span><span>Debe</span><span>Haber</span><span>Detalle</span><span></span></div>
      <div id="pmLines">${line()}${line()}</div>
      <div class="chips"><button type="button" class="btn sm" id="pmAdd">+ Línea</button><span class="muted sm" id="pmSum"></span></div>
      <div class="chips"><button class="btn primary" type="submit">Registrar partida</button></div><div class="err" id="pmErr"></div></form>`;
  const sum = () => {
    let dd = 0, cc = 0;
    document.querySelectorAll('.pm-line').forEach(l => { dd += numIn(l.querySelector('[name=debit]').value); cc += numIn(l.querySelector('[name=credit]').value); });
    $('#pmSum').innerHTML = `Debe <b>${fm(dd)}</b> · Haber <b>${fm(cc)}</b> · ${Math.abs(dd - cc) < 0.005 && dd > 0 ? '<span class="good">cuadra</span>' : '<span class="neg">diferencia ' + fm(dd - cc) + '</span>'}`;
  };
  const bind = () => { document.querySelectorAll('.pm-line input').forEach(i => i.oninput = sum); document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (document.querySelectorAll('.pm-line').length > 2) { b.parentElement.remove(); sum(); } }); };
  $('#pmAdd').onclick = () => { $('#pmLines').insertAdjacentHTML('beforeend', line()); bind(); };
  bind(); sum();
  $('#pmForm').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    const lines = [...document.querySelectorAll('.pm-line')].map(l => ({ account: l.querySelector('[name=acc]').value, debit: numIn(l.querySelector('[name=debit]').value), credit: numIn(l.querySelector('[name=credit]').value), memo: l.querySelector('[name=memo]').value }));
    try { const r = await api('apiFinManualEntry', S.token, { date: f.date.value, description: f.description.value, lines: lines }); toast('Partida ' + r.number + ' registrada'); FIN.acct = 'diario'; finAccounting(); }
    catch (e) { $('#pmErr').textContent = e.message; }
  };
}

  if (!finActive('impuestos')) return;
  const S2 = r.summary, w = can('finance:write');
  const tabs = [['resumen', 'Resumen F-07'], ['compras', 'Libro de compras'], ['cf', 'Ventas a consumidor final'], ['ccf', 'Ventas a contribuyentes'], ['ajustes', 'Ajustes de IVA']]

/** Comprobante en el POS: factura, crédito fiscal (con NRC) o exportación. */
function openPosDoc() {
  const c = POS.cart;
  openModal('Comprobante', `<form class="form fin1" id="pdForm">
    <div class="chips" role="group">${Object.keys(DOC_NAMES).map(k => `<button type="button" class="btn ${(c.doc_type || '01') === k ? 'primary' : ''}" data-doc="${k}">${DOC_NAMES[k]}</button>`).join('')}</div>
    <div id="pdNrc"><label class="f">NRC del cliente</label><input class="input" name="nrc" inputmode="numeric" value="${esc(c.customer_nrc || (c.customer && c.customer.nrc) || '')}" placeholder="123456-7">
      <div class="hint">${c.customer ? 'Se guarda en la ficha de ' + esc(c.customer.name) + '.' : 'Primero elige o registra al cliente (con su NIT).'}</div></div></form>`, async () => {
    const f = $('#pdForm'), type = f.dataset.doc || c.doc_type || '01';
    if (type === '03') {
      if (!c.customer) throw new Error('Elige o registra al cliente antes de emitir crédito fiscal.');
      if (!f.nrc.value.replace(/\D/g, '')) throw new Error('Escribe el NRC del cliente.');
      c.customer_nrc = f.nrc.value;
    } else c.customer_nrc = '';
    c.doc_type = type; drawPosCart();
  }, 'Listo');
  const f = $('#pdForm');
  f.dataset.doc = c.doc_type || '01';
  const sync = () => { $('#pdNrc').hidden = f.dataset.doc !== '03'; document.querySelectorAll('[data-doc]').forEach(b => b.classList.toggle('primary', b.dataset.doc === f.dataset.doc)); };
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => { f.dataset.doc = b.dataset.doc; sync(); });
  sync();
}


/* ============================ Facturación electrónica (DTE El Salvador) ============================ */

const DTE = { tab: 'docs', cfg: null, f: { status: '', tipo: '', q: '' }, rows: null };
const DTE_TABS = [['docs', 'Documentos'], ['ajustes', 'Configuración'], ['pruebas', 'Pruebas de Hacienda']];
const DTE_TAG = { practica: 'pendiente', pendiente: 'pendiente', enviando: 'pendiente', procesado: 'pagada', rechazado: 'cancelada', contingencia: 'parcial', invalidado: 'cancelada', error: 'cancelada' };

async function dteLoad(force) {
  if (DTE.cfg && !force) return DTE.cfg;
  DTE.cfg = await api('apiDteSettings', S.token);
  return DTE.cfg;
}

function dteMode(c) {
  const s = c.settings;
  if (!s.enabled) return { label: 'Apagada', cls: 'cancelada', text: 'La facturación electrónica está apagada: las ventas no generan DTE.' };
  if (c.missing.length) return { label: 'Faltan datos', cls: 'cancelada', text: 'Completa los datos de tu empresa en Configuración para poder emitir.' };
  if (!c.can_send) return { label: 'Práctica', cls: 'pendiente', text: 'Sin credenciales de ' + (s.ambiente === '01' ? 'producción' : 'pruebas') + ': cada venta arma su DTE completo para que lo revises, pero no se envía a Hacienda.' };
  if (s.ambiente === '00') return { label: 'Pruebas de Hacienda', cls: 'parcial', text: 'Conectado al ambiente de pruebas: Hacienda recibe y sella los documentos, pero no tienen validez fiscal.' };
  return { label: 'Producción', cls: 'pagada', text: 'Conectado a producción: los documentos aceptados son tus facturas legales.' };
}

async function viewDte() {
  const main = $('#main');
  main.innerHTML = pageHeader('Facturación electrónica', '<button class="btn" id="dteSales">Ventas</button>') +
    `<nav class="fin-tabs" role="tablist" aria-label="Secciones de facturación electrónica">${DTE_TABS.filter(t => t[0] === 'docs' || can('settings:write'))
      .map(t => `<button role="tab" class="fin-tab ${DTE.tab === t[0] ? 'on' : ''}" aria-selected="${DTE.tab === t[0]}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav>
    <div id="dteBody"><div class="empty">Cargando…</div></div>`;
  $('#dteSales').onclick = () => go('sales');
  main.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { DTE.tab = b.dataset.tab; viewDte(); });
  try { await dteLoad(true); } catch (e) { $('#dteBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; return; }
  if (S.view !== 'dte') return;
  const fn = { docs: dteDocs, ajustes: dteSettingsTab, pruebas: dteTests }[can('settings:write') ? DTE.tab : 'docs'];
  try { await fn(); } catch (e) { if (S.view === 'dte') $('#dteBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
}

/* ---------- Documentos ---------- */

async function dteDocs() {
  const c = DTE.cfg, mode = dteMode(c);
  $('#dteBody').innerHTML = `
    <div class="card pad dte-mode"><span class="tag ${mode.cls}">${esc(mode.label)}</span><p>${esc(mode.text)}</p>
      ${c.missing.length && c.admin ? '<button class="btn sm" id="dteGoCfg">Completar datos</button>' : ''}</div>
    <div class="toolbar">
      <select class="input" id="dteSt"><option value="">Todos los estados</option>${Object.keys(c.status).map(k => `<option value="${k}" ${DTE.f.status === k ? 'selected' : ''}>${esc(c.status[k])}</option>`).join('')}</select>
      <select class="input" id="dteTp"><option value="">Todos los tipos</option>${c.type_order.map(k => `<option value="${k}" ${DTE.f.tipo === k ? 'selected' : ''}>${esc(c.types[k].name)}</option>`).join('')}
        <option value="anulacion" ${DTE.f.tipo === 'anulacion' ? 'selected' : ''}>Invalidaciones</option><option value="contingencia" ${DTE.f.tipo === 'contingencia' ? 'selected' : ''}>Eventos de contingencia</option></select>
      <input class="input" id="dteQ" placeholder="Buscar por número, código o cliente" value="${esc(DTE.f.q)}">
      <span id="dteRetryWrap"></span>
    </div>
    <div class="card tablewrap" id="dteList"><div class="empty">Cargando…</div></div>`;
  if ($('#dteGoCfg')) $('#dteGoCfg').onclick = () => { DTE.tab = 'ajustes'; viewDte(); };
  let tm = null;
  const reload = () => { DTE.f = { status: $('#dteSt').value, tipo: $('#dteTp').value, q: $('#dteQ').value }; dteDrawList(); };
  $('#dteSt').onchange = reload; $('#dteTp').onchange = reload;
  $('#dteQ').oninput = () => { clearTimeout(tm); tm = setTimeout(reload, 300); };
  await dteDrawList();
}

async function dteDrawList() {
  let d;
  try { d = await api('apiDteList', S.token, DTE.f); } catch (e) { $('#dteList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  if (S.view !== 'dte') return;
  const waiting = (d.summary.pendiente || 0) + (d.summary.contingencia || 0) + (d.summary.enviando || 0);
  $('#dteRetryWrap').innerHTML = waiting && can('sales:write') ? `<button class="btn primary" id="dteRetry">Enviar pendientes (${waiting})</button>` : '';
  if ($('#dteRetry')) $('#dteRetry').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Enviando…';
    try { const r = await api('apiDteRetryAll', S.token); toast(r.sent ? r.sent + ' documento(s) aceptados por Hacienda' : (r.contingency && r.contingency.error) || 'Hacienda todavía no responde; se reintenta solo cada 15 minutos.', !r.sent); }
    catch (e) { toast(e.message, true); }
    dteDrawList();
  };
  if (!d.rows.length) {
    $('#dteList').innerHTML = `<div class="empty">${DTE.f.status || DTE.f.tipo || DTE.f.q ? 'Sin resultados.' : DTE.cfg.settings.enabled ? 'Aún no hay documentos. Cada venta del punto de venta genera el suyo; también puedes emitirlo desde el detalle de una venta.' : 'Activa la facturación electrónica en Configuración.'}</div>`;
    return;
  }
  $('#dteList').innerHTML = `<table class="wrap"><thead><tr><th>Fecha</th><th>Documento</th><th>Número de control</th><th>Receptor</th><th class="num">Total</th><th>Estado</th><th></th></tr></thead>
    <tbody>${d.rows.map(r => `<tr><td class="muted" style="white-space:nowrap">${esc(dayFmt(r.fec_emi))} ${esc(String(r.hor_emi || '').slice(0, 5))}</td>
      <td>${esc(r.type_label)}${r.ambiente === '00' ? ' <span class="tag prueba">PRUEBAS</span>' : ''}<br><span class="muted sm">${esc(r.ref_number || '')}</span></td>
      <td><span class="code sm">${esc(r.numero_control || '—')}</span></td><td>${esc(r.receptor_name || '')}${r.receptor_doc ? '<br><span class="muted sm">' + esc(r.receptor_doc) + '</span>' : ''}</td>
      <td class="num">${r.total ? esc(moneyIn(r.total, 'USD')) : ''}</td><td><span class="tag ${DTE_TAG[r.status] || ''}">${esc(r.status_label)}</span></td>
      <td class="actions"><button class="btn sm" data-dte="${esc(r.id)}">Ver</button></td></tr>`).join('')}</tbody></table>
    ${d.total > d.rows.length ? '<p class="muted sm pad">Se muestran los ' + d.rows.length + ' más recientes de ' + d.total + '. Usa la búsqueda para encontrar otros.</p>' : ''}`;
  $('#dteList').querySelectorAll('[data-dte]').forEach(b => b.onclick = () => openDte(b.dataset.dte, () => { if (S.view === 'dte') dteDrawList(); }));
}

/** Detalle de un DTE con sus acciones. after() refresca la pantalla de origen. */
async function openDte(id, after) {
  openModal('Documento electrónico', '<div class="empty">Cargando…</div>', null, null, true);
  let d;
  try { d = await api('apiDteGet', S.token, id); } catch (e) { $('#modal .body').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; return; }
  const kv = (l, v, cls) => v ? `<div class="kv"><span>${l}</span><b class="${cls || ''}">${v}</b></div>` : '';
  const isDoc = ['01', '03', '05', '14'].indexOf(d.tipo) >= 0;
  const w = can('sales:write'), rf = can('sales:refund');
  $('#modal h3').textContent = d.type_label + (d.numero_control ? ' · ' + d.numero_control.slice(-6) : '');
  $('#modal .body').innerHTML = `
    <div class="dte-detail">
      <div>
        <p><span class="tag ${DTE_TAG[d.status] || ''}">${esc(d.status_label)}</span> <span class="muted">${esc(d.ambiente_label)}${d.ref_number ? ' · ' + esc(d.ref_number) : ''}</span></p>
        ${d.status === 'practica' ? '<div class="note">Documento de práctica: está completo y validado, pero no se envió a Hacienda. Sube tus credenciales para emitir de verdad.</div>' : ''}
        ${d.status === 'error' || d.status === 'rechazado' ? `<div class="note bad-note"><b>${d.status === 'error' ? 'Faltan datos' : 'Hacienda lo rechazó'}${d.mh_code ? ' (' + esc(d.mh_code) + ')' : ''}:</b> ${esc(d.mh_message || '')}${d.observaciones ? '<br>' + esc(d.observaciones) : ''}</div>` : ''}
        ${d.status === 'contingencia' ? `<div class="note">Hacienda no respondió (${esc(d.mh_message || '')}). Se reporta como contingencia y se envía solo cuando vuelva; tienes hasta 72 horas.</div>` : ''}
        <div class="kvs">
          ${kv('Receptor', esc(d.receptor_name) + (d.receptor_doc ? ' · ' + esc(d.receptor_doc) : ''))}
          ${kv('Fecha y hora', esc(dayFmt(d.fec_emi) + ' ' + d.hor_emi))}
          ${kv('Número de control', '<span class="code">' + esc(d.numero_control || '—') + '</span>')}
          ${kv('Código de generación', '<span class="code">' + esc(d.codigo) + '</span>')}
          ${kv('Sello de recepción', d.sello ? '<span class="code">' + esc(d.sello) + '</span>' : '')}
          ${d.total ? kv('Total', esc(moneyIn(d.total, 'USD'))) : ''}${d.iva ? kv('IVA', esc(moneyIn(d.iva, 'USD'))) : ''}
          ${kv('Notas', esc(d.notes || ''))}
        </div>
        ${(d.credit_notes || []).length ? `<h4>Notas de crédito</h4><ul class="fin-list">${d.credit_notes.map(n => `<li><span>${esc(n.numero_control)} · ${esc(n.status_label)}</span><b>${esc(moneyIn(n.total, 'USD'))}</b></li>`).join('')}</ul>` : ''}
        ${d.document ? `<details class="dte-json"><summary>Ver el JSON del documento</summary>${codeBlock(JSON.stringify(d.document, null, 2))}</details>` : ''}
      </div>
      <div class="dte-qr">${d.qr ? qrSvg(d.qr, 150) + `<a href="${esc(d.qr)}" target="_blank" rel="noopener" class="hint">Consultar en Hacienda</a>` : ''}</div>
    </div>
    <div class="chips" style="margin-top:16px">
      ${w && d.status === 'pendiente' ? '<button class="btn primary" id="dSend">Enviar a Hacienda</button>' : ''}
      ${w && ['rechazado', 'error'].indexOf(d.status) >= 0 && isDoc ? '<button class="btn primary" id="dFix">Corregir y volver a generar</button>' : ''}
      ${isDoc && d.document ? '<button class="btn" id="dPrint">Imprimir</button><button class="btn" id="dJson">Descargar JSON</button>' : ''}
      ${rf && d.tipo === '03' && d.status === 'procesado' ? '<button class="btn" id="dNc">Nota de crédito</button>' : ''}
      ${rf && isDoc && d.status === 'procesado' ? '<button class="btn danger" id="dVoid">Invalidar</button>' : ''}
    </div>`;
  bindCopy($('#modal'));
  const refresh = () => { if (after) after(); openDte(id, after); };
  const busy = async (btn, label, fn) => {
    btn.disabled = true; const t = btn.textContent; btn.textContent = label;
    try { await fn(); } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = t; }
  };
  if ($('#dSend')) $('#dSend').onclick = ev => busy(ev.target, 'Enviando…', async () => {
    const r = await api('apiDteSend', S.token, id);
    toast(r.status === 'procesado' ? 'Aceptado por Hacienda' : r.status_label + (r.mh_message ? ': ' + r.mh_message : ''), r.status !== 'procesado'); refresh();
  });
  if ($('#dFix')) $('#dFix').onclick = ev => busy(ev.target, 'Generando…', async () => {
    const r = await api('apiDteRebuild', S.token, id);
    if (r.status === 'pendiente') { const s = await api('apiDteSend', S.token, id); toast(s.status === 'procesado' ? 'Corregido y aceptado por Hacienda' : s.status_label, s.status !== 'procesado'); }
    else toast(r.status === 'error' ? r.mh_message : 'Documento generado de nuevo', r.status === 'error');
    refresh();
  });
  if ($('#dPrint')) $('#dPrint').onclick = () => printDte(d);
  if ($('#dJson')) $('#dJson').onclick = ev => busy(ev.target, 'Preparando…', async () => {
    const f = await api('apiDteDownload', S.token, id);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([f.content], { type: 'application/json' })); a.download = f.filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    ev.target.disabled = false; ev.target.textContent = 'Descargar JSON';
  });
  if ($('#dNc')) $('#dNc').onclick = () => openCreditNote(d, after);
  if ($('#dVoid')) $('#dVoid').onclick = () => openInvalidate(d, after);
}

function openCreditNote(d, after) {
  const items = (d.document && d.document.cuerpoDocumento) || [];
  openModal('Nota de crédito sobre ' + d.numero_control.slice(-6), `<form class="form fin1" id="ncForm">
    <p class="muted sm" style="margin:0">Para devoluciones o descuentos después de emitir el crédito fiscal. Elige cuántas unidades de cada artículo se acreditan.</p>
    <div class="nc-items">${items.map(x => `<div class="nc-item"><span>${esc(x.descripcion)}<br><span class="muted sm">${esc(qtyFmt(x.cantidad))} × ${esc(moneyIn(x.precioUni, 'USD'))} sin IVA</span></span>
      <input class="input" type="number" min="0" max="${esc(x.cantidad)}" step="any" inputmode="decimal" data-n="${esc(x.numItem)}" value="0" aria-label="Cantidad a acreditar de ${esc(x.descripcion)}"></div>`).join('')}</div>
    <div><label class="f">Motivo</label><input class="input" name="reason" maxlength="300" placeholder="Devolución de mercadería"></div></form>`, async () => {
    const f = $('#ncForm');
    const picks = Array.from(f.querySelectorAll('[data-n]')).map(i => ({ n: Number(i.dataset.n), qty: numIn(i.value) })).filter(p => p.qty > 0);
    const nc = await api('apiDteCreditNote', S.token, d.id, { items: picks, reason: f.reason.value });
    let msg = 'Nota de crédito generada';
    if (nc.status === 'pendiente') { const s = await api('apiDteSend', S.token, nc.id); msg = s.status === 'procesado' ? 'Nota de crédito aceptada por Hacienda' : 'Nota de crédito: ' + s.status_label; }
    toast(msg); if (after) after();
    setTimeout(() => openDte(nc.id, after), 0);
  }, 'Emitir nota de crédito');
}

function openInvalidate(d, after) {
  const types = DTE.cfg ? DTE.cfg.void_types : { 1: 'Error en la información', 2: 'Rescindir la operación', 3: 'Otro' };
  openModal('Invalidar ' + d.numero_control.slice(-6), `<form class="form fin1" id="ivForm">
    <div class="note">Invalidar le avisa a Hacienda que este documento ya no vale. No se puede deshacer.</div>
    <div><label class="f">Motivo</label><select class="input" name="tipo">${Object.keys(types).map(k => `<option value="${k}" ${k === '2' ? 'selected' : ''}>${esc(types[k])}</option>`).join('')}</select></div>
    <div id="ivRepl"><label class="f">Documento que lo reemplaza</label><select class="input" name="replacement_id"><option value="">Elige…</option>${(d.replacements || []).map(r => `<option value="${esc(r.id)}">${esc(r.label)}</option>`).join('')}</select>
      <div class="hint">Primero emite el documento correcto; después invalidas este y lo eliges aquí.</div></div>
    <div><label class="f">Explicación</label><input class="input" name="reason" maxlength="200" placeholder="El cliente canceló la compra"></div></form>`, async () => {
    const f = $('#ivForm');
    await api('apiDteInvalidate', S.token, d.id, { tipo: Number(f.tipo.value), replacement_id: f.replacement_id.value, reason: f.reason.value });
    toast('Documento invalidado'); if (after) after();
  }, 'Invalidar');
  $('#modalOk').classList.add('danger');
  const f = $('#ivForm');
  const sync = () => { $('#ivRepl').hidden = f.tipo.value === '2'; };
  f.tipo.onchange = sync; sync();
}

/** Representación gráfica (hoja carta) con QR de consulta. */
function printDte(d) {
  const j = d.document || {}, e = j.emisor || {}, r = j.receptor || {}, R = j.resumen || {}, id = j.identificacion || {};
  const m = v => esc(moneyIn(v || 0, 'USD'));
  const dir = x => x && x.direccion ? esc(x.direccion.complemento || '') : '';
  const p4 = v => '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const body = (j.cuerpoDocumento || []).map(x => `<tr><td>${esc(qtyFmt(x.cantidad))}</td><td>${esc(x.descripcion)}</td><td class="num">${esc(p4(x.precioUni))}</td>
    <td class="num">${x.montoDescu ? m(x.montoDescu) : ''}</td><td class="num">${x.ventaExenta ? m(x.ventaExenta) : ''}</td><td class="num">${m(x.ventaGravada !== undefined ? x.ventaGravada : x.compra)}</td></tr>`).join('');
  const iva = R.totalIva !== undefined ? R.totalIva : (R.tributos || []).reduce((a, t) => a + (t.codigo === '20' ? t.valor : 0), 0);
  const html = `<div class="dte-paper">
    <div class="dte-top"><div><h1>${esc(e.nombre || '')}</h1><p>${esc(e.nombreComercial || '')}</p><p>NIT ${esc(e.nit || '')} · NRC ${esc(e.nrc || '')}</p><p>${esc(e.descActividad || '')}</p><p>${dir(e)}</p><p>${esc([e.telefono, e.correo].filter(Boolean).join(' · '))}</p></div>
      <div class="dte-box"><h2>DOCUMENTO TRIBUTARIO ELECTRÓNICO</h2><h3>${esc(d.type_label.toUpperCase())}</h3>
        ${d.ambiente === '00' ? '<p class="dte-warn">AMBIENTE DE PRUEBAS — SIN VALIDEZ FISCAL</p>' : ''}
        <p><b>Código de generación</b><br>${esc(d.codigo)}</p><p><b>Número de control</b><br>${esc(d.numero_control)}</p>
        <p><b>Sello de recepción</b><br>${esc(d.sello || 'Pendiente')}</p><p><b>Modelo</b> ${id.tipoModelo === 2 ? 'Diferido' : 'Previo'} · <b>Transmisión</b> ${id.tipoOperacion === 2 ? 'Contingencia' : 'Normal'}</p>
        <p><b>Fecha y hora</b> ${esc(d.fec_emi)} ${esc(d.hor_emi)}</p></div>
      <div class="dte-qrbox">${d.qr ? qrSvg(d.qr, 120) : ''}</div></div>
    <div class="dte-rec"><b>${d.tipo === '14' ? 'Sujeto excluido' : 'Receptor'}:</b> ${esc(r.nombre || 'Consumidor final')}
      ${r.nit || r.numDocumento ? ' · Documento ' + esc(r.nit || r.numDocumento) : ''}${r.nrc ? ' · NRC ' + esc(r.nrc) : ''}${r.descActividad ? ' · ' + esc(r.descActividad) : ''}${dir(r) ? '<br>' + dir(r) : ''}</div>
    ${(j.documentoRelacionado || []).length ? '<div class="dte-rec"><b>Documento relacionado:</b> ' + j.documentoRelacionado.map(x => esc(x.numeroDocumento) + ' (' + esc(x.fechaEmision) + ')').join(', ') + '</div>' : ''}
    <table class="dte-items"><thead><tr><th>Cant.</th><th>Descripción</th><th class="num">Precio</th><th class="num">Descuento</th><th class="num">Exentas</th><th class="num">${d.tipo === '14' ? 'Compra' : 'Gravadas'}</th></tr></thead><tbody>${body}</tbody></table>
    <div class="dte-sum">
      ${d.tipo === '14' ? `<div><span>Subtotal</span><b>${m(R.subTotal)}</b></div><div><span>Retención de renta</span><b>${m(R.reteRenta)}</b></div>`
        : `<div><span>Total gravado</span><b>${m(R.totalGravada)}</b></div><div><span>Total exento</span><b>${m(R.totalExenta)}</b></div>
           <div><span>${d.tipo === '01' ? 'IVA incluido' : 'IVA 13 %'}</span><b>${m(iva)}</b></div>`}
      <div class="dte-total"><span>Total a pagar</span><b>${m(R.totalPagar)}</b></div><p>${esc(R.totalLetras || '')}</p></div>
  </div>`;
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'dte-print';
  area.innerHTML = html;
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  ps.textContent = '@page { size: letter; margin: 12mm; }';
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ---------- Configuración ---------- */

function dteSettingsTab() {
  const c = DTE.cfg, s = c.settings;
  const sec = c.secrets;
  const inp = (name, label, val, attrs, hint) => `<div><label class="f" for="ds_${name}">${label}</label><input class="input" id="ds_${name}" name="${name}" value="${esc(val || '')}" ${attrs || ''}>${hint ? '<div class="hint">' + hint + '</div>' : ''}</div>`;
  const credCard = amb => {
    const st = sec[amb], name = amb === '01' ? 'producción' : 'pruebas';
    return `<div class="card pad dte-cred" data-amb="${amb}">
      <h3>Credenciales de ${name}</h3>
      <ul class="fin-list">
        <li><span>Certificado de firma</span><b class="${st.cert ? '' : 'muted'}">${st.cert ? 'Cargado' + (st.cert_at ? ' · ' + esc(dayFmt(st.cert_at.slice(0, 10))) : '') : 'Falta'}</b></li>
        <li><span>Contraseña de la API</span><b class="${st.api ? '' : 'muted'}">${st.api ? 'Guardada' : 'Falta'}</b></li>
      </ul>
      <form class="form fin1 dte-cert" autocomplete="off">
        <div><label class="f">Archivo del certificado (.crt)</label><input class="input" type="file" name="file" accept=".crt,.xml,.cer"></div>
        <div><label class="f">Contraseña de la llave privada</label><input class="input" type="password" name="pass" autocomplete="new-password"></div>
        <button type="submit" class="btn">${st.cert ? 'Reemplazar certificado' : 'Subir certificado'}</button>
      </form>
      <form class="form fin1 dte-api" autocomplete="off">
        <div><label class="f">Contraseña de la API de Hacienda</label><input class="input" type="password" name="pwd" autocomplete="new-password"></div>
        <button type="submit" class="btn">${st.api ? 'Cambiar contraseña' : 'Guardar contraseña'}</button>
      </form>
      <div class="chips"><button type="button" class="btn" data-test="${amb}" ${st.api ? '' : 'disabled'}>Probar conexión</button>
        ${st.cert || st.api ? `<button type="button" class="btn danger" data-rm="${amb}">Quitar credenciales</button>` : ''}</div>
    </div>`;
  };
  $('#dteBody').innerHTML = `
    <div class="dte-cfg">
    <div class="card pad">
      <h3>Activación</h3>
      <form class="form fin1" id="dteOn">
        <label class="chk wide"><input type="checkbox" name="enabled" ${s.enabled ? 'checked' : ''}> Activar la facturación electrónica</label>
        <label class="chk wide"><input type="checkbox" name="auto_pos" ${s.auto_pos !== false ? 'checked' : ''}> Generar el DTE en cada venta del punto de venta</label>
        <label class="chk wide"><input type="checkbox" name="transmit" ${s.transmit !== false ? 'checked' : ''}> Enviar a Hacienda cuando haya credenciales (si lo apagas, todo queda en práctica)</label>
        <div><label class="f">Ambiente</label><select class="input" name="ambiente"><option value="00" ${s.ambiente !== '01' ? 'selected' : ''}>Pruebas</option><option value="01" ${s.ambiente === '01' ? 'selected' : ''}>Producción</option></select>
          <div class="hint">Empieza en pruebas. Hacienda te autoriza producción cuando apruebas sus pruebas.</div></div>
      </form>
    </div>
    <div class="card pad dte-help"><h3>Qué necesitas de Hacienda</h3>
      <ol><li>Tu NIT y NRC activos, y acceso a <b>factura.gob.sv</b> con tu clave de servicios en línea.</li>
        <li>En el portal: registra tu establecimiento y punto de venta, y genera el <b>certificado</b> (archivo .crt) con la contraseña de su llave privada.</li>
        <li>Crea la <b>contraseña de la API</b> del sistema de transmisión (una para pruebas y otra para producción).</li>
        <li>Súbelos aquí, prueba la conexión y haz las pruebas que pide Hacienda en la pestaña <b>Pruebas de Hacienda</b>.</li>
        <li>Cuando Hacienda te autorice, sube las credenciales de producción y cambia el ambiente.</li></ol>
      <p class="muted sm">El certificado y las contraseñas se guardan cifrados en tu servidor de Google y nunca se muestran ni se mandan al navegador. No los compartas por chat ni correo.</p></div>
    <div class="card pad dte-data">
      <h3>Datos del emisor</h3>
      ${c.missing.length ? '<div class="note">Falta: ' + esc(c.missing.join(', ')) + '.</div>' : ''}
      <form class="form" id="dteData">
        <div class="two">${inp('nit', 'NIT', s.nit, 'inputmode="numeric"', '14 dígitos (o tu DUI de 9 si eres persona natural).')}${inp('nrc', 'NRC', s.nrc, 'inputmode="numeric"')}</div>
        ${inp('nombre', 'Nombre o razón social', s.nombre, 'maxlength="250"')}
        ${inp('nombre_comercial', 'Nombre comercial', s.nombre_comercial, 'maxlength="150"')}
        <div class="two">${inp('cod_actividad', 'Código de actividad económica', s.cod_actividad, 'inputmode="numeric" maxlength="6"', 'El que aparece en tu tarjeta de NRC o en tu registro de Hacienda.')}
          ${inp('desc_actividad', 'Actividad económica', s.desc_actividad, 'maxlength="150"')}</div>
        <div class="three"><div><label class="f" for="ds_dep">Departamento</label><select class="input" id="ds_dep" name="dep"><option value="">Elige…</option>${c.deptos.map(x => `<option value="${x[0]}" ${s.dep === x[0] ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}</select></div>
          ${inp('mun', 'Municipio (código)', s.mun, 'inputmode="numeric" maxlength="2"', 'Catálogo de Hacienda.')}
          ${inp('dist', 'Distrito (código)', s.dist, 'inputmode="numeric" maxlength="4"')}</div>
        ${inp('complemento', 'Dirección', s.complemento, 'maxlength="200"')}
        <div class="two">${inp('telefono', 'Teléfono', s.telefono, 'inputmode="tel"')}${inp('correo', 'Correo para facturación', s.correo, 'type="email"')}</div>
        <div class="three"><div><label class="f" for="ds_tipo_establecimiento">Tipo de establecimiento</label><select class="input" id="ds_tipo_establecimiento" name="tipo_establecimiento">
            ${[['02', 'Casa matriz'], ['01', 'Sucursal'], ['04', 'Bodega'], ['07', 'Predio o patio'], ['20', 'Otro']].map(x => `<option value="${x[0]}" ${s.tipo_establecimiento === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>
          ${inp('cod_estable', 'Código de establecimiento', s.cod_estable, 'maxlength="4" autocapitalize="characters"', 'Como M001 (el que registraste en Hacienda).')}
          ${inp('cod_pv', 'Código de punto de venta', s.cod_pv, 'maxlength="4" autocapitalize="characters"', 'Como P001.')}</div>
        <h4>Responsable de invalidaciones y contingencias</h4>
        <div class="three">${inp('resp_nombre', 'Nombre', s.resp_nombre, 'maxlength="100"')}
          <div><label class="f" for="ds_resp_tipo">Documento</label><select class="input" id="ds_resp_tipo" name="resp_tipo">${[['13', 'DUI'], ['36', 'NIT'], ['03', 'Pasaporte'], ['02', 'Carné de residente']].map(x => `<option value="${x[0]}" ${s.resp_tipo === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>
          ${inp('resp_doc', 'Número', s.resp_doc, 'maxlength="25"')}</div>
        <div style="display:flex;justify-content:flex-end"><button class="btn primary" type="submit">Guardar datos</button></div>
      </form>
    </div>
    ${credCard('00')}${credCard('01')}
    </div>`;
  const save = async (data, msg) => { DTE.cfg = await api('apiDteSaveSettings', S.token, data); toast(msg || 'Guardado'); dteSettingsTab(); };
  const on = $('#dteOn');
  on.querySelectorAll('input,select').forEach(el => el.onchange = async () => {
    const data = { enabled: on.enabled.checked, auto_pos: on.auto_pos.checked, transmit: on.transmit.checked, ambiente: on.ambiente.value };
    try { await save(data, data.ambiente === '01' && s.ambiente !== '01' ? 'Ahora emites en producción' : 'Guardado'); }
    catch (e) { toast(e.message, true); dteSettingsTab(); }
  });
  $('#dteData').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, data = {};
    Array.from(f.elements).forEach(el => { if (el.name) data[el.name] = el.value; });
    try { await save(data, 'Datos guardados'); } catch (e) { toast(e.message, true); }
  };
  document.querySelectorAll('.dte-cred').forEach(card => {
    const amb = card.dataset.amb;
    card.querySelector('.dte-cert').onsubmit = async ev => {
      ev.preventDefault();
      const f = ev.target, file = f.file.files[0];
      if (!file) { toast('Elige el archivo .crt del certificado.', true); return; }
      if (file.size > 300000) { toast('Ese archivo es demasiado grande para ser un certificado de Hacienda.', true); return; }
      const btn = f.querySelector('button'); btn.disabled = true;
      try {
        const xml = await file.text();
        DTE.cfg = await api('apiDteUploadCert', S.token, amb, xml, f.pass.value);
        f.reset(); toast('Certificado cargado'); dteSettingsTab();
      } catch (e) { toast(e.message, true); btn.disabled = false; }
    };
    card.querySelector('.dte-api').onsubmit = async ev => {
      ev.preventDefault();
      const f = ev.target, btn = f.querySelector('button'); btn.disabled = true;

    };
  });
  document.querySelectorAll('[data-test]').forEach(b => b.onclick = async () => {

    b.disabled = false; b.textContent = t;
  });

  }, 'Quitar'));
}

/* ---------- Pruebas de Hacienda ---------- */

async function dteTests() {
  const c = DTE.cfg, s = c.settings;
  const cnt = c.test_counts || {};
  let customers = [];
  try { customers = (await api('apiList', S.token, 'customers', '')).filter(x => x.nrc && x.cod_actividad && x.dep_code); } catch (e) { customers = []; }
  if (S.view !== 'dte') return;
  const ready = s.enabled && s.ambiente === '00' && c.can_send && !c.missing.length;
  $('#dteBody').innerHTML = `
    <div class="card pad" style="max-width:760px">
      <h3>Pruebas para que Hacienda te autorice</h3>
      <p class="muted">Antes de darte acceso a producción, Hacienda pide que emitas en su ambiente de pruebas cierta cantidad de documentos de cada tipo (te dice cuántos en el portal). Aquí los generas con tus productos, sin tocar tus ventas ni tu inventario.</p>
      ${ready ? '' : `<div class="note">${s.ambiente === '01' ? 'Ya estás en producción: las pruebas se hacen en el ambiente de pruebas.' : 'Para hacer pruebas: activa la facturación, completa tus datos y sube las credenciales de pruebas en Configuración.'}</div>`}
      <ul class="fin-list">${c.type_order.map(k => `<li><span>${esc(c.types[k].name)}</span><b>${cnt[k] || 0} aceptados</b></li>`).join('')}</ul>
      <p class="muted sm">Las notas de crédito se hacen desde un crédito fiscal aceptado, y las de sujeto excluido desde un gasto con ese documento; también cuentan aquí.</p>
      <form class="form fin1" id="dtForm">
        <div class="two"><div><label class="f">Tipo</label><select class="input" name="tipo"><option value="01">Factura</option><option value="03">Crédito fiscal</option></select></div>
          <div><label class="f">Cuántos</label><input class="input" type="number" name="n" min="1" max="100" value="10" inputmode="numeric"></div></div>
        <div id="dtCust"><label class="f">Cliente para los créditos fiscales</label><select class="input" name="customer_id">${customers.length ? customers.map(x => `<option value="${esc(x.id)}">${esc(x.name)} · NRC ${esc(x.nrc)}</option>`).join('') : '<option value="">Ningún cliente tiene NIT, NRC, actividad y dirección completos</option>'}</select></div>
        <button class="btn primary" type="submit" ${ready ? '' : 'disabled'}>Generar y enviar</button>
        <div class="hint" id="dtProg" aria-live="polite"></div>
      </form>
    </div>`;
  const f = $('#dtForm');
  const sync = () => { $('#dtCust').hidden = f.tipo.value !== '03'; };
  f.tipo.onchange = sync; sync();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const total = Math.max(1, Math.min(100, Math.round(numIn(f.n.value))));
    const btn = f.querySelector('button'); btn.disabled = true;
    let done = 0, okN = 0, last = '';
    try {
      while (done < total && S.view === 'dte') {
        const r = await api('apiDteTestBatch', S.token, f.tipo.value, Math.min(10, total - done), { customer_id: f.customer_id.value });
        done += r.done.length; okN += r.done.filter(x => x.status === 'procesado').length;
        const bad = r.done.find(x => x.status !== 'procesado');
        if (bad) last = bad.message || bad.status;
        $('#dtProg').textContent = done + ' de ' + total + ' enviados · ' + okN + ' aceptados' + (last ? ' · último aviso: ' + last : '');
        if (!r.done.length || r.done.some(x => x.status === 'contingencia')) break;
      }
      toast(okN + ' documento(s) de prueba aceptados por Hacienda', okN < done);
      DTE.cfg = await api('apiDteSettings', S.token);
    } catch (e) { toast(e.message, true); }
    if (S.view === 'dte' && DTE.tab === 'pruebas') dteTests();
  };
}

/** Después de cobrar: envía el DTE sin hacer esperar a la caja y actualiza el recibo. */
async function posSendDte(r) {
  const line = $('#rcDte');
  const set = (txt, bad) => { const el = $('#rcDte'); if (el) { el.textContent = txt; el.classList.toggle('neg', !!bad); } };
  if (!r.dte) return;
  if (r.dte.status === 'error') { set('DTE: ' + r.dte.message, true); return; }
  if (r.dte.status === 'practica') { set('DTE de práctica generado (sin credenciales, no se envía).'); return; }
  if (r.dte.status !== 'pendiente' || !r.dte.id) { if (line) set('DTE: ' + (r.dte.status_label || r.dte.status)); return; }
  set('Enviando el DTE a Hacienda…');
  try {
    const d = await api('apiDteSend', S.token, r.dte.id);
    r.dte = { id: d.id, status: d.status, status_label: d.status_label, message: d.mh_message, control: d.numero_control };
    set(d.status === 'procesado' ? 'DTE aceptado por Hacienda ✓' : d.status === 'contingencia' ? 'Hacienda no respondió: el DTE se envía solo cuando vuelva.' : 'DTE ' + d.status_label + (d.mh_message ? ': ' + d.mh_message : ''), d.status === 'rechazado');
    const fresh = await api('apiPosReceipt', S.token, r.id);
    r.receipt = fresh.receipt;
    if (POS.last && POS.last.id === r.id) POS.last = r;
    const pv = document.querySelector('#modal .rc-preview');
    if (pv) pv.innerHTML = receiptHtml(r.receipt, '80', r.token ? receiptUrl(r.token) : '');
  } catch (e) { set('DTE: ' + e.message + ' (se reintenta solo)', true); }
}

/** Bloque fiscal del recibo impreso. */
function receiptDteHtml(rc, fmt) {
  const d = rc.dte;

  return `<div class="r-dte"><div class="r-doc">${esc(d.name)} electrónica</div>

  if (SHIP.cfg && !force) return SHIP.cfg;

function shipCarrierOptions(sel, region) {

/** Reduce la foto antes de subirla (más rápido con mala señal). Devuelve base64 JPEG. */
function shrinkImage(file, max) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      ok(cv.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => bad(new Error('No pude leer esa foto.'));
    img.src = URL.createObjectURL(file);
  });
}

/**
 * Imprime etiquetas (la del proveedor como imagen, o la propia) y hojas de empaque en un solo trabajo.
 * Funciona con cualquier impresora de etiquetas 4×6 (Zebra, Brother, Nelko, Rollo, Munbyn…) o en hoja carta.
 */
async function printShipments(list, opts) {
  opts = opts || {};
  const size = opts.size === 'carta' ? 'carta' : '4x6';
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'ship-print sp-' + size;
  area.innerHTML = list.map(sh => `<section class="sp-page">${sh.label_image ? `<img class="sp-img" src="${esc(sh.label_image)}" alt="Guía ${esc(sh.tracking_number)}">` : ownLabelHtml(sh)}</section>` +
    (opts.slip ? `<section class="sp-page">${packingSlipHtml(sh)}</section>` : '')).join('');
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  ps.textContent = size === 'carta' ? '@page { size: letter; margin: 12mm; }' : '@page { size: 4in 6in; margin: 0; }';
  // Espera a que bajen las imágenes de las guías antes de imprimir.
  await Promise.all(Array.from(area.querySelectorAll('img')).map(img => img.complete ? null : new Promise(ok => { img.onload = img.onerror = ok; setTimeout(ok, 15000); })));
  document.body.classList.add('printing');
  return new Promise(ok => {
    const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); ok(); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 1500); }, 60);
  });
}

async function printShipmentIds(ids, opts) {
  const list = await api('apiShipPrintData', S.token, ids);
  if (!list.length) throw new Error('No hay envíos para imprimir.');
  const cfg = SHIP.cfg ? SHIP.cfg.settings : {};
  await printShipments(list, Object.assign({ size: cfg.label_size, slip: cfg.packing_slip !== false }, opts || {}));
  return list;
}

/** Imprimir pendientes: compra las guías que falten (con la regla de Ajustes) y saca todo en un solo trabajo. */
async function openBatchPrint() {
  let pend;
  try { await shipLoad(); pend = await api('apiShipPending', S.token); } catch (e) { toast(e.message, true); return; }
  const c = SHIP.cfg, s = c.settings;
  if (!pend.count) { toast('No hay envíos esperando etiqueta.'); return; }
  const canBuy = pend.to_buy > 0 && s.label_provider;
  openModal('Imprimir pendientes', `<form class="form fin1" id="bpForm">
    <p style="margin:0"><b>${pend.count}</b> envío(s) esperan etiqueta${canBuy ? `; <b>${pend.to_buy}</b> necesitan comprar guía con ${esc(c.providers[s.label_provider])}` : ''}.</p>
    ${canBuy ? `<div><label class="f">Tarifa para las guías</label><select class="input" name="policy">
      <option value="cheapest" ${s.rate_policy === 'cheapest' ? 'selected' : ''}>La más barata</option><option value="fastest" ${s.rate_policy === 'fastest' ? 'selected' : ''}>La más rápida</option>
      ${String(s.rate_policy || '').indexOf('match:') === 0 ? `<option value="${esc(s.rate_policy)}" selected>${esc(s.rate_policy.slice(6))}</option>` : ''}</select>
      <div class="hint">El costo de cada guía se cobra en tu cuenta de ${esc(c.providers[s.label_provider])}.</div></div>` : ''}
    <div><label class="f">Papel</label><select class="input" name="size"><option value="4x6" ${s.label_size !== 'carta' ? 'selected' : ''}>Etiqueta 4×6 (impresora térmica)</option><option value="carta" ${s.label_size === 'carta' ? 'selected' : ''}>Hoja carta</option></select></div>
    <label class="chk wide"><input type="checkbox" name="slip" ${s.packing_slip !== false ? 'checked' : ''}> Incluir hoja de empaque de cada pedido</label>
    <div class="hint" id="bpProg" aria-live="polite"></div></form>`, async () => {
    const f = $('#bpForm'), prog = $('#bpProg');
    let ids = pend.ids, failed = [];
    if (canBuy) {
      let guard = 0;
      for (;;) {
        prog.textContent = 'Comprando guías…';
        const r = await api('apiShipBatchBuy', S.token, ids.filter(id => !failed.some(x => x.id === id)), f.policy.value);
        failed = failed.concat(r.failed);
        if (!r.left || (!r.done.length && !r.failed.length) || ++guard > 20) break;
      }
    }
    prog.textContent = 'Preparando la impresión…';
    await printShipmentIds(ids, { size: f.size.value, slip: f.slip.checked });
    setTimeout(() => confirmPrinted(ids, failed), 0);
  }, canBuy ? 'Comprar e imprimir' : 'Imprimir', false);
}

function confirmPrinted(ids, failed) {
  openModal('¿Salieron bien las etiquetas?', `${failed.length ? `<div class="note bad-note"><b>${failed.length} guía(s) no se pudieron comprar</b> y salieron con la etiqueta propia:<ul>${failed.map(x => '<li>' + esc(x.number) + ': ' + esc(x.error) + '</li>').join('')}</ul></div>` : ''}

    const r = await api('apiShipPrinted', S.token, ids); toast(r.printed + ' envío(s) marcados como impresos');
    if (S.view === 'shipping') shipDrawList();
  }, 'Sí, marcar como impresos');
}
