function finChart(months) {
  if (!months || !months.length) return '<p class="muted">Sin datos todavía.</p>';
  const W = 560, H = 200, pad = 26, bw = (W - pad * 2) / months.length;
  const max = Math.max(1, ...months.map(m => Math.max(m.sales, m.cost + m.opex + m.financial, Math.abs(m.net))));
  const base = H / 2 + 10;
  const scale = (H / 2 - 16) / max;
  const pts = months.map((m, i) => [pad + bw * i + bw / 2, base - m.net * scale]);
  return `<svg class="fin-chart" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Ventas, costos y utilidad de los últimos meses">
    <line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" class="axis"/>
    ${months.map((m, i) => {
      const x = pad + bw * i, cw = Math.min(18, bw / 3.2), spend = m.cost + m.opex + m.financial;
      return `<g><title>${esc(monthName(m.month))}: ventas ${esc(fm(m.sales))}, costos y gastos ${esc(fm(spend))}, utilidad ${esc(fm(m.net))}</title>
        <rect class="b1" x="${x + bw / 2 - cw - 2}" y="${base - m.sales * scale}" width="${cw}" height="${Math.max(0, m.sales * scale)}" rx="3"/>
        <rect class="b2" x="${x + bw / 2 + 2}" y="${base - spend * scale}" width="${cw}" height="${Math.max(0, spend * scale)}" rx="3"/>
        <text x="${x + bw / 2}" y="${H + 10}" text-anchor="middle">${esc(monthName(m.month))}</text></g>`;
    }).join('')}
    <polyline class="ln" points="${pts.map(p => p.join(',')).join(' ')}"/>
    ${pts.map((p, i) => `<circle class="dt ${months[i].net < 0 ? 'neg' : ''}" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}
  </svg>`;
}

function agingBar(a) {
  const keys = Object.keys(a), tot = keys.reduce((s, k) => s + a[k], 0) || 1;
  const label = { por_vencer: 'Por vencer', '0-30': '0–30 días', '31-60': '31–60', '61-90': '61–90', '+90': 'Más de 90' };
  return `<div class="aging" role="img" aria-label="Antigüedad de saldos">${keys.filter(k => a[k] > 0).map((k, i) => `<span class="ag ag${i}" style="flex:${a[k] / tot}" title="${esc(label[k] + ': ' + fm(a[k]))}"></span>`).join('')}</div>
    <ul class="ag-legend">${keys.map((k, i) => `<li><i class="ag ag${i}"></i>${label[k]} <b>${fm(a[k])}</b></li>`).join('')}</ul>`;
}

function catBars(list) {
  const max = Math.max(...list.map(x => x.amount)) || 1;
  return `<ul class="catbars">${list.slice(0, 8).map(x => `<li><span class="cb-n">${esc(x.name)}</span><span class="cb-b"><i style="width:${Math.max(3, x.amount / max * 100)}%"></i></span><b>${fm(x.amount)}</b></li>`).join('')}</ul>`;
}

    } else {
      box.innerHTML = `<div><label class="f">Total pagado</label><input class="input exp-big" name="total" inputmode="decimal" value="${esc(prevTotal)}" placeholder="0.00"><div class="hint">Con este documento el IVA no se recupera: todo cuenta como gasto.</div></div>`;
      f.total.oninput = () => { box.dataset.total = f.total.value; box.dataset.sub = ''; };

  };
  const ctl = () => { $('#exCtl').hidden = ['ccf', 'fse', 'factura'].indexOf(f.doc_type.value) < 0; if (f.doc_type.value === 'fse' && !f.withholding.value) f.closest('form').querySelector('.exp-more').open = true; };
  f.doc_type.onchange = () => { drawAmounts(); ctl(); }; drawAmounts(); ctl();
  const catHint = () => {
    const a = (FIN.chart || []).find(x => x.code === f.account.value);
    $('#exCatHint').textContent = a && a.system_key === 'grni' ? 'Para la factura de mercadería que ya registraste como entrada en Inventario.' :
      a && String(a.code).indexOf('12') === 0 ? 'Activo fijo: no es gasto del mes; se deprecia con el tiempo.' : '';
  };
  f.account.onchange = catHint; catHint();
  const sup = () => { const s = sups.find(x => x.name.toLowerCase() === f.supplier.value.trim().toLowerCase()); if (s && s.default_account && !f.account.value) { f.account.value = s.default_account; catHint(); } };
  f.supplier.onchange = sup;
  if (!edit) {
    const pay = () => { $('#exPayRow').hidden = !f.paid_now.checked; };

  }
}

function readAmounts(f) {
  if (f.subtotal) return { subtotal: numIn(f.subtotal.value), tax: numIn(f.tax.value) };
  return { subtotal: numIn(f.total.value), tax: 0 };
}

/** Comprime la foto (lado mayor 1600 px) y la sube a Drive. */
async function uploadReceipt(expenseId, file) {
  let data, mime = file.type;
  if (file.type.indexOf('image/') === 0) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen.')); i.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    data = cv.toDataURL('image/jpeg', 0.82); mime = 'image/jpeg';
  } else {
    if (file.size > 6 * 1024 * 1024) throw new Error('El PDF pesa más de 6 MB.');
    data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('No se pudo leer el archivo.')); r.readAsDataURL(file); });
  }
  return api('apiFinAttach', S.token, expenseId, { mime: mime, data: data });
}

/* ---------- Fechas de los reportes ---------- */

function finRange() {
  if (FIN.range) return FIN.range;
  const t = finToday();
  return (FIN.range = { from: t.slice(0, 8) + '01', to: t });
}
function rangePresets() {
  const t = finToday(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
  const pad = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();
  const pm = m === 1 ? [y - 1, 12] : [y, m - 1];
  const fy = (FIN.cfg && FIN.cfg.fiscal_start) || '01';
  const fyStart = (Number(fy) <= m ? y : y - 1) + '-' + fy + '-01';
  const ago = new Date(y, m - 12, 1);
  return [['Este mes', t.slice(0, 8) + '01', t], ['Mes anterior', pm[0] + '-' + pad(pm[1]) + '-01', pm[0] + '-' + pad(pm[1]) + '-' + lastDay(pm[0], pm[1])],
    ['Este año', fyStart, t], ['Últimos 12 meses', ago.getFullYear() + '-' + pad(ago.getMonth() + 1) + '-01', t]];
}
function rangePicker(id, from, to, single) {
  if (single) return `<div class="toolbar fin-tools"><label class="muted sm" for="${id}At">Al</label><input class="input" type="date" id="${id}At" value="${esc(to)}" style="max-width:180px"></div>`;
  return `<div class="toolbar fin-tools"><div class="chips">${rangePresets().map(p => `<button class="btn sm ${p[1] === from && p[2] === to ? 'primary' : ''}" data-rg="${p[1]}|${p[2]}">${p[0]}</button>`).join('')}</div>
    <input class="input" type="date" id="${id}From" value="${esc(from)}" aria-label="Desde" style="max-width:170px"><span class="muted">a</span><input class="input" type="date" id="${id}To" value="${esc(to)}" aria-label="Hasta" style="max-width:170px"></div>`;
}
function bindRange(id, fn, single) {
  if (single) { $('#' + id + 'At').onchange = ev => fn(ev.target.value); return; }
  document.querySelectorAll('[data-rg]').forEach(b => b.onclick = () => { const [a, c] = b.dataset.rg.split('|'); FIN.range = { from: a, to: c }; fn(a, c); });
  const ch = () => { const a = $('#' + id + 'From').value, c = $('#' + id + 'To').value; if (a && c && a <= c) { FIN.range = { from: a, to: c }; fn(a, c); } };
  $('#' + id + 'From').onchange = ch; $('#' + id + 'To').onchange = ch;
}

function downloadCsv(name, head, rows) {
  const cell = v => { const s = v === null || v === undefined ? '' : typeof v === 'number' ? (Math.round(v * 100) / 100).toFixed(2) : String(v); return /[";\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function printReport(title, html) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'report-print';
  const biz = S.boot.tenant.legal_name || S.boot.tenant.name;
  area.innerHTML = `<div class="rp"><div class="rp-h"><b>${esc(biz)}</b>${S.boot.tenant.tax_id ? '<span>NIT ' + esc(S.boot.tenant.tax_id) + '</span>' : ''}<h1>${esc(title)}</h1></div>${html}</div>`;
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  ps.textContent = '@page { size: letter; margin: 14mm; }';
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

  const r = finRange();

  if (FIN.rep === 'balance') return repBalance(r.to);

async function repIncome(from, to) {
  const byMonth = !!FIN.byMonth;
  const d = await api('apiFinIncome', S.token, from, to, byMonth);
  if (!finActive('reportes')) return;
  const T = d.totals;
  const sec = (title, rows, total, sign) => rows.length ? `<tr class="rp-sec"><td colspan="${byMonth ? d.months.length + 2 : 2}">${title}</td></tr>
    ${rows.map(r => `<tr class="click" data-code="${esc(r.code)}"><td class="rp-acc">${esc(r.name)}</td>${byMonth ? d.months.map(m => `<td class="num">${fmZ(r.months[m.month] * sign)}</td>`).join('') : ''}<td class="num">${fmZ(r.total * sign)}</td></tr>`).join('')}
    ${total ? `<tr class="rp-sub"><td>Total ${title.toLowerCase()}</td>${byMonth ? d.months.map(m => `<td class="num">${fmZ(total[1](m))}</td>`).join('') : ''}<td class="num">${fmZ(total[0])}</td></tr>` : ''}` : '';
  const line = (label, key, cls) => `<tr class="${cls || 'rp-tot'}"><td>${label}</td>${byMonth ? d.months.map(m => `<td class="num ${m[key] < 0 ? 'neg' : ''}">${fmZ(m[key])}</td>`).join('') : ''}<td class="num ${T[key] < 0 ? 'neg' : ''}">${fmZ(T[key])}</td></tr>`;
  const isOther = r => r.code.indexOf('42') === 0, isFin = r => r.code.indexOf('62') === 0 || r.code.indexOf('63') === 0;
  const rows = d.rows;
  const table = `<table class="rp-table"><thead><tr><th></th>${byMonth ? d.months.map(m => `<th class="num">${esc(monthName(m.month))}</th>`).join('') : ''}<th class="num">${byMonth ? 'Total' : esc(dayFmt(from) + ' – ' + dayFmt(to))}</th></tr></thead><tbody>
    ${sec('Ingresos', rows.filter(r => r.type === 'ingreso' && !isOther(r)), [T.sales, m => m.sales], 1)}
    ${sec('Costo de ventas', rows.filter(r => r.type === 'costo'), [T.cost, m => m.cost], 1)}
    ${line('Utilidad bruta', 'gross')}
    ${sec('Gastos de operación', rows.filter(r => r.type === 'gasto' && !isFin(r)), [T.opex, m => m.opex], 1)}
    ${line('Utilidad de operación', 'operating')}
    ${sec('Otros ingresos', rows.filter(r => r.type === 'ingreso' && isOther(r)), null, 1)}
    ${sec('Gastos financieros e impuestos', rows.filter(r => r.type === 'gasto' && isFin(r)), null, 1)}
    ${line('Utilidad neta', 'net', 'rp-net')}
  </tbody></table>`;
  $('#repBody').innerHTML = `${rangePicker('is', from, to)}
    <div class="chips" style="margin:-4px 0 10px"><label class="chk"><input type="checkbox" id="isMonth" ${byMonth ? 'checked' : ''}> Ver por mes</label></div>
    <div class="grid kpis fin-kpis"><div class="card pad kpi"><div class="l">Ventas</div><div class="v m">${fm(T.sales)}</div></div>
      <div class="card pad kpi"><div class="l">Utilidad bruta</div><div class="v m">${fm(T.gross)}</div><div class="hint">margen ${T.gross_margin.toFixed(1)} %</div></div>
      <div class="card pad kpi"><div class="l">Gastos</div><div class="v m">${fm(T.opex + T.financial)}</div></div>
      <div class="card pad kpi"><div class="l">Utilidad neta</div><div class="v m ${T.net < 0 ? 'bad' : 'good'}">${fm(T.net)}</div><div class="hint">margen ${T.net_margin.toFixed(1)} %</div></div></div>
    <div class="card tablewrap rp-card">${rows.length ? table : '<div class="empty">Sin movimientos en estas fechas.</div>'}</div>
    <div class="chips" style="margin-top:12px"><button class="btn" id="isPrint">Imprimir o PDF</button><button class="btn" id="isCsv">Descargar (Excel/CSV)</button></div>`;
  bindRange('is', (a, b) => repIncome(a, b));
  $('#isMonth').onchange = ev => { FIN.byMonth = ev.target.checked; repIncome(from, to); };
  $('#repBody').querySelectorAll('tr[data-code]').forEach(tr => tr.onclick = () => openLedger(tr.dataset.code, from, to));
  $('#isPrint').onclick = () => printReport('Estado de resultados del ' + dayFmt(from) + ' al ' + dayFmt(to), table);
  $('#isCsv').onclick = () => downloadCsv('Estado de resultados ' + from + ' a ' + to, ['Cuenta', 'Nombre', 'Tipo'].concat(byMonth ? d.months.map(m => m.month) : []).concat(['Total']),
    rows.map(r => [r.code, r.name, r.type].concat(byMonth ? d.months.map(m => r.months[m.month] || 0) : []).concat([r.total]))
      .concat([['', 'Utilidad bruta', ''].concat(byMonth ? d.months.map(m => m.gross) : []).concat([T.gross]), ['', 'Utilidad neta', ''].concat(byMonth ? d.months.map(m => m.net) : []).concat([T.net])]));
}
const fmZ = v => (!v ? '—' : fm(v));

async function repBalance(at) {
  const d = await api('apiFinBalance', S.token, at);
  if (!finActive('reportes')) return;
  const group = rows => {
    const g = {}; rows.forEach(r => { (g[r.group_name || ''] = g[r.group_name || ''] || []).push(r); });
    return Object.keys(g).map(k => `${k ? `<tr class="rp-grp"><td colspan="2">${esc(k)}</td></tr>` : ''}${g[k].map(r => `<tr ${r.code ? `class="click" data-code="${esc(r.code)}"` : ''}><td class="rp-acc">${esc(r.name)}</td><td class="num ${r.balance < 0 ? 'neg' : ''}">${fm(r.balance)}</td></tr>`).join('')}`).join('');
  };
  const col = (title, rows, total) => `<table class="rp-table"><thead><tr><th>${title}</th><th></th></tr></thead><tbody>${group(rows)}<tr class="rp-tot"><td>Total ${title.toLowerCase()}</td><td class="num">${fm(total)}</td></tr></tbody></table>`;
  const html = `<div class="bs-grid"><div>${col('Activo', d.assets, d.total_assets)}</div><div>${col('Pasivo', d.liabilities, d.total_liabilities)}${col('Patrimonio', d.equity, d.total_equity)}
    <table class="rp-table"><tbody><tr class="rp-net"><td>Pasivo + patrimonio</td><td class="num">${fm(d.total_liabilities + d.total_equity)}</td></tr></tbody></table></div></div>`;
  $('#repBody').innerHTML = `${rangePicker('bs', '', at, true)}
    ${d.balanced ? '<div class="note ok-note">El balance cuadra: activo = pasivo + patrimonio.</div>' : `<div class="note">Hay una diferencia de ${fm(d.difference)}. Revisa los saldos iniciales en Contabilidad.</div>`}
    <div class="card pad rp-card">${html}</div>
    <div class="chips" style="margin-top:12px"><button class="btn" id="bsPrint">Imprimir o PDF</button><button class="btn" id="bsCsv">Descargar (Excel/CSV)</button></div>`;
  bindRange('bs', a => { FIN.range = { from: finRange().from, to: a }; repBalance(a); }, true);
  $('#repBody').querySelectorAll('tr[data-code]').forEach(tr => tr.onclick = () => openLedger(tr.dataset.code, d.fiscal_start, at));
  $('#bsPrint').onclick = () => printReport('Balance general al ' + dayFmt(at), html);
  $('#bsCsv').onclick = () => downloadCsv('Balance general ' + at, ['Sección', 'Cuenta', 'Nombre', 'Saldo'],
    [].concat(d.assets.map(r => ['Activo', r.code, r.name, r.balance]), d.liabilities.map(r => ['Pasivo', r.code, r.name, r.balance]), d.equity.map(r => ['Patrimonio', r.code, r.name, r.balance])));
}

async function finAccounting() {
  const tabs = [['diario', 'Libro diario'], ['mayor', 'Libro mayor'], ['balanza', 'Balanza'], ['catalogo', 'Catálogo'], ['partida', 'Partida manual'], ['inicial', 'Saldos iniciales'], ['cierre', 'Cierre'], ['ajustes', 'Ajustes']]
    .filter(t => can('finance:write') || ['diario', 'mayor', 'balanza', 'catalogo'].indexOf(t[0]) >= 0);
  $('#finBody').innerHTML = `<div class="chips fin-sub" role="tablist">${tabs.map(t => `<button class="btn sm ${FIN.acct === t[0] ? 'primary' : ''}" data-ac="${t[0]}">${t[1]}</button>`).join('')}</div><div id="acBody"><div class="empty">Cargando…</div></div>`;
  $('#finBody').querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { FIN.acct = b.dataset.ac; finAccounting(); });
  const r = finRange();
  const fn = { diario: () => acJournal(r.from, r.to), mayor: () => acLedgerPick(), balanza: () => acTrial(r.from, r.to), catalogo: acChart, partida: () => acManual(), inicial: openOpeningInline, cierre: acClose, ajustes: acSettings }[FIN.acct];
  await fn();
}

async function acJournal(from, to, q, src) {
  const d = await api('apiFinJournal', S.token, { from: from, to: to, q: q || '', source_type: src || '', limit: 400 });
  if (!finActive('contabilidad')) return;
  $('#acBody').innerHTML = `${rangePicker('jr', from, to)}
    <div class="toolbar fin-tools"><input class="input" id="jrQ" placeholder="Buscar partida o concepto…" value="${esc(q || '')}" style="flex:1"><select class="input" id="jrSrc" style="max-width:200px"><option value="">Todos los orígenes</option>${Object.keys(SRC_LABEL).map(k => `<option value="${k}" ${src === k ? 'selected' : ''}>${SRC_LABEL[k]}</option>`).join('')}</select></div>
    <div class="fin-sum muted">${d.count} partida(s)${d.count > d.entries.length ? ' · se muestran las últimas ' + d.entries.length : ''}</div>
    <div class="jr-list">${d.entries.map(j => `<div class="card jr ${j.status === 'anulado' ? 'void' : ''}"><div class="jr-h"><span><b>${esc(j.number)}</b> · ${dayFmt(j.date)} · <span class="tag">${esc(SRC_LABEL[j.source_type] || j.source_type)}</span></span>
        ${can('finance:write') && ['manual', 'apertura', 'iva'].indexOf(j.source_type) >= 0 && j.status !== 'anulado' ? `<button class="btn sm danger" data-void="${esc(j.id)}">Anular</button>` : ''}</div>
      <div class="jr-d">${esc(j.description)}${j.notes ? '<div class="muted sm">' + esc(j.notes) + '</div>' : ''}</div>
      <table class="jr-t"><tbody>${j.lines.map(l => `<tr><td class="code">${esc(l.account)}</td><td class="${l.credit ? 'cr' : ''}">${esc(l.name)}${l.memo ? '<span class="muted sm"> · ' + esc(l.memo) + '</span>' : ''}</td><td class="num">${l.debit ? fm(l.debit) : ''}</td><td class="num">${l.credit ? fm(l.credit) : ''}</td></tr>`).join('')}</tbody></table></div>`).join('') || '<div class="card empty">Sin partidas en estas fechas.</div>'}</div>
    <div class="chips" style="margin-top:12px"><button class="btn" id="jrCsv">Descargar (Excel/CSV)</button></div>`;
  bindRange('jr', (a, b) => acJournal(a, b, q, src));
  let t = null;
  $('#jrQ').oninput = ev => { clearTimeout(t); t = setTimeout(() => acJournal(from, to, ev.target.value, src), 400); };
  $('#jrSrc').onchange = ev => acJournal(from, to, q, ev.target.value);
  $('#acBody').querySelectorAll('[data-void]').forEach(b => b.onclick = async () => {
    const why = prompt('¿Por qué anulas esta partida?'); if (why === null) return;
    try { await api('apiFinVoidEntry', S.token, b.dataset.void, why); toast('Partida anulada'); acJournal(from, to, q, src); } catch (e) { toast(e.message, true); }
  });
  $('#jrCsv').onclick = () => downloadCsv('Libro diario ' + from + ' a ' + to, ['Partida', 'Fecha', 'Concepto', 'Cuenta', 'Nombre', 'Debe', 'Haber', 'Detalle'],
    [].concat(...d.entries.filter(j => j.status !== 'anulado').map(j => j.lines.map(l => [j.number, j.date, j.description, l.account, l.name, l.debit, l.credit, l.memo]))));
}

  FIN.chart = await api('apiFinChart', S.token);
  if (!finActive('contabilidad')) return;
  const w = can('finance:write');
  const depth = c => (c.length <= 1 ? 0 : c.length <= 2 ? 1 : c.length <= 4 ? 2 : 3);
  $('#acBody').innerHTML = `<p class="muted">Catálogo basado en NIIF para PYMES (El Salvador). Puedes agregar subcuentas en cualquier grupo y cambiar nombres. Las cuentas que usa el sistema no se pueden desactivar.</p>
    <div class="card tablewrap"><table class="chart-t"><tbody>${FIN.chart.map(a => `<tr class="${a.is_group ? 'grp d' + depth(a.code) : ''} ${a.status === 'inactiva' ? 'off' : ''}">
      <td class="code">${esc(a.code)}</td><td style="padding-left:${depth(a.code) * 14 + 8}px">${a.is_group ? '<b>' + esc(a.name) + '</b>' : esc(a.name)}${a.system_key ? ' <span class="tag" title="La usa el sistema">sistema</span>' : ''}${a.money_kind ? ' <span class="tag activo">dinero</span>' : ''}${a.status === 'inactiva' ? ' <span class="tag">inactiva</span>' : ''}</td>
      <td class="num">${w ? (a.is_group ? `<button class="btn sm" data-add="${esc(a.code)}">+ Subcuenta</button>` : `<button class="btn sm" data-edit="${esc(a.code)}">Editar</button>`) : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $('#acBody').querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const parent = FIN.chart.find(a => a.code === b.dataset.add);
    openModal('Nueva cuenta en ' + parent.name, `<form class="form fin1" id="chForm"><div><label class="f">Nombre</label><input class="input" name="name"></div></form>`, async () => {
      const r = await api('apiFinSaveAccount', S.token, { parent: parent.code, name: $('#chForm').name.value });
      toast('Cuenta ' + r.code + ' creada'); finReload(); await finLoadBase(); acChart();
    }, 'Crear');
  });
  $('#acBody').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const a = FIN.chart.find(x => x.code === b.dataset.edit);
    openModal('Cuenta ' + a.code, `<form class="form fin1" id="chForm"><div><label class="f">Nombre</label><input class="input" name="name" value="${esc(a.name)}"></div>
      ${a.money_kind ? `<div class="two"><div><label class="f">Banco o empresa</label><input class="input" name="bank" value="${esc(a.bank)}"></div><div><label class="f">Últimos 4 dígitos</label><input class="input" name="number_hint" value="${esc(a.number_hint)}" maxlength="4"></div></div>` : ''}
      ${a.system_key ? '' : `<label class="chk"><input type="checkbox" name="inactive" ${a.status === 'inactiva' ? 'checked' : ''}> Desactivar (ya no aparece en las listas)</label>`}</form>`, async () => {
      const f = $('#chForm');
      await api('apiFinSaveAccount', S.token, { code: a.code, name: f.name.value, bank: f.bank ? f.bank.value : '', number_hint: f.number_hint ? f.number_hint.value : '', status: f.inactive && f.inactive.checked ? 'inactiva' : 'activa' });
      toast('Cuenta guardada'); finReload(); await finLoadBase(); acChart();
    }, 'Guardar');
  });
}

function acManual() {
  const line = () => `<div class="pm-line">${accSelect('acc', '', () => true, 'Cuenta…')}<input class="input" name="debit" inputmode="decimal" placeholder="Debe"><input class="input" name="credit" inputmode="decimal" placeholder="Haber"><input class="input" name="memo" placeholder="Detalle"><button type="button" class="btn sm" data-rm aria-label="Quitar línea">✕</button></div>`;
  $('#acBody').innerHTML = `<p class="muted">Para ajustes de tu contador: depreciaciones, provisiones, reclasificaciones. Lo del día a día (ventas, gastos, pagos) ya se registra solo.</p>
    <form class="form fin1 card pad" id="pmForm" style="max-width:860px">
      <div class="two"><div><label class="f">Fecha</label><input class="input" type="date" name="date" value="${finToday()}"></div><div><label class="f">Concepto</label><input class="input" name="description" placeholder="Ej. Depreciación de noviembre"></div></div>
      <div class="pm-head"><span>Cuenta</span><span>Debe</span><span>Haber</span><span>Detalle</span><span></span></div>
      <div id="pmLines">${line()}${line()}</div>
      <div class="chips"><button type="button" class="btn sm" id="pmAdd">+ Línea</button><span class="muted sm" id="pmSum"></span></div>
      <div class="chips"><button class="btn primary" type="submit">Registrar partida</button></div><div class="err" id="pmErr"></div></form>`;
  const sum = () => {
    let dd = 0, cc = 0;
    document.querySelectorAll('.pm-line').forEach(l => { dd += numIn(l.querySelector('[name=debit]').value); cc += numIn(l.querySelector('[name=credit]').value); });
    $('#pmSum').innerHTML = `Debe <b>${fm(dd)}</b> · Haber <b>${fm(cc)}</b> · ${Math.abs(dd - cc) < 0.005 && dd > 0 ? '<span class="good">cuadra</span>' : '<span class="neg">diferencia ' + fm(dd - cc) + '</span>'}`;
  };
  const bind = () => { document.querySelectorAll('.pm-line input').forEach(i => i.oninput = sum); document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (document.querySelectorAll('.pm-line').length > 2) { b.parentElement.remove(); sum(); } }); };
  $('#pmAdd').onclick = () => { $('#pmLines').insertAdjacentHTML('beforeend', line()); bind(); };
  bind(); sum();
  $('#pmForm').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    const lines = [...document.querySelectorAll('.pm-line')].map(l => ({ account: l.querySelector('[name=acc]').value, debit: numIn(l.querySelector('[name=debit]').value), credit: numIn(l.querySelector('[name=credit]').value), memo: l.querySelector('[name=memo]').value }));
    try { const r = await api('apiFinManualEntry', S.token, { date: f.date.value, description: f.description.value, lines: lines }); toast('Partida ' + r.number + ' registrada'); FIN.acct = 'diario'; finAccounting(); }
    catch (e) { $('#pmErr').textContent = e.message; }
  };
}

function openOpening() { FIN.tab = 'contabilidad'; FIN.acct = 'inicial'; viewFinance(); }

  const money = moneyAccts();
  $('#acBody').innerHTML = `${cfg.has_opening ? '<div class="note">Ya registraste saldos iniciales. Si te faltó algo, puedes registrar otros (se suman) o anular la partida en el Libro diario.</div>' : ''}

      <div class="ob-row"><span>Clientes que te debían</span><input class="input" inputmode="decimal" data-acc="110201" placeholder="0.00"></div>

      <div class="ob-row"><span>Préstamos bancarios</span><input class="input" inputmode="decimal" data-acc="220101" placeholder="0.00"></div>
      <div class="ob-row"><span>Mobiliario y equipo</span><input class="input" inputmode="decimal" data-acc="120101" placeholder="0.00"></div>
      <div class="ob-row"><span>Equipo de cómputo</span><input class="input" inputmode="decimal" data-acc="120102" placeholder="0.00"></div>
      ${grniBal > 0.004 ? `<h4>Inventario</h4><label class="chk wide"><input type="checkbox" id="obInv" checked> El inventario que ya cargaste en Inventario (<b>${fm(grniBal)}</b> al costo) era mío desde antes: tomarlo como saldo inicial y no como compra por facturar.</label>` : '<p class="muted sm">El inventario inicial se toma de lo que registres en Inventario con su costo.</p>'}
      <div class="chips"><button class="btn primary" type="submit">Registrar saldos iniciales</button></div><div class="err" id="obErr"></div></form>`;

    try { await api('apiFinOpening', S.token, { date: ev.target.date.value, items: items }); toast('Saldos iniciales registrados'); finReload(); FIN.tab = 'resumen'; FIN.acct = 'diario'; viewFinance(); }
    catch (e) { $('#obErr').textContent = e.message; }

  $('#acBody').innerHTML = `<div class="card pad" style="max-width:640px">
    <p>${c ? `Los libros están <b>cerrados hasta el ${dayFmt(c)}</b>. Nada con fecha anterior se puede crear ni cambiar; si un documento viejo cambia, el ajuste entra con fecha de hoy.` : 'No hay periodos cerrados.'}</p>

function acSettings() {
  const cfg = FIN.cfg;
  const labels = { efectivo: 'Efectivo', tarjeta: 'Tarjeta (terminal)', transferencia: 'Transferencia', wompi: 'Wompi', n1co: 'N1co', stripe: 'Stripe', stripe_qr: 'QR de Stripe', otro: 'Otro', shopify: 'Shopify', woocommerce: 'WooCommerce', online: 'Otras tiendas en línea' };
  const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  $('#acBody').innerHTML = `<form class="form fin1 card pad" id="fsForm" style="max-width:720px">
    <h4 style="margin-top:0">¿A qué cuenta entra cada forma de cobro?</h4>
    ${Object.keys(labels).map(k => `<div class="ob-row"><span>${labels[k]}</span>${accSelect('m_' + k, cfg.method_accounts[k], a => !!a.money_kind && a.money_kind !== 'tarjeta')}</div>`).join('')}
    <h4>Datos fiscales</h4>
    <div class="two"><div><label class="f">NRC</label><input class="input" name="nrc" value="${esc(cfg.nrc)}"></div><div><label class="f">Inicio del año fiscal</label><select class="input" name="fiscal_start">${months.map((m, i) => `<option value="${String(i + 1).padStart(2, '0')}" ${cfg.fiscal_start === String(i + 1).padStart(2, '0') ? 'selected' : ''}>${m}</option>`).join('')}</select></div></div>
    <div><label class="f">Giro o actividad económica</label><input class="input" name="giro" value="${esc(cfg.giro)}"></div>
    <div class="chips"><button class="btn primary" type="submit">Guardar</button></div><div class="err" id="fsErr"></div></form>`;
  $('#fsForm').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, map = {};
    Object.keys(labels).forEach(k => { map[k] = f['m_' + k].value; });
    try { FIN.cfg = Object.assign(FIN.cfg, await api('apiFinSaveSettings', S.token, { method_accounts: map, nrc: f.nrc.value, giro: f.giro.value, fiscal_start: f.fiscal_start.value })); toast('Ajustes guardados'); swrClear(); }
    catch (e) { $('#fsErr').textContent = e.message; }
  };
}

/* ---------- Impuestos: IVA de El Salvador ---------- */

const DOC_NAMES = { '01': 'Factura', '03': 'Crédito fiscal', '11': 'Exportación' };

async function finTaxes() {
  if (!FIN.ivaMonth) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); FIN.ivaMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  if (!FIN.ivaTab) FIN.ivaTab = 'resumen';
  const m = FIN.ivaMonth;
  const r = await api('apiTaxReport', S.token, m);
  if (!finActive('impuestos')) return;
  const S2 = r.summary, w = can('finance:write');
  const tabs = [['resumen', 'Resumen F-07'], ['compras', 'Libro de compras'], ['cf', 'Ventas a consumidor final'], ['ccf', 'Ventas a contribuyentes'], ['ajustes', 'Ajustes de IVA']]
    .filter(t => w || t[0] !== 'ajustes');
  const monthLabel = new Date(m + '-15T12:00:00').toLocaleDateString('es', { month: 'long', year: 'numeric' });
  $('#finBody').innerHTML = `
    <div class="toolbar fin-tools"><label class="muted sm" for="ivaM">Periodo</label><input class="input" type="month" id="ivaM" value="${esc(m)}" style="max-width:180px">
      ${r.liquidation ? `<span class="tag pagada">Liquidado · ${esc(r.liquidation.number)}</span>` : ''}</div>
    <div class="grid kpis fin-kpis">
      <div class="card pad kpi"><div class="l">Débito fiscal (ventas)</div><div class="v m">${fm(S2.debit)}</div></div>
      <div class="card pad kpi"><div class="l">Crédito fiscal (compras)</div><div class="v m">${fm(S2.credit)}</div><div class="hint">${S2.remanente_prev ? '+ remanente anterior ' + fm(S2.remanente_prev) : ''}</div></div>
      <div class="card pad kpi"><div class="l">${S2.to_pay ? 'IVA a pagar' : 'Remanente para el siguiente mes'}</div><div class="v m ${S2.to_pay ? 'warn' : 'good'}">${fm(S2.to_pay || S2.remanente_next)}</div></div>
      <div class="card pad kpi"><div class="l">Pago a cuenta (F-14)</div><div class="v m">${fm(S2.pago_cuenta)}</div><div class="hint">${S2.pac_rate} % de ${fm(S2.gross_income)}</div></div>
    </div>
    ${r.warnings.length ? `<details class="note iva-warn"><summary><b>${r.warnings.length} cosa(s) por revisar antes de declarar</b></summary><ul>${r.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : '<div class="note ok-note">Todo listo para declarar: los documentos tienen sus datos fiscales.</div>'}
    <div class="chips fin-sub" role="tablist">${tabs.map(t => `<button class="btn sm ${FIN.ivaTab === t[0] ? 'primary' : ''}" data-iv="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div id="ivaBody"></div>`;
  $('#ivaM').onchange = ev => { if (ev.target.value) { FIN.ivaMonth = ev.target.value; finTaxes(); } };
  $('#finBody').querySelectorAll('[data-iv]').forEach(b => b.onclick = () => { FIN.ivaTab = b.dataset.iv; finTaxes(); });
  const body = $('#ivaBody');
  const head = `<p class="muted sm iva-head">${esc(r.tenant.name)}${r.tenant.nrc ? ' · NRC ' + esc(r.tenant.nrc) : ''}${r.tenant.nit ? ' · NIT ' + esc(r.tenant.nit) : ''} · ${esc(monthLabel)}</p>`;
  const anexoBtn = (n, label) => `<button class="btn" data-anexo="${n}">${label}</button>`;
  const printBtn = '<button class="btn" id="ivPrint">Imprimir o PDF</button>';
  let html = '', title = '';

  if (FIN.ivaTab === 'resumen') {
    title = 'Resumen de IVA (F-07) · ' + monthLabel;
    const row = (l, v, cls) => `<tr class="${cls || ''}"><td>${l}</td><td class="num">${fm(v)}</td></tr>`;
    html = `<div class="bs-grid"><div><table class="rp-table"><thead><tr><th>Ventas</th><th></th></tr></thead><tbody>
        ${row('Ventas gravadas a contribuyentes (CCF)', S2.ccf_taxed)}${row('Débito fiscal por CCF', S2.ccf_debit)}
        ${row('Ventas gravadas a consumidor final (IVA incluido)', S2.cf_taxed_incl)}${row('Débito fiscal por facturas', S2.cf_debit)}
        ${row('Ventas exentas', S2.ccf_exempt + S2.cf_exempt)}${row('Exportaciones', S2.exports)}
        ${row('Total débito fiscal', S2.debit, 'rp-tot')}</tbody></table></div>
      <div><table class="rp-table"><thead><tr><th>Compras</th><th></th></tr></thead><tbody>
        ${row('Compras internas gravadas', S2.purchases_taxed)}${row('Importaciones gravadas', S2.imports_taxed)}${row('Compras exentas', S2.purchases_exempt)}
        ${row('Compras a sujetos excluidos', S2.excluded)}${row('Crédito fiscal del mes', S2.credit, 'rp-tot')}</tbody></table>
        <table class="rp-table" style="margin-top:14px"><thead><tr><th>Liquidación</th><th></th></tr></thead><tbody>
        ${row('Débito fiscal', S2.debit)}${row('− Crédito fiscal del mes', S2.credit)}${row('− Remanente del mes anterior', S2.remanente_prev)}
        ${row('− IVA retenido por clientes (1 %)', S2.retencion)}${row('− IVA percibido (1 %)', S2.percepcion)}${row('− Anticipo a cuenta de IVA (2 % tarjetas)', S2.anticipo)}
        ${S2.to_pay ? row('Impuesto a pagar', S2.to_pay, 'rp-net') : row('Remanente para el siguiente mes', S2.remanente_next, 'rp-net')}</tbody></table></div></div>`;
    body.innerHTML = head + `<div class="card pad rp-card">${html}</div>
      <p class="muted sm">Es un resumen para llenar tu F-07 en el portal de Hacienda; revísalo con tu contador. Los anexos se descargan en el formato de carga de Hacienda (CSV con punto y coma, sin encabezados).</p>
      <div class="chips">${anexoBtn(1, 'Anexo 1 · ventas a contribuyentes')}${anexoBtn(2, 'Anexo 2 · consumidor final')}${anexoBtn(3, 'Anexo 3 · compras')}${r.excluded.length ? anexoBtn(5, 'Anexo 5 · sujetos excluidos') : ''}${printBtn}</div>
      ${w ? `<div class="card pad iva-act"><div><b>${r.liquidation ? 'IVA de este mes liquidado' : 'Cerrar el IVA del mes'}</b>
          <p class="muted sm">${r.liquidation ? 'La partida ' + esc(r.liquidation.number) + ' pasó el débito contra el crédito fiscal' + (S2.to_pay ? ' y dejó ' + fm(S2.to_pay) + ' en IVA por pagar.' : '.') : 'Registra la partida que cancela el débito contra el crédito fiscal y deja en "IVA por pagar" lo que vas a pagar con el F-07.'}</p></div>
        <div class="chips">${r.liquidation ? '' : '<button class="btn primary" id="ivLiq">Registrar liquidación</button>'}
          ${S2.to_pay ? '<button class="btn" id="ivPay">Registrar pago del IVA</button>' : ''}${S2.pago_cuenta ? '<button class="btn" id="ivPac">Registrar pago a cuenta</button>' : ''}</div></div>` : ''}`;
  } else if (FIN.ivaTab === 'compras') {
    title = 'Libro de compras · ' + monthLabel;
    const rows = r.purchases.concat(r.excluded);
    html = rows.length ? `<table class="rp-table iva-t"><thead><tr><th>#</th><th>Fecha</th><th>Documento</th><th>NRC / NIT</th><th>Proveedor</th><th class="num">Exentas</th><th class="num">Gravadas</th><th class="num">Importaciones</th><th class="num">Crédito fiscal</th><th class="num">Sujetos excluidos</th><th class="num">Retención</th><th class="num">Total</th></tr></thead><tbody>
      ${rows.map((p, i) => `<tr class="click" data-exp="${esc(p.id)}"><td>${i + 1}</td><td>${dayFmt(p.date)}</td><td>${esc({ ccf: 'CCF', importacion: 'Importación', fse: 'FSE' }[p.doc_type])}<div class="muted sm code">${esc(p.doc_number || '—')}</div></td>
        <td class="code">${esc(p.nrc || p.nit || '—')}</td><td>${esc(p.supplier)}</td><td class="num">${fmZ(p.doc_type === 'fse' ? 0 : p.exempt)}</td><td class="num">${fmZ(p.doc_type === 'ccf' ? p.taxed : 0)}</td>
        <td class="num">${fmZ(p.doc_type === 'importacion' ? p.taxed : 0)}</td><td class="num">${fmZ(p.tax)}</td><td class="num">${fmZ(p.doc_type === 'fse' ? p.taxed + p.exempt : 0)}</td><td class="num">${fmZ(p.withholding)}</td><td class="num">${fm(p.total)}</td></tr>`).join('')}
      <tr class="rp-net"><td colspan="5">Totales</td><td class="num">${fm(S2.purchases_exempt)}</td><td class="num">${fm(S2.purchases_taxed)}</td><td class="num">${fm(S2.imports_taxed)}</td><td class="num">${fm(S2.credit)}</td><td class="num">${fm(S2.excluded)}</td><td class="num">${fm(S2.excluded_withholding)}</td><td class="num">${fm(rows.reduce((a, p) => a + p.total, 0))}</td></tr></tbody></table>`
      : '<div class="empty">No hay compras con crédito fiscal, importaciones ni sujetos excluidos en este mes. Las facturas de consumidor final y tickets no van al libro de compras.</div>';
    body.innerHTML = head + `<div class="card tablewrap rp-card">${html}</div><div class="chips" style="margin-top:12px">${anexoBtn(3, 'Anexo 3 (CSV Hacienda)')}${r.excluded.length ? anexoBtn(5, 'Anexo 5 (CSV Hacienda)') : ''}${printBtn}</div>`;
  } else if (FIN.ivaTab === 'cf') {
    title = 'Libro de ventas a consumidor final · ' + monthLabel;
    html = r.sales_cf.length ? `<table class="rp-table iva-t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Del N.º</th><th>Al N.º</th><th class="num">Docs.</th><th class="num">Exentas</th><th class="num">Gravadas (IVA incl.)</th><th class="num">Exportaciones</th><th class="num">Total</th><th class="num">Débito fiscal</th></tr></thead><tbody>
      ${r.sales_cf.map(d => `<tr><td>${dayFmt(d.date)}</td><td>${esc(DOC_NAMES[d.doc_type] || d.doc_type)}${d.dte ? '' : ' <span class="tag cancelada" title="Sin código de generación de DTE">sin DTE</span>'}</td><td class="code">${esc(d.from)}</td><td class="code">${esc(d.to)}</td>
        <td class="num">${d.count}</td><td class="num">${fmZ(d.exempt)}</td><td class="num">${fmZ(d.taxed_incl)}</td><td class="num">${fmZ(d.exports + d.export_services)}</td><td class="num">${fm(d.total)}</td><td class="num">${fmZ(d.tax)}</td></tr>`).join('')}
      <tr class="rp-net"><td colspan="5">Totales</td><td class="num">${fm(S2.cf_exempt)}</td><td class="num">${fm(S2.cf_taxed_incl)}</td><td class="num">${fm(S2.exports)}</td><td class="num">${fm(S2.cf_exempt + S2.cf_taxed_incl + S2.exports)}</td><td class="num">${fm(S2.cf_debit)}</td></tr></tbody></table>`
      : '<div class="empty">Sin ventas a consumidor final en este mes.</div>';
    body.innerHTML = head + `<div class="card tablewrap rp-card">${html}</div><div class="chips" style="margin-top:12px">${anexoBtn(2, 'Anexo 2 (CSV Hacienda)')}${printBtn}</div>`;
  } else if (FIN.ivaTab === 'ccf') {
    title = 'Libro de ventas a contribuyentes · ' + monthLabel;
    html = r.sales_ccf.length ? `<table class="rp-table iva-t"><thead><tr><th>#</th><th>Fecha</th><th>Documento</th><th>NRC</th><th>Cliente</th><th class="num">Exentas</th><th class="num">Gravadas</th><th class="num">Débito fiscal</th><th class="num">Total</th></tr></thead><tbody>
      ${r.sales_ccf.map((x, i) => `<tr class="click" data-sale="${esc(x.id)}"><td>${i + 1}</td><td>${dayFmt(x.date)}</td><td>${esc(x.number)}<div class="muted sm code">${esc(x.doc_number || 'sin DTE')}</div></td><td class="code">${esc(x.nrc || '—')}</td><td>${esc(x.customer)}</td>
        <td class="num">${fmZ(x.exempt)}</td><td class="num">${fmZ(x.taxed)}</td><td class="num">${fmZ(x.tax)}</td><td class="num">${fm(x.total)}</td></tr>`).join('')}
      <tr class="rp-net"><td colspan="5">Totales</td><td class="num">${fm(S2.ccf_exempt)}</td><td class="num">${fm(S2.ccf_taxed)}</td><td class="num">${fm(S2.ccf_debit)}</td><td class="num">${fm(S2.ccf_exempt + S2.ccf_taxed + S2.ccf_debit)}</td></tr></tbody></table>`
      : '<div class="empty">Sin créditos fiscales emitidos en este mes. En el punto de venta elige <b>Comprobante → Crédito fiscal</b> cuando el cliente te pida CCF.</div>';
    body.innerHTML = head + `<div class="card tablewrap rp-card">${html}</div><div class="chips" style="margin-top:12px">${anexoBtn(1, 'Anexo 1 (CSV Hacienda)')}${printBtn}</div>`;
  } else {
    const st = r.settings, a = r.adjust;
    body.innerHTML = `<div class="fin-grid">
      <form class="form fin1 card pad" id="ivAdj"><h3 style="margin:0">Retenciones de ${esc(monthLabel)}</h3>
        <p class="muted sm" style="margin:0">Lo que otros ya pagaron a Hacienda por ti este mes: se resta del IVA a pagar.</p>
        <div class="two"><div><label class="f">IVA retenido por clientes (1 %)</label><input class="input" name="retencion" inputmode="decimal" value="${a.retencion || ''}" placeholder="0.00"></div>
          <div><label class="f">IVA percibido (1 %)</label><input class="input" name="percepcion" inputmode="decimal" value="${a.percepcion || ''}" placeholder="0.00"></div></div>
        <div class="two"><div><label class="f">Anticipo 2 % (ventas con tarjeta)</label><input class="input" name="anticipo" inputmode="decimal" value="${a.anticipo || ''}" placeholder="0.00"></div>
          <div><label class="f">¿Dónde quedó ese dinero?</label>${accSelect('source', a.source || (FIN.cfg.method_accounts || {}).tarjeta || '110107', x => !!x.money_kind || x.code === '110201')}<div class="hint">La cuenta que recibió de menos (tarjetas por liquidar, clientes…).</div></div></div>
        <div class="chips"><button class="btn primary" type="submit">Guardar</button></div><div class="err" id="ivAdjErr"></div></form>
      <form class="form fin1 card pad" id="ivCfg"><h3 style="margin:0">Datos para los anexos</h3>
        <div class="two"><div><label class="f">Sector (compras)</label><select class="input" name="sector">${[['1', 'Industrial'], ['2', 'Comercial'], ['3', 'Agropecuario'], ['4', 'Servicios, profesiones y otros']].map(o => `<option value="${o[0]}" ${st.sector === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
          <div><label class="f">Tipo de ingreso (ventas, renta)</label><select class="input" name="income_type">${[['1', 'Profesiones, artes y oficios'], ['2', 'Servicios'], ['3', 'Comercio'], ['4', 'Industria'], ['5', 'Agropecuario'], ['7', 'Exportación de bienes'], ['9', 'Exportación de servicios']].map(o => `<option value="${o[0]}" ${st.income_type === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div></div>
        <div><label class="f">Pago a cuenta (% de ingresos brutos)</label><input class="input" name="pac_rate" inputmode="decimal" value="${st.pac_rate}" style="max-width:140px"></div>
        <h4 style="margin:6px 0 0">Remanente al empezar</h4><p class="muted sm" style="margin:0">Si traías crédito fiscal a favor de tu última declaración antes de usar el sistema.</p>
        <div class="two"><div><label class="f">Mes desde el que llevas el IVA aquí</label><input class="input" type="month" name="start_month" value="${esc(st.start_month)}"></div>
          <div><label class="f">Remanente con el que entraste</label><input class="input" name="start_remanente" inputmode="decimal" value="${st.start_remanente || ''}" placeholder="0.00"></div></div>
        <div class="chips"><button class="btn primary" type="submit">Guardar</button></div><div class="err" id="ivCfgErr"></div></form></div>`;
    $('#ivAdj').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target;
      try { await api('apiTaxSaveMonth', S.token, m, { retencion: numIn(f.retencion.value), percepcion: numIn(f.percepcion.value), anticipo: numIn(f.anticipo.value), source: f.source.value }); toast('Retenciones guardadas'); FIN.ivaTab = 'resumen'; finTaxes(); }
      catch (e) { $('#ivAdjErr').textContent = e.message; }
    };
    $('#ivCfg').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target;
      try { await api('apiTaxSaveSettings', S.token, { sector: f.sector.value, income_type: f.income_type.value, pac_rate: numIn(f.pac_rate.value), start_month: f.start_month.value, start_remanente: numIn(f.start_remanente.value) }); toast('Guardado'); finTaxes(); }
      catch (e) { $('#ivCfgErr').textContent = e.message; }
    };
    return;
  }
  body.querySelectorAll('[data-anexo]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const x = await api('apiTaxAnexo', S.token, m, b.dataset.anexo);
      if (!x.rows) { toast('Ese anexo no tiene filas este mes.'); b.disabled = false; return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([x.csv], { type: 'text/csv;charset=utf-8' }));
      a.download = x.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast(x.name + ': ' + x.rows + ' fila(s)');
    } catch (e) { toast(e.message, true); }
    b.disabled = false;
  });
  if ($('#ivPrint')) $('#ivPrint').onclick = () => printReport(title, `<p>${esc(r.tenant.name)}${r.tenant.nrc ? ' · NRC ' + esc(r.tenant.nrc) : ''}${r.tenant.nit ? ' · NIT ' + esc(r.tenant.nit) : ''}${r.tenant.giro ? ' · ' + esc(r.tenant.giro) : ''}</p>` + html);
  body.querySelectorAll('[data-exp]').forEach(tr => tr.onclick = () => openExpenseDetail(tr.dataset.exp));
  body.querySelectorAll('[data-sale]').forEach(tr => tr.onclick = () => showSale(tr.dataset.sale));
  if ($('#ivLiq')) $('#ivLiq').onclick = async ev => {
    if (!confirm('¿Registrar la liquidación del IVA de ' + monthLabel + '? Debe ser cuando ya revisaste el mes.')) return;
    ev.target.disabled = true;
    try { const x = await api('apiTaxLiquidate', S.token, m); toast('Partida ' + x.number + ' registrada' + (x.to_pay ? ' · a pagar ' + fm(x.to_pay) : '')); finTaxes(); }
    catch (e) { toast(e.message, true); ev.target.disabled = false; }
  };
  const payTax = (amount, counter, label) => {
    openMoneyMove('pago_impuesto');
    const f = $('#mvForm');
    f.amount.value = amount.toFixed(2);
    if (counter) f.counter_account.value = counter;
    f.notes.value = label;
    f.party_name.value = 'Ministerio de Hacienda';
    $('#mvCounter').hidden = false;
  };
  if ($('#ivPay')) $('#ivPay').onclick = () => payTax(S2.to_pay, '210305', 'IVA de ' + monthLabel + ' (F-07)');
  if ($('#ivPac')) $('#ivPac').onclick = () => payTax(S2.pago_cuenta, '110402', 'Pago a cuenta de ' + monthLabel + ' (F-14)');
}

/** Datos fiscales de una venta (código de generación del DTE, NRC del cliente). */
function openSaleFiscal(s, after) {
  openModal('Datos fiscales de ' + s.number, `<form class="form fin1" id="sfForm">
    <div><label class="f">Comprobante</label><select class="input" name="doc_type">${Object.keys(DOC_NAMES).map(k => `<option value="${k}" ${(s.doc_type || '01') === k ? 'selected' : ''}>${DOC_NAMES[k]}</option>`).join('')}</select></div>
    <div id="sfNrc"><label class="f">NRC del cliente</label><input class="input" name="customer_nrc" value="${esc(s.customer_nrc || '')}"></div>
    <div><label class="f">Código de generación</label><input class="input code" name="doc_number" value="${esc(s.doc_number || '')}" placeholder="1A2B3C4D-1234-1234-1234-1234567890AB"></div>
    <div class="two"><div><label class="f">Número de control</label><input class="input" name="doc_control" value="${esc(s.doc_control || '')}" placeholder="DTE-01-…"></div>
      <div><label class="f">Sello de recepción</label><input class="input" name="doc_seal" value="${esc(s.doc_seal || '')}"></div></div>
    <p class="muted sm">Son los datos del DTE que emitió tu sistema de facturación electrónica. Cuando conectemos la facturación electrónica se llenarán solos.</p></form>`, async () => {
    const f = $('#sfForm');
    await api('apiSaleFiscal', S.token, s.id, { doc_type: f.doc_type.value, customer_nrc: f.customer_nrc.value, doc_number: f.doc_number.value, doc_control: f.doc_control.value, doc_seal: f.doc_seal.value });
    toast('Datos fiscales guardados'); swrClear(); if (after) after();
  }, 'Guardar');
  const f = $('#sfForm');

}

/* ---------- Ventas sin conexión: se guardan en el dispositivo y se envían solas ---------- */

const OFF = {
  key(k) { return 'nx_' + k + '_' + (S.boot && S.boot.user ? S.boot.user.id : 'x'); },
  load(k, d) { try { const v = localStorage.getItem(OFF.key(k)); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  save(k, v) { try { localStorage.setItem(OFF.key(k), JSON.stringify(v)); return true; } catch (e) { return false; } },
  queue() { return S.boot ? OFF.load('posq', []) : []; },
  setQueue(q) { OFF.save('posq', q); drawPosNet(); },
  syncing: false,
};

/** Guarda la venta en el dispositivo y arma un comprobante provisional con lo que se ve en pantalla. */
function posQueueSale(payload, t, pays) {
  const now = new Date(), c = POS.cart, st = POS.cat.settings, sess = POS.cat.session;
  payload.offline_at = now.toISOString();
  payload.session_id = sess.id;
  payload.items = payload.items.map(i => Object.assign({}, i, { catalog_price: POS.byId[i.product_id].price }));
  const seq = Number(OFF.load('posseq', 0)) + 1;
  OFF.save('posseq', seq);
  const number = 'L' + String(seq).padStart(4, '0');
  const M = POS.cat.methods;
  const rc = {
    business: st.business, legal_name: st.legal_name, tax_id: st.tax_id, address: st.address, phone: st.phone, email: st.email,
    footer: st.receipt_footer, prices_include_tax: st.prices_include_tax, number: number, date: now.toISOString(), register: sess.register,
    status: 'pagada', customer: c.customer ? (c.customer.name || c.customer.phone || c.customer.email) : 'Consumidor final', currency: st.currency,
    subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, refunded: 0, is_test: false, offline: true,
    items: t.lines.map(l => ({ name: l.p.name, sku: l.p.sku, qty: l.qty, unit_price: l.unit, discount: l.disc, total: l.total, refunded_qty: 0 })),
    payments: pays.map(p => ({ method: M[p.method], amount: p.amount, tendered: p.method === 'efectivo' ? p.tendered : null,
      change: p.method === 'efectivo' ? r2(p.tendered - p.amount) : 0, reference: p.reference || '' })),
  };
  const q = OFF.queue();
  q.push({ ref: payload.client_ref, payload: payload, receipt: rc, at: now.toISOString(), status: 'pending', error: '' });
  if (!OFF.save('posq', q)) throw new Error('No hay espacio en este dispositivo para guardar la venta. Libera espacio o recupera la conexión.');
  // El catálogo guardado refleja lo vendido, por si se recarga la página sin señal.
  t.lines.forEach(l => { if (l.p.tracked) l.p.stock = r2(l.p.stock - l.qty); });
  sess.expected_cash = r2(Number(sess.expected_cash || 0) + pays.filter(p => p.method === 'efectivo').reduce((a, p) => a + p.amount, 0));
  OFF.save('poscat', POS.cat);
  return { id: null, ref: payload.client_ref, number: number, status: 'pagada', offline: true, token: null,
           customer: c.customer ? { name: c.customer.name || '', phone: c.customer.phone || '', email: c.customer.email || '' } : null,
           change: r2(rc.payments.reduce((a, p) => a + p.change, 0)), receipt: rc };
}

/** Envía las ventas guardadas, en orden. El servidor no duplica una venta que ya recibió. */
async function posSync(manual) {
  if (OFF.syncing || !S.token || !S.boot) return;
  const todo = OFF.queue().filter(x => x.status !== 'error' || manual);
  if (!todo.length) return;
  OFF.syncing = true; drawPosNet();
  let sent = 0;
  try {
    for (const item of todo) {
      try {
        const r = await apiT(25000, 'apiPosCheckout', S.token, item.payload);
        r.ref = item.ref;
        OFF.setQueue(OFF.queue().filter(x => x.ref !== item.ref));
        sent++;
        POS.offline = false; S.offline = false;
        if (POS.last && POS.last.ref === item.ref) POS.last = r;
      } catch (e) {
        if (isNet(e)) { POS.offline = true; break; }
        if (e.code === 'AUTH' || e.code === 'PWD_CHANGE') break;
        OFF.setQueue(OFF.queue().map(x => x.ref === item.ref ? Object.assign(x, { status: 'error', error: e.message }) : x));
      }
    }
  } finally { OFF.syncing = false; drawPosNet(); }
  if (sent) {
    toast(sent === 1 ? 'Se envió 1 venta hecha sin conexión' : 'Se enviaron ' + sent + ' ventas hechas sin conexión');
    swrClear();
    if (S.view === 'pos' && !$('#modal') && !document.body.classList.contains('cart-open')) viewPos();
  }
  if (manual && POS.offline) toast('Sigue sin conexión. Se enviarán solas cuando vuelva la señal.', true);
}

function drawPosNet() {
  const b = $('#posNet');
  if (!b) return;
  const q = OFF.queue(), err = q.filter(x => x.status === 'error').length;
  const off = POS.offline || !navigator.onLine;
  b.hidden = !off && !q.length;
  b.className = 'btn sm pos-net' + (off ? ' off' : '') + (err ? ' err' : '');
  b.innerHTML = '<span class="net-dot" aria-hidden="true"></span>' +
    (off ? 'Sin conexión' : OFF.syncing ? 'Enviando…' : 'Por enviar') + (q.length ? ' · ' + q.length : '') + (err ? ' · ' + err + ' con error' : '');
  b.setAttribute('aria-label', (off ? 'Sin conexión. ' : '') + q.length + ' venta(s) guardadas en este dispositivo');
}

function openPosQueue() {
  const draw = () => {
    const q = OFF.queue(), off = POS.offline || !navigator.onLine;
    $('#modal .body').innerHTML = `
      <p class="muted" style="margin-top:0">${off ? 'Sin conexión. ' : ''}Las ventas hechas sin señal quedan guardadas en este dispositivo y se envían solas cuando vuelve la conexión. No borres los datos del navegador hasta que se envíen.</p>
      ${q.length ? `<ul class="list q-list">${q.map(x => `<li>
          <span><b>${esc(x.receipt.number)}</b> · ${esc(new Date(x.at).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }))}
            <br><span class="muted sm">${esc(x.receipt.items.map(i => i.name + ' ×' + qtyFmt(i.qty)).join(', '))}</span>
            ${x.status === 'error' ? `<br><span class="neg sm">No se pudo registrar: ${esc(x.error)}</span>` : ''}</span>
          <span class="q-acts"><b>${esc(pm(x.receipt.total))}</b>
            <button class="btn sm" data-see="${esc(x.ref)}">Recibo</button>
            ${x.status === 'error' ? `<button class="btn sm" data-retry="${esc(x.ref)}">Reintentar</button><button class="btn sm danger" data-drop="${esc(x.ref)}">Descartar</button>` : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty">No hay ventas pendientes de enviar.</div>'}
      ${q.length ? '<button class="btn primary" id="qSend" style="margin-top:12px">Enviar ahora</button>' : ''}`;
    const find = ref => OFF.queue().find(x => x.ref === ref);
    document.querySelectorAll('[data-see]').forEach(b => b.onclick = () => {
      const x = find(b.dataset.see); if (!x) return;
      closeModal(true);
      showPosDone({ id: null, ref: x.ref, number: x.receipt.number, offline: true, token: null, customer: null,
        change: r2(x.receipt.payments.reduce((a, p) => a + (p.change || 0), 0)), receipt: x.receipt }, false);
    });
    document.querySelectorAll('[data-retry]').forEach(b => b.onclick = async () => {
      OFF.setQueue(OFF.queue().map(x => x.ref === b.dataset.retry ? Object.assign(x, { status: 'pending', error: '' }) : x));
      await posSync(); draw();
    });
    document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
      if (!confirm('Esta venta no quedará registrada en el sistema ni descontará inventario. ¿Descartarla?')) return;
      OFF.setQueue(OFF.queue().filter(x => x.ref !== b.dataset.drop)); draw();
    });
    if ($('#qSend')) $('#qSend').onclick = async ev => { ev.target.disabled = true; ev.target.textContent = 'Enviando…'; await posSync(true); if ($('#modal')) draw(); };
  };
  openModal('Ventas guardadas en este dispositivo', '', null, null, true);
  draw();
}

window.addEventListener('online', () => { POS.offline = false; drawPosNet(); posSync(); });
window.addEventListener('offline', () => { POS.offline = true; drawPosNet(); });
setInterval(() => { if (document.visibilityState === 'visible' && OFF.queue().some(x => x.status !== 'error')) posSync(); }, 30000);

/* ---------- Impresora térmica directa (ESC/POS por Bluetooth, USB o puerto serie) ---------- */

const PRN = {
  dev: null,     // { type, name, write(bytes), close() }
  busy: false,
  // Servicios Bluetooth de las impresoras térmicas más comunes (genéricas chinas, Xprinter, MUNBYN, GOOJPRT, Rongta, Epson TM-P…).
  BT_SERVICES: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb',
    '0000fee7-0000-1000-8000-00805f9b34fb', '0000af30-0000-1000-8000-00805f9b34fb'],
  defaults: { conn: 'system', width: '80', auto: true, drawer: false, cut: true, charset: 'pc850', qr: true, slow: false, baud: 9600, name: '', id: '' },
  cfg() { try { return Object.assign({}, PRN.defaults, JSON.parse(localStorage.getItem('nx_printer') || '{}')); } catch (e) { return Object.assign({}, PRN.defaults); } },
  save(c) { try { localStorage.setItem('nx_printer', JSON.stringify(c)); } catch (e) { /* sin almacenamiento */ } PRN.paintDot(); },
  support() {
    return { bluetooth: !!(navigator.bluetooth && navigator.bluetooth.requestDevice), usb: !!(navigator.usb && navigator.usb.requestDevice),
             serial: !!(navigator.serial && navigator.serial.requestPort) };
  },
  label() {
    const c = PRN.cfg();
    if (c.conn === 'system') return 'Diálogo de impresión del navegador';
    const kind = { bluetooth: 'Bluetooth', usb: 'USB', serial: 'Puerto serie' }[c.conn];
    return (PRN.dev ? 'Conectada: ' : (c.name ? 'Guardada: ' : 'Sin elegir · ')) + (c.name || kind) + ' · ' + c.width + ' mm';
  },
  paintDot() { const d = $('#prnDot'); if (d) { const c = PRN.cfg(); d.className = 'prn-dot' + (c.conn === 'system' ? '' : PRN.dev ? ' on' : ' off'); } },
  sleep: ms => new Promise(r => setTimeout(r, ms)),

  /** Elige la impresora (necesita un toque del usuario). */
  async pick() {
    const c = PRN.cfg();
    await PRN.close();
    if (c.conn === 'bluetooth') {
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: PRN.BT_SERVICES });
      await PRN.openBt(device);
    } else if (c.conn === 'usb') {
      let device;
      try { device = await navigator.usb.requestDevice({ filters: [{ classCode: 7 }] }); }
      catch (e) { if (e.name === 'NotFoundError') throw new Error('No se eligió ninguna impresora. Si la tuya no aparece, conéctala por "Puerto serie" o usa el diálogo de impresión.'); throw e; }
      await PRN.openUsb(device);
    } else if (c.conn === 'serial') {
      const port = await navigator.serial.requestPort();
      await PRN.openSerial(port);
    }
    const n = PRN.cfg(); n.name = PRN.dev.name; n.id = PRN.dev.id || ''; PRN.save(n);
  },

  /** Reconecta sin preguntar a la última impresora con permiso (cuando el navegador lo permite). */
  async reconnect() {
    const c = PRN.cfg();
    try {
      if (c.conn === 'usb' && navigator.usb && navigator.usb.getDevices) {
        const list = await navigator.usb.getDevices();
        const d = list.find(x => (x.productName || '') + ':' + x.vendorId + ':' + x.productId === c.id) || (list.length === 1 ? list[0] : null);
        if (d) { await PRN.openUsb(d); return true; }
      } else if (c.conn === 'serial' && navigator.serial && navigator.serial.getPorts) {
        const ports = await navigator.serial.getPorts();
        if (ports.length) { await PRN.openSerial(ports[0]); return true; }
      } else if (c.conn === 'bluetooth' && navigator.bluetooth && navigator.bluetooth.getDevices) {
        const list = await navigator.bluetooth.getDevices();
        const d = list.find(x => x.id === c.id) || (list.length === 1 ? list[0] : null);
        if (d) { await PRN.openBt(d); return true; }
      }
    } catch (e) { /* sin permiso guardado o apagada */ }
    return false;
  },

  async openBt(device) {
    const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
    let ch = null;
    for (const uuid of PRN.BT_SERVICES) {
      try {
        const svc = await server.getPrimaryService(uuid);
        const chars = await svc.getCharacteristics();
        ch = chars.find(x => x.properties.writeWithoutResponse || x.properties.write);
        if (ch) break;
      } catch (e) { /* este servicio no está */ }
    }
    if (!ch) { try { server.disconnect(); } catch (e) { /* nada */ } throw new Error('Esa impresora no ofrece un canal de impresión compatible por Bluetooth. Prueba "Puerto serie" en una PC o el diálogo de impresión.'); }
    const noResp = ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse;
    device.addEventListener('gattserverdisconnected', () => { if (PRN.dev && PRN.dev.raw === device) { PRN.dev = null; PRN.paintDot(); } }, { once: true });
    PRN.dev = { type: 'bluetooth', raw: device, name: device.name || 'Impresora Bluetooth', id: device.id,
      write: async bytes => {
        const slow = PRN.cfg().slow, size = slow ? 20 : noResp ? 120 : 180;
        for (let i = 0; i < bytes.length; i += size) {
          const part = bytes.slice(i, i + size);
          if (noResp) { await ch.writeValueWithoutResponse(part); await PRN.sleep(slow ? 40 : 12); }
          else await (ch.writeValueWithResponse ? ch.writeValueWithResponse(part) : ch.writeValue(part));
        }
      },
      close: async () => { try { device.gatt.disconnect(); } catch (e) { /* ya */ } } };
  },

  async openUsb(device) {
    try { await device.open(); }
    catch (e) { throw new Error('No se pudo abrir la impresora USB' + (/Access denied|SecurityError/i.test(e.message) ? ': la está usando el driver del sistema (pasa en Windows). Usa "Puerto serie" o el diálogo de impresión.' : ': ' + e.message)); }
    if (!device.configuration) await device.selectConfiguration(1);
    let ep = null, itf = null;
    for (const i of device.configuration.interfaces) {
      for (const alt of i.alternates) {
        const e = alt.endpoints.find(x => x.direction === 'out' && x.type === 'bulk');
        if (e) { ep = e; itf = i; break; }
      }
      if (ep) break;
    }
    if (!ep) { await device.close(); throw new Error('Esa impresora USB no tiene un canal de impresión.'); }
    try { await device.claimInterface(itf.interfaceNumber); }
    catch (e) { await device.close(); throw new Error('La impresora USB está ocupada por el driver del sistema. Usa "Puerto serie" o el diálogo de impresión.'); }
    PRN.dev = { type: 'usb', raw: device, name: device.productName || 'Impresora USB', id: (device.productName || '') + ':' + device.vendorId + ':' + device.productId,
      write: async bytes => { for (let i = 0; i < bytes.length; i += 4096) await device.transferOut(ep.endpointNumber, bytes.slice(i, i + 4096)); },
      close: async () => { try { await device.close(); } catch (e) { /* ya */ } } };
  },

  async openSerial(port) {
    const c = PRN.cfg();
    if (!port.writable) await port.open({ baudRate: Number(c.baud) || 9600 });
    const info = port.getInfo ? port.getInfo() : {};
    PRN.dev = { type: 'serial', raw: port, name: 'Puerto serie' + (info.usbVendorId ? ' USB ' + info.usbVendorId.toString(16) : ''), id: '',
      write: async bytes => { const w = port.writable.getWriter(); try { await w.write(bytes); await w.ready; } finally { w.releaseLock(); } },
      close: async () => { try { await port.close(); } catch (e) { /* ya */ } } };
  },

  async close() { if (PRN.dev) { const d = PRN.dev; PRN.dev = null; await d.close(); } PRN.paintDot(); },

  async ensure(gesture) {
    if (PRN.dev && !(PRN.dev.type === 'bluetooth' && !PRN.dev.raw.gatt.connected)) return;
    if (PRN.dev && PRN.dev.type === 'bluetooth') { try { await PRN.openBt(PRN.dev.raw); return; } catch (e) { PRN.dev = null; } }
    if (await PRN.reconnect()) { PRN.paintDot(); return; }
    if (!gesture) { const e = new Error('Hay que reconectar la impresora.'); e.code = 'PICK'; throw e; }
    await PRN.pick();
    PRN.paintDot();
  },

  async send(bytes, opts) {
    const c = PRN.cfg();
    if (c.conn === 'system') throw new Error('No hay impresora directa configurada.');
    const sup = PRN.support()[c.conn];
    if (!sup) throw new Error(ON_GOOGLE ? 'Dentro de la página de Google el navegador no deja usar Bluetooth ni USB. Abre la app desde tu dirección de GitHub.' : 'Este navegador no permite imprimir por ' + c.conn + '. En iPhone usa el diálogo de impresión (AirPrint).');
    if (PRN.busy) throw new Error('La impresora está ocupada; espera un momento.');
    PRN.busy = true;
    try {
      await PRN.ensure(opts && opts.gesture);
      try { await PRN.dev.write(bytes); }
      catch (e) {
        // Se cortó la conexión (impresora apagada, se alejó el teléfono): un reintento.
        PRN.dev = null;
        await PRN.ensure(opts && opts.gesture);
        await PRN.dev.write(bytes);
      }
    } catch (e) {
      if (e.code === 'PICK') throw e;
      if (e.name === 'NotFoundError') throw new Error('No se eligió ninguna impresora.');
      if (e.name === 'SecurityError') throw new Error('El navegador pidió un toque para conectar: toca "Imprimir ticket".');
      throw e;
    } finally { PRN.busy = false; PRN.paintDot(); }
  },

  printReceipt(rc, link, opts) { const c = PRN.cfg(); return PRN.send(escposDoc(receiptDoc(rc, c.qr ? link : ''), Object.assign({}, c, { drawer: c.drawer && opts && opts.drawer })), opts); },
  printDoc(doc, opts) { return PRN.send(escposDoc(doc, PRN.cfg()), opts); },
};

/* Un "documento" de ticket es una lista de renglones; de ahí salen los bytes ESC/POS. */
function receiptDoc(rc, link) {
  const m = v => moneyIn(v, rc.currency);
  const d = [];
  d.push({ t: 'title', v: rc.business });
  [rc.legal_name, rc.tax_id ? 'NIT/ID ' + rc.tax_id : '', rc.address, rc.phone].filter(Boolean).forEach(x => d.push({ t: 'center', v: x }));
  if (rc.is_test) d.push({ t: 'center', v: '*** PRUEBA - no es una venta real ***' });
  if (rc.doc_type === '03') d.push({ t: 'center', v: 'Crédito fiscal - NRC cliente ' + rc.customer_nrc });
  if (rc.offline && !rc.synced) { d.push({ t: 'center', v: 'COMPROBANTE PROVISIONAL' }); d.push({ t: 'center', v: '(venta sin conexión)' }); }
  d.push({ t: 'sep' });
  d.push({ t: 'lr', l: 'Recibo ' + rc.number, r: new Date(rc.date).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }) });
  d.push({ t: 'lr', l: rc.register || '', r: rc.customer || '' });
  d.push({ t: 'sep' });
  rc.items.forEach(i => {
    d.push({ t: 'lr', l: i.name, r: m(i.total) });
    d.push({ t: 'sub', v: qtyFmt(i.qty) + ' x ' + m(i.unit_price) + (i.discount ? ' · desc. ' + m(i.discount) : '') + (i.refunded_qty ? ' · ' + i.refunded_qty + ' devuelta(s)' : '') });
  });
  d.push({ t: 'sep' });
  if (rc.discount) d.push({ t: 'lr', l: 'Descuento', r: '-' + m(rc.discount) });
  if (rc.prices_include_tax) d.push({ t: 'lr', l: 'IVA incluido', r: m(rc.tax) });
  else { d.push({ t: 'lr', l: 'Subtotal', r: m(rc.subtotal) }); d.push({ t: 'lr', l: 'Impuesto', r: m(rc.tax) }); }
  d.push({ t: 'total', l: 'TOTAL', r: m(rc.total) });
  (rc.payments || []).forEach(p => {
    d.push({ t: 'lr', l: p.method + (p.reference ? ' ' + p.reference : ''), r: m(p.amount) });
    if (p.tendered && p.change) { d.push({ t: 'lr', l: '  Recibido', r: m(p.tendered) }); d.push({ t: 'lr', l: '  Cambio', r: m(p.change) }); }
  });
  if (rc.refunded) d.push({ t: 'lr', l: 'Reembolsado', r: '-' + m(rc.refunded) });
  if (link) { d.push({ t: 'feed' }); d.push({ t: 'qr', v: link }); d.push({ t: 'center', v: 'Tu recibo en línea' }); }
  if (rc.footer) { d.push({ t: 'feed' }); d.push({ t: 'center', v: rc.footer }); }
  return d;
}

function sessionDoc(s) {
  const m = v => pm(v);
  const d = [{ t: 'title', v: 'Cierre de caja' }, { t: 'center', v: (POS.cat ? POS.cat.settings.business + ' · ' : '') + s.register + ' · ' + locName(s.location) }, { t: 'sep' },
    { t: 'lr', l: s.number, r: s.opened_by_name || '' }, { t: 'lr', l: 'Abrió', r: fmtDate(s.opened_at) }, { t: 'lr', l: 'Cerró', r: fmtDate(s.closed_at) }, { t: 'sep' },
    { t: 'lr', l: 'Ventas (' + s.sales_count + ')', r: m(s.sales_total) }];
  s.by_method.forEach(x => d.push({ t: 'lr', l: '  ' + x.label, r: m(x.amount) }));
  if (s.refunded_total) d.push({ t: 'lr', l: 'Devoluciones', r: '-' + m(s.refunded_total) });
  d.push({ t: 'lr', l: 'Fondo inicial', r: m(s.opening_cash) }, { t: 'lr', l: 'Efectivo esperado', r: m(s.expected_cash) }, { t: 'lr', l: 'Efectivo contado', r: m(s.counted_cash) });
  d.push({ t: 'total', l: 'Diferencia', r: m(s.difference) });
  s.moves.filter(x => x.type === 'entrada' || x.type === 'salida' || x.type === 'devolucion')
    .forEach(x => d.push({ t: 'lr', l: { entrada: 'Entrada', salida: 'Salida', devolucion: 'Devolución' }[x.type] + ': ' + x.reason, r: m(x.amount) }));
  if (s.notes) { d.push({ t: 'feed' }); d.push({ t: 'center', v: s.notes }); }
  return d;
}

/* Página de códigos PC850 (ESC t 2): la que traen casi todas las térmicas y tiene ñ, tildes, ¿ y ¡. */
const CP850 = { 'Ç': 0x80, 'ü': 0x81, 'é': 0x82, 'â': 0x83, 'ä': 0x84, 'à': 0x85, 'ç': 0x87, 'ê': 0x88, 'ë': 0x89, 'è': 0x8A, 'ï': 0x8B, 'î': 0x8C,
  'ì': 0x8D, 'Ä': 0x8E, 'É': 0x90, 'ô': 0x93, 'ö': 0x94, 'ò': 0x95, 'û': 0x96, 'ù': 0x97, 'Ö': 0x99, 'Ü': 0x9A, '£': 0x9C, '×': 0x9E,
  'á': 0xA0, 'í': 0xA1, 'ó': 0xA2, 'ú': 0xA3, 'ñ': 0xA4, 'Ñ': 0xA5, 'ª': 0xA6, 'º': 0xA7, '¿': 0xA8, '½': 0xAB, '¡': 0xAD, 'Á': 0xB5,
  'Â': 0xB6, 'À': 0xB7, '¢': 0xBD, 'Ê': 0xD2, 'Í': 0xD6, 'Ó': 0xE0, 'Ô': 0xE2, 'Ú': 0xE9, '±': 0xF1, '°': 0xF8, '·': 0xFA };

function escText(str, charset) {
  str = String(str === null || str === undefined ? '' : str)
    .replace(/[   ]/g, ' ').replace(/[−–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/…/g, '...').replace(/€/g, 'EUR').replace(/[\r\n\t]+/g, ' ');
  const out = [];
  for (const ch of str) {
    const c = ch.charCodeAt(0);
    if (c < 128) { out.push(c); continue; }
    if (charset === 'pc850' && CP850[ch]) { out.push(CP850[ch]); continue; }
    const base = ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
    out.push(base.length === 1 && base.charCodeAt(0) < 128 ? base.charCodeAt(0) : 63);
  }
  return out;
}

/** Corta un texto en renglones de n columnas sin partir palabras (salvo que no quepan). */
function wrapCols(text, n) {
  const words = String(text || '').split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  words.forEach(w => {
    while (w.length > n) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, n)); w = w.slice(n); }
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= n) cur += ' ' + w; else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/** Bytes ESC/POS de un documento. o = { width:'58'|'80', charset, cut, drawer, qr } */
function escposDoc(doc, o) {
  const W = o.width === '58' ? 32 : 48, dots = o.width === '58' ? 384 : 576;
  const b = [];
  const put = (...x) => { for (const v of x) { if (Array.isArray(v)) b.push.apply(b, v); else b.push(v); } };
  const txt = s => escText(s, o.charset);
  const align = a => put(0x1B, 0x61, a);       // 0 izq, 1 centro
  const bold = on => put(0x1B, 0x45, on ? 1 : 0);
  const size = n => put(0x1D, 0x21, n);        // 0x00 normal, 0x11 doble, 0x01 doble alto
  const nl = () => put(0x0A);
  const lr = (l, r, cols) => {
    cols = cols || W;
    r = String(r || ''); l = String(l || '');
    const room = Math.max(4, cols - r.length - 1);
    const ls = wrapCols(l, room);
    ls.forEach((line, i) => {
      if (i < ls.length - 1) { put(txt(line)); nl(); }
      else { put(txt(line + ' '.repeat(Math.max(1, cols - line.length - r.length)) + r)); nl(); }
    });
  };
  put(0x1B, 0x40);                              // reiniciar
  if (o.charset === 'pc850') put(0x1B, 0x74, 2); // tabla PC850
  if (o.drawer) put(0x1B, 0x70, 0, 25, 250);     // abrir cajón (pin 2)
  doc.forEach(r => {
    if (r.t === 'title') { align(1); bold(true); size(0x11); wrapCols(r.v, Math.floor(W / 2)).forEach(l => { put(txt(l)); nl(); }); size(0); bold(false); align(0); }
    else if (r.t === 'center') { align(1); wrapCols(r.v, W).forEach(l => { put(txt(l)); nl(); }); align(0); }
    else if (r.t === 'sep') { put(txt('-'.repeat(W))); nl(); }
    else if (r.t === 'lr') lr(r.l, r.r);
    else if (r.t === 'sub') { wrapCols(r.v, W - 2).forEach(l => { put(txt('  ' + l)); nl(); }); }
    else if (r.t === 'total') { bold(true); size(0x01); lr(r.l, r.r); size(0); bold(false); }
    else if (r.t === 'feed') nl();
    else if (r.t === 'qr') {
      const q = qrcode(0, 'M'); q.addData(r.v); q.make();
      const n = q.getModuleCount(), quiet = 2;
      const scale = Math.max(2, Math.min(8, Math.floor((o.width === '58' ? 200 : 240) / (n + quiet * 2))));
      const px = (n + quiet * 2) * scale, wb = Math.ceil(px / 8);
      const pad = Math.max(0, Math.floor((dots / 8 - wb) / 2)); // centrado a mano: no todas respetan ESC a con imágenes
      const rowBytes = wb + pad;
      put(0x1D, 0x76, 0x30, 0x00, rowBytes & 255, rowBytes >> 8, px & 255, px >> 8);
      for (let y = 0; y < px; y++) {
        const row = new Array(rowBytes).fill(0);
        const my = Math.floor(y / scale) - quiet;
        for (let x = 0; x < px; x++) {
          const mx = Math.floor(x / scale) - quiet;
          if (mx >= 0 && my >= 0 && mx < n && my < n && q.isDark(my, mx)) row[pad + (x >> 3)] |= 0x80 >> (x & 7);
        }
        put(row);
      }
      nl();
    }
  });
  put(0x1B, 0x64, 4);                           // avanzar 4 renglones
  if (o.cut) put(0x1D, 0x56, 0x42, 0x00);       // corte parcial
  return new Uint8Array(b);
}

async function openPosClose() {
  const pend = OFF.queue();
  if (pend.length) {
    openModal('Antes de cerrar la caja', `<p>Hay <b>${pend.length}</b> venta(s) hechas sin conexión que todavía no llegan al sistema. Envíalas primero para que el arqueo cuadre.</p>`, async () => { await posSync(true); if (OFF.queue().length) throw new Error('Aún quedan ventas sin enviar. Revisa la conexión o abre la lista de ventas guardadas.'); setTimeout(openPosClose, 0); }, 'Enviar ahora');
    return;
  }
  let s;
  try { s = (await api('apiPosCatalog', S.token)).session; } catch (e) { toast(e.message, true); return; }
  if (!s) { viewPos(); return; }
  openModal('Cerrar caja · ' + s.register, `
    <div class="close-grid">
      <div class="card pad"><div class="muted sm">Ventas</div><div class="big">${s.sales_count}</div><div class="muted sm">${esc(pm(s.sales_total))}</div></div>
      <div class="card pad"><div class="muted sm">Efectivo esperado</div><div class="big">${esc(pm(s.expected_cash))}</div><div class="muted sm">fondo ${esc(pm(s.opening_cash))}</div></div>
    </div>
    ${s.by_method.length ? `<ul class="list">${s.by_method.map(m => `<li><span>${esc(m.label)}</span><b>${esc(pm(m.amount))}</b></li>`).join('')}</ul>` : ''}
    ${s.refunded_total ? `<p class="muted">Devoluciones: −${esc(pm(s.refunded_total))}</p>` : ''}
    <form class="form" id="clForm" style="margin-top:12px">
      <div><label class="f">Efectivo contado</label><input class="input pos-money" name="counted" inputmode="decimal" placeholder="0.00" required></div>
      <div><label class="f">Diferencia</label><div class="diff" id="clDiff">—</div></div>
      <div class="wide"><label class="f">Nota</label><input class="input" name="notes" placeholder="Opcional"></div>
    </form>`, async () => {

    toast('Caja cerrada. Diferencia: ' + pm(closed.difference));
    setTimeout(() => { viewPos(); showSessionReport(closed); }, 0);
  }, 'Cerrar caja', true);

  };
}
