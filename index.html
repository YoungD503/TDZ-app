/* ============================ Escáner: cámara y lectores ============================ */

/*
 * Cámara: usa el lector nativo del navegador (Android/Chrome, Mac) y, donde no existe
 * (iPhone, Windows), carga un lector de respaldo (ZXing) solo la primera vez que se usa.
 * Lectores USB/Bluetooth: escriben el código como un teclado y terminan con Enter.
 */
const BD_URL = 'https:\/\/fastly.jsdelivr.net/npm/barcode-detector@3.2.4/dist/iife/ponyfill.js';
const BD_SRI = 'sha384-V0LFv1UaolwYOQ6Y1C07pBzM25t1t+HbAAwyN47cJtg/Sqa2jYnTPGGt+oL1kjS/';
const SCAN_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code', 'data_matrix'];
let detectorP = null;

function loadScript(src, sri) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    if (sri) { s.integrity = sri; s.crossOrigin = 'anonymous'; }
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar el lector de códigos. Revisa tu internet.'));
    document.head.appendChild(s);
  });
}

function getDetector() {
  if (detectorP) return detectorP;
  detectorP = (async () => {
    if ('BarcodeDetector' in window) {
      try {
        const sup = await window.BarcodeDetector.getSupportedFormats();
        const f = SCAN_FORMATS.filter(x => sup.indexOf(x) >= 0);
        if (f.length >= 3) return new window.BarcodeDetector({ formats: f });
      } catch (e) { /* usa el respaldo */ }
    }
    await loadScript(BD_URL, BD_SRI);
    return new window.BarcodeDetectionAPI.BarcodeDetector({ formats: SCAN_FORMATS });
  })();
  detectorP.catch(() => { detectorP = null; });
  return detectorP;
}

let audioCtx = null;
function beep(good) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = good === false ? 300 : 1250;
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (good === false ? 0.25 : 0.12));
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.26);
  } catch (e) { /* sin sonido */ }
  if (navigator.vibrate) navigator.vibrate(good === false ? [70, 50, 70] : 35);
}

/**
 * Abre la cámara a pantalla completa.
 * opts.continuous: sigue leyendo (para contar o recibir varios productos).
 * opts.onCode(code) → { ok, label } : qué pasó con el código (se muestra abajo).
 * Devuelve una promesa con el código leído (modo simple) o vacío al cerrar.
 */
function scanCamera(opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'scanner';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', opts.title || 'Escanear código');
    el.innerHTML = `<video playsinline muted autoplay></video>
      <div class="scan-top"><b>${esc(opts.title || 'Escanear código')}</b><button type="button" class="scan-x" data-act="close" aria-label="Cerrar">✕</button></div>
      <div class="scan-frame" aria-hidden="true"><i></i></div>
      <div class="scan-bottom">
        <div class="scan-msg" aria-live="polite">Abriendo la cámara…</div>
        <div class="scan-log"></div>
        <div class="scan-actions">
          <button type="button" class="btn" data-act="torch" hidden>Linterna</button>
          <label class="btn">Tomar foto<input type="file" accept="image/*" capture="environment" hidden></label>
          <button type="button" class="btn primary" data-act="close">${opts.continuous ? 'Listo' : 'Cancelar'}</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const video = el.querySelector('video'), msg = el.querySelector('.scan-msg'), log = el.querySelector('.scan-log');
    let stream = null, track = null, alive = true, last = '', lastAt = 0, busy = false, torchOn = false, result = '';

    const close = () => {
      if (!alive) return;
      alive = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      document.removeEventListener('keydown', onKey, true);
      el.remove();
      resolve(result);
    };
    const onKey = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); ev.preventDefault(); close(); } };
    document.addEventListener('keydown', onKey, true);
    el.querySelectorAll('[data-act=close]').forEach(b => b.onclick = close);

    const handle = async code => {
      const now = Date.now();
      if (code === last && now - lastAt < 1800) return;
      last = code; lastAt = now;
      if (!opts.continuous) { beep(true); result = code; close(); return; }
      let r = { ok: true, label: code };
      try { if (opts.onCode) r = (await opts.onCode(code)) || r; } catch (e) { r = { ok: false, label: e.message }; }
      beep(r.ok !== false);
      el.classList.remove('hit', 'miss'); void el.offsetWidth; el.classList.add(r.ok === false ? 'miss' : 'hit');
      msg.textContent = r.label;
      const chip = document.createElement('span');
      chip.className = 'tag ' + (r.ok === false ? 'error' : 'ok');
      chip.textContent = r.short || r.label;
      log.prepend(chip);
      while (log.children.length > 6) log.lastChild.remove();
    };

    el.querySelector('input[type=file]').onchange = async ev => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      msg.textContent = 'Buscando el código en la foto…';
      try {
        const det = await getDetector();
        const img = await createImageBitmap(file);
        const found = await det.detect(img);
        if (found.length) await handle(found[0].rawValue);
        else { beep(false); msg.textContent = 'No encontré un código en la foto. Acércate más, con buena luz, y vuelve a intentar.'; }
      } catch (e) { msg.textContent = e.message; }
    };

    const tick = async () => {
      if (!alive) return;
      if (!busy && video.readyState >= 2) {
        busy = true;
        try {
          const det = await getDetector();
          const found = await det.detect(video);
          if (found.length && alive) await handle(found[0].rawValue);
        } catch (e) { /* cuadro sin código */ }
        busy = false;
      }
      if (alive) setTimeout(tick, 140);
    };

    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        if (!alive) { stream.getTracks().forEach(t => t.stop()); return; }
        video.srcObject = stream;
        await video.play().catch(() => {});
        track = stream.getVideoTracks()[0];
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) {
          const b = el.querySelector('[data-act=torch]');
          b.hidden = false;
          b.onclick = () => { torchOn = !torchOn; track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {}); b.classList.toggle('primary', torchOn); };
        }
        msg.textContent = opts.continuous ? 'Apunta a cada código. Suena cuando lo lee.' : 'Apunta al código de barras o QR.';
        getDetector().catch(e => { msg.textContent = e.message; });
        tick();
      } catch (e) {
        el.classList.add('nocam');
        msg.textContent = ON_GOOGLE
          ? 'La cámara en vivo no funciona dentro de la página de Google. Usa "Tomar foto", o abre la app desde tu dirección de GitHub.'
          : 'No pude abrir la cámara. Permite el acceso a la cámara para este sitio, o usa "Tomar foto".';
      }
    })();
  });
}

/* Lectores USB / Bluetooth: llegan como teclas muy rápidas terminadas en Enter (o Tab). */
const wedge = { buf: '', last: 0 };
document.addEventListener('keydown', ev => {
  if (!S.onScan || document.querySelector('.scanner')) return;
  const t = ev.target;
  const field = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (field) { wedge.buf = ''; return; }
  const now = performance.now();
  if (now - wedge.last > 90) wedge.buf = '';
  wedge.last = now;
  if (ev.key === 'Enter' || ev.key === 'Tab') {
    if (wedge.buf.length >= 3) { ev.preventDefault(); const code = wedge.buf; wedge.buf = ''; S.onScan(code); }
    return;
  }
  if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) wedge.buf += ev.key;
}, true);

const normCode = c => {
  const s = String(c || '').trim().toLowerCase();
  return /^\d+$/.test(s) ? s.replace(/^0+/, '') : s;
};
function findLocal(rows, code) {
  const raw = String(code || '').trim(), n = normCode(raw);
  if (!raw) return null;
  return rows.find(p => p.id === raw) || rows.find(p => p.barcode && normCode(p.barcode) === n) || rows.find(p => p.sku && normCode(p.sku) === n) || null;
}

/* ============================ Códigos de barras (SVG) ============================ */

const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
const eanR = d => EAN_L[d].replace(/./g, b => b === '0' ? '1' : '0');
const eanG = d => eanR(d).split('').reverse().join('');

function ean13Valid(code) {
  if (!/^\d{13}$/.test(code)) return false;
  let s = 0;
  for (let i = 0; i < 12; i++) s += Number(code[i]) * (i % 2 ? 3 : 1);
  return (10 - (s % 10)) % 10 === Number(code[12]);
}

/** Módulos (1 = barra) de un EAN-13, con marcas de guarda para dibujarlas más largas. */
function ean13Modules(code) {
  const d = code.split('').map(Number), par = EAN_PAR[d[0]];
  let m = '101';
  for (let i = 1; i <= 6; i++) m += par[i - 1] === 'L' ? EAN_L[d[i]] : eanG(d[i]);
  m += '01010';
  for (let i = 7; i <= 12; i++) m += eanR(d[i]);
  m += '101';
  return m;
}

const C128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232', '2331112'];

function code128Modules(text) {
  const vals = [];
  if (/^\d+$/.test(text) && text.length % 2 === 0 && text.length >= 4) {
    vals.push(105);
    for (let i = 0; i < text.length; i += 2) vals.push(Number(text.substr(i, 2)));
  } else {
    vals.push(104);
    for (const ch of text) { const c = ch.charCodeAt(0); vals.push(c >= 32 && c <= 126 ? c - 32 : 31); }
  }
  let sum = vals[0];
  for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103, 106);
  let m = '';
  vals.forEach(v => { C128[v].split('').forEach((w, i) => { m += (i % 2 ? '0' : '1').repeat(Number(w)); }); });
  return m;
}

/** SVG de código de barras: EAN-13 si el código lo es; si no, Code 128. */
function barcodeSvg(code, opts) {
  opts = opts || {};
  const isEan = ean13Valid(code);
  const mods = isEan ? ean13Modules(code) : code128Modules(code);
  const quiet = isEan ? 9 : 10, w = mods.length + quiet * 2, h = 60;
  let path = '';
  for (let i = 0; i < mods.length; i++) {
    if (mods[i] !== '1') continue;
    let j = i;
    while (j + 1 < mods.length && mods[j + 1] === '1') j++;
    const guard = isEan && (i < 3 || (i >= 45 && i < 50) || i >= 92);
    path += `M${i + quiet} 0h${j - i + 1}v${guard ? h + 6 : h}h-${j - i + 1}z`;
    i = j;
  }
  return `<svg class="bc" viewBox="0 0 ${w} ${h + 6}" preserveAspectRatio="${opts.stretch ? 'none' : 'xMidYMid meet'}" role="img" aria-label="Código ${esc(code)}" shape-rendering="crispEdges"><rect width="${w}" height="${h + 6}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
}

/* ============================ Inventario ============================ */

const LEVELS = { ok: ['Disponible', 'ok'], bajo: ['Bajo el mínimo', 'bajo'], agotado: ['Agotado', 'agotado'] };
const MOVE_KINDS = {
  entrada: { title: 'Recibir mercadería', save: 'Guardar entrada', verb: 'Recibir', hint: 'Escanea o busca cada producto que llegó. Si escaneas el mismo dos veces, suma 1.' },
  ajuste: { title: 'Ajustar existencias', save: 'Guardar ajuste', verb: 'Ajustar', hint: 'Para mermas, daños, pérdidas o correcciones. Usa números negativos para restar.' },
  conteo: { title: 'Contar inventario', save: 'Guardar conteo', verb: 'Contar', hint: 'Escanea cada pieza (cada lectura suma 1) o escribe cuántas hay. El sistema calcula la diferencia.' },
  traslado: { title: 'Trasladar entre ubicaciones', save: 'Guardar traslado', verb: 'Trasladar', hint: 'Mueve existencias de una ubicación a otra, por ejemplo de bodega a tienda.' },
};
const locName = l => l === 'principal' ? 'Principal' : l;
const qtyFmt = n => {
  const v = Number(n || 0);
  return (Math.round(v * 100) / 100).toLocaleString('es', { maximumFractionDigits: 2 });
};

async function loadInventory(opts) {
  S.inv = await api('apiInventory', S.token, opts || {});

}

async function viewInventory() {

    '<div id="invBody"><div class="empty">Cargando inventario…</div></div>';

function drawInvRows() {
  const d = S.inv, f = S.invFilter;
  const text = normCode(f.q);
  const rows = d.rows.filter(r => (!f.level || r.level === f.level) &&
    (!text || (r.name + ' ' + r.sku + ' ' + r.barcode + ' ' + r.category).toLowerCase().indexOf(text) >= 0 || normCode(r.barcode) === text));
  const box = $('#invList');
  if (!d.rows.length) {
    box.innerHTML = `<div class="empty">Todavía no hay productos que controlen inventario.<br>${can('products:write') ? 'Crea productos en <b>Productos y servicios</b> con "Controlar inventario" activado.' : ''}</div>`;
    return;
  }
  if (!rows.length) { box.innerHTML = '<div class="empty">Ningún producto coincide con el filtro.</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>Producto</th><th class="num">Existencias</th><th class="num">Mínimo</th><th class="num">Costo prom.</th><th class="num">Valor</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-id="${esc(r.id)}" tabindex="0">
      <td><b>${esc(r.name)}</b><div class="muted sm">${esc([r.sku, r.barcode && r.barcode !== r.sku ? r.barcode : '', r.category].filter(String).join(' · '))}</div></td>

async function openByCode(code) {
  const local = S.inv ? findLocal(S.inv.rows, code) : null;
  if (local) { beep(true); return openProductSheet(local.id); }
  try {
    const r = await api('apiInventoryLookup', S.token, code);
    if (r.found) { beep(true); return openProductSheet(r.product.id); }
    beep(false);
    openModal('Código no encontrado', `<p>Ningún producto tiene el código <b>${esc(code)}</b>.</p>
      ${can('products:write') ? '<p class="muted">Puedes crear el producto ahora con este código ya puesto.</p>' : ''}`,
      can('products:write') ? async () => { setTimeout(() => editRecord('products', null, { prefill: { barcode: code, kind: 'producto', track_stock: true }, onSaved: () => S.view === 'inventory' && viewInventory() }), 0); } : null, 'Crear producto');

}

  const locOpts = sel => d.locations.map(l => `<option value="${esc(l)}" ${l === sel ? 'selected' : ''}>${esc(locName(l))}</option>`).join('');
  const body = `
    <p class="muted" style="margin-top:0">${K.hint}</p>
    <div class="form mv-head">
      <div><label class="f">${kind === 'traslado' ? 'Desde' : 'Ubicación'}</label><select class="input" id="mvLoc">${locOpts(st.location)}</select></div>
      ${kind === 'traslado' ? `<div><label class="f">Hacia</label><input class="input" id="mvTo" list="mvLocs" placeholder="Ej. Tienda Centro"><datalist id="mvLocs">${d.locations.map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>` : ''}
      ${kind === 'ajuste' ? `<div><label class="f">Motivo *</label><select class="input" id="mvReason"><option value="">Elige…</option>${d.reasons.map(r => `<option>${esc(r)}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="scanbox mv-scan">
      <input class="input" id="mvCode" list="mvProducts" placeholder="Escanea o escribe código o nombre…" autocomplete="off" data-scan>
      <datalist id="mvProducts">${products.map(p => `<option value="${esc(p.name)}${p.sku ? ' · ' + esc(p.sku) : ''}">`).join('')}</datalist>
      <button type="button" class="btn primary" id="mvCam" aria-label="Escanear con la cámara">${ICONS.scan}<span>Escanear</span></button>
    </div>
    <div id="mvNew"></div>
    ${kind === 'conteo' ? '<div class="mv-all"><button type="button" class="btn sm" id="mvAll">Agregar todos los productos de la lista</button></div>' : ''}
    <div id="mvLines" class="mv-lines"></div>
    <div class="mv-sum" id="mvSum"></div>
    <div class="form mv-extra">
      ${kind === 'entrada' ? '<div><label class="f">Proveedor o factura</label><input class="input" id="mvRef" placeholder="Opcional"></div>' : ''}
      <div class="${kind === 'entrada' ? '' : 'wide'}"><label class="f">Nota</label><input class="input" id="mvNotes" placeholder="Opcional"></div>
    </div>`;

  openModal(K.title, body, async () => {
    const lines = st.lines.filter(l => kind !== 'conteo' || l.counted !== '');
    if (!lines.length) throw new Error(kind === 'conteo' ? 'Escribe la cantidad contada de al menos un producto.' : 'Agrega al menos un producto.');
    const doc = {
      kind: kind, location: $('#mvLoc').value,
      to_location: $('#mvTo') ? $('#mvTo').value.trim() : '',
      reason: $('#mvReason') ? $('#mvReason').value : '',
      reference: $('#mvRef') ? $('#mvRef').value : '', notes: $('#mvNotes').value,
      lines: lines.map(l => ({ product_id: l.id, qty: Number(l.qty), unit_cost: l.unit_cost === '' ? '' : Number(l.unit_cost), counted: l.counted === '' ? '' : Number(l.counted) })),
    };
    const r = await api('apiInventoryMove', S.token, doc);
    st.saved = true;
    toast(r.message + (r.warnings.length ? ' Atención: ' + r.warnings[0] + (r.warnings.length > 1 ? ' y ' + (r.warnings.length - 1) + ' más' : '') + '.' : ''), r.warnings.length > 0);
    S.inv = null;
    if (S.view === 'inventory') viewInventory();
  }, K.save, true);

  const modal = $('#modal');
  modal.classList.add('mv-modal');
  modal._guard = () => st.saved || !st.lines.length || confirm('¿Cerrar sin guardar? Se perderán los ' + st.lines.length + ' producto(s) agregados.');
  const prevScan = S.onScan;
  modal._onClose = () => { S.onScan = prevScan; };

  const onHandAt = p => {
    const loc = $('#mvLoc').value;
    return Number((p.by_location || {})[loc] || 0);
  };

  const addProduct = (p, n) => {
    n = n === undefined ? 1 : n;
    let l = st.lines.find(x => x.id === p.id);
    if (l) {
      if (kind === 'conteo') l.counted = Number(l.counted || 0) + n; else l.qty = Number(l.qty || 0) + (kind === 'ajuste' ? -n : n);
      st.lines.splice(st.lines.indexOf(l), 1);
      st.lines.unshift(l);
    } else {
      l = { id: p.id, name: p.name, sku: p.sku, unit: p.unit, p: p, qty: kind === 'ajuste' ? -n : n, unit_cost: kind === 'entrada' ? (p.avg_cost || p.cost || '') : '', counted: kind === 'conteo' ? n : '' };
      st.lines.unshift(l);
    }
    drawLines(l.id);
    return l;
  };

  const resolveCode = async code => {
    const p = findLocal(products, code);
    if (p) return { p: p };
    const byName = products.filter(x => (x.name + (x.sku ? ' · ' + x.sku : '')).toLowerCase() === code.toLowerCase());
    if (byName.length === 1) return { p: byName[0] };
    const r = await api('apiInventoryLookup', S.token, code);
    if (r.found && r.tracked) { products.push(r.product); return { p: r.product }; }
    if (r.found) return { untracked: r.product };
    const partial = products.filter(x => (x.name + ' ' + x.sku).toLowerCase().indexOf(code.toLowerCase()) >= 0);
    return { partial: partial, code: code };
  };

  const handleCode = async (code, fromCamera) => {
    code = String(code || '').trim();
    if (!code) return { ok: false, label: '' };
    $('#mvNew').innerHTML = '';
    const r = await resolveCode(code);
    if (r.p) {
      const l = addProduct(r.p);
      if (!fromCamera) beep(true);
      const n = kind === 'conteo' ? l.counted : Math.abs(l.qty);
      return { ok: true, label: r.p.name + ' — ' + qtyFmt(n), short: r.p.name + ' ×' + qtyFmt(n) };
    }
    if (!fromCamera) beep(false);
    if (r.untracked) {
      $('#mvNew').innerHTML = `<div class="note">"${esc(r.untracked.name)}" no controla inventario. ${can('products:write') ? '<button type="button" class="btn sm" id="mvTrack">Activar y agregar</button>' : ''}</div>`;
      if ($('#mvTrack')) $('#mvTrack').onclick = async () => {
        try {
          await api('apiInventoryEnableTracking', S.token, [r.untracked.id]);
          const lk = await api('apiInventoryLookup', S.token, r.untracked.id);
          products.push(lk.product); addProduct(lk.product); $('#mvNew').innerHTML = '';
        } catch (e) { toast(e.message, true); }
      };
      return { ok: false, label: r.untracked.name + ': no controla inventario' };
    }
    if (r.partial && r.partial.length && r.partial.length <= 8 && !/^\d{6,}$/.test(code)) {
      $('#mvNew').innerHTML = `<div class="pick">${r.partial.map(p => `<button type="button" class="btn sm" data-pick="${esc(p.id)}">${esc(p.name)}${p.sku ? ' · ' + esc(p.sku) : ''}</button>`).join('')}</div>`;
      $('#mvNew').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { addProduct(products.find(p => p.id === b.dataset.pick)); $('#mvNew').innerHTML = ''; $('#mvCode').focus(); });
      return { ok: false, label: 'Varios productos coinciden' };
    }
    if (can('products:write')) {
      $('#mvNew').innerHTML = `<form class="card pad mv-create" id="mvCreate">
        <b>Código nuevo: ${esc(code)}</b><p class="muted" style="margin:4px 0 10px">Crea el producto aquí mismo y se agrega a la lista.</p>
        <div class="form">
          <div class="wide"><label class="f">Nombre *</label><input class="input" name="name" required></div>
          <div><label class="f">Precio de venta *</label><input class="input" name="price" type="number" step="any" min="0" inputmode="decimal" required></div>
          <div><label class="f">Costo</label><input class="input" name="cost" type="number" step="any" min="0" inputmode="decimal"></div>
          <div><label class="f">Categoría</label><input class="input" name="category"></div>
          <div><label class="f">Stock mínimo</label><input class="input" name="min_stock" type="number" step="any" min="0" inputmode="decimal"></div>
        </div>
        <div class="chips" style="margin-top:10px"><button class="btn primary">Crear y agregar</button><button type="button" class="btn" id="mvCreateX">Cancelar</button></div></form>`;
      $('#mvCreateX').onclick = () => { $('#mvNew').innerHTML = ''; };
      const f = $('#mvCreate');
      setTimeout(() => f.name.focus(), 50);
      f.onsubmit = async ev => {
        ev.preventDefault(); ev.stopPropagation();
        const b = f.querySelector('button.primary'); b.disabled = true;
        try {
          const isCode = /^\d{8,14}$/.test(code);
          await api('apiSave', S.token, 'products', { kind: 'producto', name: f.name.value, price: f.price.value, cost: f.cost.value, category: f.category.value,
            min_stock: f.min_stock.value, barcode: isCode ? code : '', sku: isCode ? '' : code, track_stock: true, status: 'activo', unit: 'pieza' });
          const lk = await api('apiInventoryLookup', S.token, code);
          products.push(lk.product);
          addProduct(lk.product);
          $('#mvNew').innerHTML = '';
          $('#mvCode').focus();
          toast('Producto creado');
        } catch (e) { toast(e.message, true); b.disabled = false; }
      };
    } else {
      $('#mvNew').innerHTML = `<div class="note">Ningún producto tiene el código <b>${esc(code)}</b>.</div>`;
    }
    return { ok: false, label: 'Código no registrado: ' + code };
  };
  S.onScan = code => { if (!document.querySelector('.scanner')) handleCode(code); };

  const drawLines = flashId => {
    const box = $('#mvLines');
    if (!box) return;
    if (!st.lines.length) {
      box.innerHTML = '<div class="empty mv-empty">Escanea con la cámara o con tu lector, o escribe el nombre del producto.</div>';
    } else {
      box.innerHTML = st.lines.map((l, i) => {
        const have = onHandAt(l.p);
        return `<div class="mline ${l.id === flashId ? 'flash' : ''}" data-i="${i}">
          <div class="ml-name"><b>${esc(l.name)}</b><span class="muted sm">${esc(l.sku || '')}${l.sku ? ' · ' : ''}hay ${qtyFmt(have)}${kind === 'conteo' ? '' : ''}</span>
            ${kind === 'conteo' ? '<span class="ml-diff sm"></span>' : ''}</div>
          <div class="stepper" role="group" aria-label="Cantidad">
            <button type="button" data-d="-1" aria-label="Menos">−</button>
            <input class="input" inputmode="decimal" aria-label="${kind === 'conteo' ? 'Cantidad contada' : 'Cantidad'}" value="${esc(kind === 'conteo' ? l.counted : l.qty)}" data-f="${kind === 'conteo' ? 'counted' : 'qty'}">
            <button type="button" data-d="1" aria-label="Más">+</button>
          </div>
          ${kind === 'entrada' ? `<label class="ml-cost"><span class="muted sm">Costo c/u</span><input class="input" inputmode="decimal" value="${esc(l.unit_cost)}" data-f="unit_cost"></label>` : ''}
          <button type="button" class="ml-x" aria-label="Quitar ${esc(l.name)}">✕</button>
        </div>`;
      }).join('');
      box.querySelectorAll('.mline').forEach(row => {
        const l = st.lines[Number(row.dataset.i)];
        row.querySelectorAll('input[data-f]').forEach(inp => inp.oninput = () => { l[inp.dataset.f] = inp.value.replace(',', '.'); updateSum(); });
        row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
          const fld = kind === 'conteo' ? 'counted' : 'qty';
          let v = Number(l[fld] || 0) + Number(b.dataset.d);
          if (kind !== 'ajuste' && v < 0) v = 0;
          l[fld] = v;
          row.querySelector('input[data-f=' + fld + ']').value = v;
          updateSum();
        });
        row.querySelector('.ml-x').onclick = () => { st.lines.splice(st.lines.indexOf(l), 1); drawLines(); };
      });
    }
    updateSum();
  };

  const updateSum = () => {
    let units = 0, cost = 0, diffs = 0;
    $('#mvLines').querySelectorAll('.mline').forEach(row => {
      const l = st.lines[Number(row.dataset.i)];
      if (kind === 'conteo') {
        const el = row.querySelector('.ml-diff');
        if (l.counted === '') { el.textContent = 'Sin contar'; el.className = 'ml-diff sm muted'; return; }
        const diff = Math.round((Number(l.counted) - onHandAt(l.p)) * 100) / 100;
        if (diff) diffs++;
        el.textContent = diff === 0 ? 'Coincide' : (diff > 0 ? 'Sobran ' + qtyFmt(diff) : 'Faltan ' + qtyFmt(-diff));
        el.className = 'ml-diff sm ' + (diff === 0 ? 'pos' : 'neg');
        units += Number(l.counted || 0);
      } else {
        units += Number(l.qty || 0);
        if (kind === 'entrada' && l.unit_cost !== '') cost += Number(l.qty || 0) * Number(l.unit_cost || 0);
      }
    });
    const n = st.lines.length;
    $('#mvSum').innerHTML = n ? `<b>${n}</b> producto${n === 1 ? '' : 's'} · <b>${qtyFmt(units)}</b> unidades${kind === 'entrada' && cost ? ' · costo total <b>' + money(cost) + '</b>' : ''}${kind === 'conteo' ? ' · <b>' + diffs + '</b> con diferencia' : ''}` : '';
    const ok = $('#modalOk');
    if (ok) ok.textContent = K.save + (n ? ' (' + n + ')' : '');
  };

  const codeIn = $('#mvCode');
  codeIn.onkeydown = async ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const v = codeIn.value; codeIn.value = '';
    await handleCode(v);
  };
  codeIn.onchange = () => {
    // Elegido de la lista desplegable (sin Enter)
    const v = codeIn.value;
    const p = products.find(x => (x.name + (x.sku ? ' · ' + x.sku : '')) === v);
    if (p) { codeIn.value = ''; addProduct(p); }
  };
  $('#mvCam').onclick = () => scanCamera({ title: K.title, continuous: true, onCode: code => handleCode(code, true) });
  $('#mvLoc').onchange = () => drawLines();
  if ($('#mvAll')) $('#mvAll').onclick = () => {
    const list = S.invFilter && S.invFilter.level ? products.filter(p => p.level === S.invFilter.level) : products;
    list.slice().reverse().forEach(p => { if (!st.lines.find(l => l.id === p.id)) st.lines.unshift({ id: p.id, name: p.name, sku: p.sku, unit: p.unit, p: p, qty: 0, unit_cost: '', counted: '' }); });
    drawLines();
  };
  (preset || []).forEach(p => addProduct(p, kind === 'conteo' ? 0 : 1));
  if (preset && preset.length && kind === 'conteo') { st.lines[0].counted = ''; drawLines(); }
  drawLines();
  setTimeout(() => codeIn.focus(), 60);
}

/* ---------- Historial ---------- */

async function openHistory(q) {
  q = Object.assign({ type: '', location: '', from: '', to: '', q: '' }, q || {});
  const types = { '': 'Todos los tipos', entrada: 'Entradas', ajuste: 'Ajustes', conteo: 'Conteos', traslado: 'Traslados', venta: 'Ventas', devolucion: 'Devoluciones' };
  openModal(q.product ? 'Historial · ' + q.product : 'Historial de movimientos', `
    <div class="toolbar hist-tools">
      <input class="input" id="hQ" placeholder="Buscar producto, documento o nota" value="${esc(q.q)}">
      <select class="input" id="hType">${Object.keys(types).map(k => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${types[k]}</option>`).join('')}</select>
      <input class="input" type="date" id="hFrom" aria-label="Desde" value="${esc(q.from)}">
      <input class="input" type="date" id="hTo" aria-label="Hasta" value="${esc(q.to)}">
      <button class="btn" id="hCsv">Descargar CSV</button>
    </div>
    <div id="hList"><div class="empty">Cargando…</div></div>`, null, null, true);
  $('#modal').classList.add('hist-modal');
  let data = null, timer;
  const load = async () => {
    q.q = $('#hQ').value; q.type = $('#hType').value; q.from = $('#hFrom').value; q.to = $('#hTo').value;
    try { data = await api('apiInventoryHistory', S.token, Object.assign({}, q, { limit: 500 })); }
    catch (e) { $('#hList').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; return; }
    if (!$('#hList')) return;
    $('#hList').innerHTML = !data.rows.length ? '<div class="empty">No hay movimientos con estos filtros.</div>' :
      `<div class="card tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Movimiento</th><th class="num">Cantidad</th><th class="num">Queda</th><th>Detalle</th></tr></thead><tbody>
      ${data.rows.map(m => `<tr><td>${fmtDate(m.created_at)}</td><td><b>${esc(m.product)}</b>${m.sku ? '<div class="muted sm">' + esc(m.sku) + '</div>' : ''}</td>
        <td>${esc(m.type_label)}${m.doc ? '<div class="muted sm">' + esc(m.doc) + '</div>' : ''}</td>
        <td class="num"><b class="${m.qty < 0 ? 'neg' : 'pos'}">${m.qty > 0 ? '+' : ''}${qtyFmt(m.qty)}</b></td>
        <td class="num">${m.qty_after === '' ? '' : qtyFmt(m.qty_after)}</td>
        <td><span class="sm">${esc([m.location !== 'principal' ? locName(m.location) : '', m.reason, m.notes, m.user].filter(String).join(' · '))}</span></td></tr>`).join('')}
      </tbody></table></div>${data.total > data.rows.length ? '<p class="muted">Mostrando ' + data.rows.length + ' de ' + data.total + '. Usa los filtros para acotar.</p>' : ''}`;
  };
  $('#hQ').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 350); };
  ['#hType', '#hFrom', '#hTo'].forEach(s => { $(s).onchange = load; });
  $('#hCsv').onclick = async () => {
    const all = await api('apiInventoryHistory', S.token, Object.assign({}, q, { limit: 5000 }));
    const head = ['Fecha', 'Producto', 'SKU', 'Movimiento', 'Documento', 'Ubicación', 'Cantidad', 'Queda', 'Costo unitario', 'Motivo', 'Nota', 'Usuario'];
    const cell = v => { const s = String(v === undefined || v === null ? '' : v); return /[",\n;]/.test(s) || /^[=+\-@]/.test(s) ? '"' + s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""') + '"' : s; };
    const lines = [head.join(',')].concat(all.rows.map(m => [new Date(m.created_at).toLocaleString('es'), m.product, m.sku, m.type_label, m.doc, locName(m.location), m.qty, m.qty_after, m.unit_cost, m.reason, m.notes, m.user].map(cell).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'movimientos-inventario-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };
  load();
}

const LABEL_FORMATS = {
  carta30: { name: 'Hoja carta · 30 por hoja (Avery 5160)', page: '8.5in 11in', w: 2.625, h: 1, unit: 'in', cols: 3, rows: 10, top: 0.5, left: 0.1875, gapX: 0.125, gapY: 0 },
  a4_24: { name: 'Hoja A4 · 24 por hoja (70 × 37 mm)', page: '210mm 297mm', w: 70, h: 37, unit: 'mm', cols: 3, rows: 8, top: 0.5, left: 0, gapX: 0, gapY: 0 },
  rollo50: { name: 'Rollo · 50 × 25 mm (impresora de etiquetas)', page: '50mm 25mm', w: 50, h: 25, unit: 'mm', cols: 1, rows: 1, top: 0, left: 0, gapX: 0, gapY: 0 },
  rollo57: { name: 'Rollo · 57 × 32 mm (2¼ × 1¼ in)', page: '57mm 32mm', w: 57, h: 32, unit: 'mm', cols: 1, rows: 1, top: 0, left: 0, gapX: 0, gapY: 0 },
};

async function openLabels(ids) {
  openModal('Imprimir etiquetas', '<div class="empty">Cargando productos…</div>', null, null, true);
  let all;
  try { all = (await api('apiList', S.token, 'products')).filter(p => p.kind === 'producto' && p.status !== 'inactivo'); }
  catch (e) { $('#modal .body').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; return; }
  const pre = ids && ids.length ? new Set(ids) : null;
  const st = {
    fmt: localStorage.getItem('nx_label_fmt') || 'carta30', type: localStorage.getItem('nx_label_type') || 'barcode', price: localStorage.getItem('nx_label_price') !== '0',
    copies: {},
  };
  all.forEach(p => { st.copies[p.id] = pre ? (pre.has(p.id) ? 1 : 0) : 0; });
  const codeOf = p => String(p.barcode || p.sku || '').trim();
  const draw = () => {
    const missing = all.filter(p => st.copies[p.id] > 0 && !codeOf(p));
    const total = all.reduce((s, p) => s + (codeOf(p) ? Number(st.copies[p.id] || 0) : 0), 0);
    $('#modal .body').innerHTML = `
      <div class="form lb-opts">
        <div><label class="f">Formato</label><select class="input" id="lbFmt">${Object.keys(LABEL_FORMATS).map(k => `<option value="${k}" ${st.fmt === k ? 'selected' : ''}>${LABEL_FORMATS[k].name}</option>`).join('')}</select></div>
        <div><label class="f">Código</label><select class="input" id="lbType"><option value="barcode" ${st.type === 'barcode' ? 'selected' : ''}>Código de barras</option><option value="qr" ${st.type === 'qr' ? 'selected' : ''}>Código QR</option></select></div>
        <div class="check"><input type="checkbox" id="lbPrice" ${st.price ? 'checked' : ''}><label for="lbPrice">Mostrar precio</label></div>
      </div>
      <div class="lb-bar">
        <input class="input" id="lbQ" placeholder="Filtrar productos…" autocomplete="off">
        <button type="button" class="btn sm" id="lbStock">Una por unidad en existencia</button>
        <button type="button" class="btn sm" id="lbOne">Una de cada</button>
        <button type="button" class="btn sm" id="lbNone">Ninguna</button>
      </div>
      ${missing.length ? `<div class="note">${missing.length} producto(s) elegidos no tienen código ni SKU. ${can('products:write') ? '<button type="button" class="btn sm" id="lbGen">Generar códigos de barras</button>' : 'Pide a un administrador que les asigne uno.'}</div>` : ''}
      <div class="lb-list">${all.map(p => `<div class="lb-row" data-name="${esc((p.name + ' ' + (p.sku || '') + ' ' + (p.barcode || '')).toLowerCase())}">
          <span><b>${esc(p.name)}</b><span class="muted sm">${esc(codeOf(p) || 'Sin código')}${p.stock !== '' && p.stock !== undefined ? ' · hay ' + qtyFmt(p.stock) : ''}</span></span>
          <div class="stepper sm" role="group" aria-label="Copias de ${esc(p.name)}"><button type="button" data-d="-1" data-id="${esc(p.id)}" aria-label="Menos">−</button><input class="input" inputmode="numeric" value="${st.copies[p.id]}" data-id="${esc(p.id)}" aria-label="Copias"><button type="button" data-d="1" data-id="${esc(p.id)}" aria-label="Más">+</button></div>
        </div>`).join('')}</div>
      <div class="lb-foot"><div class="lb-preview" id="lbPrev"></div>
        <div><div class="muted" id="lbCount"><b>${total}</b> etiqueta(s)${pagesFor(total) ? ' · ' + pagesFor(total) + ' hoja(s)' : ''}</div>
        <button class="btn primary" id="lbPrint" ${total ? '' : 'disabled'}>Imprimir ${total || ''}</button></div></div>`;
    const sample = all.find(p => st.copies[p.id] > 0 && codeOf(p)) || all.find(codeOf);
    $('#lbPrev').innerHTML = sample ? labelHtml(sample, st, true) : '';
    bind();
  };
  const pagesFor = n => { const f = LABEL_FORMATS[st.fmt]; return f.cols * f.rows > 1 ? Math.ceil(n / (f.cols * f.rows)) : 0; };
  const refreshCount = () => {
    const total = all.reduce((s, p) => s + (codeOf(p) ? Number(st.copies[p.id] || 0) : 0), 0);
    $('#lbCount').innerHTML = `<b>${total}</b> etiqueta(s)${pagesFor(total) ? ' · ' + pagesFor(total) + ' hoja(s)' : ''}`;
    $('#lbPrint').disabled = !total; $('#lbPrint').textContent = 'Imprimir ' + (total || '');
  };
  const bind = () => {
    const body = $('#modal .body');
    $('#lbFmt').onchange = ev => { st.fmt = ev.target.value; localStorage.setItem('nx_label_fmt', st.fmt); draw(); };
    $('#lbType').onchange = ev => { st.type = ev.target.value; localStorage.setItem('nx_label_type', st.type); draw(); };
    $('#lbPrice').onchange = ev => { st.price = ev.target.checked; localStorage.setItem('nx_label_price', st.price ? '1' : '0'); draw(); };
    $('#lbQ').oninput = ev => { const t = ev.target.value.toLowerCase(); body.querySelectorAll('.lb-row').forEach(r => { r.hidden = t && r.dataset.name.indexOf(t) < 0; }); };
    const visible = () => all.filter(p => { const r = body.querySelector('.lb-row[data-name="' + CSS.escape((p.name + ' ' + (p.sku || '') + ' ' + (p.barcode || '')).toLowerCase()) + '"]'); return !r || !r.hidden; });
    $('#lbStock').onclick = () => { visible().forEach(p => { st.copies[p.id] = Math.max(0, Math.ceil(Number(p.stock || 0))); }); draw(); };
    $('#lbOne').onclick = () => { visible().forEach(p => { st.copies[p.id] = 1; }); draw(); };
    $('#lbNone').onclick = () => { all.forEach(p => { st.copies[p.id] = 0; }); draw(); };
    body.querySelectorAll('.lb-row input').forEach(inp => inp.oninput = () => { st.copies[inp.dataset.id] = Math.max(0, Math.min(999, parseInt(inp.value, 10) || 0)); refreshCount(); });
    body.querySelectorAll('.lb-row [data-d]').forEach(b => b.onclick = () => {
      const id = b.dataset.id; st.copies[id] = Math.max(0, Math.min(999, (st.copies[id] || 0) + Number(b.dataset.d)));
      b.parentNode.querySelector('input').value = st.copies[id]; refreshCount();
    });
    if ($('#lbGen')) $('#lbGen').onclick = async ev => {
      ev.target.disabled = true;
      try {
        const r = await api('apiInventoryAssignCodes', S.token, all.filter(p => st.copies[p.id] > 0 && !codeOf(p)).map(p => p.id));
        r.items.forEach(it => { const p = all.find(x => x.id === it.id); if (p) p.barcode = it.barcode; });
        toast(r.assigned + ' código(s) generados'); draw();
      } catch (e) { toast(e.message, true); ev.target.disabled = false; }
    };
    $('#lbPrint').onclick = () => printLabels(all, st);
  };
  draw();
}

function labelHtml(p, st, preview) {
  const code = String(p.barcode || p.sku || '').trim();
  const f = LABEL_FORMATS[st.fmt];
  const style = preview ? `style="width:${f.w}${f.unit};height:${f.h}${f.unit}"` : '';
  const graphic = st.type === 'qr' ? qrSvg(code, '100%') : barcodeSvg(code, { stretch: true });
  return `<div class="label ${st.type}" ${style}>
    <div class="lb-name">${esc(p.name)}</div>
    <div class="lb-code">${graphic}</div>
    <div class="lb-meta"><span>${esc(code)}</span>${st.price ? '<b>' + esc(money(p.price)) + '</b>' : ''}</div>
  </div>`;
}

function printLabels(all, st) {
  const f = LABEL_FORMATS[st.fmt];
  const list = [];
  all.forEach(p => { const n = String(p.barcode || p.sku || '').trim() ? Number(st.copies[p.id] || 0) : 0; for (let i = 0; i < n; i++) list.push(p); });
  if (!list.length) return;
  const per = f.cols * f.rows, u = f.unit;
  let html = '';
  for (let i = 0; i < list.length; i += per) {
    html += `<div class="lb-page" style="width:${f.page.split(' ')[0]};height:${f.page.split(' ')[1]};padding:${f.top}${u} 0 0 ${f.left}${u};grid-template-columns:repeat(${f.cols}, ${f.w}${u});grid-auto-rows:${f.h}${u};column-gap:${f.gapX}${u};row-gap:${f.gapY}${u}">
      ${list.slice(i, i + per).map(p => labelHtml(p, st)).join('')}</div>`;
  }
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  area.className = 'fmt-' + st.fmt + (f.unit === 'mm' && f.h <= 32 ? ' small' : '');
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  ps.textContent = '@page { size: ' + f.page + '; margin: 0; }';
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ============================ Punto de venta (POS) ============================ */

const POS = { cat: null, cart: null, filter: { q: '', category: '' }, last: null };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const newRef = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const store2 = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
                 set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* privado */ } } };

function emptyCart() { return { items: [], discount: 0, customer: null, notes: '', ref: newRef() }; }

/** Mismo cálculo que el servidor (Pos.price): el servidor vuelve a calcular y manda. */
function posTotals() {
  const st = POS.cat.settings, c = POS.cart;
  const lines = c.items.map(it => {
    const p = POS.byId[it.product_id];
    const rate = (p.tax_rate === null ? st.tax_rate : p.tax_rate) / 100;
    const unit = it.price === undefined || it.price === '' ? p.price : Number(it.price);
    return { it: it, p: p, unit: unit, qty: Number(it.qty), disc: r2(it.discount || 0), rate: rate };
  });
  const orderDisc = r2(c.discount || 0);
  const gross = r2(lines.reduce((a, l) => a + l.unit * l.qty - l.disc, 0));
  let left = orderDisc;
  lines.forEach((l, i) => {
    const base = l.unit * l.qty - l.disc;
    const share = i === lines.length - 1 ? left : r2(gross ? orderDisc * base / gross : 0);
    l.disc = r2(l.disc + share); left = r2(left - share);
  });
  lines.forEach(l => {
    const net = r2(l.unit * l.qty - l.disc);
    if (st.prices_include_tax) { l.tax = r2(net - net / (1 + l.rate)); l.total = net; }
    else { l.tax = r2(net * l.rate); l.total = r2(net + l.tax); }
  });
  const total = r2(lines.reduce((a, l) => a + l.total, 0)), tax = r2(lines.reduce((a, l) => a + l.tax, 0));
  return { lines: lines, total: total, tax: tax, subtotal: r2(total - tax), discount: r2(lines.reduce((a, l) => a + l.disc, 0)),
           units: lines.reduce((a, l) => a + l.qty, 0) };
}

const pm = v => moneyIn(v, POS.cat ? POS.cat.settings.currency : undefined);

async function viewPos() {
  const main = $('#main');
  if (!POS.cat) main.innerHTML = '<div id="posBody"><div class="empty">Cargando punto de venta…</div></div>';
  try {
    if (S.offline && !navigator.onLine) throw netError();
    const fresh = await apiT(20000, 'apiPosCatalog', S.token);
    POS.offline = false; S.offline = false;
    OFF.save('poscat', fresh);
    // Lo vendido sin conexión que aún no llega al servidor sigue descontado en pantalla.
    OFF.queue().forEach(x => (x.payload.items || []).forEach(i => {
      const p = fresh.products.find(q => q.id === i.product_id);
      if (p && p.tracked) p.stock = r2(p.stock - Number(i.qty));
    }));
    POS.cat = fresh;
    setTimeout(posSync, 300);
  } catch (e) {
    const cached = isNet(e) ? OFF.load('poscat', null) : null;
    if (!cached) {
      if (S.view !== 'pos') return;
      $('#main').innerHTML = '<div class="card empty">' + esc(e.message) +
        (isNet(e) ? '<br><span class="muted">Para vender sin internet, abre el punto de venta una vez con conexión en este dispositivo: así queda guardado el catálogo.</span>' : '') + '</div>';
      return;
    }
    POS.cat = cached; POS.offline = true;
  }
  POS.byId = {};
  POS.cat.products.forEach(p => { POS.byId[p.id] = p; });
  if (!POS.cart) POS.cart = emptyCart();
  POS.cart.items = POS.cart.items.filter(i => POS.byId[i.product_id]);
  if (S.view !== 'pos') return;
  if (!POS.cat.session) {
    if (POS.offline) { $('#main').innerHTML = pageHeader('Punto de venta') + '<div class="card empty">Sin conexión. Necesitas internet para <b>abrir la caja</b>; después puedes vender aunque se vaya la señal.</div>'; return; }
    return drawPosOpen();
  }
  drawPos();
  S.onScan = code => { if (S.view === 'pos' && !$('#modal') && !document.querySelector('.scanner')) posAddByCode(code); };
}

    <div class="pos">

  } });

function posVisible() {
  const t = POS.filter.q.trim().toLowerCase(), cat = POS.filter.category;
  return POS.cat.products.filter(p => (!cat || p.category === cat) &&
    (!t || (p.name + ' ' + p.sku + ' ' + p.barcode + ' ' + p.category).toLowerCase().indexOf(t) >= 0));
}

function initials(name) {
  return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function hue(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }

function drawPosGrid() {
  const list = posVisible();
  const box = $('#posGrid');
  if (!box) return;
  if (!POS.cat.products.length) { box.innerHTML = '<div class="empty">No hay productos activos. Créalos en <b>Productos y servicios</b>.</div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="empty">Ningún producto coincide.</div>'; return; }
  box.innerHTML = list.map(p => {
    const inCart = POS.cart.items.find(i => i.product_id === p.id);
    const out = p.tracked && p.stock <= 0;
    return `<button class="pos-tile ${out ? 'out' : ''}" data-id="${esc(p.id)}" style="--h:${hue(p.category || p.name)}">
      <span class="pt-ini" aria-hidden="true">${esc(initials(p.name))}</span>
      ${inCart ? `<span class="pt-n" aria-label="${inCart.qty} en el carrito">${qtyFmt(inCart.qty)}</span>` : ''}
      <span class="pt-name">${esc(p.name)}</span>
      <span class="pt-foot"><b>${esc(pm(p.price))}</b>${p.tracked ? `<span class="pt-stock ${out ? 'neg' : p.stock <= 3 ? 'warn' : ''}">${out ? 'Agotado' : qtyFmt(p.stock) + ' disp.'}</span>` : ''}</span>
    </button>`;
  }).join('');
  box.querySelectorAll('.pos-tile').forEach(b => b.onclick = () => posAdd(POS.byId[b.dataset.id]));
}

function posAdd(p, qty) {
  if (!p) return;
  const it = POS.cart.items.find(i => i.product_id === p.id);
  if (it) it.qty = r2(Number(it.qty) + (qty || 1));
  else POS.cart.items.push({ product_id: p.id, qty: qty || 1 });
  if (p.tracked) {
    const n = POS.cart.items.find(i => i.product_id === p.id).qty;
    if (n > p.stock) toast(p.name + ': solo hay ' + qtyFmt(p.stock) + ' en ' + locName(POS.cat.session.location) + '. Puedes venderlo igual; el inventario quedará en negativo.', true);
  }
  drawPosGrid(); drawPosCart(p.id);
}

function posAddByCode(code, quiet) {
  const p = findLocal(POS.cat.products, code);
  if (!p) { if (!quiet) { beep(false); toast('Código no registrado: ' + code, true); } return false; }
  beep(true); posAdd(p); return true;
}
