  if ($('#pcDisc')) $('#pcDisc').onclick = () => {
    openModal('Descuento general', `<form class="form" id="dForm"><div class="wide"><label class="f">Monto a descontar del total</label>
      <input class="input pos-money" name="amount" inputmode="decimal" value="${c.discount ? esc(c.discount) : ''}" placeholder="0.00"></div>
      <div class="wide chips">${[5, 10, 15, 20].map(p => `<button type="button" class="btn sm" data-pct="${p}">${p} %</button>`).join('')}</div></form>`, async () => {
      const v = r2(Number($('#dForm').amount.value.replace(',', '.')) || 0);
      const gross = r2(c.items.reduce((a, it) => { const p = POS.byId[it.product_id]; return a + (it.price === undefined || it.price === '' ? p.price : Number(it.price)) * it.qty - r2(it.discount || 0); }, 0));
      if (v < 0 || v > gross) throw new Error('El descuento no puede ser mayor que ' + pm(gross) + '.');
      c.discount = v; drawPosCart();
    }, 'Aplicar');
    document.querySelectorAll('[data-pct]').forEach(b => b.onclick = () => {
      const gross = c.items.reduce((a, it) => { const p = POS.byId[it.product_id]; return a + (it.price === undefined || it.price === '' ? p.price : Number(it.price)) * it.qty - r2(it.discount || 0); }, 0);
      $('#dForm').amount.value = r2(gross * Number(b.dataset.pct) / 100).toFixed(2);
    });
  };
  $('#pcNote').onclick = () => openModal('Nota de la venta', `<textarea class="input" id="nText" rows="3" maxlength="400">${esc(c.notes)}</textarea>`, async () => { c.notes = $('#nText').value.trim(); drawPosCart(); }, 'Guardar');
  $('#pcClear').onclick = () => { if (confirm('¿Vaciar el carrito?')) { POS.cart = emptyCart(); drawPosCart(); drawPosGrid(); } };
  $('#pcPay').onclick = openPayment;
}

function editPosLine(l) {
  const can = POS.cat.can_discount;
  openModal(l.p.name, `<form class="form" id="lForm">
      <div><label class="f">Cantidad</label><input class="input" name="qty" inputmode="decimal" value="${esc(qtyFmt(l.qty))}"></div>
      ${can ? `<div><label class="f">Precio unitario</label><input class="input" name="price" inputmode="decimal" value="${esc(l.unit)}"><div class="hint">Catálogo: ${esc(pm(l.p.price))}</div></div>
      <div class="wide"><label class="f">Descuento en esta línea (monto)</label><input class="input" name="discount" inputmode="decimal" value="${l.it.discount ? esc(l.it.discount) : ''}" placeholder="0.00"></div>` : '<p class="muted wide">Para cambiar precios o dar descuentos pide a un gerente.</p>'}
    </form><button type="button" class="btn danger" id="lDel" style="margin-top:12px">Quitar del carrito</button>`, async () => {
    const f = $('#lForm');
    const qty = Number(f.qty.value.replace(',', '.'));
    if (!(qty > 0)) throw new Error('La cantidad debe ser mayor que 0.');
    l.it.qty = l.p.kind === 'producto' ? Math.round(qty) : qty;
    if (can) {
      const price = Number(f.price.value.replace(',', '.'));
      if (!(price >= 0)) throw new Error('Precio no válido.');
      l.it.price = r2(price) === r2(l.p.price) ? undefined : r2(price);
      const d = r2(Number((f.discount.value || '0').replace(',', '.')) || 0);
      if (d < 0 || d > r2(price * l.it.qty)) throw new Error('Descuento no válido.');
      l.it.discount = d || undefined;
    }
    drawPosCart(); drawPosGrid();
  }, 'Guardar');
  $('#lDel').onclick = () => { POS.cart.items.splice(POS.cart.items.indexOf(l.it), 1); closeModal(true); drawPosCart(); drawPosGrid(); };
}

function pickCustomer() {
  openModal('Cliente', `
    <input class="input" id="cQ" placeholder="Buscar por nombre, teléfono, correo o NIT…" autocomplete="off">
    <div id="cList" class="c-list"></div>
    <details class="c-new"><summary>Cliente nuevo</summary>
      <form class="form" id="cForm" style="margin-top:10px">
        <div class="wide"><label class="f">Nombre</label><input class="input" name="name"></div>
        <div><label class="f">Teléfono / WhatsApp</label><input class="input" name="phone" type="tel" inputmode="tel"></div>
        <div><label class="f">Correo</label><input class="input" name="email" type="email" inputmode="email"></div>
        <div class="wide"><label class="f">NIT / DUI / Tax ID</label><input class="input" name="tax_id"></div>
      </form><button type="button" class="btn primary" id="cUse" style="margin-top:10px">Usar este cliente</button></details>
    <div style="margin-top:12px"><button type="button" class="btn" id="cNone">Consumidor final</button></div>`, null);
  let timer;
  const choose = c => { POS.cart.customer = c; closeModal(true); drawPosCart(); };
  $('#cQ').oninput = () => {
    clearTimeout(timer);
    const v = $('#cQ').value.trim();
    if (v.length < 2) { $('#cList').innerHTML = ''; return; }
    timer = setTimeout(async () => {
      try {
        const rows = await api('apiPosCustomers', S.token, v);
        if (!$('#cList')) return;
        $('#cList').innerHTML = rows.length ? rows.map((c, i) => `<button class="c-row" data-i="${i}"><b>${esc(c.name)}</b><span class="muted sm">${esc([c.phone, c.email, c.tax_id].filter(Boolean).join(' · '))}</span></button>`).join('')
          : '<p class="muted">Sin resultados. Usa "Cliente nuevo".</p>';
        $('#cList').querySelectorAll('[data-i]').forEach(b => b.onclick = () => choose(rows[Number(b.dataset.i)]));
      } catch (e) { toast(e.message, true); }
    }, 300);
  };
  $('#cUse').onclick = () => {
    const f = $('#cForm');
    const c = { name: f.name.value.trim(), phone: f.phone.value.trim(), email: f.email.value.trim(), tax_id: f.tax_id.value.trim() };
    if (!c.name && !c.phone && !c.email) { toast('Escribe al menos el nombre, teléfono o correo.', true); return; }
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) { toast('Revisa el correo.', true); return; }
    choose(c);
  };
  $('#cNone').onclick = () => choose(null);
  setTimeout(() => $('#cQ') && $('#cQ').focus(), 50);
}

/* ---------- Cobro ---------- */

function cartPayload() {
  const c = POS.cart;
  return {
    client_ref: c.ref, notes: c.notes, discount: c.discount || 0,
    items: c.items.map(i => ({ product_id: i.product_id, qty: i.qty, price: i.price, discount: i.discount })),
    customer_id: c.customer && c.customer.id ? c.customer.id : undefined,
    customer: c.customer && !c.customer.id ? c.customer : undefined,
  };
}

function receiptBase() {
  if (ON_GOOGLE) return '';
  return new URL('recibo.html', location.href).href.split('?')[0] + '?t=';
}
function receiptUrl(token) {
  return ON_GOOGLE ? (POS.cat.web_app_url || '') + '?action=receipt&t=' + token : receiptBase() + token;
}

function openPayment() {
  const t = posTotals();
  const M = POS.cat.methods;
  const pays = [];
  const remaining = () => r2(t.total - pays.reduce((a, p) => a + p.amount, 0));
  const methods = ['efectivo', 'tarjeta', 'transferencia', 'wompi', 'n1co', 'otro'];
  const offline = POS.offline || !navigator.onLine;
  openModal('Cobrar', `
    ${offline ? '<div class="note off-note">Sin conexión: la venta se guarda en este dispositivo y se envía sola cuando vuelva la señal.</div>' : ''}
    <div class="pay-total"><span class="muted">Total</span><b>${esc(pm(t.total))}</b><span class="muted" id="payLeft"></span></div>
    <div class="pay-methods" role="tablist">${methods.map(m => `<button type="button" class="btn ${m === 'efectivo' ? 'primary' : ''}" data-m="${m}">${esc(M[m])}</button>`).join('')}
      ${POS.cat.stripe_qr && !offline ? `<button type="button" class="btn" data-m="stripe_qr">QR Stripe${POS.cat.stripe_qr.mode === 'test' ? ' (prueba)' : ''}</button>` : ''}</div>
    <div id="payPanel"></div>
    <div id="payList"></div>`, async () => {
    if (remaining() > 0.009) throw new Error('Falta cobrar ' + pm(remaining()) + '.');
    const payload = Object.assign(cartPayload(), { payments: pays.map(p => ({ method: p.method, amount: p.amount, tendered: p.tendered, reference: p.reference })) });
    let r;
    if (POS.offline || !navigator.onLine) r = posQueueSale(payload, t, pays);
    else {
      try { r = await apiT(20000, 'apiPosCheckout', S.token, payload); r.ref = payload.client_ref; }
      catch (e) {
        if (!isNet(e)) throw e;
        // Se cayó la señal al cobrar: se guarda; si el servidor sí la alcanzó a registrar, no se duplica (mismo identificador).
        POS.offline = true; r = posQueueSale(payload, t, pays);
      }
    }
    posFinished(r, true);
  }, 'Finalizar venta', true);
  const ok = $('#modalOk');
  let method = 'efectivo';
  const drawList = () => {
    const left = remaining();
    $('#payLeft').innerHTML = pays.length ? (left > 0 ? 'Falta <b>' + esc(pm(left)) + '</b>' : '<b class="pos">Completo</b>') : '';
    $('#payList').innerHTML = pays.length ? `<ul class="list pay-list">${pays.map((p, i) => `<li><span>${esc(M[p.method])}${p.reference ? ' <span class="muted sm">' + esc(p.reference) + '</span>' : ''}${p.method === 'efectivo' && p.tendered > p.amount ? '<br><span class="muted sm">Recibido ' + esc(pm(p.tendered)) + ' · cambio ' + esc(pm(p.tendered - p.amount)) + '</span>' : ''}</span>
      <span><b>${esc(pm(p.amount))}</b> <button type="button" class="ml-x" data-x="${i}" aria-label="Quitar pago">✕</button></span></li>`).join('')}</ul>` : '';
    $('#payList').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { pays.splice(Number(b.dataset.x), 1); drawList(); drawPanel(); });
    ok.disabled = left > 0.009;
    ok.textContent = left > 0.009 ? 'Falta ' + pm(left) : 'Finalizar venta';
  };
  const add = p => { pays.push(p); drawList(); drawPanel(); };
  const drawPanel = () => {
    const left = remaining();
    document.querySelectorAll('[data-m]').forEach(b => { b.classList.toggle('primary', b.dataset.m === method); b.disabled = left <= 0.009 && b.dataset.m !== method; });
    const qr = document.querySelector('[data-m=stripe_qr]');
    if (qr) qr.disabled = pays.length > 0;
    const panel = $('#payPanel');
    if (left <= 0.009) { panel.innerHTML = ''; return; }
    if (method === 'efectivo') {
      const opts = [left].concat([1, 5, 10, 20, 50, 100].map(b => Math.ceil(left / b) * b)).filter((v, i, a) => a.indexOf(v) === i && v >= left).slice(0, 5);
      panel.innerHTML = `<label class="f">Efectivo recibido</label>
        <div class="cash-row"><input class="input pos-money" id="cashIn" inputmode="decimal" value="${left.toFixed(2)}"><button type="button" class="btn primary" id="cashAdd">Aplicar</button></div>
        <div class="chips cash-quick">${opts.map((v, i) => `<button type="button" class="btn" data-q="${v}">${i === 0 ? 'Exacto' : esc(pm(v))}</button>`).join('')}</div>
        <div class="change" id="chg"></div>`;
      const inp = $('#cashIn');
      const showChange = () => { const v = Number(inp.value.replace(',', '.')) || 0; $('#chg').innerHTML = v >= left ? 'Cambio: <b>' + esc(pm(r2(v - left))) + '</b>' : v > 0 ? 'Abono parcial en efectivo: ' + esc(pm(v)) : ''; };
      inp.oninput = showChange; showChange();
      const apply = v => {
        v = r2(v);
        if (!(v > 0)) { toast('Escribe cuánto recibiste.', true); return; }
        add({ method: 'efectivo', amount: Math.min(v, left), tendered: v });
      };
      $('#cashAdd').onclick = () => apply(Number(inp.value.replace(',', '.')));
      inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); apply(Number(inp.value.replace(',', '.'))); } };
      panel.querySelectorAll('[data-q]').forEach(b => b.onclick = () => apply(Number(b.dataset.q)));
      setTimeout(() => inp.select(), 30);
    } else if (method === 'stripe_qr') {
      panel.innerHTML = `<p class="muted">Se crea un cobro de Stripe por <b>${esc(pm(t.total))}</b> y se muestra un QR. El cliente lo escanea con su teléfono y paga; la venta se confirma sola.</p>
        <button type="button" class="btn primary pos-big" id="qrGo">Mostrar QR de pago</button>`;
      $('#qrGo').onclick = () => startStripeQr(t);
    } else {
      const refLabel = { tarjeta: 'Número de aprobación (opcional)', transferencia: 'Referencia de la transferencia', wompi: 'ID de la transacción de Wompi', n1co: 'ID de la transacción de N1co', otro: 'Detalle' }[method];
      panel.innerHTML = `<div class="form">
          <div><label class="f">Monto</label><input class="input pos-money" id="pAmt" inputmode="decimal" value="${left.toFixed(2)}"></div>
          <div><label class="f">${esc(refLabel)}</label><input class="input" id="pRef" maxlength="80"></div></div>
        ${method === 'wompi' || method === 'n1co' ? '<p class="muted sm">Cobra con el enlace o QR de ' + esc(M[method]) + ' y confirma aquí cuando veas el pago aprobado.</p>' : ''}
        ${method === 'tarjeta' ? '<p class="muted sm">Pasa la tarjeta en tu terminal; cuando salga aprobada, confirma aquí.</p>' : ''}
        <button type="button" class="btn primary" id="pAdd" style="margin-top:10px">Confirmar ${esc(M[method])}</button>`;
      $('#pAdd').onclick = () => {
        const v = r2(Number($('#pAmt').value.replace(',', '.')));
        if (!(v > 0)) { toast('Escribe el monto.', true); return; }
        if (v > left + 0.009) { toast('El monto es mayor que lo que falta (' + pm(left) + ').', true); return; }
        if (method === 'transferencia' && !$('#pRef').value.trim()) { toast('Escribe la referencia de la transferencia.', true); return; }
        add({ method: method, amount: v, reference: $('#pRef').value.trim() });
      };
    }
  };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; drawPanel(); });
  drawPanel(); drawList();
}

async function startStripeQr(t) {
  let pend;
  try { pend = await api('apiPosStripeQr', S.token, Object.assign(cartPayload(), { receipt_base: receiptBase() })); }
  catch (e) { toast(e.message, true); return; }
  if (pend.status === 'pagada') return posFinished(pend);
  let alive = true, timer = null;
  openModal('Paga con tu teléfono', `
    <div class="qr-pay">
      <div class="qr-box">${qrSvg(pend.url, 'min(72vw, 300px)')}</div>
      <div><div class="pay-total"><span class="muted">Total</span><b>${esc(pm(pend.total))}</b></div>
        ${pend.is_test ? '<p><span class="tag prueba">PRUEBA</span> Usa la tarjeta 4242 4242 4242 4242.</p>' : ''}
        <p class="muted">El cliente escanea el código con la cámara, paga en la página segura de Stripe y esta pantalla se actualiza sola.</p>
        <p class="qr-wait" aria-live="polite"><span class="dot-pulse" aria-hidden="true"></span> Esperando el pago… <span class="muted sm">${esc(pend.number)}</span></p>
        <button type="button" class="btn danger" id="qrCancel">Cancelar cobro</button></div>
    </div>`, null, null, true);
  const modal = $('#modal');
  modal._guard = () => !alive || confirm('Si cierras, el cobro sigue abierto en Stripe hasta que lo canceles o expire (30 min). ¿Cerrar de todos modos?');
  modal._onClose = () => { alive = false; clearTimeout(timer); };
  const poll = async () => {
    if (!alive) return;
    try {
      const st = await api('apiPosSaleStatus', S.token, pend.id);
      if (!alive) return;
      if (st.status === 'pagada') { alive = false; beep(true); closeModal(true); posFinished(st, true); return; }
      if (st.status === 'cancelada') { alive = false; closeModal(true); toast('El cobro con QR se canceló.', true); return; }
    } catch (e) { /* reintenta */ }
    timer = setTimeout(poll, 3000);
  };
  timer = setTimeout(poll, 3000);
  $('#qrCancel').onclick = async () => {
    const b = $('#qrCancel'); b.disabled = true;
    try {
      const r = await api('apiPosCancelPending', S.token, pend.id);
      alive = false; closeModal(true);
      if (r.status === 'pagada') { posFinished(r); return; }
      toast('Cobro cancelado. El carrito sigue listo.');
      POS.cart.ref = newRef();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  };
}

function posFinished(r, fresh) {
  POS.last = r;
  POS.cart = emptyCart();
  document.body.classList.remove('cart-open');
  swrClear();
  // Después de que se cierre la ventana de cobro (si no, se cerraría también la del recibo).
  setTimeout(() => viewPos().then(() => showPosDone(r, fresh !== false)), 0);
}

/* ---------- Venta terminada: recibo ---------- */

function showPosDone(r, fresh) {
  const rc = r.receipt;
  const link = r.token ? receiptUrl(r.token) : '';
  const phone = r.customer && r.customer.phone ? r.customer.phone : '';
  const email = r.customer && r.customer.email ? r.customer.email : '';
  const fmt = store2.get('nx_receipt_fmt', '80');
  const cfg = PRN.cfg(), direct = cfg.conn !== 'system';
  openModal('Venta ' + r.number + (r.offline ? ' · sin enviar' : ''), `
    <div class="done-head">
      ${r.change > 0 ? `<div class="change-big"><span class="muted">Cambio</span><b>${esc(pm(r.change))}</b></div>` : `<div class="change-big ok"><span class="muted">Pagado</span><b>${esc(pm(rc.total))}</b></div>`}
      ${rc.is_test ? '<span class="tag prueba">PRUEBA</span>' : ''}
    </div>
    ${r.offline ? '<div class="note off-note">Venta guardada en este dispositivo. Se envía sola al sistema cuando vuelva la señal; ahí recibe su número definitivo y el enlace del recibo.</div>' : ''}
    <div class="done-grid">
      <div class="rc-preview" aria-label="Vista previa del recibo">${receiptHtml(rc, '80', link)}</div>
      <div class="done-acts">
        <label class="f">Imprimir</label>
        ${direct ? `<div class="cash-row"><button type="button" class="btn primary" id="rcDirect" style="flex:1">${ICONS.printer} Imprimir ticket</button><button type="button" class="btn" id="rcPrnCfg" aria-label="Ajustes de impresora">Ajustes</button></div>
          <div class="hint" id="rcPrnState" aria-live="polite">${esc(PRN.label())}</div>
          <a href="#" id="rcSystem" class="hint">Imprimir con el diálogo del navegador</a>`
        : `<div class="cash-row"><select class="input" id="rcFmt"><option value="58" ${fmt === '58' ? 'selected' : ''}>Ticket 58 mm</option><option value="80" ${fmt === '80' ? 'selected' : ''}>Ticket 80 mm</option><option value="carta" ${fmt === 'carta' ? 'selected' : ''}>Hoja carta</option></select>
          <button type="button" class="btn primary" id="rcPrint">Imprimir</button></div>
          <a href="#" id="rcPrnCfg" class="hint">Conectar una impresora térmica (Bluetooth o USB)</a>`}
        ${link ? `<label class="f" style="margin-top:12px">WhatsApp</label>
        <div class="cash-row"><input class="input" id="rcPhone" type="tel" inputmode="tel" placeholder="7123 4567" value="${esc(phone)}"><button type="button" class="btn" id="rcWa">Enviar</button></div>
        <label class="f" style="margin-top:12px">Correo</label>
        <div class="cash-row"><input class="input" id="rcMail" type="email" inputmode="email" placeholder="cliente@correo.com" value="${esc(email)}"><button type="button" class="btn" id="rcMailGo">Enviar</button></div>
        <div class="chips" style="margin-top:12px"><button type="button" class="btn" id="rcQr">Mostrar QR del recibo</button><button type="button" class="btn" id="rcCopy">Copiar enlace</button></div>`
        : '<p class="muted sm" style="margin-top:12px">El envío por WhatsApp o correo y el QR del recibo estarán en <b>Último recibo</b> cuando la venta llegue al sistema.</p>'}
      </div>
    </div>`, async () => {}, 'Nueva venta', true);
  const cancel = document.querySelector('#modal footer .btn:not(#modalOk)');
  if (cancel) cancel.style.display = 'none'; // la venta ya está hecha: solo "Nueva venta"
  const cash = (rc.payments || []).some(p => /efectivo/i.test(p.method));
  const state = (txt, bad) => { const el = $('#rcPrnState'); if (el) { el.textContent = txt; el.classList.toggle('neg', !!bad); } };
  const printDirect = async gesture => {
    state('Imprimiendo…');
    try { await PRN.printReceipt(rc, link, { gesture: gesture, drawer: cash }); state('Impreso ✓ · ' + PRN.label()); }
    catch (e) { state(e.code === 'PICK' ? 'Toca "Imprimir ticket" para reconectar la impresora.' : e.message, true); }
  };
  $('#rcPrnCfg').onclick = ev => { ev.preventDefault(); openPrinterSettings(() => showPosDone(r, false)); };
  if (direct) {
    $('#rcDirect').onclick = () => printDirect(true);
    $('#rcSystem').onclick = ev => { ev.preventDefault(); printReceipt(rc, cfg.width, link); };
    if (fresh && cfg.auto) printDirect(false);
  } else {
    $('#rcFmt').onchange = ev => store2.set('nx_receipt_fmt', ev.target.value);
    $('#rcPrint').onclick = () => printReceipt(rc, $('#rcFmt').value, link);
  }
  if (!link) return;
  $('#rcWa').onclick = () => {
    let d = $('#rcPhone').value.replace(/\D/g, '');
    if (d.length === 8) d = '503' + d; else if (d.length === 10) d = '1' + d;
    if (d.length < 10) { toast('Escribe el WhatsApp del cliente.', true); return; }
    const text = '¡Gracias por tu compra en ' + rc.business + '! Recibo ' + rc.number + ' por ' + pm(rc.total) + '.' + (link ? '\nMíralo aquí: ' + link : '');
    window.open('https:\/\/wa.me/' + d + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  };
  $('#rcMailGo').onclick = async ev => {
    ev.target.disabled = true;
    try { await api('apiPosEmailReceipt', S.token, r.id, $('#rcMail').value, link); toast('Recibo enviado a ' + $('#rcMail').value); }
    catch (e) { toast(e.message, true); }
    ev.target.disabled = false;
  };
  $('#rcQr').onclick = () => {
    const el = document.createElement('div');
    el.className = 'qr-full';
    el.innerHTML = `<div class="qr-full-inner"><div class="qr-biz">${esc(rc.business)}</div>${qrSvg(link, 'min(78vw, 62vh)')}
      <div class="qr-event">Recibo ${esc(rc.number)}</div><p>Escanea para guardar tu recibo</p><button class="btn" type="button">Cerrar</button></div>`;
    document.body.appendChild(el);
    el.onclick = ev => { if (ev.target === el || ev.target.tagName === 'BUTTON') el.remove(); };
  };
  $('#rcCopy').onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Enlace copiado'), () => prompt('Copia el enlace:', link));
}

/** Recibo en HTML (pantalla e impresión). fmt: '58' | '80' | 'carta'. */
function receiptHtml(rc, fmt, link) {
  const m = v => esc(moneyIn(v, rc.currency));
  return `<div class="receipt r-${fmt}">
    <div class="r-biz">${esc(rc.business)}</div>
    <div class="r-meta">${esc([rc.legal_name, rc.tax_id ? 'NIT/ID ' + rc.tax_id : '', rc.address, rc.phone].filter(Boolean).join(' · '))}</div>
    ${rc.is_test ? '<div class="r-test">PRUEBA — no es una venta real</div>' : ''}
    ${rc.offline && !rc.synced ? '<div class="r-test">Venta sin conexión · comprobante provisional</div>' : ''}
    <div class="r-row r-head"><span>Recibo ${esc(rc.number)}</span><span>${esc(new Date(rc.date).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }))}</span></div>
    <div class="r-row"><span>${esc(rc.register || '')}</span><span>${esc(rc.customer || '')}</span></div>
    <div class="r-items">${rc.items.map(i => `<div class="r-item"><div class="r-row"><span>${esc(i.name)}</span><span>${m(i.total)}</span></div>
      <div class="r-sub">${esc(qtyFmt(i.qty))} × ${m(i.unit_price)}${i.discount ? ' · desc. ' + m(i.discount) : ''}${i.refunded_qty ? ' · ' + i.refunded_qty + ' devuelta(s)' : ''}</div></div>`).join('')}</div>
    ${rc.discount ? `<div class="r-row"><span>Descuento</span><span>−${m(rc.discount)}</span></div>` : ''}
    ${rc.prices_include_tax ? `<div class="r-row"><span>IVA incluido</span><span>${m(rc.tax)}</span></div>` : `<div class="r-row"><span>Subtotal</span><span>${m(rc.subtotal)}</span></div><div class="r-row"><span>Impuesto</span><span>${m(rc.tax)}</span></div>`}
    <div class="r-row r-total"><span>TOTAL</span><span>${m(rc.total)}</span></div>
    ${rc.payments.map(p => `<div class="r-row"><span>${esc(p.method)}${p.reference ? ' ' + esc(p.reference) : ''}</span><span>${m(p.amount)}</span></div>${p.tendered && p.change ? `<div class="r-row r-sub"><span>Recibido ${m(p.tendered)}</span><span>Cambio ${m(p.change)}</span></div>` : ''}`).join('')}
    ${rc.refunded ? `<div class="r-row"><span>Reembolsado</span><span>−${m(rc.refunded)}</span></div>` : ''}
    ${link ? `<div class="r-qr">${qrSvg(link, fmt === '58' ? 92 : 112)}<span>Tu recibo en línea</span></div>` : ''}
    ${rc.footer ? `<div class="r-foot">${esc(rc.footer)}</div>` : ''}
  </div>`;
}

function printReceipt(rc, fmt, link) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.className = 'receipt-print';
  area.innerHTML = receiptHtml(rc, fmt, link);
  let ps = $('#printPage');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
  if (fmt === 'carta') ps.textContent = '@page { size: letter; margin: 14mm; }';
  else {
    // Rollo: el alto de la página es el del recibo, para no gastar papel.
    area.style.display = 'block'; area.style.position = 'absolute'; area.style.left = '-9999px'; area.style.width = fmt + 'mm';
    const mm = Math.ceil(area.firstElementChild.getBoundingClientRect().height * 25.4 / 96) + 8;
    area.removeAttribute('style');
    ps.textContent = '@page { size: ' + fmt + 'mm ' + Math.max(mm, 60) + 'mm; margin: 0; }';
  }
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ---------- Ventas sin conexión: se guardan en el dispositivo y se envían solas ---------- */

const OFF = {
  key(k) { return 'nx_' + k + '_' + (S.boot && S.boot.user ? S.boot.user.id : 'x'); },
  load(k, d) { try { const v = localStorage.getItem(OFF.key(k)); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  save(k, v) { try { localStorage.setItem(OFF.key(k), JSON.stringify(v)); return true; } catch (e) { return false; } },
  queue() { return S.boot ? OFF.load('posq', []) : []; },
  setQueue(q) { OFF.save('posq', q); drawPosNet(); },
  syncing: false,
};

/** Guarda la venta en el dispositivo y arma un comprobante provisional con lo que se ve en pantalla. */
function posQueueSale(payload, t, pays) {
  const now = new Date(), c = POS.cart, st = POS.cat.settings, sess = POS.cat.session;
  payload.offline_at = now.toISOString();
  payload.session_id = sess.id;
  payload.items = payload.items.map(i => Object.assign({}, i, { catalog_price: POS.byId[i.product_id].price }));
  const seq = Number(OFF.load('posseq', 0)) + 1;
  OFF.save('posseq', seq);
  const number = 'L' + String(seq).padStart(4, '0');
  const M = POS.cat.methods;
  const rc = {
    business: st.business, legal_name: st.legal_name, tax_id: st.tax_id, address: st.address, phone: st.phone, email: st.email,
    footer: st.receipt_footer, prices_include_tax: st.prices_include_tax, number: number, date: now.toISOString(), register: sess.register,
    status: 'pagada', customer: c.customer ? (c.customer.name || c.customer.phone || c.customer.email) : 'Consumidor final', currency: st.currency,
    subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, refunded: 0, is_test: false, offline: true,
    items: t.lines.map(l => ({ name: l.p.name, sku: l.p.sku, qty: l.qty, unit_price: l.unit, discount: l.disc, total: l.total, refunded_qty: 0 })),
    payments: pays.map(p => ({ method: M[p.method], amount: p.amount, tendered: p.method === 'efectivo' ? p.tendered : null,
      change: p.method === 'efectivo' ? r2(p.tendered - p.amount) : 0, reference: p.reference || '' })),
  };
  const q = OFF.queue();
  q.push({ ref: payload.client_ref, payload: payload, receipt: rc, at: now.toISOString(), status: 'pending', error: '' });
  if (!OFF.save('posq', q)) throw new Error('No hay espacio en este dispositivo para guardar la venta. Libera espacio o recupera la conexión.');
  // El catálogo guardado refleja lo vendido, por si se recarga la página sin señal.
  t.lines.forEach(l => { if (l.p.tracked) l.p.stock = r2(l.p.stock - l.qty); });
  sess.expected_cash = r2(Number(sess.expected_cash || 0) + pays.filter(p => p.method === 'efectivo').reduce((a, p) => a + p.amount, 0));
  OFF.save('poscat', POS.cat);
  return { id: null, ref: payload.client_ref, number: number, status: 'pagada', offline: true, token: null,
           customer: c.customer ? { name: c.customer.name || '', phone: c.customer.phone || '', email: c.customer.email || '' } : null,
           change: r2(rc.payments.reduce((a, p) => a + p.change, 0)), receipt: rc };
}

/** Envía las ventas guardadas, en orden. El servidor no duplica una venta que ya recibió. */
async function posSync(manual) {
  if (OFF.syncing || !S.token || !S.boot) return;
  const todo = OFF.queue().filter(x => x.status !== 'error' || manual);
  if (!todo.length) return;
  OFF.syncing = true; drawPosNet();
  let sent = 0;
  try {
    for (const item of todo) {
      try {
        const r = await apiT(25000, 'apiPosCheckout', S.token, item.payload);
        r.ref = item.ref;
        OFF.setQueue(OFF.queue().filter(x => x.ref !== item.ref));
        sent++;
        POS.offline = false; S.offline = false;
        if (POS.last && POS.last.ref === item.ref) POS.last = r;
      } catch (e) {
        if (isNet(e)) { POS.offline = true; break; }
        if (e.code === 'AUTH' || e.code === 'PWD_CHANGE') break;
        OFF.setQueue(OFF.queue().map(x => x.ref === item.ref ? Object.assign(x, { status: 'error', error: e.message }) : x));
      }
    }
  } finally { OFF.syncing = false; drawPosNet(); }
  if (sent) {
    toast(sent === 1 ? 'Se envió 1 venta hecha sin conexión' : 'Se enviaron ' + sent + ' ventas hechas sin conexión');
    swrClear();
    if (S.view === 'pos' && !$('#modal') && !document.body.classList.contains('cart-open')) viewPos();
  }
  if (manual && POS.offline) toast('Sigue sin conexión. Se enviarán solas cuando vuelva la señal.', true);
}

function drawPosNet() {
  const b = $('#posNet');
  if (!b) return;
  const q = OFF.queue(), err = q.filter(x => x.status === 'error').length;
  const off = POS.offline || !navigator.onLine;
  b.hidden = !off && !q.length;
  b.className = 'btn sm pos-net' + (off ? ' off' : '') + (err ? ' err' : '');
  b.innerHTML = '<span class="net-dot" aria-hidden="true"></span>' +
    (off ? 'Sin conexión' : OFF.syncing ? 'Enviando…' : 'Por enviar') + (q.length ? ' · ' + q.length : '') + (err ? ' · ' + err + ' con error' : '');
  b.setAttribute('aria-label', (off ? 'Sin conexión. ' : '') + q.length + ' venta(s) guardadas en este dispositivo');
}

function openPosQueue() {
  const draw = () => {
    const q = OFF.queue(), off = POS.offline || !navigator.onLine;
    $('#modal .body').innerHTML = `
      <p class="muted" style="margin-top:0">${off ? 'Sin conexión. ' : ''}Las ventas hechas sin señal quedan guardadas en este dispositivo y se envían solas cuando vuelve la conexión. No borres los datos del navegador hasta que se envíen.</p>
      ${q.length ? `<ul class="list q-list">${q.map(x => `<li>
          <span><b>${esc(x.receipt.number)}</b> · ${esc(new Date(x.at).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }))}
            <br><span class="muted sm">${esc(x.receipt.items.map(i => i.name + ' ×' + qtyFmt(i.qty)).join(', '))}</span>
            ${x.status === 'error' ? `<br><span class="neg sm">No se pudo registrar: ${esc(x.error)}</span>` : ''}</span>
          <span class="q-acts"><b>${esc(pm(x.receipt.total))}</b>
            <button class="btn sm" data-see="${esc(x.ref)}">Recibo</button>
            ${x.status === 'error' ? `<button class="btn sm" data-retry="${esc(x.ref)}">Reintentar</button><button class="btn sm danger" data-drop="${esc(x.ref)}">Descartar</button>` : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty">No hay ventas pendientes de enviar.</div>'}
      ${q.length ? '<button class="btn primary" id="qSend" style="margin-top:12px">Enviar ahora</button>' : ''}`;
    const find = ref => OFF.queue().find(x => x.ref === ref);
    document.querySelectorAll('[data-see]').forEach(b => b.onclick = () => {
      const x = find(b.dataset.see); if (!x) return;
      closeModal(true);
      showPosDone({ id: null, ref: x.ref, number: x.receipt.number, offline: true, token: null, customer: null,
        change: r2(x.receipt.payments.reduce((a, p) => a + (p.change || 0), 0)), receipt: x.receipt }, false);
    });
    document.querySelectorAll('[data-retry]').forEach(b => b.onclick = async () => {
      OFF.setQueue(OFF.queue().map(x => x.ref === b.dataset.retry ? Object.assign(x, { status: 'pending', error: '' }) : x));
      await posSync(); draw();
    });
    document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
      if (!confirm('Esta venta no quedará registrada en el sistema ni descontará inventario. ¿Descartarla?')) return;
      OFF.setQueue(OFF.queue().filter(x => x.ref !== b.dataset.drop)); draw();
    });
    if ($('#qSend')) $('#qSend').onclick = async ev => { ev.target.disabled = true; ev.target.textContent = 'Enviando…'; await posSync(true); if ($('#modal')) draw(); };
  };
  openModal('Ventas guardadas en este dispositivo', '', null, null, true);
  draw();
}

window.addEventListener('online', () => { POS.offline = false; drawPosNet(); posSync(); });
window.addEventListener('offline', () => { POS.offline = true; drawPosNet(); });
setInterval(() => { if (document.visibilityState === 'visible' && OFF.queue().some(x => x.status !== 'error')) posSync(); }, 30000);

/* ---------- Impresora térmica directa (ESC/POS por Bluetooth, USB o puerto serie) ---------- */

const PRN = {
  dev: null,     // { type, name, write(bytes), close() }
  busy: false,
  // Servicios Bluetooth de las impresoras térmicas más comunes (genéricas chinas, Xprinter, MUNBYN, GOOJPRT, Rongta, Epson TM-P…).
  BT_SERVICES: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb',
    '0000fee7-0000-1000-8000-00805f9b34fb', '0000af30-0000-1000-8000-00805f9b34fb'],
  defaults: { conn: 'system', width: '80', auto: true, drawer: false, cut: true, charset: 'pc850', qr: true, slow: false, baud: 9600, name: '', id: '' },
  cfg() { try { return Object.assign({}, PRN.defaults, JSON.parse(localStorage.getItem('nx_printer') || '{}')); } catch (e) { return Object.assign({}, PRN.defaults); } },
  save(c) { try { localStorage.setItem('nx_printer', JSON.stringify(c)); } catch (e) { /* sin almacenamiento */ } PRN.paintDot(); },
  support() {
    return { bluetooth: !!(navigator.bluetooth && navigator.bluetooth.requestDevice), usb: !!(navigator.usb && navigator.usb.requestDevice),
             serial: !!(navigator.serial && navigator.serial.requestPort) };
  },
  label() {
    const c = PRN.cfg();
    if (c.conn === 'system') return 'Diálogo de impresión del navegador';
    const kind = { bluetooth: 'Bluetooth', usb: 'USB', serial: 'Puerto serie' }[c.conn];
    return (PRN.dev ? 'Conectada: ' : (c.name ? 'Guardada: ' : 'Sin elegir · ')) + (c.name || kind) + ' · ' + c.width + ' mm';
  },
  paintDot() { const d = $('#prnDot'); if (d) { const c = PRN.cfg(); d.className = 'prn-dot' + (c.conn === 'system' ? '' : PRN.dev ? ' on' : ' off'); } },
  sleep: ms => new Promise(r => setTimeout(r, ms)),

  /** Elige la impresora (necesita un toque del usuario). */
  async pick() {
    const c = PRN.cfg();
    await PRN.close();
    if (c.conn === 'bluetooth') {
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: PRN.BT_SERVICES });
      await PRN.openBt(device);
    } else if (c.conn === 'usb') {
      let device;
      try { device = await navigator.usb.requestDevice({ filters: [{ classCode: 7 }] }); }
      catch (e) { if (e.name === 'NotFoundError') throw new Error('No se eligió ninguna impresora. Si la tuya no aparece, conéctala por "Puerto serie" o usa el diálogo de impresión.'); throw e; }
      await PRN.openUsb(device);
    } else if (c.conn === 'serial') {
      const port = await navigator.serial.requestPort();
      await PRN.openSerial(port);
    }
    const n = PRN.cfg(); n.name = PRN.dev.name; n.id = PRN.dev.id || ''; PRN.save(n);
  },

  /** Reconecta sin preguntar a la última impresora con permiso (cuando el navegador lo permite). */
  async reconnect() {
    const c = PRN.cfg();
    try {
      if (c.conn === 'usb' && navigator.usb && navigator.usb.getDevices) {
        const list = await navigator.usb.getDevices();
        const d = list.find(x => (x.productName || '') + ':' + x.vendorId + ':' + x.productId === c.id) || (list.length === 1 ? list[0] : null);
        if (d) { await PRN.openUsb(d); return true; }
      } else if (c.conn === 'serial' && navigator.serial && navigator.serial.getPorts) {
        const ports = await navigator.serial.getPorts();
        if (ports.length) { await PRN.openSerial(ports[0]); return true; }
      } else if (c.conn === 'bluetooth' && navigator.bluetooth && navigator.bluetooth.getDevices) {
        const list = await navigator.bluetooth.getDevices();
        const d = list.find(x => x.id === c.id) || (list.length === 1 ? list[0] : null);
        if (d) { await PRN.openBt(d); return true; }
      }
    } catch (e) { /* sin permiso guardado o apagada */ }
    return false;
  },

  async openBt(device) {
    const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
    let ch = null;
    for (const uuid of PRN.BT_SERVICES) {
      try {
        const svc = await server.getPrimaryService(uuid);
        const chars = await svc.getCharacteristics();
        ch = chars.find(x => x.properties.writeWithoutResponse || x.properties.write);
        if (ch) break;
      } catch (e) { /* este servicio no está */ }
    }
    if (!ch) { try { server.disconnect(); } catch (e) { /* nada */ } throw new Error('Esa impresora no ofrece un canal de impresión compatible por Bluetooth. Prueba "Puerto serie" en una PC o el diálogo de impresión.'); }
    const noResp = ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse;
    device.addEventListener('gattserverdisconnected', () => { if (PRN.dev && PRN.dev.raw === device) { PRN.dev = null; PRN.paintDot(); } }, { once: true });
    PRN.dev = { type: 'bluetooth', raw: device, name: device.name || 'Impresora Bluetooth', id: device.id,
      write: async bytes => {
        const slow = PRN.cfg().slow, size = slow ? 20 : noResp ? 120 : 180;
        for (let i = 0; i < bytes.length; i += size) {
          const part = bytes.slice(i, i + size);
          if (noResp) { await ch.writeValueWithoutResponse(part); await PRN.sleep(slow ? 40 : 12); }
          else await (ch.writeValueWithResponse ? ch.writeValueWithResponse(part) : ch.writeValue(part));
        }
      },
      close: async () => { try { device.gatt.disconnect(); } catch (e) { /* ya */ } } };
  },

  async openUsb(device) {
    try { await device.open(); }
    catch (e) { throw new Error('No se pudo abrir la impresora USB' + (/Access denied|SecurityError/i.test(e.message) ? ': la está usando el driver del sistema (pasa en Windows). Usa "Puerto serie" o el diálogo de impresión.' : ': ' + e.message)); }
    if (!device.configuration) await device.selectConfiguration(1);
    let ep = null, itf = null;
    for (const i of device.configuration.interfaces) {
      for (const alt of i.alternates) {
        const e = alt.endpoints.find(x => x.direction === 'out' && x.type === 'bulk');
        if (e) { ep = e; itf = i; break; }
      }
      if (ep) break;
    }
    if (!ep) { await device.close(); throw new Error('Esa impresora USB no tiene un canal de impresión.'); }
    try { await device.claimInterface(itf.interfaceNumber); }
    catch (e) { await device.close(); throw new Error('La impresora USB está ocupada por el driver del sistema. Usa "Puerto serie" o el diálogo de impresión.'); }
    PRN.dev = { type: 'usb', raw: device, name: device.productName || 'Impresora USB', id: (device.productName || '') + ':' + device.vendorId + ':' + device.productId,
      write: async bytes => { for (let i = 0; i < bytes.length; i += 4096) await device.transferOut(ep.endpointNumber, bytes.slice(i, i + 4096)); },
      close: async () => { try { await device.close(); } catch (e) { /* ya */ } } };
  },

  async openSerial(port) {
    const c = PRN.cfg();
    if (!port.writable) await port.open({ baudRate: Number(c.baud) || 9600 });
    const info = port.getInfo ? port.getInfo() : {};
    PRN.dev = { type: 'serial', raw: port, name: 'Puerto serie' + (info.usbVendorId ? ' USB ' + info.usbVendorId.toString(16) : ''), id: '',
      write: async bytes => { const w = port.writable.getWriter(); try { await w.write(bytes); await w.ready; } finally { w.releaseLock(); } },
      close: async () => { try { await port.close(); } catch (e) { /* ya */ } } };
  },

  async close() { if (PRN.dev) { const d = PRN.dev; PRN.dev = null; await d.close(); } PRN.paintDot(); },

  async ensure(gesture) {
    if (PRN.dev && !(PRN.dev.type === 'bluetooth' && !PRN.dev.raw.gatt.connected)) return;
    if (PRN.dev && PRN.dev.type === 'bluetooth') { try { await PRN.openBt(PRN.dev.raw); return; } catch (e) { PRN.dev = null; } }
    if (await PRN.reconnect()) { PRN.paintDot(); return; }
    if (!gesture) { const e = new Error('Hay que reconectar la impresora.'); e.code = 'PICK'; throw e; }
    await PRN.pick();
    PRN.paintDot();
  },

  async send(bytes, opts) {
    const c = PRN.cfg();
    if (c.conn === 'system') throw new Error('No hay impresora directa configurada.');
    const sup = PRN.support()[c.conn];
    if (!sup) throw new Error(ON_GOOGLE ? 'Dentro de la página de Google el navegador no deja usar Bluetooth ni USB. Abre la app desde tu dirección de GitHub.' : 'Este navegador no permite imprimir por ' + c.conn + '. En iPhone usa el diálogo de impresión (AirPrint).');
    if (PRN.busy) throw new Error('La impresora está ocupada; espera un momento.');
    PRN.busy = true;
    try {
      await PRN.ensure(opts && opts.gesture);
      try { await PRN.dev.write(bytes); }
      catch (e) {
        // Se cortó la conexión (impresora apagada, se alejó el teléfono): un reintento.
        PRN.dev = null;
        await PRN.ensure(opts && opts.gesture);
        await PRN.dev.write(bytes);
      }
    } catch (e) {
      if (e.code === 'PICK') throw e;
      if (e.name === 'NotFoundError') throw new Error('No se eligió ninguna impresora.');
      if (e.name === 'SecurityError') throw new Error('El navegador pidió un toque para conectar: toca "Imprimir ticket".');
      throw e;
    } finally { PRN.busy = false; PRN.paintDot(); }
  },

  printReceipt(rc, link, opts) { const c = PRN.cfg(); return PRN.send(escposDoc(receiptDoc(rc, c.qr ? link : ''), Object.assign({}, c, { drawer: c.drawer && opts && opts.drawer })), opts); },
  printDoc(doc, opts) { return PRN.send(escposDoc(doc, PRN.cfg()), opts); },
};

/* Un "documento" de ticket es una lista de renglones; de ahí salen los bytes ESC/POS. */
function receiptDoc(rc, link) {
  const m = v => moneyIn(v, rc.currency);
  const d = [];
  d.push({ t: 'title', v: rc.business });
  [rc.legal_name, rc.tax_id ? 'NIT/ID ' + rc.tax_id : '', rc.address, rc.phone].filter(Boolean).forEach(x => d.push({ t: 'center', v: x }));
  if (rc.is_test) d.push({ t: 'center', v: '*** PRUEBA - no es una venta real ***' });
  if (rc.offline && !rc.synced) { d.push({ t: 'center', v: 'COMPROBANTE PROVISIONAL' }); d.push({ t: 'center', v: '(venta sin conexión)' }); }
  d.push({ t: 'sep' });
  d.push({ t: 'lr', l: 'Recibo ' + rc.number, r: new Date(rc.date).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }) });
  d.push({ t: 'lr', l: rc.register || '', r: rc.customer || '' });
  d.push({ t: 'sep' });
  rc.items.forEach(i => {
    d.push({ t: 'lr', l: i.name, r: m(i.total) });

  });
  d.push({ t: 'sep' });
  if (rc.discount) d.push({ t: 'lr', l: 'Descuento', r: '-' + m(rc.discount) });
  if (rc.prices_include_tax) d.push({ t: 'lr', l: 'IVA incluido', r: m(rc.tax) });
  else { d.push({ t: 'lr', l: 'Subtotal', r: m(rc.subtotal) }); d.push({ t: 'lr', l: 'Impuesto', r: m(rc.tax) }); }
  d.push({ t: 'total', l: 'TOTAL', r: m(rc.total) });
  (rc.payments || []).forEach(p => {
    d.push({ t: 'lr', l: p.method + (p.reference ? ' ' + p.reference : ''), r: m(p.amount) });
    if (p.tendered && p.change) { d.push({ t: 'lr', l: '  Recibido', r: m(p.tendered) }); d.push({ t: 'lr', l: '  Cambio', r: m(p.change) }); }
  });

  if (link) { d.push({ t: 'feed' }); d.push({ t: 'qr', v: link }); d.push({ t: 'center', v: 'Tu recibo en línea' }); }
  if (rc.footer) { d.push({ t: 'feed' }); d.push({ t: 'center', v: rc.footer }); }
  return d;
}

/* Página de códigos PC850 (ESC t 2): la que traen casi todas las térmicas y tiene ñ, tildes, ¿ y ¡. */
const CP850 = { 'Ç': 0x80, 'ü': 0x81, 'é': 0x82, 'â': 0x83, 'ä': 0x84, 'à': 0x85, 'ç': 0x87, 'ê': 0x88, 'ë': 0x89, 'è': 0x8A, 'ï': 0x8B, 'î': 0x8C,
  'ì': 0x8D, 'Ä': 0x8E, 'É': 0x90, 'ô': 0x93, 'ö': 0x94, 'ò': 0x95, 'û': 0x96, 'ù': 0x97, 'Ö': 0x99, 'Ü': 0x9A, '£': 0x9C, '×': 0x9E,
  'á': 0xA0, 'í': 0xA1, 'ó': 0xA2, 'ú': 0xA3, 'ñ': 0xA4, 'Ñ': 0xA5, 'ª': 0xA6, 'º': 0xA7, '¿': 0xA8, '½': 0xAB, '¡': 0xAD, 'Á': 0xB5,
  'Â': 0xB6, 'À': 0xB7, '¢': 0xBD, 'Ê': 0xD2, 'Í': 0xD6, 'Ó': 0xE0, 'Ô': 0xE2, 'Ú': 0xE9, '±': 0xF1, '°': 0xF8, '·': 0xFA };

function escText(str, charset) {
  str = String(str === null || str === undefined ? '' : str)
    .replace(/[   ]/g, ' ').replace(/[−–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/…/g, '...').replace(/€/g, 'EUR').replace(/[\r\n\t]+/g, ' ');
  const out = [];
  for (const ch of str) {
    const c = ch.charCodeAt(0);
    if (c < 128) { out.push(c); continue; }
    if (charset === 'pc850' && CP850[ch]) { out.push(CP850[ch]); continue; }
    const base = ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
    out.push(base.length === 1 && base.charCodeAt(0) < 128 ? base.charCodeAt(0) : 63);
  }
  return out;
}

/** Corta un texto en renglones de n columnas sin partir palabras (salvo que no quepan). */
function wrapCols(text, n) {
  const words = String(text || '').split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  words.forEach(w => {
    while (w.length > n) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, n)); w = w.slice(n); }
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= n) cur += ' ' + w; else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/** Bytes ESC/POS de un documento. o = { width:'58'|'80', charset, cut, drawer, qr } */
function escposDoc(doc, o) {
  const W = o.width === '58' ? 32 : 48, dots = o.width === '58' ? 384 : 576;
  const b = [];
  const put = (...x) => { for (const v of x) { if (Array.isArray(v)) b.push.apply(b, v); else b.push(v); } };
  const txt = s => escText(s, o.charset);
  const align = a => put(0x1B, 0x61, a);       // 0 izq, 1 centro
  const bold = on => put(0x1B, 0x45, on ? 1 : 0);
  const size = n => put(0x1D, 0x21, n);        // 0x00 normal, 0x11 doble, 0x01 doble alto
  const nl = () => put(0x0A);
  const lr = (l, r, cols) => {
    cols = cols || W;
    r = String(r || ''); l = String(l || '');
    const room = Math.max(4, cols - r.length - 1);
    const ls = wrapCols(l, room);
    ls.forEach((line, i) => {
      if (i < ls.length - 1) { put(txt(line)); nl(); }
      else { put(txt(line + ' '.repeat(Math.max(1, cols - line.length - r.length)) + r)); nl(); }
    });
  };
  put(0x1B, 0x40);                              // reiniciar
  if (o.charset === 'pc850') put(0x1B, 0x74, 2); // tabla PC850
  if (o.drawer) put(0x1B, 0x70, 0, 25, 250);     // abrir cajón (pin 2)
  doc.forEach(r => {
    if (r.t === 'title') { align(1); bold(true); size(0x11); wrapCols(r.v, Math.floor(W / 2)).forEach(l => { put(txt(l)); nl(); }); size(0); bold(false); align(0); }
    else if (r.t === 'center') { align(1); wrapCols(r.v, W).forEach(l => { put(txt(l)); nl(); }); align(0); }
    else if (r.t === 'sep') { put(txt('-'.repeat(W))); nl(); }
    else if (r.t === 'lr') lr(r.l, r.r);
    else if (r.t === 'sub') { wrapCols(r.v, W - 2).forEach(l => { put(txt('  ' + l)); nl(); }); }
    else if (r.t === 'total') { bold(true); size(0x01); lr(r.l, r.r); size(0); bold(false); }
    else if (r.t === 'feed') nl();
    else if (r.t === 'qr') {
      const q = qrcode(0, 'M'); q.addData(r.v); q.make();
      const n = q.getModuleCount(), quiet = 2;
      const scale = Math.max(2, Math.min(8, Math.floor((o.width === '58' ? 200 : 240) / (n + quiet * 2))));
      const px = (n + quiet * 2) * scale, wb = Math.ceil(px / 8);
      const pad = Math.max(0, Math.floor((dots / 8 - wb) / 2)); // centrado a mano: no todas respetan ESC a con imágenes
      const rowBytes = wb + pad;
      put(0x1D, 0x76, 0x30, 0x00, rowBytes & 255, rowBytes >> 8, px & 255, px >> 8);
      for (let y = 0; y < px; y++) {
        const row = new Array(rowBytes).fill(0);
        const my = Math.floor(y / scale) - quiet;
        for (let x = 0; x < px; x++) {
          const mx = Math.floor(x / scale) - quiet;
          if (mx >= 0 && my >= 0 && mx < n && my < n && q.isDark(my, mx)) row[pad + (x >> 3)] |= 0x80 >> (x & 7);
        }
        put(row);
      }
      nl();
    }
  });
  put(0x1B, 0x64, 4);                           // avanzar 4 renglones
  if (o.cut) put(0x1D, 0x56, 0x42, 0x00);       // corte parcial
  return new Uint8Array(b);
}

          <label class="chk wide"><input type="checkbox" id="prnQr" ${c.qr ? 'checked' : ''}> Imprimir el QR del recibo en línea</label>
          <label class="chk wide"><input type="checkbox" id="prnAscii" ${c.charset === 'ascii' ? 'checked' : ''}> Quitar tildes y ñ (si salen símbolos raros en lugar de letras)</label>

      catch (e) { if (e.name !== 'NotFoundError') toast(e.message, true); }
      draw();
    };
  };
  openModal('Impresora', '', async () => { if (typeof after === 'function') setTimeout(after, 0); }, 'Listo', true);
  draw();
}

async function openPosClose() {
  const pend = OFF.queue();
  if (pend.length) {
    openModal('Antes de cerrar la caja', `<p>Hay <b>${pend.length}</b> venta(s) hechas sin conexión que todavía no llegan al sistema. Envíalas primero para que el arqueo cuadre.</p>`, async () => { await posSync(true); if (OFF.queue().length) throw new Error('Aún quedan ventas sin enviar. Revisa la conexión o abre la lista de ventas guardadas.'); setTimeout(openPosClose, 0); }, 'Enviar ahora');
    return;
  }
  let s;
  try { s = (await api('apiPosCatalog', S.token)).session; } catch (e) { toast(e.message, true); return; }
  if (!s) { viewPos(); return; }
  openModal('Cerrar caja · ' + s.register, `
    <div class="close-grid">
      <div class="card pad"><div class="muted sm">Ventas</div><div class="big">${s.sales_count}</div><div class="muted sm">${esc(pm(s.sales_total))}</div></div>
      <div class="card pad"><div class="muted sm">Efectivo esperado</div><div class="big">${esc(pm(s.expected_cash))}</div><div class="muted sm">fondo ${esc(pm(s.opening_cash))}</div></div>
    </div>
    ${s.by_method.length ? `<ul class="list">${s.by_method.map(m => `<li><span>${esc(m.label)}</span><b>${esc(pm(m.amount))}</b></li>`).join('')}</ul>` : ''}
    ${s.refunded_total ? `<p class="muted">Devoluciones: −${esc(pm(s.refunded_total))}</p>` : ''}
    <form class="form" id="clForm" style="margin-top:12px">
      <div><label class="f">Efectivo contado</label><input class="input pos-money" name="counted" inputmode="decimal" placeholder="0.00" required></div>
      <div><label class="f">Diferencia</label><div class="diff" id="clDiff">—</div></div>
      <div class="wide"><label class="f">Nota</label><input class="input" name="notes" placeholder="Opcional"></div>
    </form>`, async () => {
    const f = $('#clForm');
    if (f.counted.value.trim() === '') throw new Error('Escribe cuánto efectivo contaste.');
    const closed = await api('apiPosClose', S.token, s.id, { counted_cash: Number(f.counted.value.replace(',', '.')), notes: f.notes.value });
    POS.cart = emptyCart();
    toast('Caja cerrada. Diferencia: ' + pm(closed.difference));
    setTimeout(() => { viewPos(); showSessionReport(closed); }, 0);
  }, 'Cerrar caja', true);
  const f = $('#clForm');
  f.counted.oninput = () => {
    const v = Number(f.counted.value.replace(',', '.'));
    if (f.counted.value.trim() === '' || !isFinite(v)) { $('#clDiff').textContent = '—'; return; }
    const d = r2(v - s.expected_cash);
    $('#clDiff').innerHTML = d === 0 ? '<b class="pos">Cuadra</b>' : '<b class="' + (d < 0 ? 'neg' : 'warn') + '">' + (d < 0 ? 'Falta ' : 'Sobra ') + esc(pm(Math.abs(d))) + '</b>';
  };
}

function showSessionReport(s) {
  openModal('Cierre ' + s.number, `<div class="rc-preview">${sessionReportHtml(s)}</div>
    <div style="margin-top:12px"><button type="button" class="btn primary" id="zPrint">Imprimir cierre</button></div>`, null, null, true);
  $('#zPrint').onclick = async () => {
    if (PRN.cfg().conn !== 'system') {
      try { await PRN.printDoc(sessionDoc(s), { gesture: true }); toast('Cierre impreso'); return; }
      catch (e) { toast(e.code === 'PICK' ? 'Conecta la impresora en Ajustes de impresora.' : e.message, true); return; }
    }
    let area = $('#printArea');
    if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
    area.className = 'receipt-print';
    area.innerHTML = sessionReportHtml(s);
    let ps = $('#printPage');
    if (!ps) { ps = document.createElement('style'); ps.id = 'printPage'; document.head.appendChild(ps); }
    ps.textContent = '@page { size: 80mm 200mm; margin: 0; }';
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  };
}

/* ============================ Suscriptores ============================ */

const SUB_STATUS = { activo: 'Activo', pendiente: 'Pendiente', baja: 'Baja' };
const SUB_LANG = { es: 'Español', en: 'English', ambos: 'Ambos' };

async function viewSubscribers() {
  const main = $('#main');
  main.innerHTML = pageHeader('Suscriptores', '<button class="btn" id="csvBtn">Exportar CSV</button>' +
    (can('marketing:write') ? ' <button class="btn primary" id="addSub">+ Agregar</button>' : '')) + '<div id="subBody"><div class="card empty">Cargando…</div></div>';
  setTimeout(() => { if ($('#addSub') && S.subs && S.subs.connected) $('#addSub').textContent = '+ Invitar'; }, 0);
  if ($('#addSub')) $('#addSub').onclick = () => editSubscriber(null);
  try {
    await apiFresh('apiSubscribers', [], d => {
      S.subs = d;
      if (S.view === 'subscribers') drawSubscribers();
      if ($('#addSub') && S.subs.connected) $('#addSub').textContent = '+ Invitar';
    });
  } catch (e) { $('#subBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
}

function drawSubscribers() {
  const st = S.subs.stats;
  const kpi = (l, v, hint) => `<div class="card pad kpi"><div class="l">${l}</div><div class="v">${v}</div>${hint ? '<div class="hint">' + hint + '</div>' : ''}</div>`;
  if (!S.subs.rows.length) {
    $('#subBody').innerHTML = `<div class="card empty">Aún no hay suscriptores.<br><br>Conecta la hoja de tu newsletter en <b>Integraciones → Conectar plataforma → Google Sheets</b>, agrégalos con <b>+ Agregar</b>, o envíalos en tiempo real desde tu sitio.</div>`;
    $('#csvBtn').disabled = true;
    return;
  }
  $('#subBody').innerHTML = `
    <div class="grid kpis">
      ${kpi('Activos', st.activo, 'Reciben el correo')}${kpi('Pendientes', st.pendiente, 'Sin confirmar')}${kpi('Bajas', st.baja)}
      ${kpi('Activos que ya son clientes', st.clientes, st.activo ? Math.round(st.clientes / st.activo * 100) + '% de los activos' : '')}
      ${kpi('Activos por idioma', `<span style="font-size:16px;line-height:1.6">Español ${st.es}<br>English ${st.en} · Ambos ${st.ambos}</span>`)}
    </div>
    ${S.subs.connected ? `<div class="note ok-note" style="margin:0 0 12px">Conectado con tu newsletter (<b>${esc(S.subs.connected.name)}</b>): las bajas, invitaciones y cambios de idioma se aplican en la lista real.</div>` : ''}
    <div class="toolbar" style="flex-wrap:wrap">
      <input class="input" id="q" placeholder="Buscar correo…">
      <select class="input" id="fStatus" style="max-width:180px"><option value="">Todos los estados</option>${Object.keys(SUB_STATUS).map(k => `<option value="${k}">${SUB_STATUS[k]}</option>`).join('')}</select>
      <select class="input" id="fLang" style="max-width:160px"><option value="">Todos los idiomas</option>${Object.keys(SUB_LANG).map(k => `<option value="${k}">${SUB_LANG[k]}</option>`).join('')}</select>
      <select class="input" id="fCust" style="max-width:200px"><option value="">Clientes y no clientes</option><option value="si">Ya son clientes</option><option value="no">Aún no compran</option></select>
    </div>
    <div class="card tablewrap" id="list"></div>`;
  ['#q', '#fStatus', '#fLang', '#fCust'].forEach(s => $(s).addEventListener('input', drawSubscriberRows));
  $('#csvBtn').onclick = exportSubscribers;
  drawSubscriberRows();
}

function filteredSubscribers() {
  const q = ($('#q').value || '').toLowerCase().trim(), fs = $('#fStatus').value, fl = $('#fLang').value, fc = $('#fCust').value;
  return S.subs.rows.filter(r => (!q || r.email.indexOf(q) >= 0) && (!fs || r.status === fs) && (!fl || r.language === fl) &&
    (!fc || (fc === 'si' ? !!r.customer_id : !r.customer_id)));
}

function drawSubscriberRows() {
  const rows = filteredSubscribers();
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  const w = can('marketing:write'), del = can('marketing:delete');
  $('#list').innerHTML = `<table class="wrap"><thead><tr><th>Correo</th><th>Idioma</th><th>Estado</th><th>Fechas</th><th>En el CRM</th><th>Origen</th>${w || del ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.map(r => `<tr><td style="white-space:nowrap">${esc(r.email)}${contactIcons(r.email, r.phone)}</td><td>${esc(SUB_LANG[r.language] || '—')}</td>
      <td><span class="tag ${r.status === 'activo' ? 'activo' : r.status === 'baja' ? 'cancelada' : 'pendiente'}">${esc(SUB_STATUS[r.status] || r.status)}</span>
        ${r.status_source === 'manual' && r.sheet_status && r.sheet_status !== r.status ? '<span class="drift" title="Cambiado a mano en el CRM">En tu hoja: ' + esc(SUB_STATUS[r.sheet_status] || r.sheet_status) + '</span>' : ''}</td>
      <td class="muted" style="white-space:nowrap;font-size:13px">Alta: ${esc(r.subscribed_at || '—')}<br>${r.unsubscribed_at && r.status === 'baja' ? 'Baja: ' + esc(r.unsubscribed_at) : 'Confirmó: ' + esc(r.confirmed_at || '—')}
        ${r.consent_at ? `<br><span style="color:var(--brand)" title="${esc(r.consent_method || '')}">✓ Consentimiento ${esc(String(r.consent_at).slice(0, 10))}</span>` : ''}</td>
      <td>${r.customer_id ? '<span class="tag activo">Cliente</span> ' + esc(r.customer_name) : r.lead_id ? '<span class="tag nuevo">Prospecto</span>' : '<span class="muted">—</span>'}</td>
      <td class="muted">${esc(r.source || '')}</td>
      ${w || del ? `<td class="actions">${w ? `<button class="btn sm" data-sedit="${esc(r.id)}">Editar</button>` : ''}${del ? `<button class="btn sm danger" data-sdel="${esc(r.id)}">Eliminar</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table>
    <div class="muted" style="padding:10px 14px">${rows.length} de ${S.subs.rows.length}</div>`;
  $('#list').querySelectorAll('[data-sedit]').forEach(b => b.onclick = () => editSubscriber(S.subs.rows.find(r => r.id === b.dataset.sedit)));
  $('#list').querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => deleteSubscriber(S.subs.rows.find(r => r.id === b.dataset.sdel)));
}

function exportSubscribers() {
  const rows = filteredSubscribers();
  const cols = ['email', 'language', 'status', 'subscribed_at', 'confirmed_at', 'unsubscribed_at', 'consent_at', 'consent_method', 'customer_name', 'source'];
  const q = v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'suscriptores-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast(rows.length + ' suscriptores exportados');
  } catch (e) {
    openModal('Exportar CSV', '<p class="muted">Tu navegador bloqueó la descarga. Copia el contenido:</p>' + codeBlock(csv.slice(1)), null, null, true);
  }
}

function editSubscriber(r) {
  if (S.subs.connected) return editSubscriberConnected(r);
  const langOpts = [['es', 'Español'], ['en', 'English'], ['ambos', 'Ambos'], ['', '—']];
  const statusOpts = r ? [['activo', 'Activo'], ['pendiente', 'Pendiente de confirmar'], ['baja', 'Dado de baja']]
                       : [['activo', 'Activo'], ['pendiente', 'Pendiente de confirmar']];
  const sel = (name, opts, v) => `<select class="input" name="${name}">${opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const body = `<form class="form" id="recForm">
      <div class="wide"><label class="f">Correo *</label><input class="input" name="email" type="email" value="${esc(r ? r.email : '')}" ${r ? 'disabled' : 'required'}></div>
      <div><label class="f">Idioma</label>${sel('language', langOpts, r ? r.language : 'es')}</div>
      <div><label class="f">Estado *</label>${sel('status', statusOpts, r ? r.status : 'activo')}</div>
      ${r ? '' : `<div class="wide"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" style="margin-top:3px">
        <span>Esta persona aceptó recibir mis correos (por ejemplo, se inscribió en persona, en un evento o me lo pidió por escrito).</span></label></div>`}
      <div class="wide note" style="margin:0">Este cambio queda en el CRM y la sincronización con tu hoja lo respeta. <b>Tu plataforma de envío del newsletter no se entera</b>:
        para que alguien deje de recibir (o empiece a recibir) el correo, cámbialo también allí.</div>
    </form>`;
  openModal(r ? 'Editar suscriptor' : 'Agregar suscriptor', body, async () => {
    const f = $('#recForm');
    if (!f.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = { language: f.elements.language.value, status: f.elements.status.value };
    if (r) values.id = r.id; else { values.email = f.elements.email.value; values.consent = f.elements.consent.checked; }
    await api('apiSubscriberSave', S.token, values);
    S.subs = await api('apiSubscribers', S.token);
    drawSubscribers();
    toast(r ? 'Suscriptor actualizado' : 'Suscriptor agregado');
  }, r ? 'Guardar' : 'Agregar');
}

function editSubscriberConnected(r) {
  const langOpts = [['es', 'Español'], ['en', 'English'], ['ambos', 'Ambos']];
  const sel = (name, opts, v) => `<select class="input" name="${name}">${opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const actions = !r ? null : r.status === 'activo'
    ? [['', 'Sigue suscrito'], ['baja', 'Darlo de baja del newsletter']]
    : r.status === 'pendiente'
      ? [['', 'Esperar su confirmación'], ['invite', 'Reenviar el correo de confirmación'], ['baja', 'Darlo de baja']]
      : [['', 'Sigue dado de baja'], ['invite', 'Invitarlo a suscribirse de nuevo']];
  const canInvite = S.subs.connected.canInvite;
  const body = `<form class="form" id="recForm">
      <div class="wide"><label class="f">Correo *</label><input class="input" name="email" type="email" value="${esc(r ? r.email : '')}" ${r ? 'disabled' : 'required'}></div>
      <div><label class="f">Idioma del newsletter</label>${sel('language', langOpts, r ? (r.language || 'ambos') : 'es')}</div>
      ${r ? `<div><label class="f">Acción</label>${sel('action', actions, '')}</div>` : ''}
      <div class="wide note ok-note" style="margin:0">${r
        ? 'Los cambios se aplican en tu newsletter. Una baja surte efecto de inmediato. Para reactivar a alguien, el newsletter le envía su correo de confirmación.'
        : 'Le enviaremos el <b>correo de confirmación de tu newsletter</b>. Aparecerá como <b>activo</b> cuando lo confirme, y su consentimiento quedará registrado solo.'}</div>
      ${!canInvite && (!r || r.status !== 'activo') ? '<div class="wide note" style="margin:0">Para invitar, configura la página de suscripción en <b>Integraciones → Editar</b>.</div>' : ''}
    </form>`;
  openModal(r ? 'Editar suscriptor' : 'Invitar al newsletter', body, async () => {
    const f = $('#recForm');
    if (!f.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = { language: f.elements.language.value };
    if (r) {
      values.id = r.id;
      const a = f.elements.action.value;
      values.status = a === 'baja' ? 'baja' : r.status;
      if (a === 'invite') values.invite = true;
    } else { values.email = f.elements.email.value; values.status = 'pendiente'; }
    const res = await api('apiSubscriberSave', S.token, values);
    S.subs = await api('apiSubscribers', S.token);
    drawSubscribers();
    toast(res.note || 'Listo');
  }, r ? 'Guardar' : 'Enviar invitación');
}

function deleteSubscriber(r) {
  const connected = !!S.subs.connected;
  openModal('Eliminar suscriptor', `<p>¿Eliminar a <b>${esc(r.email)}</b> de la lista?</p>
    <p class="muted">${connected && r.status !== 'baja'
      ? 'Se dará de <b>baja en tu newsletter</b> (deja de recibir el correo) y desaparecerá de esta pantalla. Si solo quieres darlo de baja y conservar el registro, usa <b>Editar → Darlo de baja</b>.'
      : 'Desaparece de esta pantalla y la sincronización <b>no lo volverá a agregar</b>. Si solo dejó de querer el newsletter, es mejor <b>Editar → Dado de baja</b>, así queda el registro de su baja.'}</p>`,
    async () => {
      await api('apiSubscriberDelete', S.token, r.id);
      S.subs = await api('apiSubscribers', S.token);
      drawSubscribers();
      toast('Suscriptor eliminado');
    }, 'Eliminar');
}

function showSyncResult(r) {
  const c = r.counts;
  openModal('Sincronización completa', `
    <div class="grid kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="card pad kpi"><div class="l">Nuevos</div><div class="v">${c.creado}</div></div>
      <div class="card pad kpi"><div class="l">Actualizados</div><div class="v">${c.actualizado}</div></div>
      <div class="card pad kpi"><div class="l">Sin cambios</div><div class="v">${c['sin cambios']}</div></div>
    </div>
    <p>Fuente: <b>${esc(r.source || r.sheet)}</b>. Datos reconocidos: ${r.columns.map(x => '<span class="tag">' + esc(x) + '</span>').join(' ')}</p>
    ${r.errors.length ? '<div class="note">' + r.errors.map(esc).join('<br>') + '</div>' : ''}
    <p class="muted">A partir de ahora se sincroniza sola cada 10 minutos. Puedes forzarla con <b>Sincronizar ahora</b>.</p>`, null);
}

function integrationFields(rec) {
  const d = S.int;
  const fields = d.fields.map(f => Object.assign({}, f, rec && f.name === 'platform' ? { lock: true } : {}));
  if (!rec || (rec.is_pull && !rec.is_d1)) fields.splice(rec ? 1 : 2, 0, ...d.sheetFields);
  if (!rec || rec.platform === 'stripe') {
    const keyFields = d.stripeFields.map(f => rec ? Object.assign({}, f, {
      placeholder: (f.name === 'stripe_key_test' ? rec.has_stripe_test_key : rec.has_stripe_live_key) ? '•••••• guardada — pega otra para reemplazarla' : 'Sin configurar' }) : f);
    fields.splice(fields.findIndex(f => f.name === 'status'), 0, ...keyFields);
  }
  if (!rec || rec.is_d1) fields.splice(rec ? 1 : 2, 0, ...d.d1Fields.map(f => f.name === 'api_token' && rec
    ? Object.assign({}, f, { placeholder: rec.has_token ? '•••••• guardado — pega otro para reemplazarlo' : 'Falta el token: pégalo aquí' }) : f));
  const sig = !rec || rec.supports_signature;
  if (sig) fields.splice(2, 0, {
    name: 'webhook_secret', label: 'Secreto de firma', type: 'text',
    placeholder: rec && rec.has_secret ? '•••••• guardado — escribe otro para reemplazarlo' : 'Pégalo después de crear el webhook en la plataforma',
    hint: 'Con él se verifica que cada pedido o pago venga realmente de tu tienda.',
  });
  return fields;
}

function editIntegration(rec) {
  setTimeout(() => togglePlatformFields(rec), 0);
  openForm({
    title: rec ? 'Editar integración' : 'Conectar plataforma', fields: integrationFields(rec), record: rec,
    onSave: async values => {
      if (rec) values.id = rec.id;
      const r = await api('apiIntegrationSave', S.token, values);
      S.int = await api('apiIntegrations', S.token);
      drawIntegrations();
      if (r.sync) setTimeout(() => showSyncResult(r.sync), 0);
      else if (r.key) setTimeout(() => showGuide(r.integration, r.key), 0);
      else toast('Integración actualizada');
    },
  });
}

/** Muestra solo los campos que aplican a la plataforma elegida. */
function togglePlatformFields(rec) {
  const form = $('#recForm');
  if (!form) return;
  const sel = form.elements.platform;
  const wrap = n => form.elements[n] ? form.elements[n].closest('div') : null;
  const apply = () => {
    const p = S.int.platforms[sel.value] || {};
    [['webhook_secret', !!p.signature], ['source_url', !!p.pull && !p.d1], ['source_sheet', !!p.pull && !p.d1], ['notify_email', !p.pull],
     ['api_token', !!p.d1], ['d1_database_id', !!p.d1], ['d1_account_id', !!p.d1], ['site_url', !!p.d1], ['record_tests', !!p.testable],
     ['stripe_key_test', sel.value === 'stripe'], ['stripe_key_live', sel.value === 'stripe'], ['stock_sync', sel.value === 'stripe']]
      .forEach(([n, show]) => { const w = wrap(n); if (w) w.style.display = show ? '' : 'none'; });
  };
  sel.addEventListener('change', apply);
  apply();
}

/* Inventario ↔ enlaces de pago de Stripe */
async function openStockSync(integ) {
  const w = can('integrations:write');
  openModal('Inventario en Stripe · ' + integ.name, '<div id="ssBody"><div class="empty">Cargando…</div></div>', null, null, true);
  const draw = d => {
    const st = d.status;
    const linkRow = l => {
      const state = l.active ? '<span class="tag activo">Activo</span>' : l.by_crm ? '<span class="tag agotado">Pausado por inventario</span>' : '<span class="tag inactivo">Desactivado por ti</span>';
      return `<div class="ss-link">
        <div class="ss-head"><span>${state} <span class="tag ${l.mode === 'test' ? 'prueba' : ''}">${l.mode === 'test' ? 'PRUEBA' : 'REAL'}</span></span>
          ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener" class="sm">${esc(l.url.replace(/^https:\/\//, ''))}</a>` : ''}</div>
        ${l.items.map(it => `<div class="ss-item">
          <span><b>${esc(it.name)}</b><br><span class="muted sm">${it.product ? 'Ligado a ' + esc(it.product) + (it.sku ? ' · ' + esc(it.sku) : '') : 'Sin ligar: ponle el metadato sku en Stripe o el mismo nombre que en tu catálogo'}</span></span>
          <span class="num">${it.product ? (it.tracked ? `<b class="qty ${it.stock <= 0 ? 'agotado' : ''}">${qtyFmt(it.stock)}</b> <span class="muted sm">en existencia</span>` : '<span class="muted sm">No controla inventario</span>') : ''}
            ${it.adjustable ? `<br><span class="muted sm">Máx. por compra: <b>${it.max}</b>${it.user_max && it.user_max !== it.max ? ' (tu tope: ' + it.user_max + ')' : ''}</span>` : `<br><span class="muted sm">Cantidad fija: ${it.qty}</span>`}</span>
        </div>`).join('')}
      </div>`;
    };
    $('#ssBody').innerHTML = `
      <p class="muted" style="margin-top:0">${d.enabled
        ? 'Activado. Cuando un producto se agota, su enlace de pago se pausa; cuando recibes mercadería, se reactiva. La cantidad máxima por compra nunca supera lo que tienes.'
        : 'Apagado. Actívalo en <b>Editar</b> → "Pausar enlaces de pago cuando se agote el inventario". Mientras tanto puedes revisar qué enlaces están ligados a tu catálogo.'}</p>
      ${st ? `<div class="note ${st.ok ? '' : 'bad-note'}">${st.ok ? '' : '<b>Error:</b> '}${esc(st.message || '')} <span class="muted sm">· ${fmtDate(st.at)}</span></div>` : ''}
      ${w ? '<div style="margin:10px 0 14px"><button class="btn primary" id="ssRun">Revisar ahora</button> <span class="muted sm">Lee tus enlaces de Stripe y los ajusta. También se hace solo cada hora y con cada movimiento de inventario.</span></div>' : ''}
      ${d.links.length ? d.links.map(linkRow).join('') : '<div class="empty">Todavía no hay enlaces leídos. Pulsa "Revisar ahora".</div>'}`;
    if ($('#ssRun')) $('#ssRun').onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Revisando…';
      try { draw(await api('apiStockSyncRun', S.token, integ.id)); toast('Enlaces revisados'); }
      catch (e) { toast(e.message, true); ev.target.disabled = false; ev.target.textContent = 'Revisar ahora'; }
    };
  };
  try { draw(await api('apiStockSyncStatus', S.token, integ.id)); }
  catch (e) { $('#ssBody').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

function rotateKey(i) {

function deleteIntegration(i) {

function editWebhook(h) {
  const events = S.int.webhookEvents;
  const checks = `<div class="wide"><label class="f">Eventos *</label>${events.map(e => `<label style="display:flex;gap:8px;align-items:center;margin:6px 0">
    <input type="checkbox" name="ev_${e[0]}" ${!h || h.events.indexOf(e[0]) >= 0 ? 'checked' : ''}> ${esc(e[1])} <code class="muted">${e[0]}</code></label>`).join('')}</div>`;
  const body = `<form class="form" id="recForm">${S.int.webhookFields.map(f => fieldHtml(f, h ? h[f.name] : undefined, false)).join('')}${checks}</form>`;
  openModal(h ? 'Editar webhook' : 'Nuevo webhook de salida', body, async () => {
    const form = $('#recForm');
    if (!form.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = readFormValues(form, S.int.webhookFields);
    values.events = events.map(e => e[0]).filter(k => form.elements['ev_' + k].checked);
    if (h) values.id = h.id;
    const r = await api('apiWebhookSave', S.token, values);
    S.int = await api('apiIntegrations', S.token); drawIntegrations();
    if (r.secret) setTimeout(() => openModal('Webhook creado', `<p>Secreto para verificar la firma <code>X-Nexo-Signature</code>:</p>
      <div class="secret">${esc(r.secret)}</div><p class="muted">Guárdalo: no se volverá a mostrar. Los avisos se envían en menos de un minuto.</p>`, null), 0);
    else toast('Webhook actualizado');
  }, 'Guardar');
}

/* ---------- Guías por plataforma ---------- */

function showGuide(i, key) {
  const d = S.int;
  const base = d.webAppUrl || 'https:\/\/script.google.com/macros/s/TU_ID/exec';
  const k = key || i.public_key || '';
  const K = k || 'TU_CLAVE_SECRETA';
  const relay = (d.relayUrl || 'https:\/\/TU-RELEVO.workers.dev') + '/in/' + K;
  if (i.is_pull) { openModal('Cómo funciona: ' + i.name, (i.is_d1 ? GUIDES.cloudflare_d1 : GUIDES.google_sheet)({ base, i }), null, null, true); return; }
  let html = '';
  if (key) html += `<div class="note ok-note"><b>Tu clave${i.is_public ? '' : ' secreta'}:</b><div class="secret" style="margin-top:8px">${esc(key)}</div>
    ${i.is_public ? 'Es pública: puede ir en tu página web, solo sirve para ' + (i.platform === 'catalog' ? 'leer el catálogo' : 'enviar prospectos') + '.' : '<b>Cópiala ahora:</b> por seguridad no se volverá a mostrar. Ya va incluida en las instrucciones de abajo.'}</div>`;
  else if (!k) html += `<div class="note">La clave secreta solo se muestra al crearla. Donde diga <code>TU_CLAVE_SECRETA</code> usa la que guardaste, o genera una con "Nueva clave".</div>`;
  if (i.needs_relay && !d.relayUrl) html += `<div class="note">Antes, instala el <b>relevo</b> (sección "Relevo" en esta pantalla) y guarda su URL.</div>`;
  html += (GUIDES[i.platform] || (() => ''))({ base, key: K, relay, i });
  openModal('Conectar: ' + i.name, html, null, null, true);
}

    ${codeBlock(`{
  "id": "OBX-…", "event": "sale.created", "created_at": "2026-11-03T16:40:00Z",
  "data": { "number": "V-000123", "external_number": "#1029", "status": "pagada",
            "total": 448, "currency": "USD", "customer": { "name": "…", "email": "…" }, "items": [ … ] }
}`)}
    <p>Eventos: <code>lead.created</code>, <code>customer.created</code>, <code>sale.created</code>, <code>sale.updated</code>. Se envían en menos de un minuto, con hasta 6 reintentos si el destino falla.</p>
    <p>Para verificar que el aviso viene de tu sistema, compara el encabezado <code>X-Nexo-Signature</code> (Node.js):</p>
    ${codeBlock(`const crypto = require('crypto');
const expected = crypto.createHmac('sha256', process.env.NEXO_SECRET).update(rawBody).digest('hex');
const valido = crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(req.headers['x-nexo-signature']));`)}`;
}
