        <td>${esc(s.register)}<div class="muted sm">${esc(locName(s.location))}</div></td><td>${esc(fmtDate(s.opened_at))}<div class="muted sm">${esc(s.opened_by_name)}</div></td>
        <td class="num">${s.sales_count}<div class="muted sm">${esc(pm(s.sales_total))}</div></td>
        <td class="num">${s.difference === null ? '—' : '<b class="' + (s.difference < 0 ? 'neg' : s.difference > 0 ? 'warn' : 'pos') + '">' + esc(pm(s.difference)) + '</b>'}</td>
        <td class="actions">${s.status === 'cerrada' ? `<button class="btn sm" data-z="${i}">Ver cierre</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Todavía no hay turnos.</div>';
    document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => showSessionReport(rows[Number(b.dataset.z)]));
  } catch (e) { $('#modal .body').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

/* ============================ Suscriptores ============================ */

const SUB_STATUS = { activo: 'Activo', pendiente: 'Pendiente', baja: 'Baja' };
const SUB_LANG = { es: 'Español', en: 'English', ambos: 'Ambos' };

async function viewSubscribers() {
  const main = $('#main');
  main.innerHTML = pageHeader('Suscriptores', '<button class="btn" id="csvBtn">Exportar CSV</button>' +
    (can('marketing:write') ? ' <button class="btn primary" id="addSub">+ Agregar</button>' : '')) + '<div id="subBody"><div class="card empty">Cargando…</div></div>';
  setTimeout(() => { if ($('#addSub') && S.subs && S.subs.connected) $('#addSub').textContent = '+ Invitar'; }, 0);
  if ($('#addSub')) $('#addSub').onclick = () => editSubscriber(null);
  try {
    await apiFresh('apiSubscribers', [], d => {
      S.subs = d;
      if (S.view === 'subscribers') drawSubscribers();
      if ($('#addSub') && S.subs.connected) $('#addSub').textContent = '+ Invitar';
    });
  } catch (e) { $('#subBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
}

function drawSubscribers() {
  const st = S.subs.stats;
  const kpi = (l, v, hint) => `<div class="card pad kpi"><div class="l">${l}</div><div class="v">${v}</div>${hint ? '<div class="hint">' + hint + '</div>' : ''}</div>`;
  if (!S.subs.rows.length) {
    $('#subBody').innerHTML = `<div class="card empty">Aún no hay suscriptores.<br><br>Conecta la hoja de tu newsletter en <b>Integraciones → Conectar plataforma → Google Sheets</b>, agrégalos con <b>+ Agregar</b>, o envíalos en tiempo real desde tu sitio.</div>`;
    $('#csvBtn').disabled = true;
    return;
  }
  $('#subBody').innerHTML = `
    <div class="grid kpis">
      ${kpi('Activos', st.activo, 'Reciben el correo')}${kpi('Pendientes', st.pendiente, 'Sin confirmar')}${kpi('Bajas', st.baja)}
      ${kpi('Activos que ya son clientes', st.clientes, st.activo ? Math.round(st.clientes / st.activo * 100) + '% de los activos' : '')}
      ${kpi('Activos por idioma', `<span style="font-size:16px;line-height:1.6">Español ${st.es}<br>English ${st.en} · Ambos ${st.ambos}</span>`)}
    </div>
    ${S.subs.connected ? `<div class="note ok-note" style="margin:0 0 12px">Conectado con tu newsletter (<b>${esc(S.subs.connected.name)}</b>): las bajas, invitaciones y cambios de idioma se aplican en la lista real.</div>` : ''}
    <div class="toolbar" style="flex-wrap:wrap">
      <input class="input" id="q" placeholder="Buscar correo…">
      <select class="input" id="fStatus" style="max-width:180px"><option value="">Todos los estados</option>${Object.keys(SUB_STATUS).map(k => `<option value="${k}">${SUB_STATUS[k]}</option>`).join('')}</select>
      <select class="input" id="fLang" style="max-width:160px"><option value="">Todos los idiomas</option>${Object.keys(SUB_LANG).map(k => `<option value="${k}">${SUB_LANG[k]}</option>`).join('')}</select>
      <select class="input" id="fCust" style="max-width:200px"><option value="">Clientes y no clientes</option><option value="si">Ya son clientes</option><option value="no">Aún no compran</option></select>
    </div>
    <div class="card tablewrap" id="list"></div>`;
  ['#q', '#fStatus', '#fLang', '#fCust'].forEach(s => $(s).addEventListener('input', drawSubscriberRows));
  $('#csvBtn').onclick = exportSubscribers;
  drawSubscriberRows();
}

function filteredSubscribers() {
  const q = ($('#q').value || '').toLowerCase().trim(), fs = $('#fStatus').value, fl = $('#fLang').value, fc = $('#fCust').value;
  return S.subs.rows.filter(r => (!q || r.email.indexOf(q) >= 0) && (!fs || r.status === fs) && (!fl || r.language === fl) &&
    (!fc || (fc === 'si' ? !!r.customer_id : !r.customer_id)));
}

function drawSubscriberRows() {
  const rows = filteredSubscribers();
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  const w = can('marketing:write'), del = can('marketing:delete');
  $('#list').innerHTML = `<table class="wrap"><thead><tr><th>Correo</th><th>Idioma</th><th>Estado</th><th>Fechas</th><th>En el CRM</th><th>Origen</th>${w || del ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.map(r => `<tr><td style="white-space:nowrap">${esc(r.email)}${contactIcons(r.email, r.phone)}</td><td>${esc(SUB_LANG[r.language] || '—')}</td>
      <td><span class="tag ${r.status === 'activo' ? 'activo' : r.status === 'baja' ? 'cancelada' : 'pendiente'}">${esc(SUB_STATUS[r.status] || r.status)}</span>
        ${r.status_source === 'manual' && r.sheet_status && r.sheet_status !== r.status ? '<span class="drift" title="Cambiado a mano en el CRM">En tu hoja: ' + esc(SUB_STATUS[r.sheet_status] || r.sheet_status) + '</span>' : ''}</td>
      <td class="muted" style="white-space:nowrap;font-size:13px">Alta: ${esc(r.subscribed_at || '—')}<br>${r.unsubscribed_at && r.status === 'baja' ? 'Baja: ' + esc(r.unsubscribed_at) : 'Confirmó: ' + esc(r.confirmed_at || '—')}
        ${r.consent_at ? `<br><span style="color:var(--brand)" title="${esc(r.consent_method || '')}">✓ Consentimiento ${esc(String(r.consent_at).slice(0, 10))}</span>` : ''}</td>
      <td>${r.customer_id ? '<span class="tag activo">Cliente</span> ' + esc(r.customer_name) : r.lead_id ? '<span class="tag nuevo">Prospecto</span>' : '<span class="muted">—</span>'}</td>
      <td class="muted">${esc(r.source || '')}</td>
      ${w || del ? `<td class="actions">${w ? `<button class="btn sm" data-sedit="${esc(r.id)}">Editar</button>` : ''}${del ? `<button class="btn sm danger" data-sdel="${esc(r.id)}">Eliminar</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table>
    <div class="muted" style="padding:10px 14px">${rows.length} de ${S.subs.rows.length}</div>`;
  $('#list').querySelectorAll('[data-sedit]').forEach(b => b.onclick = () => editSubscriber(S.subs.rows.find(r => r.id === b.dataset.sedit)));
  $('#list').querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => deleteSubscriber(S.subs.rows.find(r => r.id === b.dataset.sdel)));
}

function exportSubscribers() {
  const rows = filteredSubscribers();
  const cols = ['email', 'language', 'status', 'subscribed_at', 'confirmed_at', 'unsubscribed_at', 'consent_at', 'consent_method', 'customer_name', 'source'];
  const q = v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'suscriptores-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast(rows.length + ' suscriptores exportados');
  } catch (e) {
    openModal('Exportar CSV', '<p class="muted">Tu navegador bloqueó la descarga. Copia el contenido:</p>' + codeBlock(csv.slice(1)), null, null, true);
  }
}

function editSubscriber(r) {
  if (S.subs.connected) return editSubscriberConnected(r);
  const langOpts = [['es', 'Español'], ['en', 'English'], ['ambos', 'Ambos'], ['', '—']];
  const statusOpts = r ? [['activo', 'Activo'], ['pendiente', 'Pendiente de confirmar'], ['baja', 'Dado de baja']]
                       : [['activo', 'Activo'], ['pendiente', 'Pendiente de confirmar']];
  const sel = (name, opts, v) => `<select class="input" name="${name}">${opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const body = `<form class="form" id="recForm">
      <div class="wide"><label class="f">Correo *</label><input class="input" name="email" type="email" value="${esc(r ? r.email : '')}" ${r ? 'disabled' : 'required'}></div>
      <div><label class="f">Idioma</label>${sel('language', langOpts, r ? r.language : 'es')}</div>
      <div><label class="f">Estado *</label>${sel('status', statusOpts, r ? r.status : 'activo')}</div>
      ${r ? '' : `<div class="wide"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" style="margin-top:3px">
        <span>Esta persona aceptó recibir mis correos (por ejemplo, se inscribió en persona, en un evento o me lo pidió por escrito).</span></label></div>`}
      <div class="wide note" style="margin:0">Este cambio queda en el CRM y la sincronización con tu hoja lo respeta. <b>Tu plataforma de envío del newsletter no se entera</b>:
        para que alguien deje de recibir (o empiece a recibir) el correo, cámbialo también allí.</div>
    </form>`;
  openModal(r ? 'Editar suscriptor' : 'Agregar suscriptor', body, async () => {
    const f = $('#recForm');
    if (!f.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = { language: f.elements.language.value, status: f.elements.status.value };
    if (r) values.id = r.id; else { values.email = f.elements.email.value; values.consent = f.elements.consent.checked; }
    await api('apiSubscriberSave', S.token, values);
    S.subs = await api('apiSubscribers', S.token);
    drawSubscribers();
    toast(r ? 'Suscriptor actualizado' : 'Suscriptor agregado');
  }, r ? 'Guardar' : 'Agregar');
}

function editSubscriberConnected(r) {
  const langOpts = [['es', 'Español'], ['en', 'English'], ['ambos', 'Ambos']];
  const sel = (name, opts, v) => `<select class="input" name="${name}">${opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const actions = !r ? null : r.status === 'activo'
    ? [['', 'Sigue suscrito'], ['baja', 'Darlo de baja del newsletter']]
    : r.status === 'pendiente'
      ? [['', 'Esperar su confirmación'], ['invite', 'Reenviar el correo de confirmación'], ['baja', 'Darlo de baja']]
      : [['', 'Sigue dado de baja'], ['invite', 'Invitarlo a suscribirse de nuevo']];
  const canInvite = S.subs.connected.canInvite;
  const body = `<form class="form" id="recForm">
      <div class="wide"><label class="f">Correo *</label><input class="input" name="email" type="email" value="${esc(r ? r.email : '')}" ${r ? 'disabled' : 'required'}></div>
      <div><label class="f">Idioma del newsletter</label>${sel('language', langOpts, r ? (r.language || 'ambos') : 'es')}</div>
      ${r ? `<div><label class="f">Acción</label>${sel('action', actions, '')}</div>` : ''}
      <div class="wide note ok-note" style="margin:0">${r
        ? 'Los cambios se aplican en tu newsletter. Una baja surte efecto de inmediato. Para reactivar a alguien, el newsletter le envía su correo de confirmación.'
        : 'Le enviaremos el <b>correo de confirmación de tu newsletter</b>. Aparecerá como <b>activo</b> cuando lo confirme, y su consentimiento quedará registrado solo.'}</div>
      ${!canInvite && (!r || r.status !== 'activo') ? '<div class="wide note" style="margin:0">Para invitar, configura la página de suscripción en <b>Integraciones → Editar</b>.</div>' : ''}
    </form>`;
  openModal(r ? 'Editar suscriptor' : 'Invitar al newsletter', body, async () => {
    const f = $('#recForm');
    if (!f.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = { language: f.elements.language.value };
    if (r) {
      values.id = r.id;
      const a = f.elements.action.value;
      values.status = a === 'baja' ? 'baja' : r.status;
      if (a === 'invite') values.invite = true;
    } else { values.email = f.elements.email.value; values.status = 'pendiente'; }
    const res = await api('apiSubscriberSave', S.token, values);
    S.subs = await api('apiSubscribers', S.token);
    drawSubscribers();
    toast(res.note || 'Listo');
  }, r ? 'Guardar' : 'Enviar invitación');
}

function deleteSubscriber(r) {
  const connected = !!S.subs.connected;
  openModal('Eliminar suscriptor', `<p>¿Eliminar a <b>${esc(r.email)}</b> de la lista?</p>
    <p class="muted">${connected && r.status !== 'baja'
      ? 'Se dará de <b>baja en tu newsletter</b> (deja de recibir el correo) y desaparecerá de esta pantalla. Si solo quieres darlo de baja y conservar el registro, usa <b>Editar → Darlo de baja</b>.'
      : 'Desaparece de esta pantalla y la sincronización <b>no lo volverá a agregar</b>. Si solo dejó de querer el newsletter, es mejor <b>Editar → Dado de baja</b>, así queda el registro de su baja.'}</p>`,
    async () => {
      await api('apiSubscriberDelete', S.token, r.id);
      S.subs = await api('apiSubscribers', S.token);
      drawSubscribers();
      toast('Suscriptor eliminado');
    }, 'Eliminar');
}

function showSyncResult(r) {
  const c = r.counts;
  openModal('Sincronización completa', `
    <div class="grid kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="card pad kpi"><div class="l">Nuevos</div><div class="v">${c.creado}</div></div>
      <div class="card pad kpi"><div class="l">Actualizados</div><div class="v">${c.actualizado}</div></div>
      <div class="card pad kpi"><div class="l">Sin cambios</div><div class="v">${c['sin cambios']}</div></div>
    </div>
    <p>Fuente: <b>${esc(r.source || r.sheet)}</b>. Datos reconocidos: ${r.columns.map(x => '<span class="tag">' + esc(x) + '</span>').join(' ')}</p>
    ${r.errors.length ? '<div class="note">' + r.errors.map(esc).join('<br>') + '</div>' : ''}
    <p class="muted">A partir de ahora se sincroniza sola cada 10 minutos. Puedes forzarla con <b>Sincronizar ahora</b>.</p>`, null);
}

/* ============================ Integraciones ============================ */

const EV_STATUS = { creado: 'Creado', actualizado: 'Actualizado', duplicado: 'Duplicado', spam: 'Spam', ignorado: 'Ignorado', 'sin cambios': 'Sin cambios',
  error: 'Error', rechazado: 'Rechazado', ok: 'OK', reprocesado: 'Reprocesado' };

async function viewIntegrations() {
  const main = $('#main');
  const w = can('integrations:write');
  main.innerHTML = pageHeader('Integraciones', w ? '<button class="btn primary" id="newInt">+ Conectar plataforma</button>' : '') +
    '<div id="intBody"><div class="card empty">Cargando…</div></div>';
  if ($('#newInt')) $('#newInt').onclick = () => editIntegration(null);
  try { await apiFresh('apiIntegrations', [], d => { S.int = d; if (S.view === 'integrations') drawIntegrations(); }); }
  catch (e) { $('#intBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
}

function drawIntegrations() {
  const d = S.int, w = can('integrations:write');
  const needsRelay = d.integrations.some(i => i.needs_relay);

  $('#intBody').innerHTML = warnUrl + `
    <div class="card tablewrap">${d.integrations.length ? `<table class="wrap"><thead><tr><th>Nombre</th><th>Plataforma</th><th>Clave</th><th>Estado</th><th class="num">Eventos</th><th>Último</th><th></th></tr></thead>
      <tbody>${d.integrations.map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.platform_label)}${i.supports_signature ? (i.has_secret ? ' <span class="tag activo">firmado</span>' : ' <span class="tag pendiente">sin firma</span>') : ''}</td>
        <td>${i.is_pull ? '<span class="muted" title="' + esc(i.last_sync_result || '') + '">Cada 10 min</span>' : '<code>' + esc(i.key_hint) + '</code>'}</td><td><span class="tag ${i.status === 'activo' ? 'activo' : 'inactivo'}">${i.status === 'activo' ? 'Activa' : 'Pausada'}</span></td>
        <td class="num">${esc(i.events_count)}</td><td class="muted">${i.last_event_at ? fmtDate(i.last_event_at) : 'Nunca'}</td>
        <td class="actions">${i.is_pull && w ? `<button class="btn sm primary" data-sync="${esc(i.id)}">Sincronizar ahora</button>` : ''}${i.platform === 'stripe' ? `<button class="btn sm ${i.stock_sync ? 'primary' : ''}" data-stock="${esc(i.id)}">Inventario</button>` : ''}<button class="btn sm" data-guide="${esc(i.id)}">${i.is_pull ? 'Cómo funciona' : 'Cómo conectar'}</button>${w ? `<button class="btn sm" data-edit="${esc(i.id)}">Editar</button>
          ${i.is_pull ? '' : `<button class="btn sm" data-rotate="${esc(i.id)}">Nueva clave</button>`}<button class="btn sm danger" data-del="${esc(i.id)}">Eliminar</button>` : ''}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">Conecta tu primer formulario, tienda o plataforma de pagos.<br><br>${w ? '<button class="btn primary" id="newInt2">+ Conectar plataforma</button>' : ''}</div>`}</div>

    <div class="section card pad">

      <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="input" id="relayUrl" style="max-width:420px" placeholder="https:\/\/nexo-relay.tu-cuenta.workers.dev" value="${esc(d.relayUrl)}" ${w ? '' : 'disabled'}>
        ${w ? '<button class="btn" id="relaySave">Guardar</button>' : ''}<button class="btn" id="relayGuide">Cómo instalarlo</button></div>

    <div class="section card pad">
      <h3><span>Webhooks de salida <span class="muted" style="font-weight:400">— avisa a Zapier, Make, n8n u otro sistema</span></span>
        <span>${w ? '<button class="btn sm" id="runOutbox">Enviar pendientes</button> <button class="btn sm primary" id="newHook">+ Webhook</button>' : ''}</span></h3>
      ${d.webhooks.length ? `<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Eventos</th><th>Estado</th><th>Última respuesta</th><th class="num">En cola</th><th></th></tr></thead>
        <tbody>${d.webhooks.map(h => `<tr><td>${esc(h.name)}<br><span class="muted">${esc(h.url.slice(0, 60))}</span></td>
          <td><div class="chips">${h.events.map(e => '<span class="tag">' + esc(e) + '</span>').join('')}</div></td>
          <td><span class="tag ${h.status === 'activo' ? 'activo' : 'inactivo'}">${h.status === 'activo' ? 'Activo' : 'Pausado'}</span></td>

    b.disabled = true; b.textContent = 'Sincronizando…';
    try { const r = await api('apiIntegrationSync', S.token, b.dataset.sync); S.int = await api('apiIntegrations', S.token); drawIntegrations(); showSyncResult(r); }
    catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Sincronizar ahora'; }
  });
  on('[data-stock]', b => openStockSync(d.integrations.find(i => i.id === b.dataset.stock)));
  on('[data-del]', b => deleteIntegration(d.integrations.find(i => i.id === b.dataset.del)));
  on('[data-re]', async b => { b.disabled = true; try { const st = await api('apiIntegrationReprocess', S.token, b.dataset.re); toast('Reprocesado: ' + st); viewIntegrations(); } catch (e) { toast(e.message, true); b.disabled = false; } });
  on('[data-htest]', async b => { b.disabled = true; try { await api('apiWebhookTest', S.token, b.dataset.htest); toast('El destino respondió correctamente'); viewIntegrations(); } catch (e) { toast(e.message, true); b.disabled = false; } });
  on('[data-hedit]', b => editWebhook(d.webhooks.find(h => h.id === b.dataset.hedit)));
  on('[data-hdel]', b => { const h = d.webhooks.find(x => x.id === b.dataset.hdel);
    openModal('Eliminar webhook', `<p>¿Eliminar <b>${esc(h.name)}</b>? Dejará de recibir avisos.</p>`, async () => { await api('apiWebhookDelete', S.token, h.id); viewIntegrations(); }, 'Eliminar'); });
  if ($('#newHook')) $('#newHook').onclick = () => editWebhook(null);
  if ($('#runOutbox')) $('#runOutbox').onclick = async () => { try { const n = await api('apiOutboxRun', S.token); toast(n ? n + ' avisos procesados' : 'No hay avisos pendientes'); viewIntegrations(); } catch (e) { toast(e.message, true); } };
  if ($('#relaySave')) $('#relaySave').onclick = async () => { try { S.int.relayUrl = await api('apiRelaySave', S.token, $('#relayUrl').value); toast('Relevo guardado'); } catch (e) { toast(e.message, true); } };
  $('#relayGuide').onclick = () => openModal('Instalar el relevo en Cloudflare (gratis, 5 minutos)', relayGuideHtml(), null, null, true);
  $('#hookGuide').onclick = ev => { ev.preventDefault(); openModal('Webhooks de salida', hookGuideHtml(), null, null, true); };
}

function integrationFields(rec) {
  const d = S.int;
  const fields = d.fields.map(f => Object.assign({}, f, rec && f.name === 'platform' ? { lock: true } : {}));
  if (!rec || (rec.is_pull && !rec.is_d1)) fields.splice(rec ? 1 : 2, 0, ...d.sheetFields);
  if (!rec || rec.platform === 'stripe') {
    const keyFields = d.stripeFields.map(f => rec ? Object.assign({}, f, {
      placeholder: (f.name === 'stripe_key_test' ? rec.has_stripe_test_key : rec.has_stripe_live_key) ? '•••••• guardada — pega otra para reemplazarla' : 'Sin configurar' }) : f);
    fields.splice(fields.findIndex(f => f.name === 'status'), 0, ...keyFields);
  }
  if (!rec || rec.is_d1) fields.splice(rec ? 1 : 2, 0, ...d.d1Fields.map(f => f.name === 'api_token' && rec
    ? Object.assign({}, f, { placeholder: rec.has_token ? '•••••• guardado — pega otro para reemplazarlo' : 'Falta el token: pégalo aquí' }) : f));
  const sig = !rec || rec.supports_signature;
  if (sig) fields.splice(2, 0, {
    name: 'webhook_secret', label: 'Secreto de firma', type: 'text',
    placeholder: rec && rec.has_secret ? '•••••• guardado — escribe otro para reemplazarlo' : 'Pégalo después de crear el webhook en la plataforma',
    hint: 'Con él se verifica que cada pedido o pago venga realmente de tu tienda.',
  });
  return fields;
}

function editIntegration(rec) {
  setTimeout(() => togglePlatformFields(rec), 0);
  openForm({
    title: rec ? 'Editar integración' : 'Conectar plataforma', fields: integrationFields(rec), record: rec,
    onSave: async values => {
      if (rec) values.id = rec.id;
      const r = await api('apiIntegrationSave', S.token, values);
      S.int = await api('apiIntegrations', S.token);
      drawIntegrations();
      if (r.sync) setTimeout(() => showSyncResult(r.sync), 0);
      else if (r.key) setTimeout(() => showGuide(r.integration, r.key), 0);
      else toast('Integración actualizada');
    },
  });
}

/** Muestra solo los campos que aplican a la plataforma elegida. */
function togglePlatformFields(rec) {
  const form = $('#recForm');
  if (!form) return;
  const sel = form.elements.platform;
  const wrap = n => form.elements[n] ? form.elements[n].closest('div') : null;
  const apply = () => {
    const p = S.int.platforms[sel.value] || {};
    [['webhook_secret', !!p.signature], ['source_url', !!p.pull && !p.d1], ['source_sheet', !!p.pull && !p.d1], ['notify_email', !p.pull],
     ['api_token', !!p.d1], ['d1_database_id', !!p.d1], ['d1_account_id', !!p.d1], ['site_url', !!p.d1], ['record_tests', !!p.testable],
     ['stripe_key_test', sel.value === 'stripe'], ['stripe_key_live', sel.value === 'stripe'], ['stock_sync', sel.value === 'stripe']]
      .forEach(([n, show]) => { const w = wrap(n); if (w) w.style.display = show ? '' : 'none'; });
  };
  sel.addEventListener('change', apply);
  apply();
}

/* Inventario ↔ enlaces de pago de Stripe */
async function openStockSync(integ) {
  const w = can('integrations:write');
  openModal('Inventario en Stripe · ' + integ.name, '<div id="ssBody"><div class="empty">Cargando…</div></div>', null, null, true);
  const draw = d => {
    const st = d.status;
    const linkRow = l => {
      const state = l.active ? '<span class="tag activo">Activo</span>' : l.by_crm ? '<span class="tag agotado">Pausado por inventario</span>' : '<span class="tag inactivo">Desactivado por ti</span>';
      return `<div class="ss-link">
        <div class="ss-head"><span>${state} <span class="tag ${l.mode === 'test' ? 'prueba' : ''}">${l.mode === 'test' ? 'PRUEBA' : 'REAL'}</span></span>
          ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener" class="sm">${esc(l.url.replace(/^https:\/\//, ''))}</a>` : ''}</div>
        ${l.items.map(it => `<div class="ss-item">
          <span><b>${esc(it.name)}</b><br><span class="muted sm">${it.product ? 'Ligado a ' + esc(it.product) + (it.sku ? ' · ' + esc(it.sku) : '') : 'Sin ligar: ponle el metadato sku en Stripe o el mismo nombre que en tu catálogo'}</span></span>
          <span class="num">${it.product ? (it.tracked ? `<b class="qty ${it.stock <= 0 ? 'agotado' : ''}">${qtyFmt(it.stock)}</b> <span class="muted sm">en existencia</span>` : '<span class="muted sm">No controla inventario</span>') : ''}
            ${it.adjustable ? `<br><span class="muted sm">Máx. por compra: <b>${it.max}</b>${it.user_max && it.user_max !== it.max ? ' (tu tope: ' + it.user_max + ')' : ''}</span>` : `<br><span class="muted sm">Cantidad fija: ${it.qty}</span>`}</span>
        </div>`).join('')}
      </div>`;
    };
    $('#ssBody').innerHTML = `
      <p class="muted" style="margin-top:0">${d.enabled
        ? 'Activado. Cuando un producto se agota, su enlace de pago se pausa; cuando recibes mercadería, se reactiva. La cantidad máxima por compra nunca supera lo que tienes.'
        : 'Apagado. Actívalo en <b>Editar</b> → "Pausar enlaces de pago cuando se agote el inventario". Mientras tanto puedes revisar qué enlaces están ligados a tu catálogo.'}</p>
      ${st ? `<div class="note ${st.ok ? '' : 'bad-note'}">${st.ok ? '' : '<b>Error:</b> '}${esc(st.message || '')} <span class="muted sm">· ${fmtDate(st.at)}</span></div>` : ''}
      ${w ? '<div style="margin:10px 0 14px"><button class="btn primary" id="ssRun">Revisar ahora</button> <span class="muted sm">Lee tus enlaces de Stripe y los ajusta. También se hace solo cada hora y con cada movimiento de inventario.</span></div>' : ''}
      ${d.links.length ? d.links.map(linkRow).join('') : '<div class="empty">Todavía no hay enlaces leídos. Pulsa "Revisar ahora".</div>'}`;
    if ($('#ssRun')) $('#ssRun').onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Revisando…';
      try { draw(await api('apiStockSyncRun', S.token, integ.id)); toast('Enlaces revisados'); }
      catch (e) { toast(e.message, true); ev.target.disabled = false; ev.target.textContent = 'Revisar ahora'; }
    };
  };
  try { draw(await api('apiStockSyncStatus', S.token, integ.id)); }
  catch (e) { $('#ssBody').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

function rotateKey(i) {
  openModal('Nueva clave', `<p>Se generará una clave nueva para <b>${esc(i.name)}</b>. <b>La actual dejará de funcionar</b> y tendrás que actualizarla en la plataforma.</p>`, async () => {
    const r = await api('apiIntegrationRotate', S.token, i.id);
    S.int = await api('apiIntegrations', S.token); drawIntegrations();
    setTimeout(() => showGuide(r.integration, r.key), 0);
  }, 'Generar');
}

function deleteIntegration(i) {
  openModal('Eliminar integración', `<p>¿Eliminar <b>${esc(i.name)}</b>? Su clave dejará de funcionar de inmediato. El historial se conserva.</p>`, async () => {
    await api('apiIntegrationDelete', S.token, i.id);
    S.int = await api('apiIntegrations', S.token); drawIntegrations();
  }, 'Eliminar');
}

function editWebhook(h) {
  const events = S.int.webhookEvents;
  const checks = `<div class="wide"><label class="f">Eventos *</label>${events.map(e => `<label style="display:flex;gap:8px;align-items:center;margin:6px 0">
    <input type="checkbox" name="ev_${e[0]}" ${!h || h.events.indexOf(e[0]) >= 0 ? 'checked' : ''}> ${esc(e[1])} <code class="muted">${e[0]}</code></label>`).join('')}</div>`;
  const body = `<form class="form" id="recForm">${S.int.webhookFields.map(f => fieldHtml(f, h ? h[f.name] : undefined, false)).join('')}${checks}</form>`;
  openModal(h ? 'Editar webhook' : 'Nuevo webhook de salida', body, async () => {
    const form = $('#recForm');
    if (!form.reportValidity()) throw new Error('Revisa los campos marcados.');
    const values = readFormValues(form, S.int.webhookFields);
    values.events = events.map(e => e[0]).filter(k => form.elements['ev_' + k].checked);
    if (h) values.id = h.id;
    const r = await api('apiWebhookSave', S.token, values);
    S.int = await api('apiIntegrations', S.token); drawIntegrations();
    if (r.secret) setTimeout(() => openModal('Webhook creado', `<p>Secreto para verificar la firma <code>X-Nexo-Signature</code>:</p>
      <div class="secret">${esc(r.secret)}</div><p class="muted">Guárdalo: no se volverá a mostrar. Los avisos se envían en menos de un minuto.</p>`, null), 0);
    else toast('Webhook actualizado');
  }, 'Guardar');
}
