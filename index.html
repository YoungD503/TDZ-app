<style>
  /* ============ Tema: The Desert ZONE de noche (oscuro) y de día (claro) ============ */
  :root, [data-theme="dark"] {
    /* Negro neutro como el newsletter; el verde queda solo como acento */
    color-scheme: dark;
    --bg: #000000; --panel: #141414; --raised: #1C1C1C; --line: #262626; --line-strong: #333333; --input-bg: #0D0D0D;
    --ink: #F5F5F5; --muted: #9B9B9B; --faint: #6B6B6B;
    --brand: #2F6FE4; --brand-ink: #FFFFFF; --brand-text: #7DB2FF; --brand-hover: #3D7DF0; --brand-soft: rgba(47, 111, 228, .16); --brand-line: rgba(61, 125, 240, .45);
    --sand: #E2C08A; --sand-soft: rgba(226, 192, 138, .12); --sand-line: rgba(226, 192, 138, .35);
    --danger: #F87171; --danger-soft: rgba(248, 113, 113, .12);
    --info: #7DB2FF; --info-soft: rgba(125, 178, 255, .12);
    --side: #000000; --side-ink: #B5B5B5; --side-hover: rgba(255, 255, 255, .06);
    --code-bg: #0B0B0B; --code-ink: #E0E0E0;
    --scrim: rgba(0, 0, 0, .72); --shadow: 0 18px 50px rgba(0, 0, 0, .6);
    --warn: var(--sand);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F2F4F0; --panel: #FFFFFF; --raised: #F7F9F6; --line: #DDE3DE; --line-strong: #C7D0CA;
    --ink: #14211B; --muted: #5C6E66; --faint: #8A9A92;
    --brand: #1F5BD0; --brand-ink: #FFFFFF; --brand-text: #1F5BD0; --brand-hover: #2F6FE4; --brand-soft: rgba(31, 91, 208, .10); --brand-line: rgba(31, 91, 208, .35);
    --sand: #9A6B1E; --sand-soft: rgba(154, 107, 30, .10); --sand-line: rgba(154, 107, 30, .35);
    --danger: #B42318; --danger-soft: rgba(180, 35, 24, .08);
    --info: #1D5FA8; --info-soft: rgba(29, 95, 168, .08);
    --side: #12201A; --side-ink: #C3D3CB; --side-hover: rgba(255, 255, 255, .07);
    --code-bg: #12201A; --code-ink: #DDEBE3;
    --scrim: rgba(10, 20, 15, .45); --shadow: 0 18px 50px rgba(20, 33, 27, .18);
    --warn: var(--sand); --input-bg: #FFFFFF;
  }
  :root {
    --radius: 12px; --radius-sm: 8px;
    --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --display: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --brandfont: "Michroma", "Geist", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand-text); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  .btn { border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); padding: 8px 14px; border-radius: var(--radius-sm); min-height: 36px; }
  .btn:hover { border-color: var(--brand-line); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); background: var(--danger-soft); }
  .btn.sm { padding: 4px 10px; font-size: 13px; min-height: 30px; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .input { width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--input-bg); min-height: 40px; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .input:disabled { opacity: .7; }
  input[type="checkbox"] { accent-color: var(--brand); width: 16px; height: 16px; }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .hint { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
  .muted { color: var(--muted); }
  code { font-size: 12.5px; }

  /* Ingreso */
  .center { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .auth { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px 28px; box-shadow: var(--shadow); }
  .auth h1 { margin: 0 0 4px; font: 600 26px/1.15 var(--display); letter-spacing: -.01em; }
  .auth .row { margin-top: 14px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .logo { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font: 700 14px var(--display); margin-bottom: 16px; }

  /* Estructura */
  .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 1px;
          position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); }
  .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; color: #fff; font: 400 13px var(--brandfont); letter-spacing: .02em; }
  .side .brand .logo { font-family: var(--display); font-weight: 700; }
  .side .brand .logo { margin: 0; width: 32px; height: 32px; font-size: 13px; }
  .side .group { font-size: 12px; color: var(--faint); padding: 18px 12px 6px; }
  .nav { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0;
         color: inherit; padding: 9px 12px; border-radius: var(--radius-sm); min-height: 38px; }
  .nav:hover { background: var(--side-hover); color: #fff; }
  .nav.on { background: rgba(47, 111, 228, .16); color: #fff; }
  .nav.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #2F6FE4; }
  .nav.soon { opacity: .5; }
  .pill { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: rgba(255, 255, 255, .07); color: var(--side-ink); }
  .side .foot { margin-top: auto; padding: 14px 12px 4px; border-top: 1px solid rgba(255, 255, 255, .07); font-size: 13px; }
  .side .foot b { color: #fff; display: block; }
  .side .foot .links { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; }
  .side .foot a { color: var(--side-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .side .foot a:hover { color: #fff; }
  main { padding: 28px 32px 48px; min-width: 0; max-width: 1480px; width: 100%; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .top h2 { margin: 0; font: 600 26px/1.15 var(--display); letter-spacing: -.015em; }
  .top > div { display: flex; gap: 8px; flex-wrap: wrap; }
  .mobilebar { display: none; }
  .scrim { display: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .card.pad { padding: 18px 20px; }
  .card h3 { margin: 0 0 12px; font: 600 16px var(--display); }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
  .kpi .v { font: 600 34px/1.1 var(--display); margin-top: 6px; color: var(--brand-text); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .hint { color: var(--faint); }
  .two { grid-template-columns: 1fr 1fr; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar .input { max-width: 340px; }
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-size: 12.5px; color: var(--muted); font-weight: 500; background: var(--raised); }
  tbody tr:hover td { background: rgba(47, 111, 228, .035); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  td.actions { text-align: right; white-space: normal; min-width: 250px; }
  table.wrap td { white-space: normal; }
  table.wrap td code { white-space: nowrap; }
  table.wrap td.actions { min-width: 0; white-space: nowrap; }
  td.actions .btn { margin: 3px 0 3px 6px; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .cv { display: contents; }

  .tag { display: inline-block; font-size: 12px; line-height: 1.6; padding: 1px 9px; border-radius: 99px; background: rgba(141, 161, 151, .14); color: var(--muted); white-space: nowrap; }
  .tag.activo, .tag.pagada, .tag.creado, .tag.enviado, .tag.ganado, .tag.ok, .tag.reprocesado { background: var(--brand-soft); color: var(--brand-text); }
  .tag.prospecto, .tag.pendiente, .tag.parcial, .tag.nuevo, .tag.actualizado, .tag.duplicado { background: var(--info-soft); color: var(--info); }
  .tag.cancelada, .tag.reembolsada, .tag.error, .tag.rechazado, .tag.fallido, .tag.perdido { background: var(--danger-soft); color: var(--danger); }
  .tag.contactado, .tag.calificado, .tag.cotizado, .tag.producto, .tag.prueba { background: var(--sand-soft); color: var(--sand); }
  .tag.servicio { background: rgba(178, 150, 255, .14); color: #B9A4FF; }
  [data-theme="light"] .tag.servicio { background: rgba(109, 74, 214, .10); color: #5B3CC4; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .phase { display: flex; gap: 10px; align-items: center; padding: 7px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .dot.done { background: var(--brand); }

  /* Ventanas */
  .backdrop { position: fixed; inset: 0; background: var(--scrim); display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; z-index: 50; backdrop-filter: blur(2px); }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 640px; min-width: 0; max-height: 92vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .modal.wide { max-width: 880px; }
  .modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .modal header h3 { margin: 0; font: 600 18px var(--display); }
  .modal .body { padding: 18px 20px; overflow-y: auto; min-width: 0; }
  .scrollx { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .modal footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
  .modal footer .err { margin: 0 auto 0 0; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .form .wide { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 8px; padding-top: 22px; }
  .secret { font-family: ui-monospace, Menlo, monospace; font-size: 17px; background: var(--brand-soft); color: var(--ink); padding: 12px; border-radius: var(--radius-sm); text-align: center; letter-spacing: .03em; user-select: all; word-break: break-all; }

  pre.code { background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); padding: 12px 14px; border-radius: var(--radius-sm); overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: 6px 0 4px; white-space: pre; }
  .codebox { position: relative; }
  .codebox .copy { position: absolute; top: 6px; right: 6px; background: var(--raised); color: var(--ink); border-color: var(--line-strong); }
  .steps { padding-left: 20px; margin: 6px 0 12px; } .steps li { margin: 6px 0; }
  .note { background: var(--sand-soft); border: 1px solid var(--sand-line); color: var(--ink); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; margin: 10px 0; }
  .ok-note { background: var(--brand-soft); border-color: var(--brand-line); }
  .section { margin-top: 22px; }
  .section h3 { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ic { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: 4px; border-radius: 7px; color: var(--muted); vertical-align: middle; text-decoration: none; }
  .ic:hover { background: var(--brand-soft); color: var(--brand-text); }
  .ic svg { width: 16px; height: 16px; }
  .drift { display: block; font-size: 11.5px; color: var(--sand); margin-top: 2px; }
  #toast { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--danger); color: #1a0705 !important; font-weight: 500; }
  .theme-btn { display: inline-flex; align-items: center; gap: 6px; }

  /* Captura rápida, QR */
  .fab { display: none; position: fixed; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 35; width: 58px; height: 58px; border-radius: 50%;
         border: 0; background: var(--brand); color: var(--brand-ink); box-shadow: 0 10px 28px rgba(0, 0, 0, .35); place-items: center; }
  .fab:active { transform: scale(.96); }
  .fab svg { transition: transform .18s ease; }
  .fab.open svg { transform: rotate(45deg); }
  .fab-scrim { position: fixed; inset: 0; z-index: 34; background: rgba(0, 0, 0, .55); }
  .fab-menu { position: fixed; right: 18px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px); z-index: 36; display: grid; gap: 10px; justify-items: end; }
  .fab-menu button { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px 0 14px; border-radius: 26px; border: 1px solid var(--line-strong);
                     background: var(--raised); color: var(--ink); font: 600 16px var(--font); box-shadow: var(--shadow); }
  .fab-menu button svg { color: var(--brand-text); flex: none; }
  .fab-menu button:active { transform: scale(.98); }
  .qr-pick-row { display: flex !important; width: 100%; justify-content: space-between; align-items: center; gap: 12px; min-height: 54px; margin-bottom: 8px; font-size: 16px; text-align: left; }
  @media (prefers-reduced-motion: reduce) { .fab svg { transition: none; } }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .qr-card { display: flex; gap: 14px; align-items: center; }
  .qr-mini { flex: none; border-radius: 10px; overflow: hidden; line-height: 0; }
  .qr-meta { min-width: 0; }
  .qr-full { position: fixed; inset: 0; z-index: 70; background: #fff; color: #0F1412; display: grid; place-items: center; padding: 20px; text-align: center; }
  .qr-full-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .qr-full .qr-biz { font: 600 20px var(--display); }
  .qr-full .qr-event { font: 700 28px/1.1 var(--display); letter-spacing: -.01em; }
  .qr-full p { margin: 0; color: #4b5a53; font-size: 16px; }
  .qr-full .btn { background: #fff; color: #0F1412; border-color: #c7d0ca; margin-top: 8px; }
  table.no-cards th { padding: 8px; }
  table.no-cards td { padding: 8px 10px; }


  /* ============ Punto de venta ============ */
  body[data-view="pos"] .fab { display: none !important; }
  .pos-open { max-width: 560px; }
  .pos-big { width: 100%; min-height: 52px; font-size: 16px; margin-top: 12px; }
  .pos-money { font: 600 22px var(--display); font-variant-numeric: tabular-nums; }
  .pos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); gap: 16px; align-items: start; }
  .pos-left { min-width: 0; }
  .pos-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .pos-sess { display: flex; flex-direction: column; }
  .pos-sess b { font: 600 20px var(--display); }
  .pos-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .pos-tools .btn svg { flex: none; }
  .prn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: none; flex: none; }
  .prn-dot.on { display: inline-block; background: #34C759; }
  .prn-dot.off { display: inline-block; background: var(--sand); }
  .pos-net { gap: 6px; }
  .pos-net .net-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-text); flex: none; }
  .pos-net.off { border-color: var(--sand-line); color: var(--sand); }
  .pos-net.off .net-dot { background: var(--sand); }
  .pos-net.err { border-color: var(--danger); color: var(--danger); }
  .pos-net.err .net-dot { background: var(--danger); }
  .off-note { margin-top: 0; }
  .q-list li { align-items: flex-start; gap: 10px; }
  .q-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .prn-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .prn-opt { display: grid; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font: inherit; cursor: pointer; }
  .prn-opt.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
  .prn-opt:disabled { opacity: .5; cursor: not-allowed; }
  .prn-state { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .prn-state .prn-dot { display: inline-block; }
  .chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; cursor: pointer; }
  .chk input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--brand); }
  #rcDirect { gap: 8px; }
  .pos-search { max-width: none; margin-bottom: 10px; }
  .pos-cats { margin-bottom: 12px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .pos-cats .btn { flex: none; }
  .pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pos-tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 132px; padding: 12px; text-align: left;
              border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  .pos-tile:hover { border-color: var(--brand-line); }
  .pos-tile:active { transform: scale(.98); background: var(--brand-soft); }
  .pos-tile.out { opacity: .6; }
  .pt-ini { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 700 15px var(--display);
            background: hsl(var(--h) 45% 22%); color: hsl(var(--h) 70% 78%); }
  :root[data-theme="light"] .pt-ini { background: hsl(var(--h) 60% 90%); color: hsl(var(--h) 55% 30%); }
  .pt-n { position: absolute; top: 10px; right: 10px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--brand); color: var(--brand-ink);
          font: 700 13px var(--font); display: grid; place-items: center; }
  .pt-name { font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pt-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; width: 100%; }
  .pt-foot b { font-variant-numeric: tabular-nums; }
  .pt-stock { font-size: 12px; color: var(--muted); }
  .pos-cart { position: sticky; top: 16px; display: flex; flex-direction: column; max-height: calc(100vh - 32px); border: 1px solid var(--line-strong);
              border-radius: var(--radius); background: var(--panel); overflow: hidden; }

  @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

  /* Recibo (pantalla e impresión) */

  /* Barra fina mientras se actualizan datos en segundo plano */
  #busy { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 95; pointer-events: none; opacity: 0; transition: opacity .2s .15s;
          background: linear-gradient(90deg, transparent, var(--brand), transparent) 0 0 / 40% 100% no-repeat; }

  /* ============ Inventario ============ */

             border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); font: 600 15px var(--font); }

  .scanbox { display: flex; gap: 8px; flex: 1 1 320px; max-width: 480px; }

  .inv-tools { align-items: center; }
  .with-scan { position: relative; }

  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .big-qty { font: 700 56px/1 var(--display); letter-spacing: -.03em; color: var(--brand-text); font-variant-numeric: tabular-nums; }

  .big-qty.agotado { color: var(--danger); }
  .sheet-code { text-align: center; }
  .sheet-code .bc { width: 190px; height: 64px; display: block; border-radius: 6px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 18px; margin: 0 0 14px; }
  .facts > div { border-top: 1px solid var(--line); padding-top: 8px; }
  .facts .wide { grid-column: 1 / -1; }
  .facts dt { color: var(--muted); font-size: 12.5px; }
  .facts dd { margin: 2px 0 0; font-weight: 600; }
  .sheet-acts { margin-top: 4px; }
  .moves .num { text-align: right; white-space: nowrap; }

  .mv-head { margin-bottom: 12px; }
  .mv-head:has(> div:only-child) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .mv-extra { margin-top: 14px; }
  .mv-scan { max-width: none; margin-bottom: 8px; }
  .mv-all { margin: 4px 0 8px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .mv-create { margin: 8px 0; border-color: var(--brand-line); }
  .mv-lines { border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; }
  .mv-empty { padding: 28px 16px; }
  .mline { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .mline:last-child { border-bottom: 0; }
  .mline.flash { animation: mflash .9s ease-out; }
  @keyframes mflash { from { background: var(--brand-soft); } to { background: transparent; } }
  .ml-name { min-width: 0; display: flex; flex-direction: column; }

  .ml-cost { display: flex; flex-direction: column; width: 96px; }

  .ml-x { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; }
  .ml-x:hover { background: var(--danger-soft); color: var(--danger); }
  .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
  .stepper button { width: 40px; border: 0; background: var(--raised); color: var(--ink); font-size: 20px; line-height: 1; }
  .stepper button:active { background: var(--brand-soft); }

  .stepper.sm button { width: 34px; font-size: 17px; }
  .stepper.sm .input { width: 50px; min-height: 34px; }
  .mv-sum { margin-top: 10px; color: var(--muted); min-height: 20px; }
  .mv-sum b { color: var(--ink); }

  .hist-tools .input { max-width: 220px; }
  .hist-tools #hQ { max-width: 300px; }
  .hist-modal table td:last-child { white-space: normal; min-width: 180px; }

  .geo-row { flex-wrap: wrap; }
  .geo-row .input { flex: 1 1 220px; }
  .card-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rf-head { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; }
  .rf-items { border: 1px solid var(--line); border-radius: var(--radius); }
  .rf-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .rf-item:last-child { border-bottom: 0; }
  .rf-restock { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 0; color: var(--muted); }
  .rf-restock input { width: 18px; height: 18px; accent-color: var(--brand); }
  .tag.reembolso_parcial { background: var(--sand-soft); color: var(--sand); }
  .btn.danger#modalOk { background: var(--danger); color: #1a0806; border-color: var(--danger); }
  .ss-link { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .ss-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--raised); }
  .ss-head a { color: var(--muted); overflow-wrap: anywhere; }
  .ss-item { display: flex; justify-content: space-between; gap: 14px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .ss-item .num { text-align: right; white-space: nowrap; }
  .note.bad-note { border-color: var(--danger); }
  .stock-alert { margin-bottom: 14px; border-color: var(--sand-line); }
  .sa-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sa-head h3 { margin: 0; }

  .lb-opts { margin-bottom: 10px; }
  .lb-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .lb-bar .input { flex: 1 1 200px; }
  .lb-list { max-height: 38vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  .lb-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .lb-row:last-child { border-bottom: 0; }
  .lb-row > span { display: flex; flex-direction: column; min-width: 0; }
  .lb-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .lb-foot > div:last-child { display: flex; align-items: center; gap: 12px; }
  .lb-preview { background: repeating-conic-gradient(var(--raised) 0 25%, var(--bg) 0 50%) 0 0 / 14px 14px; padding: 12px; border-radius: var(--radius-sm); }
  .lb-preview .label { box-shadow: 0 2px 10px rgba(0, 0, 0, .3); }

  /* Etiqueta (pantalla y papel) */
  .label { background: #fff; color: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 4% 6%; overflow: hidden;
           font-family: "Geist", Arial, sans-serif; box-sizing: border-box; }
  .label .lb-name { font-size: 9pt; font-weight: 600; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .label .lb-code { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 2% 0; }
  .label .lb-code svg { width: 100%; height: 100%; display: block; }
  .label.qr { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; column-gap: 6%; }
  .label.qr .lb-code { grid-row: 1 / 3; grid-column: 1; aspect-ratio: 1; height: 100%; padding: 0; }
  .label.qr .lb-name { grid-column: 2; }
  .label.qr .lb-meta { grid-column: 2; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
  .label .lb-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 7pt; font-variant-numeric: tabular-nums; }
  .label .lb-meta b { font-size: 10pt; }
  #printArea { display: none; }

  /* Escáner a pantalla completa */
  .scanner { position: fixed; inset: 0; z-index: 90; background: #000; color: #fff; display: flex; flex-direction: column; }
  .scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scanner.nocam video { display: none; }
  .scan-top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px 14px;
              background: linear-gradient(rgba(0, 0, 0, .7), transparent); font: 600 17px var(--display); }
  .scan-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; font-size: 18px; }
  .scan-frame { position: relative; margin: auto; width: min(78vw, 420px); aspect-ratio: 16 / 10; border-radius: 18px;
                box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); }
  .scan-frame::before { content: ""; position: absolute; inset: 0; border-radius: 18px; border: 3px solid transparent;
                        background: linear-gradient(#2F6FE4, #2F6FE4) top left / 34px 3px no-repeat, linear-gradient(#2F6FE4, #2F6FE4) top left / 3px 34px no-repeat,
                                    linear-gradient(#2F6FE4, #2F6FE4) top right / 34px 3px no-repeat, linear-gradient(#2F6FE4, #2F6FE4) top right / 3px 34px no-repeat,
                                    linear-gradient(#2F6FE4, #2F6FE4) bottom left / 34px 3px no-repeat, linear-gradient(#2F6FE4, #2F6FE4) bottom left / 3px 34px no-repeat,
                                    linear-gradient(#2F6FE4, #2F6FE4) bottom right / 34px 3px no-repeat, linear-gradient(#2F6FE4, #2F6FE4) bottom right / 3px 34px no-repeat; }
  .scan-frame i { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #2F6FE4; box-shadow: 0 0 12px #2F6FE4; opacity: .8; animation: scanline 2.2s ease-in-out infinite; }
  @keyframes scanline { 0%, 100% { transform: translateY(-70px); } 50% { transform: translateY(70px); } }
  .scanner.nocam .scan-frame { display: none; }
  .scanner.hit .scan-frame { animation: scanhit .5s ease-out; }
  .scanner.miss .scan-frame { animation: scanmiss .5s ease-out; }
  @keyframes scanhit { from { box-shadow: 0 0 0 100vmax rgba(47, 111, 228, .45); } to { box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); } }
  @keyframes scanmiss { from { box-shadow: 0 0 0 100vmax rgba(255, 110, 100, .45); } to { box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); } }
  .scan-bottom { position: relative; padding: 16px 16px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0, 0, 0, .85) 30%); }
  .scanner.nocam .scan-bottom { margin-top: auto; }
  .scan-msg { font-size: 16px; text-align: center; min-height: 24px; margin-bottom: 10px; }
  .scan-log { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; min-height: 4px; }
  .scan-log .tag { font-size: 13px; }
  .scan-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .scan-actions .btn { min-height: 48px; padding: 10px 20px; background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .25); }
  .scan-actions .btn.primary { background: #2F6FE4; color: #FFFFFF; border-color: #2F6FE4; }
  body[data-view="inventory"] .fab { display: none !important; }

  /* ============ Pantallas medianas (tablets, laptops pequeñas) ============ */
  @media (max-width: 1100px) {
    main { padding: 22px 22px 40px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    td.actions { min-width: 0; white-space: nowrap; }
  }

  /* ============ Menú deslizable (tablets en vertical y celulares) ============ */
  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); height: 100%; z-index: 45; transform: translateX(-102%);
            transition: transform .22s ease; box-shadow: var(--shadow); padding-top: max(18px, env(safe-area-inset-top)); }
    .side.open { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 44; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .mobilebar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30; background: var(--side); color: #fff;
                 padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
    .mobilebar button { background: none; border: 0; color: #fff; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; }
    .mobilebar button:hover { background: var(--side-hover); }
    .mobilebar b { font: 400 13px var(--brandfont); letter-spacing: .02em; }
    .fab { display: grid; }
    main { padding-bottom: 96px; }
    .two { grid-template-columns: 1fr; }
  }

  /* ============ Tablas como tarjetas: tablets en vertical y celulares ============ */
  @media (max-width: 860px) {
    .tablewrap { overflow: visible; }
    table.rt thead { display: none; }
    table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; }
    table.rt tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    table.rt tr:last-child { border-bottom: 0; }
    table.rt tbody tr:hover td { background: none; }
    table.rt td { border: 0; padding: 3px 0; white-space: normal !important; text-align: right; display: flex; justify-content: space-between; align-items: baseline; gap: 14px; min-width: 0 !important; }
    table.rt td::before { content: attr(data-label); color: var(--muted); font-size: 12.5px; text-align: left; flex: none; max-width: 45%; }
    table.rt td[data-label=""]::before { content: none; }
    table.rt td > .cv { display: block; min-width: 0; text-align: right; overflow-wrap: anywhere; }
    table.rt td:first-child { font-weight: 600; text-align: left; justify-content: flex-start; padding-bottom: 6px; font-size: 15.5px; }
    table.rt td:first-child > .cv { text-align: left; }
    table.rt td.actions > .cv { display: flex; flex-wrap: wrap; gap: 8px; }
    table.rt td:first-child::before { content: none; }
    table.rt td.actions { justify-content: flex-start; flex-wrap: wrap; padding-top: 10px; gap: 8px; }
    table.rt td.actions::before { content: none; }
    table.rt td.actions .btn { margin: 0; }

  .dte-paper .dte-total { border-top: 1.5px solid #000; font-weight: 700; font-size: 12pt; margin-top: 4px; padding-top: 4px !important; }
  @media (max-width: 860px) { .dte-cfg { grid-template-columns: minmax(0, 1fr); } .dte-detail { grid-template-columns: 1fr; } }
  .exp-att { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .exp-att label.btn { cursor: pointer; }
  .kvs { display: grid; gap: 0; margin: 10px 0; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
  .acc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .acc-card { text-align: left; cursor: pointer; color: var(--ink); font: inherit; display: grid; gap: 10px; }
  .acc-card:hover { border-color: var(--line-strong); }
  .acc-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .acc-top { display: flex; gap: 10px; align-items: center; }
  .acc-top > span:last-child { display: grid; }
  .acc-ic { font-size: 20px; width: 36px; height: 36px; display: grid; place-items: center; background: var(--raised); border-radius: 10px; flex: none; }
  .acc-bal { font: 600 26px var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .acc-io { display: flex; gap: 12px; }
  .rp-card { overflow-x: auto; }
  .rp-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .rp-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .rp-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rp-table td.rp-acc { white-space: normal; padding-left: 22px; }
  .rp-sec td { font-weight: 600; padding-top: 14px; color: var(--ink); border-bottom-color: var(--line-strong); }
  .rp-grp td { color: var(--muted); font-size: 12px; padding-top: 10px; }
  .rp-sub td { color: var(--muted); font-weight: 500; }
  .rp-tot td { font-weight: 600; background: var(--raised); }
  .rp-net td { font-weight: 700; font-size: 15px; border-top: 2px solid var(--line-strong); background: var(--brand-soft); }
  .rp-table tr.click:hover td { background: var(--raised); }
  .bs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .bs-grid table + table { margin-top: 14px; }
  .ok-note { background: var(--brand-soft); border-color: var(--brand-line); }
  .jr-list { display: grid; gap: 10px; }
  .jr { padding: 12px 14px; }
  .jr.void { opacity: .5; }
  .jr.void .jr-d { text-decoration: line-through; }
  .jr-h { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; }
  .jr-d { margin: 6px 0 8px; font-size: 14px; }
  .jr-t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .jr-t { table-layout: fixed; }
  .jr-t td { padding: 4px 6px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .jr-t td.code { width: 64px; }
  .jr-t td.num { width: 110px; }
  .jr-t td.cr { padding-left: 28px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chart-t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .chart-t td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .chart-t tr.grp.d0 td, .chart-t tr.grp.d1 td { background: var(--raised); }
  .chart-t tr.off td { opacity: .5; }
  .pm-head, .pm-line { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(80px, 1fr) minmax(80px, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; }
  .pm-head { font-size: 12px; color: var(--muted); }
  #pmLines { display: grid; gap: 8px; }
  .ob-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 220px); gap: 12px; align-items: center; padding: 4px 0; }
  .ob-row .input { text-align: right; }
  .rec-list li > span:first-child { display: grid; gap: 2px; }
  #printArea.report-print { font: 11pt/1.4 "Geist", Arial, sans-serif; color: #000; }
  .report-print .rp-h { margin-bottom: 14px; }
  .report-print .rp-h b { font-size: 13pt; }
  .report-print .rp-h span { margin-left: 10px; color: #444; }
  .report-print h1 { font-size: 15pt; margin: 6px 0 0; }
  .report-print table { width: 100%; border-collapse: collapse; }
  .report-print td, .report-print th { padding: 4px 6px; border-bottom: 1px solid #ddd; color: #000 !important; background: none !important; }
  .report-print .num { text-align: right; }
  .report-print .rp-net td, .report-print .rp-tot td { font-weight: 700; border-top: 1px solid #000; }
  .report-print .bs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .report-print .code { color: #555; }
  @media (max-width: 760px) {
    .exp-detail { grid-template-columns: 1fr; }
    .bs-grid { grid-template-columns: 1fr; }
    .form .three { grid-template-columns: 1fr 1fr; }
    .pm-head { display: none; }
    .pm-line { grid-template-columns: 1fr 1fr; }
    .pm-line select, .pm-line [name=memo] { grid-column: 1 / -1; }
    .fin-tools input[type=date] { max-width: none; flex: 1; }
    .acc-cards { grid-template-columns: 1fr; }
    .fin-grid { grid-template-columns: 1fr; }
    .jr-t td.code { display: none; }
    .jr-t td.num { width: 84px; font-size: 12px; }
    .jr-t td.cr { padding-left: 14px; }
  }
  @media (max-width: 520px) { .form .two { grid-template-columns: 1fr; } .form .three { grid-template-columns: 1fr; } }
</style>

<script>
/* ============================ Utilidades ============================ */
const mem = {};
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return mem[k] || null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete mem[k]; } },
};

const S = { token: store.get('nx_token'), boot: null, view: 'inicio', rows: [], users: [] };
const $ = sel => document.querySelector(sel);
const app = () => $('#app');

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 3200);
}

 * La misma página funciona en dos lugares:
 *  - Servida por Google (URL /exec): usa google.script.run.
 *  - En tu propio dominio (GitHub Pages u otro): usa fetch() contra la URL /exec,
 *    definida en window.NEXO_API_URL.
 */
const API_URL = String(window.NEXO_API_URL || '').trim();
const ON_GOOGLE = !!(window.google && google.script && google.script.run);

/** Error de red (sin señal o el servidor no respondió a tiempo), distinto de un error del sistema. */
function netError(msg) { const e = new Error(msg || 'Sin conexión con el servidor. Revisa tu internet.'); e.network = true; return e; }
const isNet = e => !!(e && e.network);

function callServer(fn, args, timeoutMs) {
  if (ON_GOOGLE) {
    return new Promise((resolve, reject) => {
      const t = timeoutMs ? setTimeout(() => reject(netError('El servidor no respondió a tiempo.')), timeoutMs) : null;
      google.script.run.withSuccessHandler(v => { clearTimeout(t); resolve(v); })
        .withFailureHandler(e => {
          clearTimeout(t);
          const msg = e && e.message ? e.message : String(e);
          reject(/network|connection failure|HTTP 0/i.test(msg) ? netError() : (e instanceof Error ? e : new Error(msg)));
        })[fn].apply(null, args);
    });
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API_URL)) {
    return Promise.reject(new Error('Falta configurar la URL de tu sistema (NEXO_API_URL) en este archivo.'));
  }
  const ctl = window.AbortController ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), timeoutMs || 60000);
  return fetch(API_URL + '?rpc=1', { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(r => { if (!r.ok) throw r.status >= 500 || r.status === 0 ? netError('El servidor respondió ' + r.status + '.') : new Error('El servidor respondió ' + r.status); return r.json(); })
    .catch(e => {
      if (isNet(e)) throw e;
      if (e.name === 'AbortError') throw netError('El servidor no respondió a tiempo.');
      if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed|network/i.test(e.message)) throw netError();
      throw e;
    })
    .finally(() => clearTimeout(t));
}

function api(fn) {
  return apiT.apply(null, [0].concat(Array.prototype.slice.call(arguments)));
}
/** Igual que api() pero con tiempo máximo de espera (ms); 0 = el normal. */
function apiT(timeoutMs, fn) {
  const args = Array.prototype.slice.call(arguments, 2);
  return callServer(fn, args, timeoutMs).then(res => {
    if (!SWR_READS.has(fn) && !NO_SIDE_EFFECTS.has(fn)) swrClear(); // algo cambió: la memoria ya no vale
    if (res && res.ok) return res.data;
    const err = new Error(res ? res.error : 'Sin respuesta del servidor.');
    err.code = res && res.code;
    if (err.code === 'AUTH') { endSession(); toast(err.message, true); }
    else if (err.code === 'PWD_CHANGE') { renderPasswordChange(true); }
    throw err;
  });
}

/* ---------- Datos con memoria: las pestañas muestran lo último que viste y se actualizan solas ---------- */

const SWR = { mem: null, busy: 0, prefetched: false };
// Lecturas que se pueden guardar. Cualquier otra llamada (guardar, borrar, mover…) borra la memoria.
const SWR_READS = new Set(['apiDashboard', 'apiList', 'apiSales', 'apiInventory', 'apiSubscribers', 'apiIntegrations', 'apiAudit', 'apiUsers',
  'apiFinOverview', 'apiFinExpenses', 'apiFinPayables', 'apiFinReceivables', 'apiFinMoney']);
const NO_SIDE_EFFECTS = new Set(['apiLeadSources', 'apiQrList', 'apiInventoryLookup', 'apiInventoryProduct', 'apiInventoryHistory', 'apiSale',
  'apiSaleRefundInfo', 'apiStockSyncStatus', 'apiBoot', 'apiPing', 'apiFinSettings', 'apiFinChart', 'apiFinSuppliers', 'apiFinExpense', 'apiFinRecurring',
  'apiFinIncome', 'apiFinBalance', 'apiFinCashFlow', 'apiFinJournal', 'apiFinLedger', 'apiFinTrial', 'apiTaxReport', 'apiTaxAnexo',
  'apiDteSettings', 'apiDteList', 'apiDteGet', 'apiDteDownload', 'apiShipList', 'apiShipGet', 'apiNotifyGet', 'apiNotifyHistory', 'apiPanorama', 'apiMktGet']);

function swrLoad() {
  if (SWR.mem) return SWR.mem;
  SWR.mem = {};
  try { const raw = sessionStorage.getItem('nx_swr'); if (raw) { const o = JSON.parse(raw); if (o.t === S.token) SWR.mem = o.m || {}; } } catch (e) { /* sin memoria */ }
  return SWR.mem;
}
let swrSaveTimer = null;
function swrSave() {
  clearTimeout(swrSaveTimer);
  swrSaveTimer = setTimeout(() => {
    try { sessionStorage.setItem('nx_swr', JSON.stringify({ t: S.token, m: SWR.mem })); }
    catch (e) { try { sessionStorage.removeItem('nx_swr'); } catch (x) { /* lleno */ } }
  }, 300);
}
function swrClear() { SWR.mem = {}; try { sessionStorage.removeItem('nx_swr'); } catch (e) { /* nada */ } }

function setBusy(delta) {
  SWR.busy = Math.max(0, SWR.busy + delta);
  const bar = $('#busy');
  if (bar) bar.classList.toggle('on', SWR.busy > 0);
}

/** Conserva el campo donde el usuario está escribiendo cuando la pantalla se vuelve a dibujar. */
function keepFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? a.id : '';
  const val = id ? a.value : '', start = id ? a.selectionStart : 0, end = id ? a.selectionEnd : 0;
  fn();
  if (!id) return;
  const b = document.getElementById(id);
  if (b && b !== a) { b.value = val; b.focus(); try { b.setSelectionRange(start, end); } catch (e) { /* tipo sin cursor */ } }
}

/**
 * Lee con memoria: si ya hay datos guardados, onData(datos, true) se llama al instante;
 * luego se piden al servidor y, si cambiaron, onData(datos, false) vuelve a dibujar.
 */
async function apiFresh(fn, args, onData) {
  const mem = swrLoad();
  const key = fn + '|' + JSON.stringify(args);
  const hit = mem[key];
  if (hit) onData(hit.d, true);
  setBusy(+1);
  try {
    const data = await api.apply(null, [fn, S.token].concat(args));
    const json = JSON.stringify(data);
    if (!hit || hit.j !== json) {
      swrLoad()[key] = { d: data, j: json };
      swrSave();
      if (hit) keepFocus(() => onData(data, false)); else onData(data, false);
    }
    return data;
  } catch (e) {
    if (!hit) throw e;
    toast('No se pudo actualizar: ' + e.message, true);
    return hit.d;
  } finally { setBusy(-1); }
}

/** Después de abrir Inicio, carga en silencio las pestañas más usadas para que abran al instante. */
async function prefetch() {
  if (SWR.prefetched) return;
  SWR.prefetched = true;
  const jobs = [
    ['apiSales', [''], 'sales:read'], ['apiInventory', [{ location: '' }], 'inventory:read'],
    ['apiList', ['leads', ''], 'leads:read'], ['apiList', ['customers', ''], 'customers:read'], ['apiList', ['products', ''], 'products:read'],
  ];
  const token = S.token;
  for (const [fn, args, perm] of jobs) {
    if (S.token !== token) return;
    if (!can(perm)) continue;
    const key = fn + '|' + JSON.stringify(args);
    if (swrLoad()[key]) continue;
    try {
      const data = await api.apply(null, [fn, S.token].concat(args));
      if (S.token !== token) return;
      swrLoad()[key] = { d: data, j: JSON.stringify(data) };
      swrSave();
    } catch (e) { return; }
  }
}

function can(perm) {
  const parts = perm.split(':');
  return (S.boot ? S.boot.perms : []).some(p =>
    p === '*' || p === perm || p === parts[0] + ':*' || p === '*:' + parts[1]);
}

/* Montos al estilo de EE. UU. y El Salvador: $1,234.56 (coma para miles, punto para decimales). */
const MONEY_FMT = {};
function fmtMoney(v, cur) {
  cur = cur || 'USD';
  try {
    const f = MONEY_FMT[cur] || (MONEY_FMT[cur] = new Intl.NumberFormat('en-US', { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol' }));
    return f.format(Number(v) || 0);
  } catch (e) { return (cur === 'USD' ? '$' : cur + ' ') + (Number(v) || 0).toFixed(2); }
}
function money(v) {
  if (v === '' || v === null || v === undefined) return '';
  return fmtMoney(v, (S.boot && S.boot.tenant && S.boot.tenant.currency) || 'USD');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' });
}

/** Íconos de contacto rápido: correo, WhatsApp y llamada. */
function contactIcons(email, phone) {
  let out = '';
  if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    out += `<a class="ic" href="mailto:${esc(email)}" title="Enviar correo a ${esc(email)}" aria-label="Enviar correo">${ICONS.mail}</a>`;
  }
  const digits = String(phone || '').replace(/\D/g, '');
  if (digits.length >= 7) {
    out += `<a class="ic" href="https:\/\/wa.me/${digits}" target="_blank" rel="noopener" title="WhatsApp ${esc(phone)}" aria-label="WhatsApp">${ICONS.chat}</a>`;
    out += `<a class="ic" href="tel:${esc(String(phone).replace(/[^\d+]/g, ''))}" title="Llamar a ${esc(phone)}" aria-label="Llamar">${ICONS.phone}</a>`;
  }
  return out;
}

function optLabel(field, value) {
  const o = (field.options || []).find(x => x[0] === value);
  return o ? o[1] : value;
}

function cell(field, value) {
  if (!field) return esc(value);
  if (field.type === 'select') {
    if (value === '' || value === undefined) return '<span class="muted">—</span>';
    return '<span class="tag ' + esc(value) + '">' + esc(optLabel(field, value)) + '</span>';
  }
  if (field.type === 'checkbox') return value === true ? 'Sí' : 'No';
  if (field.format === 'money') return esc(money(value));
  if (field.type === 'email') return value ? esc(value) + contactIcons(value, '') : '<span class="muted">—</span>';
  if (field.type === 'tel') return value ? esc(value) + contactIcons('', value) : '<span class="muted">—</span>';
  if (field.format === 'datetime') return '<span class="muted">' + fmtDate(value) + '</span>';
  if (field.format === 'number') return value === '' || value === undefined ? '<span class="muted">—</span>' : esc(Number(value).toLocaleString('en-US'));
  return esc(value);
}

/* ============================ Sesión ============================ */

function endSession() {
  swrClear(); SWR.prefetched = false;
  S.token = null; S.boot = null;
  store.del('nx_token');
  renderLogin();
}

async function start() {
  if (!S.token) return renderLogin();
  app().innerHTML = '<div class="center muted">Cargando…</div>';
  try {
    S.boot = await api('apiBootstrap', S.token);
    try { sessionStorage.setItem('nx_boot', JSON.stringify({ t: S.token, d: S.boot })); } catch (x) { /* sin espacio */ }
    if (S.boot.user.must_change_password) return renderPasswordChange(true);
    renderShell();
    posSync();
  } catch (e) {
    // Sin señal: con la sesión guardada en esta pestaña se puede seguir vendiendo.
    if (isNet(e)) {
      let cached = null;
      try { const o = JSON.parse(sessionStorage.getItem('nx_boot') || 'null'); if (o && o.t === S.token) cached = o.d; } catch (x) { /* nada */ }
      if (cached) {
        S.boot = cached; S.offline = true;
        if (cached.menu.some(m => m.id === 'pos')) S.view = 'pos';
        renderShell();
        toast('Sin conexión: puedes seguir vendiendo en el punto de venta.', true);
        return;
      }
    }
    if (e.code !== 'AUTH' && e.code !== 'PWD_CHANGE') { toast(e.message, true); renderLogin(); }
  }
}

function renderLogin() {
  app().innerHTML = `
    <div class="center"><form class="auth" id="loginForm">
      <div class="logo">Nx</div>
      <h1>Iniciar sesión</h1>
      <div class="muted">ERP + CRM para tu negocio</div>
      <div class="row"><label class="f">Correo</label><input class="input" name="email" type="email" autocomplete="username" required></div>
      <div class="row"><label class="f">Contraseña</label><input class="input" name="password" type="password" autocomplete="current-password" required></div>
      <div class="err" id="loginErr"></div>
      <div class="row"><button class="btn primary" style="width:100%" type="submit">Entrar</button></div>
    </form></div>`;
  $('#loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = ev.target, btn = f.querySelector('button');
    btn.disabled = true; $('#loginErr').textContent = '';
    try {
      const r = await api('apiLogin', f.email.value, f.password.value);
      S.token = r.token; store.set('nx_token', r.token);
      await start();
    } catch (e) {
      $('#loginErr').textContent = e.message; btn.disabled = false;
    }
  });
  $('#loginForm [name=email]').focus();
}

function renderPasswordChange(forced) {
  const html = `
    <form class="${forced ? 'auth' : ''}" id="pwdForm">
      ${forced ? '<div class="logo">Nx</div><h1>Crea tu contraseña</h1><div class="muted">Por seguridad, cambia la contraseña temporal.</div>' : ''}

      <div class="row" style="margin-top:14px"><label class="f">Nueva contraseña</label><input class="input" name="next" type="password" autocomplete="new-password" required><div class="hint">Mínimo 8 caracteres, con letras y números.</div></div>
      <div class="row" style="margin-top:14px"><label class="f">Repite la nueva contraseña</label><input class="input" name="again" type="password" autocomplete="new-password" required></div>
      <div class="err" id="pwdErr"></div>
      <div class="row" style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
        ${forced ? '<button class="btn" type="button" id="pwdOut">Salir</button>' : ''}
        <button class="btn primary" type="submit">Guardar contraseña</button>
      </div>

  if (forced) {
    app().innerHTML = '<div class="center">' + html + '</div>';

    f.querySelector('[type=submit]').disabled = true;
    try {
      await api('apiChangePassword', S.token, f.current.value, f.next.value);
      toast('Contraseña actualizada');
      if (forced) start(); else closeModal();
    } catch (e) {
      $('#pwdErr').textContent = e.message;
      f.querySelector('[type=submit]').disabled = false;
    }
  });
}

async function logout() {
  const pend = OFF.queue().length;
  if (pend && !confirm('Hay ' + pend + ' venta(s) guardadas en este dispositivo que todavía no llegan al sistema. Se enviarán cuando vuelvas a entrar con este usuario en este dispositivo. ¿Salir de todos modos?')) return;
  try { await api('apiLogout', S.token); } catch (e) { /* sin importancia */ }
  endSession();
}

/* ============================ Tablas → tarjetas en celulares ============================ */

/** Etiqueta cada celda con el nombre de su columna; en pantallas chicas el CSS las muestra como tarjetas. */
function labelTables(root) {
  (root || document).querySelectorAll('table').forEach(t => {
    const ths = t.querySelectorAll('thead th');
    if (!ths.length || t.classList.contains('no-cards')) return;
    t.classList.add('rt');
    const names = Array.prototype.map.call(ths, th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => {
      let col = 0; // las celdas que ocupan varias columnas (totales) no llevan etiqueta
      Array.prototype.forEach.call(tr.children, td => {
        const i = col, span = td.colSpan || 1;
        col += span;
        if (td.hasAttribute('data-label')) return;
        td.setAttribute('data-label', span > 1 ? '' : names[i] || '');
        // Agrupa el contenido de la celda (moviendo los nodos, así se conservan sus eventos).
        const cv = document.createElement('span');
        cv.className = 'cv';
        while (td.firstChild) cv.appendChild(td.firstChild);
        td.appendChild(cv);
      });
    });
  });
}

let labelQueued = false;

function drawTable(key) {
  const def = S.boot.entities[key];
  const q = ($('#q').value || '').toLowerCase().trim();
  const rows = q ? S.rows.filter(r => def.search.some(f => String(r[f] || '').toLowerCase().indexOf(q) >= 0)) : S.rows;
  const fields = def.columns.map(c => def.fields.find(f => f.name === c) ||
    Object.assign({ name: c, label: c }, (def.extraColumns || {})[c] || {}));
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty">${q ? 'Sin resultados.' : 'Aún no hay registros.'}</div>`;
    return;
  }
  const canW = can(def.resource + ':write'), canD = can(def.resource + ':delete');
  $('#list').innerHTML = `<table><thead><tr>${fields.map(f => `<th class="${f.format === 'money' ? 'num' : ''}">${esc(f.label)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>${fields.map(f => `<td class="${f.format === 'money' ? 'num' : ''}">${cell(f, r[f.name])}</td>`).join('')}
      <td class="actions">${canW ? `<button class="btn sm" data-edit="${esc(r.id)}">Editar</button>` : `<button class="btn sm" data-edit="${esc(r.id)}">Ver</button>`}
      ${key === 'leads' && !r.customer_id && canW && can('customers:write') ? `<button class="btn sm" data-convert="${esc(r.id)}">Hacer cliente</button>` : ''}
      ${key === 'leads' && r.customer_id ? '<span class="tag activo">cliente</span>' : ''}
      ${canD ? `<button class="btn sm danger" data-del="${esc(r.id)}">Eliminar</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
  $('#list').querySelectorAll('[data-convert]').forEach(b => b.onclick = () => convertLead(S.rows.find(r => r.id === b.dataset.convert)));
  $('#list').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editRecord(key, S.rows.find(r => r.id === b.dataset.edit)));
  $('#list').querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteRecord(key, S.rows.find(r => r.id === b.dataset.del)));
}

function editRecord(key, rec, opts) {
  opts = opts || {};
  const def = S.boot.entities[key];
  const readOnly = !can(def.resource + ':write');
  openForm({
    title: (rec ? (readOnly ? '' : 'Editar ') : 'Nuevo ') + def.singular,
    fields: def.fields, record: rec || opts.prefill, readOnly: readOnly,
    onSave: async values => {
      if (rec) values.id = rec.id;
      const saved = await api('apiSave', S.token, key, values);
      if (opts.onSaved) { opts.onSaved(saved); toast(rec ? 'Cambios guardados' : 'Registro creado'); return; }
      const i = S.rows.findIndex(r => r.id === saved.id);
      if (i >= 0) S.rows[i] = saved; else S.rows.unshift(saved);
      drawTable(key);
      toast(rec ? 'Cambios guardados' : 'Registro creado');
    },
  });
}

async function convertLead(lead) {
  try {
    const r = await api('apiLeadConvert', S.token, lead.id);
    const i = S.rows.findIndex(x => x.id === lead.id);
    if (i >= 0) S.rows[i] = r.lead;
    drawTable('leads');
    toast(r.created ? 'Cliente creado: ' + r.customer.name : 'Ligado al cliente existente: ' + r.customer.name);
  } catch (e) { toast(e.message, true); }
}

function deleteRecord(key, rec) {
  if (!rec) return;
  openModal('Eliminar', `<p>¿Eliminar <b>${esc(rec.name)}</b>? El registro se conserva en el historial de auditoría.</p>`,
    async () => {
      await api('apiDelete', S.token, key, rec.id);
      S.rows = S.rows.filter(r => r.id !== rec.id);
      drawTable(key);
      toast('Registro eliminado');
    }, 'Eliminar');
}

/* ============================ Formularios y modales ============================ */

function fieldHtml(f, value, readOnly) {
  const v = value === undefined || value === null || value === '' ? (f.default !== undefined && value === undefined ? f.default : value) : value;
  const dis = readOnly || f.lock ? 'disabled' : '';
  const req = f.required ? ' *' : '';
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
  const wide = f.type === 'textarea' ? 'wide' : '';
  if (f.type === 'checkbox') {
    return `<div class="check"><input type="checkbox" id="f_${f.name}" name="${f.name}" ${v === true ? 'checked' : ''} ${dis}><label for="f_${f.name}">${esc(f.label)}</label></div>`;
  }
  let input;
  if (f.type === 'select') {
    input = `<select class="input" name="${f.name}" ${dis}>${f.options.map(o => `<option value="${esc(o[0])}" ${String(v === undefined ? '' : v) === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea class="input" name="${f.name}" rows="3" ${dis}>${esc(v)}</textarea>`;
  } else {
    const type = f.type === 'number' ? 'number" step="any' : f.type;
    input = `<input class="input" name="${f.name}" type="${type}" value="${esc(v)}" ${f.placeholder ? 'placeholder="' + esc(f.placeholder) + '"' : ''} ${f.min !== undefined ? 'min="' + f.min + '"' : ''} ${f.max !== undefined ? 'max="' + f.max + '"' : ''} ${f.required ? 'required' : ''} ${dis}>`;
  }
  return `<div class="${wide}"><label class="f">${esc(f.label)}${req}</label>${input}${hint}</div>`;
}

function readFormValues(form, fields) {
  const out = {};
  fields.forEach(f => {
    const el = form.elements[f.name];
    if (!el) return;
    out[f.name] = f.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}

function openForm(opts) {
  const rec = opts.record || {};
  const body = `<form class="form" id="recForm">${opts.fields.map(f => fieldHtml(f, opts.record ? rec[f.name] : undefined, opts.readOnly)).join('')}</form>`;
  openModal(opts.title, body, opts.readOnly ? null : async () => {
    const form = $('#recForm');
    if (!form.reportValidity()) throw new Error('Revisa los campos marcados.');
    await opts.onSave(readFormValues(form, opts.fields));
  }, 'Guardar');
  // Campo de código de barras: botón para leerlo con la cámara o con un lector.
  const bc = document.querySelector('#recForm [name=barcode]');
  if (bc && !opts.readOnly) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn field-scan'; b.innerHTML = ICONS.scan; b.setAttribute('aria-label', 'Escanear código con la cámara');
    bc.parentNode.insertBefore(b, bc.nextSibling);
    bc.parentNode.classList.add('with-scan');
    b.onclick = async () => { const code = await scanCamera({ title: 'Escanear código del producto' }); if (code) { bc.value = code; bc.focus(); } };
  }
}

function openModal(title, bodyHtml, onOk, okLabel, wide) {
  if (!closeModal()) return;
  const el = document.createElement('div');
  el.className = 'backdrop';
  el.id = 'modal';
  el.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <header><h3>${esc(title)}</h3><button class="btn sm" data-close>✕</button></header>
    <div class="body">${bodyHtml}</div>
    ${onOk ? `<footer><div class="err" id="modalErr"></div><button class="btn" data-close>Cancelar</button><button class="btn primary" id="modalOk">${esc(okLabel || 'Aceptar')}</button></footer>` : ''}
  </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', ev => { if (ev.target === el || ev.target.hasAttribute('data-close')) closeModal(); });
  bindCopy(el);
  if (onOk) {
    const ok = $('#modalOk');
    const run = async () => {
      ok.disabled = true; $('#modalErr').textContent = '';
      try { await onOk(); closeModal(true); }
      catch (e) { $('#modalErr').textContent = e.message; ok.disabled = false; }
    };
    ok.onclick = run;
    const form = el.querySelector('form');
    if (form) form.addEventListener('submit', ev => { ev.preventDefault(); run(); });
  }
  const first = el.querySelector('.body input:not([disabled]), .body select:not([disabled])');
  if (first) first.focus();
}

function closeModal(force) {
  const m = $('#modal');
  if (!m) return true;
  if (!force && m._guard && !m._guard()) return false;
  if (m._onClose) m._onClose();
  m.remove();
  return true;
}

function showSecret(title, intro, secret) {

    <p class="muted">Compártela por un medio seguro. Se pedirá cambiarla en el primer acceso y no se volverá a mostrar.</p>`, null);
}

function summarize(json) {
  if (!json) return '<span class="muted">—</span>';
  try {
    const c = JSON.parse(json);
    const parts = Object.keys(c).slice(0, 4).map(k => Array.isArray(c[k])
      ? `<b>${esc(k)}</b>: ${esc(c[k][0])} → ${esc(c[k][1])}` : `<b>${esc(k)}</b>: ${esc(c[k])}`);
    const more = Object.keys(c).length - 4;
    return parts.join(' · ') + (more > 0 ? ` <span class="muted">+${more}</span>` : '');
  } catch (e) { return esc(json); }
}

  };
}

async function mkPanorama(fresh) {
  if (fresh) $('#mkBody').innerHTML = '<div class="empty">Leyendo Google Analytics…</div>';
  let d;
  try { d = await api('apiPanorama', S.token, { days: MKT.days, fresh: !!fresh }); }
  catch (e) { $('#mkBody').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; return; }
  if (S.view !== 'marketing' || MKT.tab !== 'panorama') return;
  MKT.data = d;
  const n = d.nexo, k = n.kpi, ga = d.ga, cur = d.currency;
  const fm = v => fmtMoney(v, cur);
  const intf = v => Number(v || 0).toLocaleString('en-US');
  const delta = (a, b, inverse) => {
    if (!b) return a ? '<span class="mk-d muted">sin datos antes</span>' : '<span class="mk-d muted">sin cambio</span>';
    const p = Math.round((a - b) / b * 100);
    if (!p) return '<span class="mk-d muted">igual</span>';
    const good = inverse ? p < 0 : p > 0;
    return `<span class="mk-d ${good ? 'up' : 'down'}" aria-label="${p > 0 ? 'subió' : 'bajó'} ${Math.abs(p)}%">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
  };
  const tile = (label, value, d2, hint) => `<div class="card pad kpi mk-kpi"><div class="l">${label}</div><div class="v m">${value}</div><div class="mk-sub">${d2 || ''}${hint ? ' <span class="muted">' + hint + '</span>' : ''}</div></div>`;
  const vs = `vs. ${d.days} días anteriores`;
  const tiles = [
    n.can.sales ? tile('Ventas', fm(k.revenue), delta(k.revenue, d.nexo.prev.revenue)) : '',
    n.can.sales ? tile('Pedidos', intf(k.orders), delta(k.orders, d.nexo.prev.orders)) : '',
    n.can.sales ? tile('Ticket promedio', fm(k.avg), delta(k.avg, d.nexo.prev.avg)) : '',
    ga ? tile('Visitas al sitio', intf(ga.totals.sessions), delta(ga.totals.sessions, ga.prev.sessions), intf(ga.totals.users) + ' personas') : '',
    ga && d.combined && d.combined.conversion !== null ? tile('Conversión en línea', d.combined.conversion + '%', '', intf(k.online_orders) + ' pedidos de ' + intf(ga.totals.sessions) + ' visitas') : '',
    n.can.sales ? tile('Clientes nuevos', intf(n.first_buyers), delta(n.first_buyers, n.first_buyers_prev), 'compraron por primera vez') : tile('Clientes nuevos', intf(n.customers_new), delta(n.customers_new, n.customers_new_prev)),
    tile('Prospectos', intf(n.leads), delta(n.leads, n.leads_prev), n.leads_won ? n.leads_won + ' ya compraron' : ''),
  ].filter(Boolean).join('');
  const bars = (rows, val, fmt, label) => {
    if (!rows || !rows.length) return '<p class="muted" style="margin:0">Sin datos en este periodo.</p>';
    const max = Math.max.apply(null, rows.map(val)) || 1;

      <div class="mk-track"><span style="width:${Math.max(2, Math.round(val(r) / max * 100))}%"></span></div></li>`).join('')}</ul>`;
  };
  const card = (title, body, cls) => `<div class="card pad ${cls || ''}"><h3>${title}</h3>${body}</div>`;

      <p class="muted" style="margin:0">Conecta Google Analytics para ver cuánta gente entra a tu sitio, si llega de Instagram, Facebook, TikTok o Google, y cuántas visitas se convierten en ventas.</p></div>

        <p class="muted" style="margin:0">Registra lo que inviertes en anuncios, influencers, volantes o eventos como un gasto en Finanzas y elige su <b>canal de marketing</b>. Con eso calculo cuánto vendes por cada dólar invertido, cuánto te cuesta un cliente nuevo y un prospecto.</p></div>
        ${can('finance:write') ? '<button class="btn" id="mkGoFin">Registrar inversión</button>' : ''}</div>`;

        ${ltv ? tile('Valor de un cliente', fm(ltv.value), lc !== null ? health + ' <span class="muted">vale ' + lc + ' veces lo que cuesta</span>' : '', lc === null ? 'LTV · ' + ltv.orders + ' compras en promedio' : '') : ''}

  const ch = ga ? ga.channels.map(c => ({ name: GA_CHANNELS[c.name] || c.name, sessions: c.sessions, key_events: c.key_events })) : [];
  $('#mkBody').innerHTML = `

/** Barras por día, una sola serie. Cada barra tiene su valor al pasar el cursor o con el teclado. */
function dayChart(rows, key, fmt, label) {
  if (!rows || !rows.length) return '<p class="muted" style="margin:0">Sin datos.</p>';
  const W = 640, H = 170, top = 14, bottom = 24, n = rows.length;
  const max = Math.max.apply(null, rows.map(r => Number(r[key]) || 0));
  if (!max) return '<p class="muted" style="margin:0">Sin movimiento en este periodo.</p>';
  const gap = n > 60 ? 1 : 2, bw = (W - gap * (n - 1)) / n, ch = H - top - bottom;
  const dlabel = s => { const p = String(s).split('-'); return Number(p[2]) + '/' + Number(p[1]); };
  const total = rows.reduce((a, r) => a + (Number(r[key]) || 0), 0);
  const ticks = [0, Math.floor((n - 1) / 2), n - 1];
  return `<div class="mk-chart"><div class="mk-chart-h"><span class="muted sm">Máximo en un día: <b>${fmt(max)}</b></span><span class="muted sm">Total: <b>${fmt(total)}</b></span></div>
    <svg class="fin-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: total ${esc(String(fmt(total)))}">
    <line class="axis" x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}"></line>
    ${rows.map((r, i) => { const v = Number(r[key]) || 0; const h = v ? Math.max(2, v / max * ch) : 0; const x = i * (bw + gap);
      return `<g class="mk-bar" tabindex="0"><title>${esc(dlabel(r.date) + ': ' + fmt(v))}</title><rect x="${x}" y="${top}" width="${bw}" height="${ch}" fill="transparent"></rect>${h ? `<rect class="b1" x="${x.toFixed(1)}" y="${(H - bottom - h).toFixed(1)}" width="${Math.max(1, bw).toFixed(1)}" height="${h.toFixed(1)}" rx="${bw > 6 ? 2 : 0}"></rect>` : ''}</g>`; }).join('')}
    ${ticks.map(i => `<text x="${Math.min(W - 2, Math.max(2, i * (bw + gap) + bw / 2))}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(dlabel(rows[i].date))}</text>`).join('')}
    </svg></div>`;
}

async function mkRunTest() {
  const out = $('#mkTestOut'); if (!out) return;
  out.innerHTML = '<p class="muted">Probando la conexión…</p>';
  let r;
  try { r = await api('apiMktTest', S.token); } catch (e) { out.innerHTML = '<div class="note">' + esc(e.message) + '</div>'; return; }
  const line = (ok, okText, err) => `<li><span class="tag ${ok ? 'pagada' : 'fallido'}">${ok ? 'Listo' : 'Revisar'}</span> ${ok ? okText : esc(err)}</li>`;
  out.innerHTML = `<ul class="mk-test">${r.send ? line(r.send.ok, 'Analytics acepta las ventas que manda Nexo.', r.send.error) : ''}
    ${r.read ? line(r.read.ok, 'Nexo puede leer tus visitas (' + Number(r.read.sessions || 0).toLocaleString('en-US') + ' en los últimos 7 días).', r.read.error) : ''}</ul>`;

/** Guarda y vuelve a dibujar la pestaña actual. */
async function ntCall(fn, args, msg, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api.apply(null, [fn, S.token].concat(args || []));
    if (r && r.settings) NTF.d = r;
    if (msg) toast(msg);
    if (S.view === 'notify') viewNotify();
    return r;
  } catch (e) { toast(e.message, true); if (btn) btn.disabled = false; throw e; }
}

/* ============================ Copiar ============================ */

function codeBlock(text) {
  return `<div class="codebox"><pre class="code">${esc(text)}</pre><button class="btn sm copy" type="button">Copiar</button></div>`;
}

function bindCopy(root) {
  root.querySelectorAll('.codebox .copy').forEach(b => b.onclick = () => {
    const pre = b.parentNode.querySelector('pre');
    const done = () => { b.textContent = '¡Copiado!'; setTimeout(() => { b.textContent = 'Copiar'; }, 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand('copy'); done(); } catch (e) { b.textContent = 'Usa Ctrl+C'; }
    };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(done, fallback); else fallback();
  });
}

async function openRefund(id) {
  let d;
  try { d = await api('apiSaleRefundInfo', S.token, id); } catch (e) { toast(e.message, true); return; }
  const s = d.sale, r = d.refundable, m = v => moneyIn(v, s.currency);
  const st = { qty: {}, restock: {}, amountTouched: false };
  r.items.forEach(i => { st.qty[i.id] = 0; st.restock[i.id] = i.tracked; });
  const stripe = d.via === 'stripe';
  openModal('Reembolsar ' + s.number, `
    <div class="note">${stripe
      ? `El dinero se devuelve a la tarjeta del cliente <b>en Stripe</b>${s.is_test === true ? ' (modo prueba)' : ''}. Stripe no permite deshacerlo.`
      : `Haz el reembolso en el portal de <b>${esc(d.gateway || 'tu pasarela')}</b> y regístralo aquí: el CRM ajusta la venta y el inventario.`}</div>
    <div class="rf-head"><b>¿Qué se devuelve?</b><button type="button" class="btn sm" id="rfAll">Todo</button></div>
    <div class="rf-items">${r.items.map(i => `<div class="rf-item" data-id="${esc(i.id)}">
        <span><b>${esc(i.description)}</b><br><span class="muted sm">${i.refunded_qty ? i.refunded_qty + ' ya reembolsado(s) · ' : ''}quedan ${i.left} · ${esc(m(i.unit_refund))} c/u</span>
          ${i.tracked ? `<label class="check sm rf-restock"><input type="checkbox" checked data-restock> Regresa al inventario</label>` : ''}</span>
        ${i.left ? `<div class="stepper sm"><button type="button" data-d="-1" aria-label="Menos">−</button><input class="input" inputmode="numeric" value="0" aria-label="Cantidad"><button type="button" data-d="1" aria-label="Más">+</button></div>` : '<span class="muted sm">Reembolsado</span>'}
      </div>`).join('')}</div>
    <form class="form" id="rfForm" style="margin-top:14px">
      <div><label class="f">Motivo *</label><select class="input" name="reason" required><option value="">Elige…</option>${Object.keys(d.reasons).map(k => `<option value="${k}">${esc(d.reasons[k])}</option>`).join('')}</select></div>
      <div><label class="f">Monto a reembolsar</label><input class="input" name="amount" inputmode="decimal" placeholder="0.00"><div class="hint">Máximo ${esc(m(r.amount))}. Puedes escribir otro monto (por ejemplo, una compensación).</div></div>
      <div class="wide"><label class="f">Nota</label><input class="input" name="notes" placeholder="Opcional"></div>
      ${stripe ? '<div class="wide check"><input type="checkbox" id="rfManual" name="manual"><label for="rfManual">Ya lo reembolsé en Stripe: solo registrarlo aquí</label></div>' : ''}
      ${!stripe && s.source === 'pos' ? `<div class="wide check"><input type="checkbox" id="rfCash" name="cash_out" ${/Efectivo/.test(s.payment_method || '') ? 'checked' : ''}><label for="rfCash">Devolver en efectivo de mi caja abierta</label></div>` : ''}
    </form>`, async () => {
    const f = $('#rfForm');
    if (!f.reason.value) throw new Error('Elige el motivo del reembolso.');
    const items = r.items.filter(i => st.qty[i.id] > 0).map(i => ({ id: i.id, qty: st.qty[i.id], restock: st.restock[i.id] }));
    const amount = f.amount.value.trim() === '' ? '' : Number(f.amount.value.replace(',', '.'));
    if (!items.length && !(amount > 0)) throw new Error('Elige qué artículos se devuelven o escribe un monto.');
    const payload = { items: items, amount: amount, reason: f.reason.value, notes: f.notes.value, manual: !!(f.manual && f.manual.checked) };
    const res = f.cash_out ? await api('apiPosRefund', S.token, id, Object.assign(payload, { cash_out: f.cash_out.checked }))
                           : await api('apiSaleRefund', S.token, id, payload);
    toast(res.message + (res.restocked ? ' ' + res.restocked + ' pieza(s) regresaron al inventario.' : ''));
    if (S.view === 'sales') viewSales();
    S.inv = null;
    setTimeout(() => showSale(id), 0);
  }, 'Reembolsar', true);
  const f = $('#rfForm'), ok = $('#modalOk');
  ok.classList.remove('primary'); ok.classList.add('danger');
  const total = () => {
    const all = r.items.every(i => i.left === 0 || st.qty[i.id] === i.left) && r.items.some(i => st.qty[i.id] > 0);
    return all ? r.amount : Math.round(r.items.reduce((a, i) => a + i.unit_refund * st.qty[i.id], 0) * 100) / 100;
  };
  const refresh = () => {
    if (!st.amountTouched) f.amount.value = total() ? total().toFixed(2) : '';
    const v = Number((f.amount.value || '0').replace(',', '.')) || 0;
    ok.textContent = v > 0 ? 'Reembolsar ' + m(Math.min(v, r.amount)) : 'Reembolsar';
  };
  document.querySelectorAll('.rf-item').forEach(row => {
    const it = r.items.find(i => i.id === row.dataset.id);
    const inp = row.querySelector('.stepper input');
    const set = v => { st.qty[it.id] = Math.max(0, Math.min(it.left, Math.floor(v) || 0)); if (inp) inp.value = st.qty[it.id]; refresh(); };
    row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => set(st.qty[it.id] + Number(b.dataset.d)));
    if (inp) inp.oninput = () => set(Number(inp.value));
    const rs = row.querySelector('[data-restock]');
    if (rs) rs.onchange = () => { st.restock[it.id] = rs.checked; };
    row._set = set;
  });
  $('#rfAll').onclick = () => { st.amountTouched = false; document.querySelectorAll('.rf-item').forEach(row => { const it = r.items.find(i => i.id === row.dataset.id); row._set(it.left); }); };
  f.amount.oninput = () => { st.amountTouched = f.amount.value.trim() !== ''; refresh(); };
