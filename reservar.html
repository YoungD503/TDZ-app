<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Reservar cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<script>window.NEXO_API_URL = 'https://script.google.com/macros/s/AKfycby5LWM73dCEKGmDvc1LJBrw_eQYuLRLcZUCm_XJwXJt365-TEtkeKhr1N4GfkWFfiLT/exec';</script>
<script>window.NEXO_PARAMS = null;</script>
<style>
  :root { color-scheme: dark; --bg: #000000; --ink: #F5F5F5; --muted: #9B9B9B; --brand: #2F6FE4; --brand-ink: #FFFFFF; --line: #262626; --soft: #111111; --ok: #3FB27F; --bad: #E5484D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 18px 56px; }
  .biz { font-weight: 600; margin: 0; }
  h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.1; letter-spacing: -.02em; margin: 6px 0 8px; }
  .lead { color: #D4D4D4; margin: 0 0 6px; white-space: pre-line; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 26px; }
  h2 { font-size: 15px; margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; min-height: 52px; }
  .opt:hover { border-color: #3A3A3A; }
  .opt[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .opt .d { color: var(--muted); font-size: 13px; display: block; }
  .opt .p { white-space: nowrap; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; min-height: 40px; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 10px; padding: 8px 0; font: inherit; cursor: pointer; text-align: center; min-height: 58px; }
  .day small { display: block; color: var(--muted); font-size: 11px; text-transform: capitalize; }
  .day b { font-size: 17px; font-weight: 600; }
  .day:disabled { opacity: .35; cursor: default; }
  .day[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .day[aria-pressed="true"] small { color: var(--brand-ink); }
  .nav { display: flex; justify-content: space-between; margin-top: 8px; }
  .link { background: none; border: 0; color: var(--brand); font: inherit; cursor: pointer; padding: 6px 0; }
  .link:disabled { color: var(--muted); cursor: default; }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .times .chip { border-radius: 10px; }
  .empty { color: var(--muted); margin: 6px 0; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, textarea { width: 100%; background: var(--soft); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .check { display: flex; gap: 10px; align-items: flex-start; color: #D4D4D4; font-size: 14px; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .sum { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; }
  .btn { display: block; width: 100%; text-align: center; min-height: 50px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); text-decoration: none;
    font: inherit; font-weight: 600; cursor: pointer; line-height: 50px; padding: 0 16px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); margin-top: 10px; }
  .btn.danger { background: none; border: 1px solid var(--bad); color: var(--bad); margin-top: 10px; }
  .err { color: var(--bad); margin: 0; font-size: 14px; }
  .status { font-size: clamp(28px, 8vw, 38px); line-height: 1.05; letter-spacing: -.02em; font-weight: 700; margin: 8px 0 12px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .msg-c { text-align: center; color: var(--muted); padding-top: 30vh; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 30px; text-align: center; }
  @media (max-width: 380px) { .days { gap: 4px; } .day b { font-size: 15px; } }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="msg-c">Cargando…</p></main>
<script>
(function () {
  var app = document.getElementById('app');
  var P = window.NEXO_PARAMS || {};
  var qs = new URLSearchParams(location.search);
  var bizTok = P.n || qs.get('n') || '';
  var apptTok = P.cita || qs.get('cita') || '';
  var esc = function (v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fail = function (m) { app.innerHTML = '<p class="msg-c">' + esc(m) + '</p>'; };
  var onGoogle = !!(window.google && google.script && google.script.run);

  function call(fn, args) {
    if (onGoogle) {
      return new Promise(function (res) {
        var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { res({ ok: false, error: (e && e.message) || 'No se pudo conectar.' }); });
        r[fn].apply(r, args);
      });
    }
    if (String(window.NEXO_API_URL).indexOf('http') !== 0) return Promise.resolve({ ok: false, error: 'Esta página no está configurada.' });
    return fetch(window.NEXO_API_URL + '?rpc=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: 'No se pudo conectar. Revisa tu internet e intenta de nuevo.' }; });
  }

  var MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var WD = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var WDL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var dd = function (day) { return new Date(day + 'T12:00:00Z'); };
  var longDay = function (day) { var d = dd(day); return WDL[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MONTHS[d.getUTCMonth()]; };
  var money = function (n, cur) { try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: cur || 'USD' }).format(n); } catch (e) { return '$' + Number(n).toFixed(2); } };
  var dur = function (m) { return m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; };

  var S = { info: null, svc: null, staff: '', from: '', days: [], day: '', slots: [], slot: null, busy: false, err: '' };

  // Ver o cancelar una cita
  function showAppt(v, justBooked) {
    document.title = 'Tu cita en ' + v.business;
    var cls = v.status === 'cancelada' || v.status === 'no_asistio' ? 'bad' : v.status === 'confirmada' || v.status === 'completada' ? 'ok' : '';
    var title = justBooked ? (v.status === 'pendiente' ? 'Recibimos tu solicitud' : 'Tu cita está confirmada') : v.status_label;
    app.innerHTML = '<p class="biz">' + esc(v.business) + '</p><p class="meta">Cita ' + esc(v.number) + '</p>' +
      '<p class="status ' + cls + '" id="st">' + esc(title) + '</p>' +
      (justBooked ? '<p class="lead">' + (v.status === 'pendiente' ? 'Te confirmaremos pronto por correo.' : 'Te mandamos los detalles por correo.') + '</p>' : '') +
      '<div class="sum">' +
        '<div class="row"><span>Servicio</span><span>' + esc(v.service) + ' · ' + dur(v.duration) + '</span></div>' +
        '<div class="row"><span>Cuándo</span><span>' + esc(longDay(v.date)) + ', ' + esc(v.time) + '</span></div>' +
        (v.staff ? '<div class="row"><span>Con</span><span>' + esc(v.staff) + '</span></div>' : '') +
        (v.location ? '<div class="row"><span>Dónde</span><span>' + esc(v.location) + '</span></div>' : '') +
        (v.price ? '<div class="row"><span>Precio</span><span>' + esc(money(v.price, v.currency)) + '</span></div>' : '') +
      '</div>' +
      (v.calendar && ['pendiente', 'confirmada'].indexOf(v.status) >= 0 ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(v.calendar) + '">Agregar a mi calendario</a>' : '') +
      (v.manage_url && justBooked ? '<a class="btn ghost" target="_top" href="' + esc(v.manage_url) + '">Ver o cancelar mi cita</a>' : '') +
      (!justBooked && v.can_cancel ? '<button class="btn danger" id="cx">Cancelar mi cita</button><p class="err" id="er"></p>' : '') +
      (!justBooked && !v.can_cancel && ['pendiente', 'confirmada'].indexOf(v.status) >= 0 && v.cancel_hours ? '<p class="meta" style="margin-top:14px">Para cancelar con menos de ' + v.cancel_hours + ' horas, llámanos' + (v.phone ? ' al ' + esc(v.phone) : '') + '.</p>' : '') +
      '<p class="foot">' + esc(v.phone || '') + '</p>';
    var cx = document.getElementById('cx');
    if (cx) cx.onclick = function () {
      if (!confirm('¿Cancelar tu cita del ' + longDay(v.date) + ' a las ' + v.time + '?')) return;
      cx.disabled = true; cx.textContent = 'Cancelando…';
      call('apiPublicApptCancel', [apptTok, '']).then(function (r) {
        if (!r.ok) { cx.disabled = false; cx.textContent = 'Cancelar mi cita'; document.getElementById('er').textContent = r.error; return; }
        showAppt(Object.assign({}, r.data, { calendar: '' }), false);
      });
    };
  }

  if (apptTok) {
    if (!/^[a-f0-9]{32}$/.test(apptTok)) return fail('Este enlace no es válido.');
    call('apiPublicAppt', [apptTok]).then(function (r) { if (!r.ok) return fail(r.error); showAppt(r.data, false); });
    return;
  }

  // Reservar
  if (!/^[a-f0-9]{16}$/.test(bizTok)) return fail('Este enlace de reservas no es válido.');

  function render() {
    var i = S.info;
    var h = '<p class="biz">' + esc(i.business) + '</p><h1>' + esc(i.title) + '</h1>' +
      (i.message ? '<p class="lead">' + esc(i.message) + '</p>' : '') +
      '<p class="meta">' + esc([i.location, i.phone].filter(Boolean).join(' · ')) + '</p>';
    h += '<h2>Servicio</h2><div class="opts">' + i.services.map(function (s) {
      return '<button class="opt" data-svc="' + esc(s.id) + '" aria-pressed="' + (S.svc && S.svc.id === s.id) + '"><span>' + esc(s.name) +
        '<span class="d">' + dur(s.duration) + (s.description ? ' · ' + esc(s.description) : '') + '</span></span><span class="p">' + (s.price ? esc(money(s.price, i.currency)) : '') + '</span></button>';
    }).join('') + '</div>';
    if (S.svc && i.staff_choice) {
      h += '<h2>¿Con quién?</h2><div class="chips"><button class="chip" data-staff="" aria-pressed="' + (!S.staff) + '">Con quien esté libre</button>' +
        i.staff.map(function (u) { return '<button class="chip" data-staff="' + esc(u.id) + '" aria-pressed="' + (S.staff === u.id) + '">' + esc(u.name) + '</button>'; }).join('') + '</div>';
    }
    if (S.svc) {
      var first = S.days[0], label = first ? MONTHS[dd(first.day).getUTCMonth()] + ' ' + dd(first.day).getUTCFullYear() : '';
      h += '<h2>Día <small>' + esc(label) + '</small></h2>';
      if (!S.days.length) h += '<p class="empty">Buscando días libres…</p>';
      else {
        h += '<div class="days">' + S.days.map(function (d) {
          var x = dd(d.day);
          return '<button class="day" data-day="' + d.day + '"' + (d.free ? '' : ' disabled') + ' aria-pressed="' + (S.day === d.day) + '" aria-label="' + esc(longDay(d.day)) + (d.free ? '' : ', sin horarios') + '"><small>' + WD[x.getUTCDay()] + '</small><b>' + x.getUTCDate() + '</b></button>';
        }).join('') + '</div><div class="nav"><button class="link" id="prev"' + (S.from ? '' : ' disabled') + '>Anteriores</button><button class="link" id="next"' + (S.days.length < 14 ? ' disabled' : '') + '>Más días</button></div>';
        if (!S.days.some(function (d) { return d.free; })) h += '<p class="empty">No hay horarios libres en estos días. Prueba con más días.</p>';
      }
    }
    if (S.day) {
      h += '<h2>Hora <small>' + esc(longDay(S.day)) + '</small></h2>';
      h += S.slots === null ? '<p class="empty">Buscando horarios…</p>' : !S.slots.length ? '<p class="empty">Ya no quedan horarios este día. Elige otro.</p>' :
        '<div class="times">' + S.slots.map(function (s, k) { return '<button class="chip" data-slot="' + k + '" aria-pressed="' + (S.slot === s) + '">' + esc(s.time) + '</button>'; }).join('') + '</div>';
      if (!S.slot && S.err) h += '<p class="err" role="alert" style="margin-top:8px">' + esc(S.err) + '</p>';
      if (i.tz && Intl.DateTimeFormat().resolvedOptions().timeZone && Intl.DateTimeFormat().resolvedOptions().timeZone !== i.tz) h += '<p class="meta" style="margin-top:8px">Horas de ' + esc(i.tz.replace(/_/g, ' ')) + '.</p>';
    }
    if (S.slot) {
      h += '<h2>Tus datos</h2><div class="sum"><div class="row"><span>' + esc(S.svc.name) + '</span><span>' + esc(longDay(S.day)) + ', ' + esc(S.slot.time) + '</span></div>' +
        (S.slot.staff && S.slot.staff.length === 1 && S.staff ? '<div class="row"><span>Con</span><span>' + esc(S.slot.staff[0]) + '</span></div>' : '') + '</div>' +
        '<form id="f" novalidate><label>Nombre<input name="name" autocomplete="name" required maxlength="120"></label>' +
        '<label>Correo<input name="email" type="email" autocomplete="email" inputmode="email" required maxlength="160"></label>' +
        '<label>Teléfono o WhatsApp<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="40"></label>' +
        '<label>Algo que debamos saber (opcional)<textarea name="notes" maxlength="1000"></textarea></label>' +
        '<label class="hp" aria-hidden="true">Sitio web<input name="website" tabindex="-1" autocomplete="off"></label>' +
        '<label class="check"><input type="checkbox" name="marketing"><span>Quiero recibir promociones de ' + esc(i.business) + '.</span></label>' +
        '<p class="err" id="er" role="alert">' + esc(S.err) + '</p>' +
        '<button class="btn" id="go"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Reservando…' : (i.confirm === 'manual' ? 'Pedir esta cita' : 'Confirmar cita')) + '</button>' +
        (i.cancel_hours ? '<p class="meta" style="margin:0">Puedes cancelar en línea hasta ' + i.cancel_hours + ' horas antes.</p>' : '') + '</form>';
    }
    var keep = {};
    var f0 = document.getElementById('f');
    if (f0) Array.prototype.forEach.call(f0.elements, function (el) { if (el.name) keep[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
    app.innerHTML = h;
    var f = document.getElementById('f');
    if (f) {
      Array.prototype.forEach.call(f.elements, function (el) { if (el.name && keep[el.name] !== undefined) { if (el.type === 'checkbox') el.checked = keep[el.name]; else el.value = keep[el.name]; } });
      f.onsubmit = book;
    }
    bind();
  }

  function bind() {
    app.querySelectorAll('[data-svc]').forEach(function (b) { b.onclick = function () { S.svc = S.info.services.find(function (s) { return s.id === b.dataset.svc; }); S.day = ''; S.slot = null; S.from = ''; loadDays(true); }; });
    app.querySelectorAll('[data-staff]').forEach(function (b) { b.onclick = function () { S.staff = b.dataset.staff; S.day = ''; S.slot = null; loadDays(false); }; });
    app.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { S.day = b.dataset.day; S.slot = null; S.err = ''; loadSlots(); }; });
    app.querySelectorAll('[data-slot]').forEach(function (b) { b.onclick = function () { S.slot = S.slots[Number(b.dataset.slot)]; S.err = ''; render(); var n = document.querySelector('#f input[name=name]'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }; });
    var nx = document.getElementById('next'), pv = document.getElementById('prev');
    if (nx) nx.onclick = function () { var last = S.days[S.days.length - 1]; if (!last) return; S.hist = (S.hist || []).concat([S.from]); var d = dd(last.day); d.setUTCDate(d.getUTCDate() + 1); S.from = d.toISOString().slice(0, 10); S.day = ''; S.slot = null; loadDays(false); };
    if (pv) pv.onclick = function () { var h = S.hist || []; S.from = h.length ? h.pop() : ''; S.hist = h; S.day = ''; S.slot = null; loadDays(false); };
  }

  function loadDays(scroll) {
    S.days = []; render();
    call('apiPublicBookingDays', [bizTok, S.svc.id, S.staff, S.from]).then(function (r) {
      if (!r.ok) return fail(r.error);
      S.days = r.data;
      var firstFree = S.days.find(function (d) { return d.free; });
      if (firstFree && !S.from) { S.day = firstFree.day; loadSlots(); } else render();
      if (scroll) { var h = app.querySelectorAll('h2'); if (h[1]) h[1].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  }

  function loadSlots() {
    S.slots = null; render();
    var day = S.day;
    call('apiPublicBookingSlots', [bizTok, S.svc.id, day, S.staff]).then(function (r) {
      if (day !== S.day) return;
      if (!r.ok) { S.slots = []; S.err = r.error; return render(); }
      S.slots = r.data; render();
    });
  }

  function book(ev) {
    ev.preventDefault();
    if (S.busy) return;
    var f = ev.target, v = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) v[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
    S.err = '';
    if (v.name.length < 2) S.err = 'Escribe tu nombre.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) S.err = 'Escribe un correo válido: ahí te llega la confirmación.';
    else if (v.phone.replace(/\D/g, '').length < 8) S.err = 'Escribe tu teléfono con todos sus dígitos.';
    if (S.err) { document.getElementById('er').textContent = S.err; return; }
    S.busy = true; render();
    call('apiPublicBook', [bizTok, { service_id: S.svc.id, staff_id: S.staff, start: S.slot.start, name: v.name, email: v.email, phone: v.phone, notes: v.notes, website: v.website, marketing: v.marketing === true }])
      .then(function (r) {
        S.busy = false;
        if (!r.ok) {
          S.err = r.error;
          if (r.code === 'SLOT_TAKEN') { S.slot = null; loadSlots(); return; }
          return render();
        }
        apptTok = r.data.token;
        call('apiPublicAppt', [apptTok]).then(function (g) { showAppt(Object.assign({}, r.data, g.ok ? { calendar: g.data.calendar } : {}), true); window.scrollTo(0, 0); });
      });
  }

  call('apiPublicBookingInfo', [bizTok]).then(function (r) {
    if (!r.ok) return fail(r.error);
    S.info = r.data;
    document.title = 'Reservar en ' + r.data.business;
    if (!r.data.services.length) return fail('Por ahora no hay servicios para reservar en línea.');
    if (r.data.services.length === 1) { S.svc = r.data.services[0]; loadDays(false); } else render();
  });
})();
</script>
</body>
</html>
